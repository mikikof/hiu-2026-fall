/* ═════ theme-v2-suuri-01.css ═════ */
/* ============================================================================
   suuri-01 の色（2026-09-26）: 下の v2 の規則はそのまま使い、トークンの塊と末尾の上書きだけを替えた（theme.md §5.1 の 4）。
   v2「ターミナル由来のテック」（2026-09-25。本人「ポップすぎる。理系の大学生向けに洗練＋少しポップ・丸文字で」）。/designslide の棚 theme-v2
   ★ 「@@subject {」から「}」までは、この教材の章だけに効く規則（新しい教材へは写らない）
   3 案（ラボノート・ソフトなプロダクト UI・ターミナル由来）を 3 つの立場で審査して C を採り、A・B の良い所を接いだ（Workflow pcl-v2-design）
   v1 の CSS の後ろに足す上書き。html に data-theme="v2" があるときだけ効く。文と JS の組み方は変えない。
   ★ トークンだけ html[data-theme=v2]{…} で :root に勝たせる。ほかの規則はすべて :where(html[data-theme=v2]) を頭に付け、
     詳細度を v1 と揃える（v1 の状態の規則 .on・:disabled・[aria-pressed]・.ok/.ng・.ask などが、そのまま勝ち残る）。
   ★ 色は 3 系統だけ: 墨（スレート。字・札・濃い帯）／ネオン（ミント→ライム。印だけ）／意味の 4 色＋注目の赤。
   ★ 白地の上では、ネオンは字に使わない（1.69:1）。ネオンの地には墨の字を載せる。
   ★ 選んだ・押した: 暗い地の上ではネオンの地に墨の字、明るい地の上では墨の地に白い字。
   ★ いま＝琥珀・自分＝ネオン・注目（画面の中の場所を指す枠と番号）＝赤。本文が「赤い枠」「赤い番号」と書いている。
   ============================================================================ */

html[data-theme=v2]{
  /* ★ この教材（suuri-01）の色。v2 の役目と比を保ち、値だけを淡い青と青みの灰に替えた（本人「淡い青・グレーベース」「少しポップ」2026-09-26）。
     値の正本は spec/20_デザイン.md §2。16 進を書いてよいのは、このトークンの塊と末尾の「この教材の上書き」だけ */
  --bg:#eef3f8; --bg-2:#eef3f8;
  --paper:#fff; --paper-2:#f5f8fb;
  --ink:#132033; --ink-2:#2a3a50; --ink-3:#44556b; --ink-4:#56667c;
  --line:#d4dde8; --line-2:#e5ecf4; --line-3:#bfccda; --line-4:#93a3b6;
  /* 濃い地（札・押したボタン・しおり・引き出しと早見の頭）。上の帯と章ナビは末尾の上書きで淡くする */
  --deck:#15253b; --deck-2:#1e3350; --deck-3:#2d4668; --deck-ink:#e8f0fa; --deck-ink-2:#a8bad0;
  /* 差し色（空の青 → 淡い青）。白地では印だけ */
  --acc:#6aaeff; --lime:#b8d8ff; --acc-deep:#1f5fbf; --acc-tint:#e3efff; --lime-tint:#edf5ff; --lime-deep:#3a6db0;
  --c-mark:var(--acc);
  --main:#2563c4; --main-deep:#15253b; --main-dark:#132033; --main-soft:#e6eef8; --main-line:#c6d4e4; --pill:transparent;
  --pink:#1e3350; --pink-deep:#2d4668; --pink-soft:#e7eef7;
  --yellow:#b8d8ff; --marker:#cfe3ff; --brown:#1e3350;
  --red:#d63333;
  --peach:#f5f8fb; --peach-line:#d4dde8; --orange:#3a6db0;
  --hit:#18793a; --hit-soft:#e5f4e9;
  --ask:#c07a0b; --ask-soft:#fff3d9; --ask-ink:#7a4a00;
  --stop:#c42a3b; --stop-soft:#fdecee;
  --drop:#a6b0b8;
  --round:'v2-round','Hiragino Maru Gothic ProN','BIZ UDPGothic','Yu Gothic UI','Meiryo',sans-serif;
  --tag:'SF Mono','Menlo','Consolas','v2-round','BIZ UDGothic',monospace;
  --r:14px;
  --shadow-1:0 1px 2px rgba(19,32,51,.06);
  --shadow-2:0 1px 2px rgba(19,32,51,.06),0 12px 28px -20px rgba(19,32,51,.35);
}
/* 文字を拡大（投影）では、明るい教室で消えやすい縁と影を一段濃くする（案 B から） */
html.big[data-theme=v2]{--line:#bfccda;--line-3:#93a3b6;--shadow-1:0 1px 3px rgba(19,32,51,.16)}

/* ── 土台 ─────────────────────────────────────── */
:where(html[data-theme=v2]) body{font-family:var(--round);font-weight:500;background:var(--bg)}
:where(html[data-theme=v2]) :is(b,strong){font-weight:700}
:where(html[data-theme=v2]) :is(button,summary,input):focus-visible{outline-color:var(--acc-deep)}
:where(html[data-theme=v2]) code{background:#eef2f5;border:1px solid var(--line-2);border-radius:4px;padding:0 .3em}
:where(html[data-theme=v2]) mark{background:linear-gradient(transparent 56%,var(--marker) 56%);font-weight:700}
:where(html[data-theme=v2]) .kbd{border:1px solid #b3bec7;border-bottom-width:3px;font-weight:700}
:where(html[data-theme=v2]) kbd.kbd[data-gk]{border-color:var(--line-4)}
:where(html[data-theme=v2]) kbd.kbd[data-gk]:hover{background:var(--lime-tint);border-color:var(--ink)}
/* 模型なのに body の字体を受けていた所（本物の字体に戻す） */
:where(html[data-theme=v2]) :is(.dlg,.c72-ss,.c72-app,.c72-start,.c72-set,.c43-tray,.c43-menu,.term.t-win .t-bar){font-family:'Yu Gothic UI','Segoe UI','Hiragino Kaku Gothic ProN',sans-serif}
:where(html[data-theme=v2]) :is(.dlg.d-mac,.c43-spot,.c43-spot-hit,.term.t-mac .t-bar){font-family:-apple-system,'Hiragino Kaku Gothic ProN',sans-serif}

/* ── 上の帯（濃い帯）──────────────────────────── */
:where(html[data-theme=v2]) .topbar{background:var(--deck);-webkit-backdrop-filter:none;backdrop-filter:none;border-bottom:1px solid var(--deck-3);color:var(--deck-ink)}
:where(html[data-theme=v2]) .brand{font-weight:700}
:where(html[data-theme=v2]) .brand-icon{background:var(--acc);box-shadow:none;border-radius:9px}
:where(html[data-theme=v2]) .brand-icon svg{stroke:var(--deck)}
:where(html[data-theme=v2]) .brand .course{color:var(--acc);font-family:var(--tag);font-weight:600;letter-spacing:.14em}
:where(html[data-theme=v2]) .osswitch{background:var(--deck-2);border:1px solid var(--deck-3)}
:where(html[data-theme=v2]) .osswitch button{color:var(--deck-ink-2);font-weight:700}
:where(html[data-theme=v2]) .osswitch button[aria-pressed=true]{background:var(--acc);color:var(--deck);box-shadow:none}
:where(html[data-theme=v2]) :is(.tb-guide button,.topbar .plain){background:transparent;border:1px solid var(--deck-3);color:var(--deck-ink);font-weight:700}
:where(html[data-theme=v2]) :is(.tb-guide button,.topbar .plain):hover{border-color:var(--acc)}
:where(html[data-theme=v2]) :is(.tb-guide button,.topbar .plain)[aria-pressed=true]{background:var(--deck-2);color:var(--acc);border-color:var(--acc)}   /* 前は白地に墨の字。早見の幕の下で灰に沈み、押せないボタンに見えた（学生役） */

/* ── 章ナビ（濃い帯。いまの章だけネオン）──────────────
   余白（上 16・下 16）は v1 のまま。帯の色は box-shadow で左右へ伸ばし、clip-path で上 16px・下 10px までに切る。
   レイアウトの高さは v1 と同じ（1 画面の収まりを動かさない）。 */
:where(html[data-theme=v2]) .chapters{background:var(--deck);box-shadow:0 0 0 100vmax var(--deck);clip-path:inset(-16px -100vmax -10px)}
:where(html[data-theme=v2]) .chapter{background:var(--deck-2);border:1px solid var(--deck-3);border-radius:10px;color:var(--deck-ink-2);font-weight:700}
:where(html[data-theme=v2]) .chapter .num{width:auto;height:auto;min-width:2ch;background:none;border-radius:0;color:var(--deck-ink-2);font-family:var(--tag);font-weight:600}
:where(html[data-theme=v2]) .chapter .ch-dots i{background:var(--deck-3)}
:where(html[data-theme=v2]) .chapter .ch-dots i.on{background:var(--acc)}
:where(html[data-theme=v2]) .chapter:hover{border-color:var(--acc);color:var(--deck-ink)}
:where(html[data-theme=v2]) .chapter[aria-current=page]{background:var(--acc);border-color:var(--acc);color:var(--deck);box-shadow:none}
:where(html[data-theme=v2]) .chapter[aria-current=page] .num{background:none;color:var(--deck)}
:where(html[data-theme=v2]) .chapter[aria-current=page] .ch-dots i{background:rgba(15,26,32,.25)}
:where(html[data-theme=v2]) .chapter[aria-current=page] .ch-dots i.on{background:var(--deck)}

/* ── 枚と見出し ─────────────────────────────── */
:where(html[data-theme=v2]) .slide{border:1px solid var(--line);border-radius:18px}
:where(html[data-theme=v2]) .s-no{font-family:var(--tag);font-weight:600;color:var(--ink-3);letter-spacing:.02em;gap:8px}
:where(html[data-theme=v2]) .s-no::before{content:"";flex:0 0 auto;width:9px;height:9px;border-radius:2px;background:var(--acc);box-shadow:inset 0 0 0 1px rgba(11,143,107,.55)}
:where(html[data-theme=v2]) .s-chip{background:none;color:var(--ink);padding:0;border-radius:0;font-weight:700}
:where(html[data-theme=v2]) .s-chip::after{content:" /";white-space:pre;color:var(--ink-4);font-weight:500}
:where(html[data-theme=v2]) .s-no>.wb{font-family:var(--round);font-weight:700;color:var(--ink-2)}
:where(html[data-theme=v2]) .s-of{border:1px solid var(--line);border-radius:4px;padding:0 6px;line-height:1.5;color:var(--ink-3)}
/* 見出し: ピル・縫い目・縁取り・マウスの矢印を外し、頭にネオンのカーソル（ターミナルの入力待ち） */
:where(html[data-theme=v2]) .pill{background:none;color:var(--ink);padding:0;border-radius:0;box-shadow:none;text-shadow:none;
  font-weight:700;letter-spacing:.01em;gap:.38em;align-items:flex-start}
:where(html[data-theme=v2]) .pill>svg{display:none}
:where(html[data-theme=v2]) .pill::after{content:none}
:where(html[data-theme=v2]) .pill::before{content:"";flex:0 0 auto;width:.22em;height:1em;margin-top:.15em;border-radius:3px;background:linear-gradient(180deg,var(--acc),var(--lime))}
:where(html[data-theme=v2]) .s-lead{color:var(--ink-2)}

/* ── カード・ポイント・札 ───────────────────────── */
:where(html[data-theme=v2]) .card{border:1px solid var(--line);box-shadow:var(--shadow-1)}
:where(html[data-theme=v2]) .card h3{color:var(--ink);font-weight:700}
:where(html[data-theme=v2]) :is(.card:not(.points-card)>h3,.c4-cheat-h,.cv-h)::before{content:"";display:inline-block;width:.5em;height:.5em;border-radius:2px;
  background:var(--acc);box-shadow:inset 0 0 0 1px rgba(11,143,107,.55);margin-right:.5em;vertical-align:.1em}
:where(html[data-theme=v2]) .card.points-card>h3{background:var(--deck);color:var(--acc);border-radius:6px;padding:1px 12px;letter-spacing:.06em}
:where(html[data-theme=v2]) .badge{border:1px solid var(--line-3);border-radius:6px;font-weight:700}
:where(html[data-theme=v2]) .badge.ask{color:var(--ask-ink)}

/* ── 盤・ボタン・切り替え ───────────────────────── */
:where(html[data-theme=v2]) .stage{background:linear-gradient(#e9eef2 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,#e9eef2 1px,transparent 1px) 0 0/24px 24px,#f8fafb;
  border:1px solid var(--line)}
:where(html[data-theme=v2]) .btn{border:1px solid var(--line-3);border-radius:10px;font-weight:700;box-shadow:0 1px 0 rgba(15,26,32,.08)}
:where(html[data-theme=v2]) .btn:hover{border-color:var(--ink-3)}
:where(html[data-theme=v2]) .btn:active{transform:translateY(1px);box-shadow:none}
:where(html[data-theme=v2]) :is(.btn.primary,.pg-next){background:var(--deck);border-color:var(--deck);color:#fff;box-shadow:none}
:where(html[data-theme=v2]) :is(.btn.primary,.pg-next):hover{box-shadow:0 0 0 3px var(--acc)}
:where(html[data-theme=v2]) .btn.mint{background:var(--acc);border-color:var(--acc-deep);color:var(--deck);box-shadow:none}
:where(html[data-theme=v2]) .btn.mint:hover{background:#62e8b8}
:where(html[data-theme=v2]) .btn[aria-pressed=true]{background:var(--deck);border-color:var(--deck);color:#fff}
:where(html[data-theme=v2]) .btn:disabled{background:var(--paper-2);color:var(--ink-4);border-color:var(--line);box-shadow:none;transform:none}
:where(html[data-theme=v2]) .segmented{background:#eef2f5;border:1px solid var(--line);border-radius:10px;padding:3px}
:where(html[data-theme=v2]) .segmented button{border-radius:7px;color:var(--ink-3);font-weight:700}
:where(html[data-theme=v2]) .segmented button[aria-pressed=true]{background:var(--deck);color:#fff;box-shadow:none}

/* ── やってみる・これもチェック・表・理解の確認 ─────────── */
:where(html[data-theme=v2]) .tryit{background:#f6fde6;border:1px solid var(--line);border-left:4px solid var(--deck);border-radius:12px}
:where(html[data-theme=v2]) .tryit .ti{background:var(--deck);color:#fff;border-radius:6px;font-weight:700;display:inline-flex;align-items:center;gap:.45em}
:where(html[data-theme=v2]) .tryit .ti::before{content:"";width:.5em;height:.5em;border-radius:2px;background:var(--acc)}
:where(html[data-theme=v2]) .ti-os{color:var(--ink-3);font-weight:700}
:where(html[data-theme=v2]) details.check{background:#fff;border:1px solid var(--line)}
:where(html[data-theme=v2]) details.check summary{color:var(--ink);font-weight:700}
:where(html[data-theme=v2]) details.check .ctag{transform:none;background:var(--deck);color:var(--lime);border:none;border-radius:6px;padding:0 10px}
:where(html[data-theme=v2]) details.check summary::after{border-radius:8px;border:1px solid var(--line-3);color:var(--ink);background:#fff}
:where(html[data-theme=v2]) details.check[open] summary::after{background:var(--deck);border-color:var(--deck);color:#fff}
:where(html[data-theme=v2]) .dfig{border:1px solid var(--line);border-radius:12px}
:where(html[data-theme=v2]) table.mini th{background:#eef2f5;color:var(--ink);border-bottom:2px solid var(--ink)}
:where(html[data-theme=v2]) table.mini tr:nth-child(even) td{background:#f7f9fa}
:where(html[data-theme=v2]) .quiz{border:1px solid var(--line);background:linear-gradient(90deg,var(--acc),var(--lime)) 0 0/100% 4px no-repeat,#fff}
:where(html[data-theme=v2]) .quiz .qtag{background:var(--deck);color:var(--acc);border-radius:6px}
:where(html[data-theme=v2]) .qopt{border:1px solid var(--line-3);border-radius:10px}
:where(html[data-theme=v2]) .qopt:hover{border-color:var(--ink-3)}
:where(html[data-theme=v2]) .qopt.ok{border-color:var(--hit)} :where(html[data-theme=v2]) .qopt.ng{border-color:var(--stop)}

/* ── 参考図書（札・しおり・引き出し）──────────────────
   誌面の画像そのものには触らない。傾き・マスキングテープ・こげ茶の帯だけを外す。 */
:where(html[data-theme=v2]) .booktag{border:1px solid var(--line-3);background:#fff;color:var(--ink-2);border-radius:10px;font-weight:700}
:where(html[data-theme=v2]) .booktag b{background:var(--deck);color:var(--acc);border-radius:5px;font-family:var(--tag)}
:where(html[data-theme=v2]) .booktag:hover{background:var(--lime-tint);border-color:var(--ink-3)}
:where(html[data-theme=v2]) .shiori{background:var(--deck);background-image:none;border-radius:10px 0 0 10px;font-weight:700}
:where(html[data-theme=v2]) .shiori b{background:var(--acc);color:var(--deck);border-radius:5px;font-family:var(--tag)}
:where(html[data-theme=v2]) .scrim{background:rgba(15,26,32,.42)}
:where(html[data-theme=v2]) .drawer{background:#fff;border-left:1px solid var(--deck-3)}
:where(html[data-theme=v2]) .dr-head{background:var(--deck)}
:where(html[data-theme=v2]) .dr-ico{background:var(--acc)}
:where(html[data-theme=v2]) .dr-kick{color:var(--acc)}
:where(html[data-theme=v2]) :is(.dr-shelf,.dr-x){border:1px solid rgba(255,255,255,.3)}
:where(html[data-theme=v2]) .dr-shelf.on{background:var(--acc);color:var(--deck);border-color:var(--acc)}
:where(html[data-theme=v2]) .dr-tab{border:1px solid var(--line-3);border-radius:6px;font-family:var(--tag)}
:where(html[data-theme=v2]) .dr-tab.on{background:var(--deck);border-color:var(--deck);color:#fff}
:where(html[data-theme=v2]) .dr-cap{border-left:4px solid var(--acc);background:var(--paper-2);border-radius:0 10px 10px 0}
:where(html[data-theme=v2]) .taped{transform:none;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 24px -18px rgba(15,26,32,.4)}
:where(html[data-theme=v2]) .taped::before,:where(html[data-theme=v2]) .taped::after{content:none}
:where(html[data-theme=v2]) .dr-nav{border:1px solid var(--line-3)}
:where(html[data-theme=v2]) .dr-count{font-family:var(--tag)}
:where(html[data-theme=v2]) .dr-zoom{border:1px solid var(--ink-3);background:#fff;color:var(--ink);border-radius:8px}
:where(html[data-theme=v2]) .sh-row{border-top:1px solid var(--line)}
:where(html[data-theme=v2]) .sh-slide{color:var(--ink)}
:where(html[data-theme=v2]) .sh-clip{border:1px solid var(--line)}
:where(html[data-theme=v2]) .sh-clip b{color:var(--ink-3);font-family:var(--tag)}

/* ── 下の送り ───────────────────────────────── */
:where(html[data-theme=v2]) .pg-count{font-family:var(--tag);color:var(--ink-3)}
:where(html[data-theme=v2]) .pg-keys{font-family:var(--round)}
:where(html[data-theme=v2]) .foot{border-top:1px solid var(--line)}

/* ── 表紙（ひさし→上端のネオンの線、30分の丸→墨の札の中のストップウォッチ、黄の縁取り文字→墨の題＋ネオンのカーソル、花の帯→消す）── */
:where(html[data-theme=v2]) .awning{height:4px;background:linear-gradient(90deg,var(--acc),var(--lime))}
:where(html[data-theme=v2]) .scallop{display:none}
:where(html[data-theme=v2]) .flowers{display:none}
/* 30 分: 墨の角丸の札の中にストップウォッチの輪（案 A から）。60 分のうち 30 分をネオンの弧、12 の目盛り、針先（30 分の位置）にライムの点 */
:where(html[data-theme=v2]) .bignum{border-radius:28px;background:var(--deck);color:var(--deck-ink)}
:where(html[data-theme=v2]) .bignum::after{content:"";inset:5px;border:0;border-radius:50%;
  background:repeating-conic-gradient(from -.8deg,var(--deck) 0 1.6deg,transparent 1.6deg 30deg),conic-gradient(var(--acc) 0 50%,var(--deck-3) 50% 100%);
  -webkit-mask:radial-gradient(closest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));
  mask:radial-gradient(closest-side,transparent calc(100% - 7px),#000 calc(100% - 6px))}
:where(html[data-theme=v2]) .bignum::before{content:"";position:absolute;left:50%;bottom:8px;width:12px;height:12px;border-radius:50%;
  transform:translate(-50%,50%);background:var(--lime);box-shadow:0 0 0 3px var(--deck);z-index:1;pointer-events:none}
:where(html[data-theme=v2]) .bignum b{font-family:var(--tag);color:var(--deck-ink);font-weight:700;letter-spacing:-.04em;line-height:1.2}   /* 等幅の字は字の箱が 1.16em ある。行の高さ 1 だと箱の上下へ 6px 出る（検査 spill）。字の位置は変わらない */
:where(html[data-theme=v2]) .bignum .tag{background:var(--acc);color:var(--deck);border:2px solid #fff;border-radius:6px;top:-12px}
:where(html[data-theme=v2]) .title-yellow{color:var(--ink);text-shadow:none;font-weight:700;letter-spacing:.01em}
:where(html[data-theme=v2]) .title-yellow::after{content:"";display:inline-block;width:.4em;height:.9em;margin-left:.12em;vertical-align:-.1em;border-radius:3px;
  background:linear-gradient(180deg,var(--acc),var(--lime))}

/* ── 操作の早見（鍵盤は「文字＝白・特殊＝灰・修飾＝墨・日本語＝ライム」の組）── */
:where(html[data-theme=v2]) .guide{background:#fff;border-top:1px solid var(--deck-3);border-radius:16px 16px 0 0}
:where(html[data-theme=v2]) .g-head{background:var(--deck)}
:where(html[data-theme=v2]) .g-tabs{background:rgba(255,255,255,.08)}
:where(html[data-theme=v2]) .g-tab.on{background:var(--acc);color:var(--deck)}
:where(html[data-theme=v2]) :is(.g-os,.g-keys){color:var(--deck-ink-2)}
:where(html[data-theme=v2]) .g-x{border:1px solid rgba(255,255,255,.3)}
:where(html[data-theme=v2]) .g-kbscroll{background:#e3e8ec;border-radius:14px}
:where(html[data-theme=v2]) .kb .k{border-color:#b3bec7;color:var(--ink)}
:where(html[data-theme=v2]) .kb .k .k-sub{color:var(--ink-3)}
:where(html[data-theme=v2]) :is(.kb .k.s,.kb .k.a){background:#e6ecf0;border-color:#b3bec7}
:where(html[data-theme=v2]) .kb .k.m{background:#24343f;border-color:var(--deck);color:#fff}
:where(html[data-theme=v2]) .kb .k.m .k-sub{color:#c9d4db}
:where(html[data-theme=v2]) .kb .k.j{background:#e6ecf0;border-color:#b3bec7;box-shadow:inset 0 -3px 0 var(--lime-deep)}   /* 地をライムにすると、光ったキー（ライム）と同じ仲間に見えた（デザイン役）。下の縁だけにする */
:where(html[data-theme=v2]) .kb .k.f{background:#eef1f3;color:var(--ink-3)}
:where(html[data-theme=v2]) .kb .k.tid{background:#d5dce2;border-color:#b3bec7}
:where(html[data-theme=v2]) .kb .k:hover{border-color:var(--ink)}
:where(html[data-theme=v2]) .kb .k.ctx{box-shadow:0 0 0 3px var(--acc-deep)}
:where(html[data-theme=v2]) .kb .k.lit.sel{background:var(--acc);border-color:var(--acc-deep);color:var(--deck)}
:where(html[data-theme=v2]) .kb .k.lit.combo{background:var(--lime);border-color:var(--lime-deep);color:var(--deck)}
:where(html[data-theme=v2]) :is(.kb .k.lit.sel,.kb .k.lit.combo) :is(.k-sub,.k-kana){color:var(--ink-2)}
:where(html[data-theme=v2]) .lg::before{border-color:#b3bec7}
:where(html[data-theme=v2]) .lg.s::before{background:#e6ecf0} :where(html[data-theme=v2]) .lg.m::before{background:#24343f}
:where(html[data-theme=v2]) .lg.j::before{background:#e6ecf0;box-shadow:inset 0 -3px 0 var(--lime-deep)} :where(html[data-theme=v2]) .lg.ctx::before{box-shadow:0 0 0 3px var(--acc-deep)}
:where(html[data-theme=v2]) .g-kana{border:1px solid var(--line-3)}
:where(html[data-theme=v2]) .g-kana.on{background:var(--deck);border-color:var(--deck);color:#fff}
:where(html[data-theme=v2]) .g-info{border:1px solid var(--line);border-left:6px solid var(--deck)}
:where(html[data-theme=v2]) .g-info.empty{border-left-color:var(--acc)}
:where(html[data-theme=v2]) .g-h4{color:var(--ink)}
:where(html[data-theme=v2]) .g-combo{border:1px solid var(--line)}
:where(html[data-theme=v2]) .g-combo.on{border-color:var(--lime-deep);background:var(--lime-tint)}
:where(html[data-theme=v2]) .g-op{border:1px solid var(--line-3)}
:where(html[data-theme=v2]) .g-op.on{background:var(--deck);border-color:var(--deck);color:#fff;box-shadow:none}
:where(html[data-theme=v2]) .g-dev{border:1px solid var(--line)}
:where(html[data-theme=v2]) .g-dev.mine{border-color:var(--deck);box-shadow:0 0 0 3px var(--acc-tint)}
:where(html[data-theme=v2]) .g-mine{background:var(--deck);color:var(--acc)}
:where(html[data-theme=v2]) .g-pad{border:2px dashed var(--line-4);background:linear-gradient(#e9eef2 1px,transparent 1px) 0 0/18px 18px,linear-gradient(90deg,#e9eef2 1px,transparent 1px) 0 0/18px 18px,#f8fafb}
:where(html[data-theme=v2]) .g-pad-h{color:var(--ink)}
:where(html[data-theme=v2]) .g-pad-log li{border:1px solid var(--line)}
:where(html[data-theme=v2]) .g-pad-log li.new{border-color:var(--acc-deep);background:var(--acc-tint)}
:where(html[data-theme=v2]) .g-set{background:var(--paper-2);border:1px solid var(--line)}
:where(html[data-theme=v2]) .g-set h4{color:var(--ink)}
:where(html[data-theme=v2]) .gtip{border:1px solid var(--line-3);background:#fff;color:var(--ink-2)}
:where(html[data-theme=v2]) .gtip:hover{background:var(--lime-tint)}

/* ── 注目（模型と地図の上の枠と番号）は v1 の赤のまま ──────────────
   本文に「赤い枠で光ります」「赤い枠の［表示］」「赤い番号が部品を指している」とあるので、色を変えると文がうそになる。
   並びの番号（ポイントの 1・2・3）だけを墨にする（場所を指していない）。 */
:where(html[data-theme=v2]) .points .mark{background:var(--deck);color:#fff;font-family:var(--tag);font-weight:700;box-shadow:0 0 0 2px var(--acc)}
:where(html[data-theme=v2]) [style*="background:#4a3226"]{background:#1e3350!important}
:where(html[data-theme=v2]) [style*="background:#d9506c"]{background:#6a4fc9!important}
:where(html[data-theme=v2]) svg text[font-family*="Hiragino Maru"]{font-family:var(--round)}
:where(html[data-theme=v2]) [style*="--k:#c8455d"]{--k:#1e3350!important}

/* ── JS が描く SVG の色（v1 の値 → v2 の値）。CSS は表示属性に勝つ。
   1-1 の画面の模型（Dock・iPhone のアプリの色）と FTYPE（アプリの見分け）は塗り替えない ── */
:where(html[data-theme=v2]) :is(.slide,.guide,.drawer) svg [fill="#e9677f"]{fill:#334552}
:where(html[data-theme=v2]) :is(.slide,.guide,.drawer) svg [stroke="#e9677f"]{stroke:#334552}

/* 本のアイコン（参考書の誌面を見る・引き出しの頭）: クリームの地と黄の背を白とネオンへ */

/* 早見のクリックの指: 範囲の :is() の塗り替え（墨灰）が詳細度で勝っていた。ネオンに戻す（デザイン役 3） */

/* ピルは OS の溝（OS の切り替え・早見のタブ）だけに残す。札は角 6px、ボタンは角 10px、手順の札は 4-2 のミッションの札と同じ形（デザイン役 5） */

/* 6-1 の木の「PC」の段: v1 の暖色の灰（C6_COLOR.pc）。寒色の灰へ（デザイン役 10） */

:where(html[data-theme=v2]) svg [stroke="#8a7d73"]{stroke:#6b7884}

/* 白い面に色の錨を 1 つ: ポイントのカードの上端にネオンの線（学生役 3。ネオンを増やすのではなく、置き場を 1 つに決める） */

/* ═════ 補足の厚い形（details.check.sp）の v2（2026-09-26。sp.css の上書き）═════
   ★ 書き方はこのファイルの規律のまま: 規則は全部 :where(html[data-theme=v2]) を頭に付け、v1 と同じ詳細度で後ろから勝つ
   ★ 色は v2 のトークンだけ（墨・ネオンの印・意味の 4 色・注目の赤）。ネオンを白地の字と縁にしない。グラデーションは細い棒だけ
   ★ 傾け・水玉・ピン・固い台の影・999px のピルを戻さない（§7）。画面の模型（sp.js の style の色）と .sp-aw は塗り替えない */

/* 絵の色を v2 に塗り替える（sp.js の SVG はクラスで塗っているので、変数を替えるだけで全部変わる） */
:where(html[data-theme=v2]) .sp{
  --sp-ink:var(--ink);
  --sp-paper:#fff;
  --sp-a:var(--line-2);         /* 淡い灰（台座・道具の胴） */
  --sp-b:var(--acc-tint);       /* ネオンの淡い地（ひもの穴・消しゴム） */
  --sp-c:var(--acc);            /* 印（ネオン。地に敷く。字と縁には使わない） */
  --sp-sh:var(--line);
  --sp-box:var(--lime-tint);
  --sp-hl:var(--red);           /* 注目の赤は v2 でも残す（画面の中の場所を指す輪と番号札） */
  --sp-bg:#f8fafb;
  --sp-l1:var(--line-4);        /* 終わった系統は灰 */
  --sp-l2:var(--acc-deep);      /* いまに続く系統はネオンの濃い側 */
  --sp-arw:var(--ink);
}

:where(html[data-theme=v2]) .sp-thumb{border:1px solid var(--line);border-radius:6px}

/* 扉: 絵の地は盤と同じ方眼（方眼は盤の中だけ＝この絵の地も盤として扱う） */
:where(html[data-theme=v2]) .sp-hero{border:1px solid var(--line);border-radius:14px}
:where(html[data-theme=v2]) .sp-hero-art{background:linear-gradient(#e9eef2 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,#e9eef2 1px,transparent 1px) 0 0/24px 24px,var(--sp-bg);
  border-right:1px solid var(--line)}
:where(html[data-theme=v2]) .sp-hero-yr{font-family:var(--tag);font-weight:600;border:1px solid var(--line-3);border-radius:4px;background:#fff}
:where(html[data-theme=v2]) .sp-kicker{font-family:var(--tag);font-weight:600;letter-spacing:.08em;color:var(--ink-3);display:flex;align-items:center;gap:8px}
:where(html[data-theme=v2]) .sp-kicker::before{content:"";flex:0 0 auto;width:9px;height:9px;border-radius:2px;background:var(--acc);box-shadow:inset 0 0 0 1px rgba(11,143,107,.55)}
:where(html[data-theme=v2]) .sp-h{font-weight:700;display:flex;align-items:flex-start;gap:.38em}
:where(html[data-theme=v2]) .sp-h::before{content:"";flex:0 0 auto;width:.22em;height:1em;margin-top:.17em;border-radius:3px;background:linear-gradient(180deg,var(--acc),var(--lime))}
:where(html[data-theme=v2]) .sp-h>span{background:none}

/* 見開き: 白い 2 枚、のどは 1px の線 */
:where(html[data-theme=v2]) .sp-spread{background:#fff;border:1px solid var(--line);border-radius:14px}
:where(html[data-theme=v2]) .sp-spread::before{border-left:1px solid var(--line)}
:where(html[data-theme=v2]) .sp-ph{font-weight:700}
:where(html[data-theme=v2]) .sp-no{width:auto;min-width:26px;height:26px;padding:0 6px;border-radius:6px;background:var(--deck);color:var(--acc);font-family:var(--tag);font-weight:700}

/* 鋭い一言: 墨の札にライムの字（.ctag と同じ）、左に墨の 4px */

:where(html[data-theme=v2]) .sp-key-lbl{font-family:var(--tag);font-weight:700;background:var(--deck);color:var(--lime)}

/* 路線図（系統の外の菱形は v1 と同じ墨の点線。終わった系統の線（--line-4 の灰）と同じ色にしない） */

:where(html[data-theme=v2]) .sp-ver{border:1px solid var(--line);border-radius:4px;background:#eef2f5;color:var(--ink-2)}

/* 標本・標本の格子・画面 1 枚 */

:where(html[data-theme=v2]) .sp-spec-h{font-weight:700}
:where(html[data-theme=v2]) .sp-y{font-family:var(--tag);font-weight:600;color:var(--ink-3)}
:where(html[data-theme=v2]) .sp-cell{border:1px solid var(--line);border-radius:10px}
:where(html[data-theme=v2]) .sp-cell-fig{border:1px solid var(--line-3);border-radius:6px}
:where(html[data-theme=v2]) .sp-cell-n{font-weight:700}
:where(html[data-theme=v2]) .sp-mon{border:1px solid var(--line);border-radius:12px}

/* 図の札（番号は .sp-no。ページの見出しと同じ墨の札） */
:where(html[data-theme=v2]) .sp-plate{border:1px solid var(--line);border-radius:14px}
:where(html[data-theme=v2]) .sp-plate figcaption{font-weight:700}

/* 数の並び: 段は ネオンの淡い地（g1・g2。路線図の「いまに続く系統」の線と同じ色の系統）／ライムの淡い地（g3）。
   ★ 前は g1 を淡い灰にしていて、同じ見開きの凡例の「Mac OS 9 までの系統」（灰の線）と重なった（2026-09-26） */
:where(html[data-theme=v2]) .sp-num{border:1px solid var(--acc-deep);border-radius:4px;background:var(--acc-tint)}
:where(html[data-theme=v2]) .sp-numrow-l.g3 .sp-num{border-color:var(--lime-deep);background:var(--lime-tint)}
:where(html[data-theme=v2]) .sp-numrow-l .sp-num.skip{border-style:dashed;border-color:var(--line-4);background:transparent;color:var(--ink-3)}
:where(html[data-theme=v2]) .sp-numh{font-family:var(--tag);font-weight:600}

/* 展開した木 */
:where(html[data-theme=v2]) .sp-tree ul>li::before{border-left-width:1px;border-left-color:var(--line-3)}
:where(html[data-theme=v2]) .sp-tree ul>li::after{border-top-width:1px;border-top-color:var(--line-3)}
:where(html[data-theme=v2]) .sp-tn.dir{font-weight:700}
:where(html[data-theme=v2]) .sp-tree li.hl>.sp-tn{background:var(--lime-tint)}

/* 豆知識: ピンをやめ、左に墨の 4px（やってみると同じ言葉） */
:where(html[data-theme=v2]) .sp-tid{border:1px solid var(--line);border-left:4px solid var(--deck);border-radius:12px;box-shadow:var(--shadow-1)}
:where(html[data-theme=v2]) .sp-tid::before{content:none}
:where(html[data-theme=v2]) .sp-tid-h{background:var(--deck);color:var(--lime);border-radius:6px;font-weight:700}

/* 資料 */
:where(html[data-theme=v2]) .sp-src{border-top:1px solid var(--line)}
:where(html[data-theme=v2]) .sp-src-h{border:1px solid var(--line-3);border-radius:4px;font-family:var(--tag);font-weight:600}

/* 名前の札・判定・書き換えの例・バイト・流れ */
:where(html[data-theme=v2]) .sp-fname{border:1px solid var(--line-3);border-radius:6px;background:#eef2f5}
:where(html[data-theme=v2]) .sp-arrow{color:var(--ink)}
:where(html[data-theme=v2]) .sp-vd{border-width:1px;border-radius:6px;font-weight:700}

/* 実験台: 地は盤と同じ方眼。いま選んでいる札は、明るい地の上なので墨の地に白い字 */
:where(html[data-theme=v2]) .sp-lab{background:linear-gradient(#e9eef2 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,#e9eef2 1px,transparent 1px) 0 0/24px 24px,#f8fafb;

/* ═════ この教材の上書き（suuri-01・2026-09-26）══════════════════════════════
   ① 上の帯と章ナビを淡くする（本人「淡い青・グレーベース」→ palette.frame=light）。--deck は札とボタンの濃い地に残す。
   ② v2 に直に書かれた、前のテーマの差し色（やってみるのライムの地・ミントの影）を青の系統に替える。 */
:where(html[data-theme=v2]) .topbar{background:var(--paper);border-bottom:1px solid var(--line);color:var(--ink)}
:where(html[data-theme=v2]) .brand-icon{background:var(--acc-deep)}
:where(html[data-theme=v2]) .brand-icon svg{stroke:var(--paper)}
:where(html[data-theme=v2]) .brand .course{color:var(--acc-deep)}
:where(html[data-theme=v2]) :is(.tb-guide button,.topbar .plain){border:1px solid var(--line-3);color:var(--ink)}
:where(html[data-theme=v2]) :is(.tb-guide button,.topbar .plain):hover{border-color:var(--acc-deep)}
:where(html[data-theme=v2]) :is(.tb-guide button,.topbar .plain)[aria-pressed=true]{background:var(--acc-tint);color:var(--acc-deep);border-color:var(--acc-deep)}
/* 帯は青みの灰（--line-2）。前は --main-soft で、札の下 10px（clip-path で下へ伸ばした帯）が色の面積の本文の面に入り、19 画面の平均で 1.3 点になっていた。
   見え方はほぼ同じで、地（--bg）より一段暗い帯のまま（仕上げ C 2026-09-27） */
:where(html[data-theme=v2]) .chapters{background:var(--line-2);box-shadow:0 0 0 100vmax var(--line-2)}
:where(html[data-theme=v2]) .chapter{background:var(--paper);border:1px solid var(--line-3);color:var(--ink-2)}
:where(html[data-theme=v2]) .chapter .num{color:var(--ink-3)}

var FIGS = {
  "r3-p50": {src: "", w: 2667, h: 1500, cap: "微分積分学 編の第3回の最後のページで、「何のためにこれらを厳密化したのか」という問いに、極限と連続性の台の上に微分・積分が載る図で答えています。", cite: "小船幹生「AI・データ分析のための大学数学 微分積分学 編」第3回 p.50", page: "50"},
  "r5-p48": {src: "", w: 2155, h: 613, cap: "リーマン和の収束が積分に、差分商の収束が微分につながります。右の段は、その先をベクトル、行列、テンソルへ広げる抽象空間（高次元）への展開です。", cite: "小船幹生「AI・データ分析のための大学数学 微分積分学 編」第5回 p.48", page: "48"},
  "r4-p3": {src: "", w: 2667, h: 1500, cap: "平均変化率 (f(b)−f(a))/(b−a) と、h→0 の極限で決まる接線の傾き dy/dx が上下に並びます。区間の平均の速さは上の式、その瞬間の速さは下の式にあたります。", cite: "小船幹生「AI・データ分析のための大学数学 微分積分学 編」第4回 p.3", page: "3"},
  "r4-p4": {src: "", w: 2667, h: 1500, cap: "曲線上の点 Q を点 P に近づけていく図です。2 点を結ぶ直線の傾きは、y の増加量を x の増加量で割った Δy/Δx で、幅を Δ（デルタ）で表します。", cite: "小船幹生「AI・データ分析のための大学数学 微分積分学 編」第4回 p.4", page: "4"},
  "r4-p5": {src: "", w: 2667, h: 1500, cap: "Q を P に極限まで近づけると、2 点を結ぶ直線は点 P の接線に重なり、傾きを dy/dx と書きます。右下の注のとおり、本来の幅は図に描けません。", cite: "小船幹生「AI・データ分析のための大学数学 微分積分学 編」第4回 p.5", page: "5"},
  "r3-p17": {src: "", w: 2667, h: 1500, cap: "左の列は、N₁ から先の点がすべて点線の帯の中に入り、α に近づいていきます。右の列は、N₁ より先にも帯の外に出る点があり、「α から外れる値がある」例です。", cite: "小船幹生「AI・データ分析のための大学数学 微分積分学 編」第3回 p.17", page: "17"},
  "r3-p18": {src: "", w: 2667, h: 1500, cap: "ε-N 論法による数列の極限の定義です。下の枠では、α に収束することを「aₙ はあるところから先ではずっと、α に近い値を取る」と言い換えています。", cite: "小船幹生「AI・データ分析のための大学数学 微分積分学 編」第3回 p.18", page: "18"},

function compatible(a, b) {

function patchNode(current, next) {

    return;

  if (current.tagName === "INPUT" && current.value !== next.value) current.value = next.value;
  if (current.tagName === "SELECT" && current.value !== next.value) current.value = next.value;

function patchChildren(current, next) {
  var wanted = [].slice.call(next.childNodes);
  for (var i = 0; i < wanted.length; i++) {
    var target = wanted[i], key = nodeKey(target);
    var existing = current.childNodes[i];
    if (!existing || !compatible(existing, target) || nodeKey(existing) !== key) {

      if (key) {

        for (var r = 0; r < rest.length; r++) {
          if (nodeKey(rest[r]) === key && compatible(rest[r], target)) { match = rest[r]; break; }

      if (match) {

        existing = match;
      } else {
        current.insertBefore(target.cloneNode(true), existing || null);
        continue;
      }
    }
    patchNode(existing, target);
  }
  while (current.childNodes.length > wanted.length) current.lastChild.remove();

/* 切り替え（2〜4 の面を入れ替える）。★ 属性名を組み立てる（'data-' + name）ので、grep では data-* が見えない。

/* ── 枚の枠 ──────────────────────────────────────────────────────── */
function eyebrow() {
  var s = slideNow();

    + (list.length > 1 ? '<span class="s-of">' + k + " / " + list.length + "</span>" : "") + "</div>";

/* o = {title, lead, right} */
function slideHead(o) {

    + (o.right ? '<div class="s-right">' + o.right + "</div>" : "") + "</header>";

function slideBody(stageHtml, sideHtml, opt) {

/* やってみる（自分の PC で）。切り替えのある教材は o = {lead, <AXIS の値>:[手順], …}（PCL は win・mac）、無い教材は o = {lead, steps:[手順]}。
   手順の札は AXIS.labels の名前＋「の手順」。操作の早見の棚（gTipsFor）があれば、クリックの操作の札を添える */

/* 値を連続で動かす（スライダー。押して動くものの型 6）。o = {key:状態の鍵, min, max, step, label, unit, fmt(v)}。
   動かすと state[key] に数で入って描き直す（boot.js の handleInput が data-range を受ける）。章は defaults({鍵: 初期値}) を書く */
function rangeCtl(o) {

/* 式（組むときに描いた SVG。build_web.py が math_defs.json と math_cache.json から var MATH を差し込む）。本文では mx(鍵の文字列) で呼ぶ。
   ★ 鍵が無ければ止める（描いていない式を画面に出さない）。字の大きさは前後の字に合わせて em で描かれている */
function mx(key) {
  var M = typeof MATH === "object" && MATH ? MATH : {}, svg = M[key];
  if (!svg) throw new Error("式がありません（math_defs.json と math_cache.json を作り直す）: " + key);
  var disp = typeof MATH_DISPLAY === "object" && MATH_DISPLAY && MATH_DISPLAY.indexOf(key) >= 0;
  return '<span class="mx' + (disp ? " mx-d" : "") + '" data-mx="' + key + '">' + svg + "</span>";

function checkBox(id, title, body, opt) {

/* 小さな表（補足の中で使う） */

function miniTable(head, rows, cls) {

/* 理解の確認。★ 押した肢に印を残す */
function quiz(id, q, opts, ans, why, tag) {
  var picked = state.answers[id];
  var done = state.checked[id];
  return '<div class="quiz" data-quiz="' + id + '">'
    + '<span class="qtag">' + (tag || "理解の確認") + "</span>"
    + "<h3>" + q.title + "</h3>"
    + '<p class="qq">' + q.body + "</p>"
    + '<div class="qopts">' + opts.map(function (o, i) {

      if (picked === i) cls += " chosen";
      return '<button class="' + cls + '" data-qopt="' + id + ":" + i + '">' + o + "</button>";
    }).join("") + "</div>"
    + (done ? '<p class="qhead ' + (picked === ans ? "ok" : "ng") + '">' + (picked === ans ? "正解です。" : "ちがいます。") + "</p>" : "")
    + '<p class="qwhy' + (done ? " on" : "") + '">' + why + "</p>"
    + "</div>";
}

/* 参考書を開く札（枚の中に置く小さな入口。中身は引き出し） */
function bookTag() {

/* ── 誌面（参考書の切り抜き）──────────────────────────────────────────
   ★ すべて版元の誌面です。出典を必ず添えます。公開版では中身が空になり、出典だけの箱にします。 */

/* ── 引き出し（参考図書）──────────────────────────────────────────── */
var BOOK_TITLE = (DECK.refs || {}).book_title || "";   /* deck.json の refs.book_title（書名）と book_meta（書いた人と版元） */
var BOOK_META = (DECK.refs || {}).book_meta || "";

function shiori() {

      + "<figcaption><cite>" + BOOK_TITLE + " " + esc(f.cite) + "</cite></figcaption></figure>"

/* この回の一覧。枚ごとに切り抜きを並べ、押すとその枚へ行って開く */
function shelfList() {

/* ── 上の帯・章ナビ・下の送り ───────────────────────────────────────── */
/* 上の帯。左の字は deck.json の brand（lab・course。本人が 2026-09-26 に決めた字）、
   右は切り替え（AXIS があるときだけ）・操作の早見（棚 guide があるときだけ）・文字を拡大 */
function topbar() {
  var B = DECK.brand || {};
  return '<div class="topbar"><div class="wrap tb-wrap"><div class="brand"><span class="brand-icon">'
    + (B.icon_svg || '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>')
    + '</span><span>' + esc(B.lab || "") + '</span><span class="course">' + esc(B.course || "") + "</span></div>"
    + '<div class="header-actions">' + axisSwitch()

}
/* 切り替えのボタン（全部の枚に効く）。属性は data-<AXIS.key>（PCL は data-os）。押したときは boot.js の handleClick が受ける */
function axisSwitch() {
  if (!AXIS) return "";
  return '<div class="osswitch" role="group" aria-label="' + esc(AXIS.aria || "") + '">' + AXIS.values.map(function (v) {
    return "<button data-" + AXIS.key + '="' + v + '" aria-pressed="' + (axVal() === v) + '">' + esc(AXIS.labels[v] || v) + "</button>";
  }).join("") + "</div>";
}

function chapters() {
  var cur = slideNow().ch;
  return '<nav class="chapters" aria-label="章">' + CHAPTERS.map(function (c, i) {
    var list = slidesOfChapter(i);

      return '<i' + (n === state.slide ? ' class="on"' : "") + "></i>";
    }).join("") + "</span>" : "";
    return '<button class="chapter" data-slide="' + list[0] + '"' + (cur === i ? ' aria-current="page"' : "") + '>'
      + '<span class="num">' + c.no + '</span><span class="ch-t">' + tt(c.s) + "</span>" + dots + "</button>";
  }).join("") + "</nav>";
}

function pager() {
  var n = state.slide, N = SLIDES.length;
  var prev = n > 0 ? SLIDES[n - 1] : null, next = n < N - 1 ? SLIDES[n + 1] : null;
  return '<div class="pager">'
    /* 矢印と題の間は折らない空白（矢印だけが次の行に落ちないように） */
    + (prev ? '<button class="btn pg-prev" data-slide="' + (n - 1) + '">←\u00a0' + esc(tt(prev.t)) + "</button>" : "<span></span>")
    + '<span class="pg-count">' + (n + 1) + " / " + N + '<span class="pg-keys">' + kbd("←") + kbd("→") + " で送る</span></span>"
    + (next ? '<button class="btn pg-next" data-slide="' + (n + 1) + '">' + esc(tt(next.t)) + "\u00a0→</button>" : "<span></span>")
    + "</div>";
}

function foot() {

function shell() {

    + '<div class="wrap">' + chapters()

    + pager() + "</main>"

    + shiori() + drawer() + (typeof guideOverlay === "function" ? guideOverlay() : "");

/* ═════ sp.js ═════ */
/* ═════ sp.js — 補足の厚い形（details.check.sp）の部品（2026-09-26）══════════════════════════════
   案 A「図鑑のパネル」を土台に、案 B の画面の模型（標本の格子・大きな 1 枚）と拡張子の実験台の器、
   案 C の鋭い一言の札（spKey）と展開した木（spTree）を接いだもの。CSS は sp.css（v2 は theme-v2.css の末尾）。
   ★ どの関数も HTML の文字列を返すだけ（ui.js と同じ）。DOM は core.js の差分更新が当てる。状態は持たない。
   ★ 既存の補足（checkBox の 3 引数）はそのまま使える。厚くしたいものだけ spPanel に載せ替える（id は同じでよい）。

   ■ 決まり（検査で見ている）
     1. 字は HTML、絵は SVG。svg.sp-art の中に <text> を置かない（qa_drive.py sp が数える）
     2. 絵の塗りはクラス（sp-p・sp-a …）。色は .sp の CSS 変数で、v1 と v2 で塗り分ける
     3. 画面の模型（標本）の色だけは style で持つ（年代の色。v1 と v2 で同じ。v2 の [fill=…] の塗り替えに巻き込まれない）
     4. ロゴ（旗・りんご）・製品の形・壁紙の写真を描かない。［スタート］は無地の四角か丸、アップルメニューは無地の四角。
        壁紙の題材（丘と空・波・山並み）も描かない。模型の地は無地か、透ける楕円（th・bs）にする（2026-09-26 のロゴの検査役 2 体）。
        Windows の模型（vista・w7・w10・w11）の地も同じ日の 2 回目の検査で合わせた（光の波・光の筋・光の板・丸い面をやめた）
     5. 札は 14px（--fs-label）、文は 16px（--fs-body）。rem なので「文字を拡大」でそろって大きくなる
     6. 確かめていない記述には [[仮]] か kari:true を付ける（「仮」の札になる）。出荷の版では 0（qa_drive.py sp・build_web.py）
     7. 文は章のファイルが書く。ここに OS の文言・年・版・数を書かない（既定の見出しの語だけ）

   ═════════════════════════════════════════════════════════════════════════════════════════════ */

/* ── 下ごしらえ ───────────────────────────────────────────── */
function spAttr(a) {
  var h = "";
  for (var k in a) if (a[k] !== undefined && a[k] !== null) h += " " + k + '="' + a[k] + '"';
  return h;
}
/* 図形 1 つ。cls は塗りと線のクラス（下の一覧）。st は模型の年代の色（style） */
function spE(tag, a, cls, st) {
  return "<" + tag + spAttr(a) + (cls ? ' class="' + cls + '"' : "") + (st ? ' style="' + st + '"' : "") + "/>";
}
function spR(x, y, w, h, r, cls, st) { return spE("rect", { x: x, y: y, width: w, height: h, rx: r || 0 }, cls, st); }
function spC(cx, cy, r, cls, st) { return spE("circle", { cx: cx, cy: cy, r: r }, cls, st); }
function spP(d, cls, st) { return spE("path", { d: d }, cls, st); }
/* 年代の色（style の fill だけ・stroke だけ） */
function spF(c) { return "fill:" + c; }
function spS(c, w) { return "fill:none;stroke:" + c + ";stroke-width:" + (w || 1); }

/* 塗りと線のクラス（色は sp.css の .sp の変数）
   sp-ln 墨の線 2px（縮めても太さは同じ）／sp-ln1 細い線 1.5px／sp-dash 破線／sp-hl 注目の赤い輪
   sp-p 紙（白）／sp-a 主の淡い色／sp-b 差し色の淡い色／sp-c 印の色（1 枚に 1 か所）／sp-sh 影・奥／sp-k 墨のベタ／sp-box 箱の地
   sp-arl 矢印の線／sp-arf 矢じり／sp-hotl・sp-hotf 番号札の引き出し線と点（注目の赤） */

/* SVG の外枠。字を置かない。w×h が 1 倍の大きさで、それより大きくは引き伸ばさない */
function spArt(w, h, inner, label, cls) {
  return '<svg class="sp-art' + (cls ? " " + cls : "") + '" viewBox="0 0 ' + w + " " + h + '" width="' + w + '" height="' + h + '"'
    + (label ? ' role="img" aria-label="' + label + '"' : ' aria-hidden="true"') + ">" + inner + "</svg>";
}

/* 画面の大きさ（320×200）の図を 1 枚の SVG にする。crop = [x, y, 幅, 高さ] でその部分だけ（見出しの小さな絵にもそのまま使う） */
function spFrame(inner, crop, label) {
  var c = crop || [0, 0, 320, 200];
  return '<svg class="sp-art sp-shot" viewBox="' + c.join(" ") + '" width="' + c[2] + '" height="' + c[3] + '"'
    + (label ? ' role="img" aria-label="' + label + '"' : ' aria-hidden="true"') + ">" + inner + "</svg>";
}


/* 展示台（博物館の台座）。上の板・胴・銘板 */
function spPlinth(x, y, w, plates) {
  var h = spR(x - 8, y, w + 16, 11, 3, "sp-p sp-ln") + spR(x, y + 11, w, 26, 0, "sp-a sp-ln");
  (plates || []).forEach(function (cx) { h += spR(cx - 30, y + 18, 60, 11, 3, "sp-p sp-ln1"); });
  return h;
}
/* 書類のアイコン（角を折った紙）。lines = 中の行の数 */
function spDoc(x, y, w, h, lines, cls) {
  var f = Math.min(w, h) * .3;
  var s = spP("M" + x + " " + y + "h" + (w - f) + "l" + f + " " + f + "v" + (h - f) + "h-" + w + "z", (cls || "sp-p") + " sp-ln")
    + spP("M" + (x + w - f) + " " + y + "v" + f + "h" + f, "sp-ln sp-none");
  for (var i = 0; i < (lines || 0); i++) s += spR(x + w * .16, y + h * .38 + i * h * .14, w * (i % 2 ? .5 : .66), h * .06, 1, "sp-sh");
  return s;
}
/* フォルダー */
function spFolder(x, y, w, h, cls) {
  return spP("M" + x + " " + (y + h * .16) + "h" + w * .36 + "l" + w * .08 + " " + h * .12 + "h" + w * .56 + "v" + h * .72 + "h-" + w + "z", (cls || "sp-c") + " sp-ln");
}
/* 荷札（左がとがった札と、ひもを通す穴）。
   ★ 尖りの幅と穴の半径は札の高さに比例させる（h の 0.5 と 0.18。大きい札は 16 と 5 で頭打ち＝前と同じ形）。
     前は 16 と 5 の決め打ちで、見出しの小さな絵（20×14）では胴が 4 しか残らず、穴がはみ出して「三角と点」に見えた（2026-09-26） */
function spTag(x, y, w, h) {
  var p = Math.min(16, h * .5), r = Math.min(5, h * .18);
  return spP("M" + (x + p) + " " + y + "H" + (x + w) + "V" + (y + h) + "H" + (x + p) + "L" + x + " " + (y + h / 2) + "z", "sp-p sp-ln")
    + spC(x + p + 1, y + h / 2, r, "sp-b sp-ln1");
}
/* 鉛筆（(x, y) が芯の先。ang 度だけ回す） */
function spPencil(x, y, len, ang) {
  return '<g transform="translate(' + x + " " + y + ") rotate(" + ang + ')">'
    + spP("M0 0L16 -7V7z", "sp-p sp-ln") + spP("M0 0L6 -2.6V2.6z", "sp-k")
    + spR(16, -7, len - 30, 14, 0, "sp-c sp-ln") + spR(len - 14, -7, 14, 14, 3, "sp-b sp-ln")
    + spP("M16 0H" + (len - 14), "sp-ln1") + "</g>";
}
/* マウスの矢印（挿絵の色） */
function spPointer(x, y, s) {
  s = s || 1;
  return '<g transform="translate(' + x + " " + y + ") scale(" + s + ')">' + spP("M0 0l0 17 4.6-4.2 3.2 7 3-1.4-3.2-6.8 6.2-.2z", "sp-p sp-ln") + "</g>";
}


/* ── 部品（HTML）───────────────────────────────────────────── */
function spKari() { return '<i class="sp-kari" title="確かめている途中です">仮</i>'; }
/* 文の中の [[仮]] を札に替える（中身の側で書きやすくするため） */
function spK(s) { return String(s === undefined || s === null ? "" : s).replace(/\[\[仮\]\]/g, spKari()); }

/* 扉（大きな見出しの図）。o = {art, kicker, h, lead, chips, years} */
function spHero(o) {
  var yrs = o.years && o.years.length
    ? '<div class="sp-hero-yrs" style="grid-template-columns:repeat(' + o.years.length + ',minmax(0,1fr))">'
      + o.years.map(function (y) { return '<span class="sp-hero-yr">' + y + "</span>"; }).join("") + "</div>"
    : "";
  return '<header class="sp-hero"><div class="sp-hero-art"><div class="sp-hero-fig">' + o.art + yrs + "</div></div>"
    + '<div class="sp-hero-txt">' + (o.kicker ? '<p class="sp-kicker">' + o.kicker + "</p>" : "")
    + '<h3 class="sp-h"><span>' + o.h + "</span></h3>"
    + (o.lead ? '<p class="sp-lead">' + spK(o.lead) + "</p>" : "") + (o.chips ? '<div class="sp-hero-chips">' + o.chips + "</div>" : "") + "</div></header>";
}
/* 見開き（左右 2 ページ。760px 以下で縦に積む）。
   3 つ目（fill）は広い画面で片方のページの下へ回る。短いほうのページの下を埋めて、左右の高さをそろえるための口 */
function spSpread(left, right, fill) {
  var f = fill && typeof fill === "object" ? fill : { fill: fill, side: "right" };
  var under = f.fill ? '<section class="sp-page sp-page-fill">' + f.fill + "</section>" : "";
  return '<div class="sp-spread' + (under ? " sp-spread-f" + (f.side === "left" ? " sp-fill-l" : "") : "") + '">'
    + '<section class="sp-page sp-page-l">' + left + '</section><section class="sp-page sp-page-r">' + right + "</section>" + under + "</div>";
}
/* ページの見出し（番号の札つき） */
function spPh(no, t) { return '<h4 class="sp-ph"><i class="sp-no">' + no + "</i><span>" + t + "</span></h4>"; }
function spTxt(s) { return '<p class="sp-txt">' + spK(s) + "</p>"; }
/* 図の札（全幅の figure）。番号はページの見出し（spPh）と同じ札で、節の番号の続きを渡す。
   ★ 2026-09-26 まで「図 5」と出していた。節の 1〜4 の次に「図 5」があると、図 1〜4 を探してしまう（見た目と学生の検査役）。
     番号の数え方は変えず、札を節と同じにして「図」の字を外した */
function spPlate(no, cap, inner) {
  return '<figure class="sp-plate"><figcaption><i class="sp-no">' + no + "</i><span>" + spK(cap) + "</span></figcaption>" + inner + "</figure>";
}
/* 鋭い一言の札（案 C の KEY）。1 本の補足に 1 つまで */
function spKey(html, label) {
  return '<div class="sp-key"><span class="sp-key-lbl">' + (label || "KEY") + "</span><p>" + spK(html) + "</p></div>";
}

/* 年表の路線図。o = {lanes:[{k,name}], stops:[{y, name, ver, p, kari, st:{laneKey: "start|dot|pass|end|join|xfer|aside|none"}}], [aside]}
   ★ aside（2026-09-26）: どちらの系統にも入らない駅の印（点線の菱形。線は引かない）。その欄に線の無い行で使う
     （例: Mac の路線図の Xerox Alto・Apple Lisa は st: {cl: "aside", ux: "pass"}。UNIX の線の上に載って、UNIX 系に見えていた）。
     o.aside に文（HTML）を渡すと、凡例の 3 つ目に菱形の印とその文が並ぶ */
function spRail(o) {
  var keys = o.lanes.map(function (l) { return l.k; });
  var legend = '<div class="sp-legend">' + o.lanes.map(function (l, i) {
    return '<span><i class="sp-sw l' + (i + 1) + '"></i>' + l.name + "</span>";
  }).join("") + (o.aside ? '<span><i class="sp-sw aside"></i>' + spK(o.aside) + "</span>" : "") + "</div>";
  var rows = o.stops.map(function (s) {
    var lanes = keys.map(function (k, i) {
      return '<i class="sp-lane l' + (i + 1) + " " + (s.st[k] || "none") + '"></i>';
    }).join("");
    return '<li class="sp-st"><span class="sp-lanes" aria-hidden="true">' + lanes + "</span>"
      + '<span class="sp-st-y">' + s.y + "</span>"
      + '<span class="sp-st-n"><b>' + s.name + "</b>" + (s.ver ? '<span class="sp-ver">' + spK(s.ver) + "</span>" : "") + (s.kari ? spKari() : "")
      + (s.p ? '<span class="sp-st-p">' + spK(s.p) + "</span>" : "") + "</span></li>";
  }).join("");
  return legend + '<ol class="sp-rail">' + rows + "</ol>";
}

/* 標本の並び（年・名前・字の無い図・一言） */
function spSpecs(list) {
  return '<div class="sp-specs">' + list.map(function (s) {
    return '<div class="sp-spec"><div class="sp-spec-t"><p class="sp-spec-h"><b class="sp-y">' + s.y + "</b>" + s.name + (s.kari ? spKari() : "") + "</p>"
      + (s.p ? '<p class="sp-spec-p">' + spK(s.p) + "</p>" : "") + '</div><div class="sp-spec-fig">' + s.art + "</div></div>";
  }).join("") + "</div>";
}

/* 標本の格子（画面の模型を並べる。案 B の「並べる」）。list = [{scr, y, name, p, crop, kari}]
   札の最小の幅は o.min（rem。既定 11.5）。1440 で 5 列、760 で 3 列、500 で 2 列ほどになる */
function spGrid(list, o) {
  o = o || {};
  return '<div class="sp-grid"' + (o.min ? ' style="--sp-cell:' + o.min + 'rem"' : "") + ">" + list.map(function (s) {
    var fig = s.art !== undefined ? spFrame(s.art, s.crop) : (typeof spShot === "function" ? spShot(s.scr, s.crop) : "");
    return '<figure class="sp-cell"><div class="sp-cell-fig">' + fig + "</div>"
      + '<figcaption><p class="sp-cell-h"><b class="sp-y">' + s.y + '</b><span class="sp-cell-n">' + s.name + "</span>" + (s.kari ? spKari() : "") + "</p>"
      + (s.p ? '<p class="sp-cell-p">' + spK(s.p) + "</p>" : "") + "</figcaption></figure>";
  }).join("") + "</div>";
}


/* 数の並び（版の番号など）。段ごとに 年の札＋番号の札。skip は使わなかった番号（破線の札）
   rows = [{h:"…", nums:["10.0",…], cls:"g1", skip:"…"}] */
function spNums(rows) {
  return '<div class="sp-nums">' + rows.map(function (r) {
    return '<div class="sp-numrow-l ' + (r.cls || "") + '"><p class="sp-numh">' + spK(r.h) + '</p><div class="sp-numrow">'
      + (r.skip ? '<span class="sp-num skip" title="使わなかった番号">' + r.skip + "</span>" : "")
      + r.nums.map(function (n) { return '<span class="sp-num">' + n + "</span>"; }).join("") + "</div></div>";
  }).join("") + "</div>";
}

/* 展開した木（案 C の spTree）。node = [名前, 注記, [子…], 印]。名前が / で終わるものはフォルダー。印が真なら地に印の色 */
function spTree(root) {
  function li(n) {
    var dir = /\/$/.test(n[0]);
    return "<li" + (n[3] ? ' class="hl"' : "") + '><span class="sp-tn' + (dir ? " dir" : "") + '">' + esc(n[0]) + "</span>"
      + (n[1] ? '<span class="sp-ann">' + spK(n[1]) + "</span>" : "")
      + (n[2] && n[2].length ? "<ul>" + n[2].map(li).join("") + "</ul>" : "") + "</li>";
  }
  return '<ul class="sp-tree">' + li(root) + "</ul>";
}

/* 豆知識の札（高さは行ごとにそろう）。外の .sp-tidbox は幅を測る器（列の数に応じて、最後の段に 1 枚だけ残った札を横いっぱいにする。sp.css） */
function spTidbits(list) {
  if (!list || !list.length) return "";
  return '<div class="sp-tidbox"><div class="sp-tids">' + list.map(function (t) {
    return '<aside class="sp-tid"><span class="sp-tid-h">' + (t.h || "豆知識") + "</span><p>" + spK(t.p) + "</p></aside>";
  }).join("") + "</div></div>";
}
/* 資料（出典）の札 */
function spSource(s) { return s ? '<p class="sp-src"><span class="sp-src-h">資料</span><span>' + spK(s) + "</span></p>" : ""; }

/* 名前の札（ファイル名。拡張子は注目の赤） */
function spName(base, ext) {
  return '<span class="sp-fname">' + esc(base) + (ext ? '<b class="sp-ext">' + esc(ext) + "</b>" : '<b class="sp-ext sp-ext-none">（なし）</b>') + "</span>";
}
/* 判定の札（当たり＝緑／止まる＝赤／決まらない＝琥珀） */
function spVerdict(kind, t) { return '<span class="sp-vd ' + kind + '">' + t + "</span>"; }

/* 書き換えの例 1 行。o = {from:[base,ext], to:[base,ext], art, res, vd:[kind,text]} */
function spCase(o) {
  return '<div class="sp-case"><div class="sp-case-fig">' + o.art + '</div><div class="sp-case-main">'
    + '<p class="sp-case-names">' + spName(o.from[0], o.from[1]) + '<span class="sp-arrow" aria-label="を">→</span>' + spName(o.to[0], o.to[1]) + "</p>"
    + '<p class="sp-case-res">' + spVerdict(o.vd[0], o.vd[1]) + "<span>" + spK(o.res) + "</span></p></div></div>";
}

/* バイトの並び（札）。list = ["50", …] か [["50","P"], …]。hot = 先頭から印を付ける数（true なら全部） */
function spBytes(list, hot) {
  var n = hot === true ? list.length : (hot || 0);
  /* 字の段は、1 つでも字を書いたら全部に付ける（書いていないバイトは「·」＝字にならない） */
  var ch = list.some(function (x) { return typeof x !== "string" && x.length > 1; });
  return '<span class="sp-bytes">' + list.map(function (x, i) {
    var b = typeof x === "string" ? [x] : x;
    return '<span class="sp-byte' + (i < n ? " hot" : "") + '"><b>' + b[0] + "</b>" + (ch ? "<i>" + (b[1] || "·") + "</i>" : "") + "</span>";
  }).join("") + "</span>";
}
/* 先頭のバイトの並び。rows = [{ext, name, bytes:[["50","P"],…], hot, note, kari}] */
function spSig(rows) {
  return '<div class="sp-sig">' + rows.map(function (r) {
    var b = r.bytes && r.bytes.length
      ? spBytes(r.bytes.map(function (x) { return [x[0], x[1] || "·"]; }), r.hot ? true : 0)
      : '<span class="sp-nobytes">' + spK(r.note) + "</span>";
    return '<div class="sp-sig-row">' + ficon(r.ext, 26) + '<span class="sp-sig-n">' + r.name + (r.kari ? spKari() : "") + "</span>" + b + "</div>";
  }).join("") + "</div>";
}

/* 札 → 札 → 判定 の流れ（「名前だけ変える」と「作ったアプリで保存し直す」を並べる形）。
   rows = [{h:"見出し", steps:[HTML, …], vd:[kind, text]}]
   ★ 矢印は次の札と一組（.sp-flow-g）にして、折り返しが矢印の手前でしか起きないようにする。
     前は矢印が行の終わりに残り、その先に何も無い行ができた（2026-09-26 の見た目の検証） */
function spFlow(rows) {
  var ar = '<span class="sp-flow-ar" aria-hidden="true">→</span>';
  function g(h, first) { return '<span class="sp-flow-g">' + (first ? "" : ar) + h + "</span>"; }
  return '<div class="sp-flows">' + rows.map(function (r) {
    return '<div class="sp-flow"><p class="sp-flow-h">' + r.h + '</p><div class="sp-flow-r">'
      + r.steps.map(function (s, i) { return g('<span class="sp-flow-st">' + spK(s) + "</span>", i === 0); }).join("")
      + (r.vd ? g(spVerdict(r.vd[0], r.vd[1])) : "") + "</div></div>";
  }).join("") + "</div>";
}

/* 右向きの矢印（矢じりは形で描く。線の太さで育たない） */
function spArrow(w) {
  w = w || 56;
  return '<svg class="sp-art sp-arw" viewBox="0 0 ' + w + ' 24" width="' + w + '" height="24" aria-hidden="true">'
    + spP("M2 12H" + (w - 12), "sp-arl") + spP("M" + (w - 14) + " 4L" + (w - 2) + " 12L" + (w - 14) + " 20z", "sp-arf") + "</svg>";
}


/* 実験台の器（案 B の 5-1）。状態は持たない。章のファイルが state と data 属性で持ち、ここへ渡す。
   o = {label, aria, cur, attr(v) → 属性の文字列, items:[{v, t, sub, icon, attrs}],
        file:{icon, name, changed, bytes, hot, size, same}, app, view, verdict:[kind, text], why, dialog, dialogCap, labels:{name, bytes, to}}
   ★ 押すボタンの分岐は章の onClick。確認の画面は ui.js の dialogBox で章が組んで dialog に渡す */
function spLab(o) {
  var L = o.labels || {}, F = o.file || {};
  var picks = '<div class="sp-picks" role="group" aria-label="' + (o.aria || o.label || "") + '">' + (o.items || []).map(function (it) {
    var at = it.attrs || (o.attr ? o.attr(it.v) : "");
    return '<button class="sp-pick" ' + at + ' aria-pressed="' + (it.v === o.cur) + '">' + ficon(it.icon || "", 30)
      + "<b>" + it.t + "</b>" + (it.sub ? "<small>" + it.sub + "</small>" : "") + "</button>";
  }).join("") + "</div>";
  var file = '<div class="sp-lab-file">' + ficon(F.icon || "", 52)
    + '<div class="sp-lab-parts"><p class="sp-lab-meta">' + (L.name || "名前の札") + "</p>"
    + '<p class="sp-nametag' + (F.changed ? " changed" : "") + '">' + (F.name || "") + "</p>"
    + (F.bytes ? '<p class="sp-lab-meta">' + (L.bytes || "中身（先頭のバイト）") + '</p><div class="sp-inside">' + spBytes(F.bytes, F.hot)
      + (F.size ? '<span class="sp-fsize">' + F.size + "</span>" : "") + "</div>" : "")
    + (F.same ? '<span class="badge ok">' + F.same + "</span>" : "") + "</div></div>";
  var to = '<div class="sp-lab-to">' + spArrow(56) + "<span>" + (L.to || "開くのは") + '</span><b class="sp-app">' + (o.app || "") + "</b></div>";
  var view = '<div class="sp-lab-view">' + (o.view || "") + (o.verdict ? spVerdict(o.verdict[0], o.verdict[1]) : "") + "</div>";
  return '<div class="sp-lab"><p class="sp-lab-t">' + (o.label || "押して比べる") + "</p>" + picks
    + '<div class="sp-lab-stage">' + file + to + view + "</div>"
    + (o.why ? '<p class="sp-lab-why">' + spK(o.why) + "</p>" : "")
    + (o.dialog ? '<figure class="sp-lab-dlg">' + o.dialog + (o.dialogCap ? "<figcaption>" + spK(o.dialogCap) + "</figcaption>" : "") + "</figure>" : "")
    + "</div>";
}

/* 確認の札（画面に出る文言。spec/10 にあるものだけ） */
function spNote(os, html) {
  return '<div class="sp-note"><span class="sp-note-os">' + os + "</span><p>" + spK(html) + "</p></div>";
}

/* ── 厚い補足の本体。checkBox の 4 つ目の引数で .sp と見出しの小さな絵を足す ──
   o = {title, thumb, hero:{…}, lead, parts:[html…], tidbits:[…], source}
   hero を省くと lead（1〜2 文）から始まる（挿絵を描かずに厚くできる） */
function spPanel(id, o) {
  var head = o.hero ? spHero(o.hero) : (o.lead ? '<p class="sp-lead sp-lead-solo">' + spK(o.lead) + "</p>" : "");
  var body = '<div class="sp-body">' + head + (o.parts || []).join("") + spTidbits(o.tidbits) + spSource(o.source) + "</div>";
  return checkBox(id, o.title, body, { cls: "sp", thumb: o.thumb });
}


/* ═════ parts.js ═════ */
/* ═════ parts.js — この教材で共有する部品（科目。/designslide の kit.md §8）═════════════════════
   章の担当は、ここの関数を呼ぶだけにする（直すのは本体）。どれも HTML の文字列を返す。DOM は core.js の差分が当てる。
   ★ 色は 16 進を書かない。クラスで持ち、色は parts.css が役目のトークン（--c-main・--ink・--line・--hit など）で塗る。
   ★ 図の中の字は 16px（viewBox 640 の単位）。狭い画面では .diagram-scroll の中で 640px を保つので 14px を割らない。
   ★ 本文の絵（ppArt）は本人の決定（2026-09-26「本分にも入れようかな。」）で置く。絵の中に字を置かない・ロゴや製品の形や
     キャラクターを描かない。qa_subject.py の art の組が数える。

   ■ 一覧
     ppPlot(o)          関数のグラフ。曲線は式を評価して描く（手描きのベジェにしない。math.md §4）
                        o = {w, h, x:[x0,x1], y:[y0,y1], xticks, yticks, xfmt, yfmt, cap, xcap, aria,
                             lines:[{f, from, to, n, cls}], hlines:[{y, cls}], vlines:[{x, cls}],
                             bars:[{x, y, w, cls, y0}], pts:[{x, y, cls, r}], holes:[{x, y}], segs:[{x1,y1,x2,y2,cls}],
                             pins:[{x, y, html, dx, dy, cls}]（図の外の HTML の札。% で置く）}
     ppArt(key, [cls])  本文の絵（PP_ART の鍵）。字は置かない。aria-hidden
     ppNum(o)           答えを打って判定する欄（押して動くものの型 ②）。o = {key, run, label, unit, ans, tol, pct, why, hint}
                        状態の鍵 o.key（打った文字）と o.key + "R"（"ok" | "ng" | ""）は章が defaults に書く。
                        o.run は章の "cN-enter"（Enter で押すボタンの data-run。build.md §4）
     ppThread(id, t)    数理の枚へ渡す札（押すとその枚へ）。id は枚の id（"6-2"）。添字は名前で引く（build.md §12）
     ppCase(o)          実務の事例の札。o = {co, title, rows:[[見出し, 文], …], note}
     ppStep(o)          1 手ずつ送る操作（型 ③）。o = {key, max, label, unit, fmt}。状態の鍵は章が defaults に書く
     ppStat(items)      値の札の並び。items = [{v, u, l, cls}]
     ── ノート（Colab の演習ノート）とのつなぎ。字の正本は src/nb.js の NB（ノートの生成器が書く。下の節の頭の注記）──
     ppHint(id)         ノートの問のヒント 3 段（① 考え方 ② 途中までのコード ③［コードをコピー］＋セル全体のコード）。id は NB.holes の鍵
     ppHoleId(slide, q) 枚の id と問の番号から NB.holes の鍵を引く（鍵を組み立てない）
     ppNb(lead, steps, note)  slideBody の下の「ノート」の段（前の「やってみる」の位置）。ppNbRun(枚の id, 文) は実行するだけのセルの段
     ppNbLine(s)        NB の文（提出の手順）を画面の形にする（ファイル名を折らない・矢印の後ろで折れる）。字は変えない
     頭の札             eyebrow の出力の右端に NB.at の字を足す（押せない札。塗りも枠も無い小さな字）。章は何もしなくてよい
*/

/* ── 関数のグラフ ─────────────────────────────────────────── */
function ppPlot(o) {
  var W = o.w || 640, H = o.h || 260, P = o.pad || { l: 64, r: 20, t: 14, b: 40 };
  var X0 = o.x[0], X1 = o.x[1], Y0 = o.y[0], Y1 = o.y[1];
  function sx(x) { return P.l + (x - X0) / (X1 - X0) * (W - P.l - P.r); }
  function sy(y) { return H - P.b - (y - Y0) / (Y1 - Y0) * (H - P.t - P.b); }
  function r1(v) { return Math.round(v * 10) / 10; }
  function inY(y) { return y >= Y0 - 1e-9 && y <= Y1 + 1e-9; }
  var g = [];
  (o.yticks || []).forEach(function (t) {
    var Y = r1(sy(t));
    g.push('<line class="pl-grid" x1="' + P.l + '" y1="' + Y + '" x2="' + (W - P.r) + '" y2="' + Y + '"/>');
    g.push('<text class="pl-tk" x="' + (P.l - 10) + '" y="' + (Y + 5.5) + '" text-anchor="end">' + esc(o.yfmt ? o.yfmt(t) : String(t)) + "</text>");
  });
  (o.xticks || []).forEach(function (t) {
    var X = r1(sx(t));
    g.push('<line class="pl-grid" x1="' + X + '" y1="' + P.t + '" x2="' + X + '" y2="' + (H - P.b) + '"/>');
    g.push('<text class="pl-tk" x="' + X + '" y="' + (H - P.b + 24) + '" text-anchor="middle">' + esc(o.xfmt ? o.xfmt(t) : String(t)) + "</text>");
  });
  g.push('<line class="pl-axis" x1="' + P.l + '" y1="' + (H - P.b) + '" x2="' + (W - P.r) + '" y2="' + (H - P.b) + '"/>');
  g.push('<line class="pl-axis" x1="' + P.l + '" y1="' + P.t + '" x2="' + P.l + '" y2="' + (H - P.b) + '"/>');
  (o.hlines || []).forEach(function (h) {
    if (!inY(h.y)) return;
    var Y = r1(sy(h.y));
    g.push('<line class="' + (h.cls || "pl-asym") + '" x1="' + P.l + '" y1="' + Y + '" x2="' + (W - P.r) + '" y2="' + Y + '"/>');
  });
  (o.vlines || []).forEach(function (v) {
    var X = r1(sx(v.x));
    g.push('<line class="' + (v.cls || "pl-asym") + '" x1="' + X + '" y1="' + P.t + '" x2="' + X + '" y2="' + (H - P.b) + '"/>');
  });
  (o.bars || []).forEach(function (b) {
    var y0 = b.y0 === undefined ? Math.max(Y0, 0) : b.y0, top = Math.min(Math.max(b.y, Y0), Y1);
    var x = sx(b.x - (b.w || 0.8) / 2), w = sx(b.x + (b.w || 0.8) / 2) - x;
    var ya = sy(Math.max(top, y0)), yb = sy(Math.min(top, y0));
    g.push('<rect class="' + (b.cls || "pl-bar") + '" x="' + r1(x) + '" y="' + r1(ya) + '" width="' + r1(Math.max(w, 1)) + '" height="' + r1(Math.max(yb - ya, 0)) + '" rx="2"/>');
  });
  (o.lines || []).forEach(function (L) {
    var a = L.from === undefined ? X0 : L.from, b = L.to === undefined ? X1 : L.to, n = L.n || 240, d = "", pen = false, pts = [];
    for (var i = 0; i <= n; i++) {
      var x = a + (b - a) * i / n, y = L.f(x);
      if (!isFinite(y) || !inY(y)) { pen = false; continue; }
      d += (pen ? "L" : "M") + r1(sx(x)) + " " + r1(sy(y));
      pts.push([r1(sx(x)), r1(sy(y))]);
      pen = true;
    }
    /* area: 曲線と x 軸（y ＝ max(Y0, 0)）のあいだを淡く塗る（量を面で見せる。学生役の直す案 1） */
    if (L.area && pts.length > 1) {
      var base = r1(sy(Math.max(Y0, 0)));
      g.push('<path class="pl-area" d="M' + pts[0][0] + " " + base + "L" + pts.map(function (q) { return q.join(" "); }).join("L") + "L" + pts[pts.length - 1][0] + " " + base + 'Z"/>');
    }
    if (d) g.push('<path class="' + (L.cls || "pl-line") + '" d="' + d + '"/>');
  });
  (o.segs || []).forEach(function (s) {
    g.push('<line class="' + (s.cls || "pl-seg") + '" x1="' + r1(sx(s.x1)) + '" y1="' + r1(sy(s.y1)) + '" x2="' + r1(sx(s.x2)) + '" y2="' + r1(sy(s.y2)) + '"/>');
  });
  (o.pts || []).forEach(function (p) {
    if (!inY(p.y)) return;
    g.push('<circle class="' + (p.cls || "pl-pt") + '" cx="' + r1(sx(p.x)) + '" cy="' + r1(sy(p.y)) + '" r="' + (p.r || 6) + '"/>');
  });
  (o.holes || []).forEach(function (p) {
    g.push('<circle class="pl-hole" cx="' + r1(sx(p.x)) + '" cy="' + r1(sy(p.y)) + '" r="8"/>');
  });
  /* 札は点の上に出す。図の上 18% にかかるなら点の下へ、右 16%・左 12% にかかるなら内側へ寄せる（図の上端と端で切れないように。学生役 中1） */
  var pins = (o.pins || []).map(function (p) {
    var L = r1(sx(p.x) / W * 100), T = r1(sy(p.y) / H * 100), dy = p.dy === undefined ? -26 : p.dy, dx = p.dx || 0, tx = "-50%";
    if (T + dy / H * 100 < 18) dy = Math.abs(dy) || 26;
    if (L > 84) { tx = "-100%"; dx = -Math.abs(dx) - 10; }
    else if (L < 12) { tx = "0%"; dx = Math.abs(dx) + 10; }
    return '<span class="pl-pin' + (p.cls ? " " + p.cls : "") + '" style="left:' + L + "%;top:" + T + "%;--tx:" + tx + ";--dx:" + dx + "px;--dy:" + dy + 'px">' + p.html + "</span>";
  }).join("");
  return '<div class="pl-wrap">' + (o.cap ? '<div class="pl-cap">' + o.cap + "</div>" : "")
    + '<div class="diagram-scroll"><div class="pl-box wide-min"><svg class="pl" viewBox="0 0 ' + W + " " + H + '" width="' + W + '" height="' + H
    + '" role="img" aria-label="' + esc(o.aria || "") + '">' + g.join("") + "</svg>" + pins + "</div></div>"
    + (o.xcap ? '<div class="pl-xcap">' + o.xcap + "</div>" : "") + "</div>";
}

/* ── 値の札の並び ─────────────────────────────────────────── */
function ppStat(items) {
  return '<div class="pp-stats">' + items.map(function (s) {
    return '<div class="pp-stat' + (s.cls ? " " + s.cls : "") + '"><b class="pp-v">' + s.v + (s.u ? '<small>' + s.u + "</small>" : "")
      + '</b><span class="pp-lbl">' + s.l + "</span></div>";
  }).join("") + "</div>";
}

/* ── 1 手ずつ送る（型 ③）──────────────────────────────────── */
function ppStep(o) {
  PP_STEP_MIN[o.key] = o.min || 0; PP_STEP_MAX[o.key] = o.max;
  var v = state[o.key], shown = o.fmt ? o.fmt(v) : (o.label || "") + " " + v + (o.unit || "");
  return '<div class="pp-step" role="group" aria-label="' + esc(o.aria || o.label || "") + '">'
    + '<button class="btn" data-ppk="' + o.key + '" data-ppd="-1"' + (v <= (o.min || 0) ? " disabled" : "") + ">◀ 1 つ戻す</button>"
    + '<b class="pp-step-v">' + shown + "</b>"
    + '<button class="btn primary" data-ppk="' + o.key + '" data-ppd="1"' + (v >= o.max ? " disabled" : "") + ">1 つ進める ▶</button>"
    + (o.big ? '<button class="btn" data-ppk="' + o.key + '" data-ppd="' + o.big + '"' + (v >= o.max ? " disabled" : "") + ">" + o.big + " 進める</button>" : "")
    + '<button class="btn plain" data-ppk="' + o.key + '" data-ppd="0"' + (v <= (o.min || 0) ? " disabled" : "") + ">最初から</button></div>";
}
var PP_STEP_MIN = {}, PP_STEP_MAX = {};

/* ── 答えを打って判定する（型 ②）──────────────────────────── */
var PP_ANS = {};
function ppNorm(s) {
  return String(s || "").replace(/[０-９．，－ー−％／]/g, function (c) {
    return { "．": ".", "，": ",", "－": "-", "ー": "-", "−": "-", "％": "%", "／": "/" }[c] || String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
  }).replace(/[\s,]/g, "");
}
function ppParse(s) {
  var t = ppNorm(s), pct = /%$/.test(t);
  if (pct) t = t.slice(0, -1);
  var m = t.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/), v = m ? (+m[1]) / (+m[2]) : (t === "" ? NaN : +t);
  return { v: v, pct: pct };
}
function ppJudge(key) {
  var a = PP_ANS[key]; if (!a) return "";
  var p = ppParse(state[key]);
  if (!isFinite(p.v)) return "ng";
  var cands = [p.v];
  if (a.pct) cands = p.pct ? [p.v / 100] : [p.v, p.v / 100];
  return cands.some(function (v) { return Math.abs(v - a.ans) <= a.tol; }) ? "ok" : "ng";
}
function ppNum(o) {
  PP_ANS[o.key] = { ans: o.ans, tol: o.tol, pct: !!o.pct };
  var r = state[o.key + "R"];
  return '<div class="pp-num' + (r ? " " + r : "") + '">'
    + '<label class="pp-num-row"><span class="pp-num-l">' + o.label + "</span>"
    + '<input type="text" inputmode="decimal" autocomplete="off" data-field="' + o.key + '" data-enter="' + o.run + '" value="' + esc(state[o.key] || "") + '" aria-label="' + esc(o.aria || "答え") + '">'
    + (o.unit ? '<span class="pp-num-u">' + o.unit + "</span>" : "")
    + '<button class="btn primary" data-run="' + o.run + '" data-ppjudge="' + o.key + '">判定</button></label>'
    + (r ? '<p class="pp-num-r ' + r + '">' + (r === "ok" ? "合っています。" : "ちがいます。" + (o.hint ? o.hint : "")) + "</p>" : "")

   2-1 冷めていくコーヒー … 経過時間を動かすと、温度の曲線の上の点・室温との差の線・値の札が動く（型 ⑥）。
   2-2 区間を縮めると瞬間の速さ … 区間の幅を切り替えると、区間ごとの平均の速さの棒と、いちばん速い区間の札が変わる（型 ①）。

   ★ 値は model.js から引く（COOL・coolTemp・coolGap・coolTau・SPRINT・sprintSeg）。章の中で別の値を書かない。
   ★ 事実の文は spec/10_事実.md の 8-0 の文だけ（冷却の法則 1-1〜3-2、100 m S-1〜S-9）。書かないこと（8-X）:
     「ニュートンがコーヒー（お茶）で調べた」「ニュートンが『冷却の法則』を発表した」「1700 年の論文」「実物のコーヒーは室温より下がらない」
     「世界陸連が測った」「映像で 10 m ごとに測った」「0〜10 m を 1.88 秒で走った」「時速 44.72 km」。
   ★ 2-2 の棒は表 A（レーザー）の通過タイムから計算した値。いちばん速い 10 m の 12.35 は、報告の最高速度 12.34 と
     同じ画面に並べない（台帳 7-2 の 1）。補足は「距離を微分して求めています」の文だけにして、12.34 の数は出さない。
   ★ 本文の絵は ppArt（coffee・sprint）。厚い補足（2-1）の絵は sp.js の部品で描く。字・ロゴ・製品の形を描かない
     （ニュートンの絵をコーヒーと並べない・特定の体温計やセンサーの形にしない）。 */

defaults({
  c2t: COOL.init,   /* 2-1 経過時間（分） */
  c2w: 0            /* 2-2 区間の幅（SPRINT.widths の添字。初めは 100 m） */
});

onClick(function (d, e) {
  if (d.c2w !== undefined) { act(function () { state.c2w = +d.c2w; }, e); return true; }
  return false;
});

function c2Deg(v) { return fmtN(v, 1) + "℃"; }
function c2Ticks(max, step) { var t = []; for (var v = 0; v <= max; v += step) t.push(v); return t; }

/* ── 2-1 冷めていくコーヒー ──────────────────────────────── */
function renderS21() {
  var t = state.c2t, T = coolTemp(t), gap = coolGap(t), drop = coolTemp(t) - coolTemp(t + 10);
  var plot = ppPlot({
    x: [0, COOL.max], y: [0, 100], h: 220,
    xticks: c2Ticks(COOL.max, 20), yticks: [0, 25, 50, 75, 100],
    yfmt: function (v) { return v + "℃"; },
    cap: "コーヒーの温度（室温 " + COOL.room + "℃ の部屋）", xcap: "経過時間（分）",
    hlines: [{ y: COOL.room }],
    lines: [{ f: coolTemp }],
    segs: [{ x1: t, y1: T, x2: t, y2: COOL.room }],
    pts: [{ x: t, y: T }],
    pins: [
      { x: t, y: T, html: t + " 分で " + c2Deg(T), cls: "main", dx: T > 70 ? 110 : (t < COOL.max * 0.6 ? 74 : -74), dy: T > 70 ? 26 : -26 },
      { x: COOL.max * 0.86, y: COOL.room, html: "室温 " + COOL.room + "℃", dy: 18 }
    ],
    aria: "室温 " + COOL.room + "℃ の部屋で冷めていくコーヒーの温度の曲線。" + t + " 分で " + c2Deg(T)
  });
  var stage = '<div class="pp-ctl">' + rangeCtl({ key: "c2t", min: 0, max: COOL.max, step: COOL.step, label: "経過時間", unit: " 分" }) + "</div>"
    + '<div class="pp-mxline">' + mx("cool") + '<span class="c2-anno">t は経過時間（分）</span></div>'
    + plot
    + ppStat([{ v: c2Deg(T), l: "いまの温度", cls: "main" }, { v: c2Deg(gap), l: "室温との差" }, { v: c2Deg(drop), l: "次の 10 分で下がる量" }])
    + '<p class="pp-model">数は説明用の値です。</p>';
  var side = pointsCard([
    "冷却の法則の上では、温度は室温に近づき続けますが、室温を下回りません",
    "10 分で下がる量は、初めの 10 分の " + c2Deg(coolTemp(0) - coolTemp(10)) + " から、60〜70 分の " + c2Deg(coolTemp(60) - coolTemp(70)) + " まで小さくなります",
    "差が初めの " + fmtPct(1 / Math.E) + "（1/e）まで縮むのは約 " + fmtN(coolTau(), 1) + " 分後で、この 1/e は 3-1 と 6-5 にも出てきます"
  ]) + ppThread("6-2", "差が " + COOL.r + " 倍ずつ縮む") + bookTag();
  return slideHead({
    title: "冷めていくコーヒー",
    lead: COOL.start + "℃ のコーヒーを " + COOL.room + "℃ の部屋に置きます。冷め方の決まり（冷却の法則）の形で、室温との差が毎分 "
      + COOL.r + " 倍に縮むとすると、10 分後は " + c2Deg(coolTemp(10)) + " です。",
    right: ppArt("coffee")
  })
    + slideBody(stage, side)
    + ppNbRun("2-1", "出た表の温度をこの図と見比べます")   /* 電卓の「やってみる」をノート 1 に替えた（本人 2026-09-27） */
    + c2SuppCool();
}

function c2SuppCool() {
  var rows = [0, 10, 20, 30, 60].map(function (m) { return [m + " 分", c2Deg(coolTemp(m)), c2Deg(coolGap(m))]; });
  var k10 = Math.pow(COOL.r, 10);
  /* 熱時定数の図: 50℃ から 25℃ の空気に移したセンサーの温度（三菱マテリアルの式 T＝(T1−T2)exp(−t/τ)＋T2。横は τ の何倍か） */
  var T1 = 50, T2 = 25, Ttau = T2 + (T1 - T2) / Math.E;
  var tauPlot = ppPlot({
    x: [0, 4], y: [20, 50], h: 220,
    xticks: [0, 1, 2, 3, 4], yticks: [25, 30, 35, 40, 45, 50],
    xfmt: function (v) { return v === 0 ? "0" : (v === 1 ? "" : v) + "τ"; },
    yfmt: function (v) { return v + "℃"; },
    cap: "センサーの温度（" + T1 + "℃ から " + T2 + "℃ の空気へ移したとき）", xcap: "移してからの時間（τ は熱時定数）",
    hlines: [{ y: T2 }], vlines: [{ x: 1, cls: "pl-seg" }],
    lines: [{ f: function (x) { return T2 + (T1 - T2) * Math.exp(-x); } }],
    pts: [{ x: 1, y: Ttau }],
    pins: [{ x: 1, y: Ttau, html: "τ で " + c2Deg(Ttau), cls: "main", dx: 64, dy: -18 }],
    aria: T1 + "℃ から " + T2 + "℃ へ移した温度センサーの温度の曲線。熱時定数 τ のとき " + c2Deg(Ttau)
  });
  var hero = spArt(600, 250,
    spP("M40 226H560", "sp-ln") +
    spR(128, 108, 150, 112, 18, "sp-p sp-ln") + spR(140, 120, 126, 20, 8, "sp-b") +
    spP("M278 132c42 0 42 62 0 62", "sp-none sp-ln") +
    spP("M168 96c-12-14 12-24 0-44M203 96c-12-14 12-24 0-44M238 96c-12-14 12-24 0-44", "sp-none sp-ln1") +
    spP("M338 66C372 150 398 176 452 186", "sp-none sp-ln1 sp-dash") +
    spR(470, 34, 32, 156, 16, "sp-p sp-ln") + spR(479, 118, 14, 84, 7, "sp-c") + spC(486, 198, 22, "sp-c sp-ln") +
    spP("M502 58h14M502 82h9M502 106h14M502 130h9M502 154h14", "sp-none sp-ln1"));
  return spPanel("c2-cool", {
    title: "冷め方の決まりはどこから来て、どこで使われているか",
    thumb: spArt(64, 40, spR(12, 12, 28, 22, 5, "sp-p sp-ln") + spP("M40 17c7 0 7 12 0 12", "sp-none sp-ln1") + spR(48, 6, 7, 28, 3.5, "sp-c sp-ln1")),
    hero: { art: hero, kicker: "HEAT ・ 1/e", h: "著者の名前が無い論文",
      lead: "冷め方の決まりは、1701 年に英国王立協会の雑誌 Philosophical Transactions に載ったラテン語の論文に書かれています。この論文には著者の名前がなく、1744 年にニュートンの著作集に収められました。" },
    parts: [
      spKey("冷却の法則の上では、冷める速さを決めるのは、温度そのものではなく室温との差です。"),
      spSpread(
        spPh(1, "10 分ごとの温度と差") + miniTable(["経過時間", "温度", "室温との差"], rows)
          + spTxt("表の差は、10 分ごとに " + fmtN(k10, 3) + " 倍になります。"),
        spPh(2, "冷却の法則と 1701 年の論文")
          + spTxt("冷却の法則は、まわりとの温度の差が時間とともに指数的に縮む、という決まりです。")
          + spTxt("論文には、冷える時間を等しく区切ると、熱の度合いは等比の列になると書かれています。")
          + spTxt("論文は、鉄の熱が空気の熱を上回る分について、時間が等差で進むと等比で小さくなると仮定して計算しています。")),
      spPlate(3, "温度センサーの熱時定数", tauPlot
        + spTxt("温度センサーの部品（サーミスタ）のカタログには、熱時定数という値が載っています。熱時定数は、まわりの温度を急に変えたときに、センサーの温度が初めの温度と最後に落ち着く温度との差の 63.2% だけ変わるまでの時間です。")
        + spTxt("熱時定数と同じだけ時間がたつと、センサーの温度と最後に落ち着く温度との差は、初めの差の 36.8% になります。この 36.8% は、1/e ＝ 0.3678… を百分率にして丸めた値です。")
        + spTxt("三菱マテリアルは、カタログに載せる熱時定数を、50℃から 25℃の静かな空気に移して 34.2℃になるまでの時間で測っています。"))
    ],
    tidbits: [
      { h: "予測式の体温計", p: "冷め方と同じく、近づく先を途中の値から読む例です。予測式の電子体温計は、これ以上上がらない温度（平衡温）を待たずに、途中の上がり方から計算して表示します。テルモの説明では、わきの下で平衡温まで測ると 10 分以上かかります。" },
      { h: "決まりがよく合う範囲", p: "冷却の法則がよく合うのは、温度の差が小さいときです。差が大きいと、放射で出ていく熱が差に比例しないので、決まりからずれます。" },
      { h: "論文で冷やした物", p: "論文で冷やしたのは赤く焼いた鉄で、静かな空気ではなく、一様に吹く風の中に置きました。亜麻仁油の温度計で測れたのは、溶けたすずの温度まででした。それより高い温度は、焼いた鉄が冷える時間から求めました。" }
    ],
    source: "Philosophical Transactions 第 22 巻 第 270 号（1701 年）の論文、Vollmer（2009）の論文の要旨、三菱マテリアル・SEMITEC・村田製作所のサーミスタの解説、テルモ体温研究所の説明"
  });
}

/* ── 2-2 区間を縮めると瞬間の速さ ─────────────────────────── */
function c2Best(segs) { return segs.reduce(function (a, s) { return s.v > a.v ? s : a; }); }

function renderS22() {
  var w = SPRINT.widths[state.c2w], segs = sprintSeg(w), best = c2Best(segs), avg = SPRINT.dist / SPRINT.record;
  var wMin = SPRINT.widths[SPRINT.widths.length - 1], bestMin = c2Best(sprintSeg(wMin));
  var plot = ppPlot({
    x: [0, SPRINT.dist], y: [0, 18], h: 220,
    xticks: c2Ticks(SPRINT.dist, 10), yticks: [0, 4, 8, 12, 16],
    cap: "区間ごとの平均の速さ（秒速 m）。点線は " + SPRINT.dist + " m 全体の平均", xcap: "号砲からの距離（m）",
    hlines: [{ y: avg }],
    bars: segs.map(function (s) { return { x: (s.a + s.b) / 2, y: s.v, w: w - 1.2, cls: s === best ? "pl-bar" : "pl-bar2" }; }),
    pins: [{ x: (best.a + best.b) / 2, y: 14.6, html: "秒速 " + fmtN(best.v, 2) + "\u00a0m", cls: "main", dy: 0 }],
    aria: "区間の幅 " + w + " m ごとの平均の速さの棒。いちばん速いのは " + best.a + "〜" + best.b + " m の秒速 " + fmtN(best.v, 2) + " m"
  });
  var stage = '<div class="pp-ctl"><div class="pp-segrow"><span class="pp-seg-lbl">区間の幅</span>'
    + seg("c2w", SPRINT.widths.map(function (x, i) { return { v: i, t: x + " m" }; }), state.c2w) + "</div></div>"
    + plot
    + ppStat([
      { v: best.a + "〜" + best.b, l: "いちばん速い区間（m）" },
      { v: fmtN(best.v, 2), l: "その区間の平均の速さ（<span class=\"nw\">m/秒</span>）", cls: "main" },
      { v: fmtN(avg, 2), l: SPRINT.dist + " m 全体の秒速（m）" }
    ])
    + '<p class="c2-anno">通過タイムは号砲からの時間で、ボルトの反応時間 ' + SPRINT.react + " 秒を含みます。区間ごとの平均の速さは、区間の長さを通過タイムの差で割った値です。</p>";
  var side = pointsCard([
    "平均の速さを測る区間を縮めた先が、その瞬間の速さです",
    "区間を " + SPRINT.dist + " m から " + wMin + " m まで縮めると、いちばん速い区間の平均は秒速\u00a0" + fmtN(avg, 2) + "\u00a0m から " + fmtN(bestMin.v, 2) + "\u00a0m に上がります",
    "区間を 0 m にすると 0\u00a0m\u00a0÷\u00a00\u00a0秒になり、割り算の答えが決まらないので、縮めた先を極限で決めます"
  ]) + ppThread("6-4", "区間 0 の 0÷0") + bookTag();
  return slideHead({
    title: "区間を縮めると瞬間の速さ",
    lead: SPRINT.year + " 年にウサイン・ボルトが出した男子 " + SPRINT.dist + " m の世界記録 " + SPRINT.record + " 秒は、平均の速さにすると秒速 " + fmtN(avg, 2) + "\u00a0m です。",
    right: ppArt("sprint")
  })
    + slideBody(stage, side)
    + checkBox("c2-zero", "区間を 0 にしたら 0÷0 になるのでは",
      miniTable(["区間の幅（m）", "区間の数", "いちばん速い区間（m）", "その区間の平均の速さ（<span class=\"nw\">m/秒</span>）"], SPRINT.widths.map(function (x) {
        var s = sprintSeg(x), b = c2Best(s);
        return [String(x), String(s.length), b.a + "〜" + b.b, fmtN(b.v, 2)];
      }).concat([["0", "", "", "0 m ÷ 0 秒で決まらない"]]))
      + "<p>区間を縮めた先の値を求める計算を微分と呼び、第2回で扱います。</p>"
      + "<p>10 m ごとの通過タイムは、レーザーで走者までの距離を 1 秒に 50 回または 100 回測った記録から計算したものです。報告の速さは、レーザーで測った距離を微分して求めています。"
      + SPRINT.record + " 秒は、2026 年 9 月の時点でも破られていません。</p>"
      + '<p class="c2-anno">資料: ドイツ陸上競技連盟の研究班の報告（国際陸上競技連盟が公開）</p>');
}

/* 参考資料（spec/00_設計.md §5 の名前。切り抜きは本体が作る。名前がまだ FIGS に無いうちは、引き出しの札が「p.?」で出る） */
REFS["2-1"] = ["la6-p4", "suken-p50"];
REFS["2-2"] = ["r4-p3", "r4-p4", "r4-p5"];


/* ═════ ch3.js ═════ */
/* ═════ 03 ゲーム（手本の章。本体が P3 で書いた）════════════════════════════════
   3-1 当たり 1% を 100 回引く … 回数を動かし、当たりの確率を切り替えると、「1 回以上当たる確率」の曲線と値が動く。
   3-2 防御力を上げ続けると … 防御を動かすと、被ダメージの倍率の曲線の上の点と「＋100 したときに減る幅」が動く。
   3-3 目標に近づき続けるカメラ … 1 フレームずつ送ると、残りの距離の棒が 0.8 倍ずつ短くなる。

   ★ 値は model.js から引く（GACHA・missAll・hitOnce・ARMOR・armorMul・armorTough・CAM・camLeft）。章の中で別の値を書かない。
   ★ 3-2 の式はこの講義で作った式（「よく使われる」は裏が取れなかった。台帳 7-3）。作り手が公開した同じ形の例（Warcraft III）は補足で台帳 H-2 の文だけ。
     3-1 に「天井」を決まりとして書かない（台帳 G-7）。3-3 の模型を Godot の文書の例と同じと書かない（台帳 C-2 の注）。
   ★ 部品は parts.js（ppPlot・ppArt・ppStat・ppStep・ppThread）。色はクラスで持つ。 */

defaults({
  c3n: GACHA.n0,      /* 3-1 引く回数 */
  c3p: 0,             /* 3-1 当たりの確率（GACHA.ps の添字） */
  c3a: ARMOR.init,    /* 3-2 防御 */
  c3k: 0              /* 3-3 送ったフレームの数 */
});

onClick(function (d, e) {
  if (d.c3p !== undefined) { act(function () { state.c3p = +d.c3p; }, e); return true; }
  return false;
});

function c3Pct(p) { return fmtPct(p, 1); }
function c3PLabel(p) { return fmtN(p * 100, p * 100 % 1 ? 1 : 0) + "%"; }

/* ── 3-1 当たり 1% を 100 回引く ────────────────────────────── */
function renderS31() {
  var p = GACHA.ps[state.c3p], n = state.c3n, hit = hitOnce(p, n), miss = missAll(p, n), inv = 1 / p;
  var plot = ppPlot({
    x: [0, GACHA.nMax], y: [0, 1], h: 236,
    xticks: [0, 100, 200, 300, 400, 500], yticks: [0, 0.25, 0.5, 0.75, 1],
    yfmt: function (v) { return fmtN(v * 100) + "%"; },
    cap: "1 回以上当たる確率（当たり " + c3PLabel(p) + "）", xcap: "引く回数",
    hlines: [{ y: 1 }],
    vlines: inv <= GACHA.nMax ? [{ x: inv, cls: "pl-seg" }] : [],
    lines: [{ f: function (x) { return hitOnce(p, x); }, from: 0, area: true }],
    pts: [{ x: n, y: hit }],
    pins: [{ x: n, y: hit, html: n + " 回で " + c3Pct(hit), cls: "main", dy: -28 }].concat(inv <= GACHA.nMax ? [{ x: inv, y: 0.08, html: fmtN(inv) + " 回（1/p）", dx: 58, dy: 0 }] : []),
    aria: "当たりの確率 " + c3PLabel(p) + " のくじを引く回数と、1 回以上当たる確率の曲線。" + n + " 回で " + c3Pct(hit)
  });
  var stage = '<div class="c3-ctl">' + rangeCtl({ key: "c3n", min: 1, max: GACHA.nMax, step: 1, label: "引く回数", unit: " 回" })
    + '<div class="c3-seg"><span class="c3-lbl">当たりの確率</span>'
    + seg("c3p", GACHA.ps.map(function (q, i) { return { v: i, t: c3PLabel(q) }; }), state.c3p) + "</div></div>"
    + plot
    + ppStat([{ v: c3Pct(hit), l: "1 回以上当たる", cls: "hit" }, { v: c3Pct(miss), l: "1 回も当たらない" }])
    + '<p class="pp-model">当たりの確率は説明用の値です。1 回ごとに同じ確率で、前の結果によらずに当たるとします。</p>';
  var side = pointsCard([
    "当たり 1% のくじを 100 回引いても、1 回も当たらない確率は " + c3Pct(missAll(GACHA.p0, GACHA.n0)) + " 残ります",
    "当たりの確率を 1/n にして n 回引くとき、n を大きくしていくと、外れ続ける確率は 1/e ＝ " + c3Pct(1 / Math.E) + " に近づきます",
    "回数を増やすと 1 回以上当たる確率は 100% に近づきますが、届きません"
  ]) + ppThread("6-5", "外れ続ける確率 (1−1/n)ⁿ") + bookTag();
  return slideHead({ title: "当たり 1% を 100 回引く", lead: "1 回ごとに 1% で当たるくじでも、100 回引けば必ず当たるわけではありません。", right: ppArt("capsule") })
    + slideBody(stage, side)

/* ═════ ch5.js ═════ */
/* ═════ 05 計算機（章の担当が P5 で書いた。2026-09-26）══════════════════════════════════
   5-1 計算機で確かめると行き先がずれる … n の大きさ（10 の何乗か）を動かすと、数学の値と計算機の値が並び、
       頭からそろう桁に印が付き、17 点の図の上の点が動く（押して動くものの型 ⑥）。

   ★ 値は model.js から引く（FLOATE・floatE・floatMath）。17 点の冪はブラウザで計算しない（台帳 4-8・4-11。8-X の 2）。
     図に置く数は、model.js の文字列を parseFloat で読むだけ（冪を計算しない）。
   ★ 補足の表の 1＋2⁻⁵² などは、足し算と割り算だけで作る（Number.EPSILON ＝ 2⁻⁵²。足し算と割り算は仕様で 1 つの値に決まる。台帳 4-6）。
     表示は JavaScript の表示（台帳 8-X の 6）。
   ★ 書かないこと（台帳 8-X）: 「16 桁で切れる」「16 桁まで正確」「10¹⁵ までは正しい」「Python の float は倍精度と決まっている」
   ★ 部品は parts.js（ppPlot・ppArt・ppThread）と sp.js（spPanel ほか）。色はクラスで持つ（ch5.css）。 */

defaults({
  c5k: FLOATE.k0        /* 5-1 n ＝ 10 の c5k 乗 */
});

var C5_SUP = { "0": "⁰", "1": "¹", "2": "²", "3": "³", "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹", "-": "⁻" };
function c5Sup(k) { return String(k).split("").map(function (c) { return C5_SUP[c] || c; }).join(""); }
function c5Pow(k) { return "10" + c5Sup(k); }
function c5F(s) { return '<span class="c5-f nowrap-jw">' + s + "</span>"; }   /* 数と語・式を途中で折らない */

/* 頭からそろう桁（model.js の FLOATE.agree）に印を付けた数字の並び。小数点は数えない */
function c5Digits(s, agree, cls) {
  var out = "", seen = 0;
  for (var i = 0; i < s.length; i++) {
    var ch = s.charAt(i);
    if (ch === ".") { out += ch; continue; }
    out += seen < agree ? '<span class="c5-same">' + ch + "</span>" : '<span class="' + cls + '">' + ch + "</span>";
    seen++;
  }
  return out;
}

/* ── 5-1 計算機で確かめると行き先がずれる ────────────────────────────── */
function renderS51() {
  var k = state.c5k, pc = floatE(k), mt = floatMath(k), agree = FLOATE.agree[k - FLOATE.kMin];
  var pcv = parseFloat(pc), ks = [], pcs = [], mts = [];
  for (var j = FLOATE.kMin; j <= FLOATE.kMax; j++) {
    ks.push(j);
    pcs.push({ x: j, y: parseFloat(floatE(j)), cls: j === k ? "c5-pc c5-now" : "c5-pc", r: j === k ? 8 : 5 });
    mts.push({ x: j, y: parseFloat(floatMath(j)), cls: j === k ? "c5-m c5-now" : "c5-m", r: j === k ? 12 : 8 });
  }
  var plot = ppPlot({
    x: [FLOATE.kMin - 0.6, FLOATE.kMax + 0.6], y: [0.8, 3.2], h: 220,
    xticks: [1, 5, 9, 13, 17], yticks: [1, 1.5, 2, 2.5, 3],
    xfmt: c5Pow, yfmt: function (v) { return fmtN(v, 1); },
    cap: '(1＋1/n)ⁿ の値<span class="c5-lg"><i class="c5-sw c5-sw-pc" aria-hidden="true"></i>計算機</span>'
      + '<span class="c5-lg"><i class="c5-sw c5-sw-m" aria-hidden="true"></i>数学</span>',
