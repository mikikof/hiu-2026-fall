    aria: "n を 10 倍ずつ大きくしたときの (1＋1/n)ⁿ。数学の値と計算機の値の 17 点。いまは n ＝ " + c5Pow(k) + " で、計算機の値は " + pc
  });
  var cmp = '<div class="c5-cmp" aria-live="polite">'
    + '<div class="c5-row"><span class="c5-lbl">数学の値</span><code class="c5-dg">' + c5Digits(mt, agree, "c5-rest") + "…</code></div>"
    + '<div class="c5-row"><span class="c5-lbl">計算機の値</span><code class="c5-dg">' + c5Digits(pc, agree, "c5-off") + "</code></div>"
    + '<p class="c5-agree">頭からそろう桁 <b>' + agree + " 桁</b>　計算機の値は e より<b>" + (pcv > Math.E ? "大きい" : "小さい") + "</b></p></div>";
  var stage = '<div class="pp-ctl">' + rangeCtl({ key: "c5k", min: FLOATE.kMin, max: FLOATE.kMax, step: 1, label: "n の大きさ",
      fmt: function (v) { return "n ＝ " + c5Pow(v); } }) + "</div>"
    + cmp + '<div class="c5-plot">' + plot + "</div>";
  var side = pointsCard([
    "計算機の小数は 2 進法の 53 桁（10 進法でおよそ 16 桁）に丸められるので、" + c5F("(1＋1/n)ⁿ") + " は " + c5F("n ＝ " + c5Pow(15)) + " で " + floatE(15).slice(0, 5) + "…、" + c5Pow(16) + " で " + floatE(16) + " になります",
    c5Pow(15) + " では 1/n の部分が丸めで " + c5F("1 割ほど") + "大きくなり、" + c5Pow(16) + " では " + c5F("1＋1/n") + " が 1 そのものになります",
    "頭からそろう桁は、" + c5F("n ＝ 10") + " で " + c5F(FLOATE.agree[0] + " 桁") + "、" + c5F(c5Pow(8) + " で " + FLOATE.agree[7] + " 桁") + "、"
      + c5Pow(12) + " で " + c5F(FLOATE.agree[11] + " 桁") + "と減っていきます"
  ]) + ppThread("6-5", "(1＋1/n)ⁿ の行き先") + bookTag();
  return slideHead({ title: "計算機で確かめると行き先がずれる", lead: "(1＋1/n)ⁿ は、n を大きくするほど e ＝ " + FLOATE.E.slice(0, 7) + "… に近づきます。計算機で n を 10 倍ずつ大きくして確かめます。", right: ppArt("chip") })
    + slideBody(stage, side)
    + c5SuppFloat();
}

/* ── 補足（厚）: 小数がおよそ 16 桁に丸められる理由 ─────────────────────── */
function c5Bits(w, h, y, ch) {
  var s = "", cw = w / 64;
  for (var i = 0; i < 64; i++) {
    var cls = i === 0 ? "sp-k" : i < 12 ? "sp-c" : "sp-p";   /* 正負・2 の何乗か・数字の並び（v1 と v2 の両方で 3 つが見分けられる塗り） */
    s += spR(+(i * cw).toFixed(2), y, +cw.toFixed(2), ch, 0, cls + " sp-ln1");
  }
  return s + spP("M0 " + y + "H" + w + "V" + (y + ch) + "H0z", "sp-none sp-ln")
    + spP("M" + cw + " " + (y - 4) + "V" + (y + ch + 4) + "M" + (12 * cw) + " " + (y - 4) + "V" + (y + ch + 4), "sp-none sp-ln");
}
function c5Sw(cls) { return '<span class="c5-swb" aria-hidden="true">' + spArt(14, 14, spR(1, 1, 12, 12, 2, cls + " sp-ln1")) + "</span>"; }

function c5SuppFloat() {
  var EPS = Number.EPSILON;   /* 2⁻⁵²（仕様で決まった値。台帳 4-4） */
  var adds = [["2" + c5Sup(-52), EPS], ["2" + c5Sup(-53), EPS / 2], ["2" + c5Sup(-53) + " より少し大きい数" + c5F("（2" + c5Sup(-53) + "＋2" + c5Sup(-60) + "）"), EPS / 2 + EPS / (1 << 8)],
    ["10" + c5Sup(-15), 1 / 1e15], ["10" + c5Sup(-16), 1 / 1e16]];
  var addRows = adds.map(function (r) {
    var s = 1 + r[1];
    return [r[0], "<code>" + String(s) + "</code>", s === 1 ? "はい" : "いいえ"];
  });
  var t15 = (1 / 1e15) / EPS, t16 = (1 / 1e16) / EPS;   /* 刻み 2⁻⁵² で測った 10⁻¹⁵ と 10⁻¹⁶（台帳 4-9） */
  var ticks = [0, 1, 2, 3, 4, 5, 6];
  var line = ppPlot({
    x: [-0.6, 6.6], y: [0, 1], h: 190, pad: { l: 24, r: 24, t: 14, b: 40 },
    xticks: ticks, xfmt: function (v) { return v === 0 ? "1" : "＋" + v; },
    xcap: "1 からの距離（目盛り 1 つが 2" + c5Sup(-52) + "。表せる数は目盛りの上だけ）",
    segs: [{ x1: t15, y1: 0.62, x2: 5, y2: 0.2 }, { x1: t16, y1: 0.62, x2: 0, y2: 0.2 }],
    pts: ticks.map(function (t) { return { x: t, y: 0.2, cls: "pl-pt2", r: 5 }; })
      .concat([{ x: t15, y: 0.62, cls: "c5-true", r: 7 }, { x: t16, y: 0.62, cls: "c5-true", r: 7 }]),
    pins: [{ x: t15, y: 0.62, html: "1＋10" + c5Sup(-15) + "（" + fmtN(t15, 4) + "）", dy: -24 },
      { x: t16, y: 0.62, html: "1＋10" + c5Sup(-16) + "（" + fmtN(t16, 2) + "）", dx: 64, dy: -24 }],
    aria: "1 のすぐ上の表せる数の並び。1＋10⁻¹⁵ は " + fmtN(t15, 4) + " 目盛りの所にあり、5 目盛りに丸められる。1＋10⁻¹⁶ は " + fmtN(t16, 2) + " 目盛りの所にあり、1 に丸められる"
  });
  var hero = spArt(600, 250,
    spP("M30 226H570", "sp-ln") +
    (function () { var s = ""; for (var i = 0; i < 16; i++) s += spR(40 + i * 30, 50, 26, 40, 5, (i === 0 ? "sp-k" : i < 4 ? "sp-c" : "sp-p") + " sp-ln1"); return s; })() +
    spR(520, 50, 26, 40, 5, "sp-none sp-ln1 sp-dash") + spR(550, 50, 26, 40, 5, "sp-none sp-ln1 sp-dash") +
    spP("M60 176H540", "sp-ln") +
    (function () { var s = ""; for (var x = 60; x <= 540; x += 60) s += spP("M" + x + " 166V186", "sp-none sp-ln1"); return s; })() +
    spC(390, 140, 10, "sp-p sp-ln") + spP("M396 148L412 166", "sp-none sp-arl") + spP("M419 172l-12-2 5-7z", "sp-arf") +
    spC(420, 176, 7, "sp-k"));
  return spPanel("c5-float", {
    title: "計算機の小数がおよそ 16 桁に丸められるのはなぜか",
    thumb: spArt(64, 40, spR(6, 12, 10, 16, 2, "sp-k sp-ln1") + spR(18, 12, 10, 16, 2, "sp-c sp-ln1") + spR(30, 12, 10, 16, 2, "sp-p sp-ln1") + spR(42, 12, 10, 16, 2, "sp-none sp-ln1 sp-dash")),
    hero: { art: hero, kicker: "FLOATING POINT ・ IEEE 754", h: "2 進法で 53 桁",
      lead: "倍精度の小数（浮動小数点数）が持てる数字の並びは、" + c5F("2 進法") + "で 53 桁です。" + c5F("2 進法") + "の 53 桁は、" + c5F("10 進法") + "に直すとおよそ 16 桁です。" },
    parts: [
      spKey("計算の答えが倍精度で表せないときは、表せる数のうちいちばん近い数に丸めます。1 の次に大きい倍精度の数は 1＋2" + c5Sup(-52) + " です。"),
      spSpread(
        spPh(1, "64 ビットの分け方") + '<div class="c5-bitbar">' + spArt(640, 48, c5Bits(640, 48, 8, 32)) + "</div>"
          + miniTable(["ビットの数", "表すもの"], [[c5Sw("sp-k") + "1", "正か負か"], [c5Sw("sp-c") + "11", "2 の何乗か"], [c5Sw("sp-p") + "52", "数字の並び"]])
          + spTxt("1 以上 2 未満の数では、先頭の「1.」を書かずに持つので、52 ビットで " + c5F("2 進法") + "の 53 桁を表せます。"),
        spPh(2, "1 に小さな数を足す") + miniTable(["1 に足す数", "計算機の答え", "1 のままか"], addRows)
          + spTxt("1＋2" + c5Sup(-53) + " は、1 と 1＋2" + c5Sup(-52) + " のちょうど真ん中です。ちょうど真ん中のときは " + c5F("2 進法") + "の最後の桁が 0 になるほうに丸めるので、1 になります。")),
      spPlate(3, "n ＝ " + c5Pow(15) + " で " + floatE(15).slice(0, 5) + "… になる仕組み", '<div class="c5-plot">' + line + "</div>"
        + spTxt("1 のすぐ上では、表せる数が 2" + c5Sup(-52) + " おきに並んでいます。10" + c5Sup(-15) + " は、2" + c5Sup(-52) + " の目盛りで数えると " + fmtN(t15, 4)
          + " 個分なので、いちばん近い 5 個分に丸められます。1/n の部分が 1 割ほど大きくなり、大きくなった 1＋1/n を " + c5Pow(15) + " 乗するので、答えは " + floatE(15).slice(0, 5) + "… になります。")
        + spTxt("10" + c5Sup(-16) + " は同じ目盛りで " + fmtN(t16, 2) + " 個分なので 0 個分に丸められ、1＋1/n は 1 になります。1 は何乗しても 1 です。"))
    ],
    tidbits: [
      { h: "e を超える所", p: "n を 10 倍ずつ大きくしていくと、計算機の値は n ＝ " + c5Pow(9) + " で初めて e を超えます。" + c5Pow(13) + " と " + c5Pow(14) + " では、e より小さい値に戻ります。数学の値は e を超えません。" },
      { h: "言語と規格", p: "JavaScript の数（Number）は、仕様で IEEE 754 の倍精度（binary64）と決まっています。Python の小数（float）は、ほとんどの計算機で IEEE 754 の倍精度（binary64）です。" },
      { h: "このページの計算機の値", p: "JavaScript の仕様は、冪（** と Math.pow）の答えを近似でよいとしていて、1 つの値に決めていません。このページの計算機の値はブラウザで計算せず、Python と node で出した値を載せています。"
        + "Python と node の値は、" + (FLOATE.kMax - FLOATE.kMin + 1) + " 点ともビット列まで同じでした。" }
    ],
    source: "IEEE 754・ECMAScript の仕様（ECMA-262）・Python の文書と、Python・node での計算"
  });
}

/* ═════ ch6.js ═════ */
/* ═════ 06 数理（章の担当 P5 が書いた。2026-09-26）════════════════════════════════
   6-1 lim の読み方 … 数列を切り替えると、n ＝ 1〜20 の点の列と、収束・発散の札と、n ＝ 20 の値が変わる（①）。
   6-2 等比の行き先と無限の和 … 公比 r を動かすと、rⁿ の棒と、足した和・和の行き先の札が変わる（⑥）。
   6-3 ∞/∞ は最高次で割る … n を動かすと分子と分母の項の大きさの帯と式の値が変わる（⑥）。割る手順を 1 手ずつ（③）。
   6-4 0/0 は約分してから … x を 2 の左右から近づけると、直線の上の点と値の札が動く（⑥）。2 題の式変形を 1 手ずつ（③）。
   6-5 e に近づく 2 つの式 … n を 1 手ずつ送ると、表の行と 2 本の点の列が増える（③）。

   ★ 値は model.js から引く（SEQS・GEO・RAT・ratVal・HOLE・holeVal・EPOW・FLOATE・COOL・CAM・DISC）。
     EPOW の値は計算機の冪で作らず、model.js の文字列のまま出す（台帳 4-10・4-11）。
   ★ model.js に無く、式や問いそのものが決める値（行き先・補足の表の刻み）は C6 に集めた。本体が model.js へ移すなら C6 を消す。
   ★ 部品は parts.js（ppPlot・ppStat・ppStep）と sp.js。色はクラスで持つ（ch6.css は役目のトークンだけ）。
