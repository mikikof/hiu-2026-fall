    spTxt("マスターマインドは、隠された色のピンの並びを当てる推理ゲームです。" + C1_MM.colors + " 色・" + C1_MM.holes
      + " か所・同じ色を何度使ってもよい形では、答えは " + codes + " 通りあります。1 手目に置く並びで、返事の分かれ方が変わります。")
    + c1MmLab()
    + spTxt("Donald Knuth は、どの答えでも " + C1_MM.max + " 手以内で当てる手順の全体を、自分のページで公開しています。"
      + "Knuth の手順は最初に " + C1_MM.first + " を聞き、全部の答えを当てると平均 " + C1_MM.mean + " 手です。"
      + C1_MM.max + " 手という数はマスターマインドの話で、ヌメロンの 3 けた（" + all.length + " 通り）を当てる手数ではありません。"));

  return spPanel("c1-bestq", {
    title: "候補がいちばん減る聞き方",
    thumb: c1Thumb(),
    lead: "ヌメロンの " + all.length + " 通りでは、候補を 1 つずつ試すと最悪で " + all.length + " 手かかります。返事ごとに残る候補を数えると、手の良し悪しを比べられます。",
    parts: [
      spKey("よい手は、どの返事が来ても残りが少なくて済む手です。返事ごとの残りがそろう手ほど、いちばん悪い返事でも残りが少なくなります。"),
      spSpread(left, right),
      plate
    ],
    tidbits: [
      { h: "ビット", p: "等しく起こりやすい N 通りから 1 つを選ぶときの情報の量を、Shannon は N の対数で測りました（" + C1_YEAR.shannon + " 年の論文「A Mathematical Theory of Communication」）。"
        + "2 を底にしたときの単位がビットで、この語は J. W. Tukey が提案したと Shannon が書いています。はい・いいえで答える質問なら、1 回の答えで得られる情報は最大 1 ビットです。" },
      { h: "決定木", p: "ID3 は、機械学習の決定木を作る手順の 1 つです。分かれ目ごとに、分けたときに得られる情報がいちばん多い項目を選んで、木を作ります（Quinlan の " + C1_YEAR.id3 + " 年の論文「Induction of Decision Trees」）。"
        + "scikit-learn 1.9.1 の DecisionTreeClassifier は、既定ではジニ不純度で分け、entropy を選ぶと情報量で分けます。" },
      { h: "ヒット&ブローの手数", p: "このページのヒット&ブロー（6 色から違う色を " + CB_LEN + " つ）で、いちばん悪い返事でも残りがいちばん少なくなる手を選び続けると、" + cbAll().length + " 通りのどれも " + CB_GREEDY.max + " 手以内に当たり、平均は " + CB_GREEDY.mean + " 手でした。"
        + "いちばん悪い返事での残りが同じ手がいくつもあるときは、まだ答えでありうる並びを先に選び、それでも決まらないときは赤・青・緑・黄・紫・白の順で先に来る並びを選びました。この選び方で最短になるかは確かめていません。" }
    ],
    source: C1_SRC.map(function (s) { return s.t + (s.u ? "　<code>" + s.u.replace(/([/.])/g, "$1<wbr>") + "</code>" : ""); }).join("<br>")   /* URL はスラッシュと点の後ろでだけ折る */
  });
}

onClick(function (d, e) {
  var C = c1Cfg();
  /* 遊びを替えても 1-2 の段は保つ（段の数は c12View が遊びの 1 本道の長さに収める。［最初から］の前に切り替えを押しても段が残る） */
  if (d.c1game !== undefined) { act(function () { state.c1game = d.c1game; state.c11msg = ""; c1SetNo(); state.c12row = ""; state.c12i = 0; state.c1peek = state.c1show; }, e); return true; }
  /* 1-1 */
  if (d.run === "c1show") { act(function () { state.c1show = !state.c1show; if (state.c1show) state.c1peek = true; state.c11msg = ""; }, e); return true; }
  if (d.run === "c1next") { act(c1Next, e); return true; }
  if (d.run === "c1set") {
    act(function () { state.c1set = true; state.c1setin = ""; state.c1setpick = ""; state.c11msg = ""; }, e);
    var inp = document.querySelector("#main .c1-setin"); if (inp) inp.focus();   /* 押したらすぐ打てるように（学生役の指摘。押しても欄に行かなかった） */
    return true;
  }
  if (d.run === "c1setok") { act(c1SetOk, e); return true; }
  if (d.run === "c1setno") { act(c1SetNo, e); return true; }
  if (d.run === "c11reset") { act(function () { c1Clear(); state.c11msg = ""; }, e); return true; }
  if (d.c11d !== undefined) { act(function () { var p = state.c11pick; if (p.length < HB_LEN && p.indexOf(d.c11d) < 0) state.c11pick = p + d.c11d; state.c11msg = ""; }, e); return true; }
  if (d.c1col !== undefined) {
    act(function () {
      if (state.c1set) { if (state.c1setpick.length < CB_LEN) state.c1setpick += d.c1col; }   /* 答えを置く途中は同じ色も置ける（押せなくすると使った色が見えてしまう） */
      else if (state.c1pick.length < CB_LEN && state.c1pick.indexOf(d.c1col) < 0) state.c1pick += d.c1col;
      state.c11msg = "";
    }, e); return true;
  }
  if (d.run === "c1back") { act(function () { if (state.c1set) state.c1setpick = state.c1setpick.slice(0, -1); else state[C.pickKey] = state[C.pickKey].slice(0, -1); }, e); return true; }
  if (d.run === "c11ask") { act(function () { c1Ask(state[C.pickKey]); }, e); return true; }
  /* 1-2 */
  if (d.run === "c12next") { act(function () { state.c12step++; state.c12row = ""; state.c12i = 0; }, e); return true; }
  if (d.c12row !== undefined) { act(function () { state.c12row = d.c12row; state.c12i = 0; }, e); return true; }
  if (d.run === "c12i") { act(function () { state.c12i++; }, e); return true; }
  if (d.run === "c12num") { act(function () { state.c12num = !state.c12num; }, e); return true; }
  if (d.run === "c12reset") { act(c12Reset, e); return true; }
  /* 補足 */
  if (d.c1mm !== undefined) { act(function () { state.c1mm = +d.c1mm; }, e); return true; }
  return false;
});


/* ═════ ch2.js ═════ */
/* ═════ 第 2 章　手順とは（2-1 勘と手順・2-2 数当てをやってみる）══════════════════════════
   ★ 数は model.js から引く（LO・HI・TARGET・KAN_RUNS・PLAY_TARGETS・planLinear・planBinary・midOf・askMax・binaryDist・meanBinary）。
   ★ 2-1（押して動くものの型 ①）: やり方を 3 つ切り替えると、正解 97 のときに聞く数の並びと、表の中の選んだ列が変わる。
     勘の並びは model.js の KAN_RUNS（乱数を使わない固定の 2 日ぶん）。
   ★ 2-2（型 ②）: 数を打つと「もっと上」「もっと下」が返り、範囲の帯（bandSvg）と記録（logList）が変わる。
     正解は PLAY_TARGETS の順（教室で全員が同じ順に出会う。乱数は使わない）。打つ欄は全角の数字と空白も受ける。
     範囲の帯は .diagram-scroll で包む（760px 以下で帯が 640px を保ち、図の中の字が 14px を割らない。style.css の決まり）。
   ★ 参考資料: 2-1 は図鑑 序章 0-1（def-algo・any-input）。2-2 は付けない（P1 の測り役の判断。練習の枚で、誌面が答えの聞き方を先に見せる）。 */

defaults({
  c21way: "kan",    /* 2-1 のやり方（C21_WAYS の v） */
  c22n: 0,          /* 2-2 の何問目か（PLAY_TARGETS の添字） */
  c22asked: [],     /* 2-2 で聞いた数の並び */
  c22in: "",        /* 2-2 の打ちかけの字 */
  c22msg: ""        /* 2-2 の入れ方の断り */
});

REFS["2-1"] = ["def-algo", "any-input", "algo-any-n"];

/* ── 2-1 勘と手順 ─────────────────────────────────────────────────────── */
var C21_WAYS = [
  { v: "kan", t: "勘で言う" },
  { v: "seq", t: "端から順に聞く" },
  { v: "mid", t: "真ん中から聞く" }
];
/* 表の行。値は [丸か罰, 添える字] */
function c21Rows() {
  var most = askMax(HI - LO + 1);
  return [
    { t: "同じ番号なら毎回同じ順に聞く", kan: [false, "日によって違う"], seq: [true, ""], mid: [true, ""] },
    { t: "どの番号でも必ず当たって終わる", kan: [false, "言い切れない"], seq: [true, ""], mid: [true, ""] },
    { t: "何回以内に終わるかを前もって言える", kan: [false, "言えない"], seq: [true, HI + " 回以内"], mid: [true, most + " 回以内"] }
  ];
}
/* やり方ごとの、正解 TARGET のときに聞く数の並び */
function c21Runs(way) {
  if (way === "kan") return KAN_RUNS.map(function (r, i) { return { h: (i + 1) + " 日目", seq: r }; });
  var seq = (way === "seq" ? planLinear(TARGET) : planBinary(TARGET)).map(function (r) { return r.g; });
  return [{ h: "毎回", seq: seq }];
}
/* 数の並びの札。長い並び（1 から順）は頭の 3 つと終わりの 2 つだけを出す */
function c21Seq(seq) {
  var shown = seq.length > 8 ? seq.slice(0, 3).concat([null]).concat(seq.slice(-2)) : seq;
  return '<span class="c21-seq">' + shown.map(function (g, i) {
    var cls = g === null ? "c21-g gap" : g === TARGET ? "c21-g hit" : "c21-g";
    return (i ? '<span class="c21-ar" aria-hidden="true">→</span>' : "") + '<span class="' + cls + '">' + (g === null ? "…" : g) + "</span>";
  }).join("") + "</span>";
}
function c21Note(way) {
  if (way === "kan") return "同じ " + TARGET + " でも、1 日目は " + KAN_RUNS[0].length + " 回、2 日目は " + KAN_RUNS[1].length + " 回かかりました。";
  if (way === "seq") return TARGET + " を当てるまで " + planLinear(TARGET).length + " 回です。どの番号でも、番号と同じ回数で当たります。";
  return TARGET + " を当てるまで " + planBinary(TARGET).length + " 回です。どの番号でも " + askMax(HI - LO + 1) + " 回以内に当たります。";
}

function renderS21() {
  var way = state.c21way, runs = c21Runs(way);
  var runsHtml = '<div class="c21-runs">' + runs.map(function (r) {
    return '<div class="c21-run"><span class="c21-run-tag">' + r.h + "</span>" + c21Seq(r.seq) + '<b class="c21-n">' + r.seq.length + " 回</b></div>";
  }).join("") + "</div>";

  var head = "<tr><th></th>" + C21_WAYS.map(function (w) {
    return "<th" + (w.v === way ? ' class="cur"' : "") + ">" + w.t + "</th>";
  }).join("") + "</tr>";
  var body = c21Rows().map(function (row) {
    return "<tr><th>" + row.t + "</th>" + C21_WAYS.map(function (w) {
      var c = row[w.v];
      return '<td class="' + (c[0] ? "ok" : "ng") + (w.v === way ? " cur" : "") + '"><span class="c21-mk" aria-label="' + (c[0] ? "はい" : "いいえ") + '">'
        + (c[0] ? "○" : "×") + "</span>" + (c[1] ? '<span class="c21-why">' + c[1] + "</span>" : "") + "</td>";
    }).join("") + "</tr>";
  }).join("");

  var stage = "<div class=\"c21-seg\">" + seg("c21way", C21_WAYS, way) + "</div>"
    + '<div class="c21-box"><p class="c21-cap-lbl">正解が ' + TARGET + " のときに聞く数</p>" + runsHtml
    + '<p class="c21-note" aria-live="polite">' + c21Note(way) + "</p></div>"
    + '<div class="diagram-scroll"><table class="c21-tbl"><thead>' + head + "</thead><tbody>" + body + "</tbody></table></div>";

  return slideHead({
    title: "勘と手順",
    lead: "1〜100 の数当てで、3 通りのやり方を比べます。正解は " + TARGET + " です。"
  })
    + slideBody(stage, pointsCard([
      "どんな入力でも同じ動きで答えに着き、必ず終わる手順を、アルゴリズム（algorithm）と呼びます。",
      "勘は当たることがあっても、次も同じ回数で当たるとは言えません。",
      "端から順も真ん中からも手順で、違うのは回数です。"
    ]) + bookTag())
    + checkBox("c2-kan", "勘でも当たるなら、何が違うのか", c21Why());
}

/* 補足（薄い形）: 正解ごとの回数の表。手順なら正解が決まれば回数が 1 つに決まる */
function c21Why() {
  var targets = [LO, midOf(LO, HI), TARGET, HI];
  return "<p>手順は、正解が決まれば聞く回数も 1 つに決まります。正解ごとに数えると、次のとおりです。</p>"
    + '<div class="dfig">' + miniTable(["正解", "端から順に聞く", "真ん中から聞く"], targets.map(function (t) {
      return [t, planLinear(t).length + " 回", planBinary(t).length + " 回"];
    }), "c21-tbl2") + "</div>"
    + "<p>勘では、正解ごとの回数の表が作れません。同じ " + TARGET + " でも、例の 2 日は " + KAN_RUNS[0].length + " 回と " + KAN_RUNS[1].length + " 回でした。</p>";
}

/* ── 2-2 数当てをやってみる ─────────────────────────────────────────────── */
function c22Target() { return PLAY_TARGETS[state.c22n % PLAY_TARGETS.length]; }
/* 聞いた数から、残っている範囲と勝ち負けを出す */
function c22State() {
  var t = c22Target(), lo = LO, hi = HI, asked = state.c22asked;
  asked.forEach(function (g) { if (g < t) lo = Math.max(lo, g + 1); else if (g > t) hi = Math.min(hi, g - 1); });
  var win = asked.length > 0 && asked[asked.length - 1] === t;
  return { t: t, lo: win ? t : lo, hi: win ? t : hi, win: win, last: asked.length ? asked[asked.length - 1] : 0 };
}
/* 打った字を整数へ（全角の数字を半角に、半角と全角の空白を外す）。整数でなければ NaN */
function c22Num(s) {
  var v = String(s === undefined || s === null ? "" : s)
    .replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xfee0); })
    .replace(/[\s　]+/g, "");
  return /^\d+$/.test(v) ? parseInt(v, 10) : NaN;
}
function c22Ask(raw) {
  var s = c22State();
  if (s.win) return;
  var g = c22Num(raw);
  if (!(g >= LO && g <= HI)) { state.c22msg = LO + "〜" + HI + " の整数を入れます。"; return; }
  state.c22msg = "";
  state.c22in = "";
  state.c22asked = state.c22asked.concat([g]);
}

function renderS22() {
  var s = c22State(), n = state.c22asked.length, most = askMax(HI - LO + 1), rest = s.hi - s.lo + 1;
  var say;
  if (!n) say = LO + "〜" + HI + " から数を 1 つ選びました。数を入れて［聞く］を押します。";
  else if (s.win) say = "当たりです。選ばれた数は " + s.t + " でした。";
  else say = s.last + " ではありません。返事は" + (s.last < s.t ? "「もっと上」" : "「もっと下」") + "です。";

  var ctl = '<div class="c22-ctl"><span class="c22-no-lbl">問題 ' + (state.c22n + 1) + "</span>"
    + '<input class="c22-in" type="text" inputmode="numeric" maxlength="8" autocomplete="off" data-field="c22in" data-enter="c22ask"'
    + ' aria-label="聞く数（' + LO + "〜" + HI + '）" placeholder="' + LO + "〜" + HI + '" value="' + esc(state.c22in) + '"' + (s.win ? " disabled" : "") + ">"
    + '<button class="btn primary" data-run="c22ask"' + (s.win ? " disabled" : "") + ">聞く</button>"
    + '<button class="btn c22-next" data-run="c22next">別の数で</button></div>';

  var log = logList(state.c22asked.map(function (g, i) {
    return { k: "c22-" + i, n: (i + 1) + " 回目", g: g, r: g === s.t ? "当たり" : g < s.t ? "もっと上" : "もっと下", cls: g === s.t ? "hit" : "" };
  }), "聞いた数がここに並びます");

  var stage = ctl
    + (state.c22msg ? '<p class="c22-msg" role="alert">' + state.c22msg + "</p>" : "")
    + '<p class="c22-say" aria-live="polite">' + say + "</p>"
    + '<div class="c22-count c22-stat-lbl">' + pxSprite("scribe", 2.5) + statRow([   /* -lbl は qa の LABEL_SEL が札として測る印（ch1 と同じ） */
      { v: n, l: "聞いた回数", cls: s.win ? "hit" : "" },
      s.win ? { v: s.t, l: "選ばれた数", cls: "hit" } : { v: rest + "\u00a0件", l: "残っている数（" + s.lo + "〜" + s.hi + "）" }
    ]) + "</div>"
    + '<div class="diagram-scroll c22-band">' + bandSvg(s.lo, s.hi, s.last, s.win,
      { label: n ? (s.win ? "当たり" : "残りは " + rest + " 件") : "ここに残っている範囲が出ます" }) + "</div>"
    + (s.win ? '<p class="c22-cmp">当てるまで <b>' + n + " 回</b>　真ん中から聞けば最大 <b>" + most + " 回</b></p>" : "")
    + '<div class="c22-log">' + log + "</div>";

  return slideHead({
    title: "数当てをやってみる",
    lead: LO + "〜" + HI + " から 1 つ選ばれた数を、「もっと上」「もっと下」の返事だけで当てます。"
  })
    + slideBody(stage, pointsCard([
      "当たるまでに聞いた回数を控え、" + most + " 回と比べます。",
      "返事を聞くたびに、残りの範囲が縮みます。",
      "範囲の外の数を聞いても、残りは 1 つも減りません。"
    ]))
    + checkBox("c2-mid2", "真ん中が " + midOf(LO, HI) + " と " + (midOf(LO, HI) + 1) + " の 2 つあるとき", c22Why());
}

/* 補足（薄い形）: 真ん中を切り上げて聞いたときの回数の分布を、切り捨て（model.js の binaryDist）と並べる */
function c22PlanCeil(target) {
  var lo = LO, hi = HI, n = 0;
  for (;;) {
    var m = Math.ceil((lo + hi) / 2);
    n++;
    if (m === target) return n;
    if (m < target) lo = m + 1; else hi = m - 1;
  }
}
function c22DistCeil() {
  var d = {};
  for (var t = LO; t <= HI; t++) { var c = c22PlanCeil(t); d[c] = (d[c] || 0) + 1; }
  return d;
}
function c22Why() {
  var m = midOf(LO, HI), dF = binaryDist(), dC = c22DistCeil(), most = askMax(HI - LO + 1), rows = [], sumC = 0;
  for (var k = 1; k <= most; k++) {
    rows.push([k + " 回", (dF[k] || 0) + " 通り", (dC[k] || 0) + " 通り"]);
    sumC += k * (dC[k] || 0);
  }
  var meanC = sumC / (HI - LO + 1);
  return "<p>" + LO + "〜" + HI + " の真ん中は " + (LO + HI) / 2 + " で、整数では " + m + " と " + (m + 1) + " の 2 つが候補になります。"
    + m + " を聞く（切り捨て）か " + (m + 1) + " を聞く（切り上げ）かで聞く数の並びは変わりますが、全部の番号で数えた回数の分布は同じです。</p>"
    + '<div class="dfig">' + miniTable(["回数", "切り捨て（" + m + " から）", "切り上げ（" + (m + 1) + " から）"], rows, "c22-tbl") + "</div>"
    + "<p>どちらでも、いちばん多いときは " + most + " 回です。平均はどちらも " + meanBinary().toFixed(1) + " 回です。</p>";
}

onClick(function (d, e) {
  if (d.c21way !== undefined) { act(function () { state.c21way = d.c21way; }, e); return true; }
  if (d.run === "c22ask") { act(function () { c22Ask(state.c22in); }, e); return true; }
  if (d.run === "c22next") {
    act(function () { state.c22n += 1; state.c22asked = []; state.c22in = ""; state.c22msg = ""; }, e);
    return true;
  }
  return false;
});


/* ═════ ch3.js ═════ */
/* ═════ 第 3 章　2 つの聞き方（3-1 端から順と、真ん中・3-2 件数を増やす）═══════════════════════════
   ★ 3-1: 聞き方を切り替え（押して動くものの型 ①）、正解 TARGET を 1 手ずつ送る（型 ③）。送った手数 c3k は 2 つの聞き方で共通
     （切り替えると「同じ回数だけ聞いたところ」を見比べられる。真ん中から聞く方が先に当たったら、そこで止まって見える）。
     「最初から」は、まだ聞いていないときは押せない。
   ★ 3-2: 件数の段 SCALES をスライダーで動かす（型 ⑥）。最大の回数は askMax。通った段だけ、下の並びに回数が出る（予想してから動かす）。
   ★ 数は model.js（LO・HI・TARGET・plan・planLinear・planBinary・askMax・binaryDist・meanLinear・meanBinary・SCALES・pow2・fmt・SCRIBE）から引く。
   ★ 補足の事実は P1 の事実ファイルの「確かめた」節だけから書く（節の番号を注記に書く）。台帳に無い記述は [[仮]]（spKari）。
     model.js に無い事実の数（年・説明書の例の件数）は C3_REF に数で持ち、文は組み立てる（章の文に 3 桁以上の数を直に書かない。統合で model.js へ移す案）。
   ★ 人物は、3-1 の聞いた回数の札の横にカゾエ（書記官・手数を数える役）を 1 体だけ置く。台詞は言わせない（台詞は第5章だけ）。 */

defaults({
  c3way: "lin",   /* 3-1 の聞き方。"lin" 端から順・"bin" 真ん中から */
  c3k: 0,         /* 3-1 送った手数（2 つの聞き方で共通。聞き方ごとの手数はこれを当たりの手で頭打ちにしたもの） */
  c3scale: 0      /* 3-2 件数の段（SCALES の添字） */
});

/* 参考図書（名前は既存の第1回の切り抜きと同じ。spec/00_設計.md §5） */
REFS["3-1"] = ["binary-halve", "binary-mid", "binary-steps", "linear-steps", "linear-worst"];
REFS["3-2"] = ["size-growth", "binary-log", "binary-exp"];

/* 補足の事実のうち model.js に無い値（数で持つ）。〔 〕は P1 の事実ファイルの節 */
var C3_REF = {
  tv: { y: 1952, m: 11, url: "https://www2.nhk.or.jp/archives/movies/?id=D0009040005_00000" },            /* 〔G-8〕二十の扉 */
  bisect: { y: 2005, m: 7, left: [675, 337], steps: [10, 9], url: "https://git-scm.com/docs/git-bisect" },  /* 〔CS-5〕 */
  bloch: { y: 2006, m: 6, d: 2, from: 30, bits: 32,                                                      /* 〔CS-6〕〔CS-7〕 */
    url: "https://research.google/blog/extra-extra-read-all-about-it-nearly-all-binary-searches-and-mergesorts-are-broken/" }
};

/* 聞き方の名前（用語の初出。読み・英語・一言の意味をそろえる。spec/00_設計.md §0.1） */
var C3_WAYS = {
  lin: { seg: "端から順（線形探索）", t: "端から順に聞く", term: "線形探索", yomi: "せんけいたんさく", en: "linear search",
    mean: "端から 1 つずつ確かめる手順です。" },
  bin: { seg: "真ん中（二分探索）", t: "真ん中から聞く", term: "二分探索", yomi: "にぶんたんさく", en: "binary search",
    mean: "残っている範囲の真ん中を聞き、答えの無い側をまとめて捨てる手順です。" }
};

/* ── 3-1 端から順と、真ん中 ─────────────────────────────────────────── */
function c3Done(way) { return Math.min(state.c3k, plan(way, TARGET).length); }
function c3Reply(g) { return g < TARGET ? "もっと上" : "もっと下"; }
/* k 回聞いたあとの様子。lo〜hi は聞いたあとに残っている範囲 */
function c3At(way, k) {
  var rows = plan(way, TARGET);
  if (!k) return { k: 0, lo: LO, hi: HI, g: 0, hit: false, rows: rows };
  var r = rows[k - 1], lo, hi;
  if (r.hit) { lo = r.g; hi = r.g; }
  else if (way === "lin") { lo = r.g + 1; hi = HI; }
  else { lo = r.after[0]; hi = r.after[1]; }
  return { k: k, lo: lo, hi: hi, g: r.g, hit: r.hit, rows: rows };
}

/* 聞いた数の札の並び（記録。logList の横に流す形）。多いときは頭の 4 つと終わりの 6 つだけを出し、間の回数を札にする。
   ★ 縦に 1 行ずつ積む logList だと 13 件目から 11 行になり、4-1 の残す書き方の 12 手で投影の 1 画面から下へ出た（2026-09-27 に撮って確かめた）。
   ★ 4 章の c4Chips と同じ形（共通にしたほうがよい部品）。items = [{k, n, g, t, cls}] */
function c3Chips(items, empty) {
  if (!items.length) return '<p class="c3a-empty">' + empty + "</p>";
  var shown = items.length > 11 ? items.slice(0, 4).concat([{ gap: items.length - 10 }]).concat(items.slice(-6)) : items;
  return '<ol class="c3-chips">' + shown.map(function (it) {
    if (it.gap) return '<li class="gap" data-k="gap">… ' + it.gap + " 回 …</li>";
    return '<li data-k="' + it.k + '"' + (it.cls ? ' class="' + it.cls + '"' : "") + '><span class="c3-chip-n">' + it.n + "</span><b>" + it.g + '</b><span class="c3-chip-t">' + it.t + "</span></li>";
  }).join("") + "</ol>";
}

function renderS31() {
  var way = state.c3way, W = C3_WAYS[way], s = c3At(way, c3Done(way)), rest = s.hi - s.lo + 1;
  var say = !s.k ? "まだ 1 回も聞いていません。残りは " + LO + "〜" + HI + " の " + rest + " 件です。"
    : s.hit ? s.g + " を聞きました。当たりです。" + s.k + " 回で見つかりました。"
    : s.g + " を聞きました。「" + c3Reply(s.g) + "」。残りは " + s.lo + "〜" + s.hi + " の " + rest + " 件です。";
  var counter = '<div class="c3a-count">' + pxSprite("scribe", 3, { label: "書記官" + SCRIBE + "（聞いた回数を数える）" })
    + statRow([{ v: s.k + " 回", l: "聞いた回数", cls: s.hit ? "hit" : "" }, { v: rest + " 件", l: "残り" }]) + "</div>";
  var btns = '<div class="c3a-btns">'
    + '<button class="btn primary" data-run="c3next"' + (s.hit ? " disabled" : "") + ">1\u00a0手進める</button>"
    + '<button class="btn" data-run="c3end"' + (s.hit ? " disabled" : "") + ">最後まで</button>"
    + '<button class="btn" data-run="c3reset"' + (s.k ? "" : " disabled") + ">最初から</button></div>";
  var chips = c3Chips(s.rows.slice(0, s.k).map(function (r, i) {
    return { k: "c3" + way + i, n: i + 1, g: r.g, t: r.hit ? "当たり" : c3Reply(r.g), cls: r.hit ? "hit" : "" };
  }), "聞いた数と返事が、ここに順に並びます。");
  var stage = seg("c3way", [{ v: "lin", t: C3_WAYS.lin.seg }, { v: "bin", t: C3_WAYS.bin.seg }], way)
    + '<div class="c3a-row">' + counter + btns + "</div>"
    + '<div class="diagram-scroll c3a-band">' + bandSvg(s.lo, s.hi, s.g, s.hit) + "</div>"
    + '<p class="c3a-say" aria-live="polite">' + say + "</p>"
    + '<div class="c3a-log" aria-label="聞いた数と返事の記録">' + chips + "</div>";
  var term = '<div class="card c3a-term"><h3>' + W.term + '</h3><p class="c3a-yomi"><span class="c3a-lbl">' + W.yomi
    + '</span><span class="c3a-lbl" lang="en">' + W.en + "</span></p><p>" + W.mean + "</p></div>";

  return slideHead({ title: "端から順と、真ん中", lead: "正解が " + TARGET + " のとき、2 つの聞き方を 1\u00a0手ずつ進めます。" })
    + slideBody(stage, term + pointsCard([
      "真ん中から聞くと、1 回で残りが半分以下になります。",
      "端から順に聞くと、1 回に 1 つしか減りません。",
      TARGET + " は、真ん中からなら " + planBinary(TARGET).length + " 回、端から順なら " + planLinear(TARGET).length + " 回で見つかります。"
    ]) + bookTag())
    + checkBox("c3-avg", "平均では何回か", c3AvgBody());
}

/* 補足（薄い形）: 1〜HI の全部の番号で数えた回数。表は model.js の関数から */
function c3AvgBody() {
  var d = binaryDist(), ks = Object.keys(d).map(Number).sort(function (a, b) { return a - b; });
  var bMin = ks[0], bMax = ks[ks.length - 1];
  var tbl = miniTable(["聞き方", "いちばん少ない", "いちばん多い", "平均"], [
    [C3_WAYS.lin.t, planLinear(LO).length + " 回", planLinear(HI).length + " 回", meanLinear() + " 回"],
    [C3_WAYS.bin.t, bMin + " 回", bMax + " 回", meanBinary() + " 回"]
  ], "c3-avg-tbl");
  return "<p>" + TARGET + " は " + HI + " に近いので、端から順に聞くと時間のかかる数です。1 つの例だけで比べると、選んだ数しだいで差が大きくも小さくも見えます。"
    + LO + "〜" + HI + " の全部の番号で、当たるまでの回数を数えました。</p>"
    + '<div class="dfig">' + tbl + "</div>"
    + "<p>真ん中から聞くときは、" + ks[0] + " 回で当たる番号が " + d[ks[0]] + " 通り、" + ks[1] + " 回で当たる番号が " + d[ks[1]] + " 通りです。"
    + "当たる番号の数は回数が 1 つ増えるごとに倍になり、" + bMax + " 回で当たるのは残りの " + d[bMax] + " 通りです。平均が " + bMax + " 回に近い " + meanBinary() + " 回になるのは、"
    + (bMax - 1) + " 回と " + bMax + " 回で当たる番号が合わせて " + (d[bMax - 1] + d[bMax]) + " 通りあるからです。</p>";
}

/* ── 3-2 件数を増やす ──────────────────────────────────────────────── */
/* 「100 件」「100 万件」: 数で終わる札だけ、助数詞の前に空白を置く */
function c3Unit(label, u) { return c3Nb(label) + (/[0-9]$/.test(label) ? " " : "") + u; }
/* 札の中の空白（「100 万」「1.2 億」）は折らない空白にする（「1／万倍」と割れた。2026-09-27 に撮って確かめた） */
function c3Nb(label) { return String(label).replace(/ /g, "\u00a0"); }
/* 札のあとに語を続ける（「100 から」「80 億まで」。数で終わる札だけ空白を置く） */
function c3Sp(label) { return c3Nb(label) + (/[0-9]$/.test(label) ? " " : ""); }
/* 倍率を「1 万」の形に（1 万倍のように使う） */
function c3Man(n) { return c3Nb(n >= 1e8 ? (n / 1e8) + " 億" : n >= 1e4 ? (n / 1e4) + " 万" : String(n)); }

/* 3-2 の番号札の列。先頭 STRIP_HEAD 枚・最後 STRIP_TAIL 枚と、あいだの省略の帯（縞の詰まりは段ごとに増える演出） */
var C3_STRIP_GAP = [9, 4, 2.5, 1.6];   /* 縞の間隔（px）。段が上がるほど詰まって見える。実寸の比ではない */
function c3Strip(S, v) {
  var n = S.n, head = [], tail = [], i;
  for (i = 1; i <= STRIP_HEAD; i++) head.push(i);
  for (i = STRIP_TAIL - 1; i >= 0; i--) tail.push(n - i);
  var omit = n - STRIP_HEAD - STRIP_TAIL;
  var card = function (x) { return '<span class="c3s-card">' + fmt(x) + "</span>"; };
  return '<div class="c3s" role="img" aria-label="' + esc("番号札 " + fmt(n) + " 枚。先頭 " + STRIP_HEAD + " 枚と最後 " + STRIP_TAIL + " 枚のあいだの " + fmt(omit) + " 枚を省略") + '">'
    + '<p class="c3s-cap">1 件を番号札 1 枚にすると <b>' + fmt(n) + "\u00a0枚</b>（" + S.what + "）</p>"
    + '<div class="c3s-row">' + head.map(card).join("")
    + '<span class="c3s-omit" style="--c3gap:' + C3_STRIP_GAP[v] + 'px"><span class="c3s-omit-t">…… ' + fmt(omit) + "\u00a0枚を省略 ……</span></span>"
    + tail.map(card).join("") + "</div></div>";
}

function renderS32() {
  var v = state.c3scale, S = SCALES[v], last = SCALES[SCALES.length - 1], q = askMax(S.n), qMax = askMax(last.n);
  /* 番号札の列: 先頭と最後の札だけを見せ、あいだを「省略」の帯にする。件数が増えるほど帯の縞が詰まる（本人 2026-09-27
     「すごい増えたな、と言うのが感覚的にわかるような見せ方」「途中省略なども使っていっぱいあると言う感じを演出」）。
     縞の間隔は演出で、実寸ではない。札の数は model.js の STRIP_HEAD・STRIP_TAIL、省略した枚数は件数から計算する */
  var strip = c3Strip(S, v);
  /* 2 つの聞き方の最大の回数と、1 回 1 秒で聞いたときの時間（model.js の askTime。実測ではなく換算） */
  var cmp = '<div class="c3b-cmp">'
    + '<div class="c3b-way"><span class="c3b-lbl">' + C3_WAYS.lin.t + '（最大）</span><b class="c3b-v">' + c3Unit(S.label, "回") + "</b>"
    + '<span class="c3b-time">1 回 1 秒なら <b>' + askTime(S.n) + "</b></span></div>"
    + '<div class="c3b-way bin"><span class="c3b-lbl">' + C3_WAYS.bin.t + '（最大）</span><b class="c3b-v">' + q + " 回</b>"
    + '<span class="c3b-time">1 回 1 秒なら <b>' + askTime(q) + "</b></span></div></div>";
  var boxes = '<div class="diagram-scroll c3b-boxes">' + boxesSvg(qMax, q) + "</div>"
    + '<p class="c3b-cap">四角 1 つが、真ん中から聞く 1 回です。</p>';
  var steps = '<ol class="c3b-steps" aria-label="動かした段の最大の回数">' + SCALES.map(function (x, i) {
    var open = i <= v, qi = askMax(x.n);
    return '<li class="' + (i === v ? "on" : open ? "" : "later") + '"><span class="c3b-n">' + c3Unit(x.label, "件") + "</span><b>" + (open ? qi + " 回" : "？") + "</b>"
      + (i && open ? '<span class="c3b-tag">＋' + (qi - askMax(SCALES[i - 1].n)) + " 回</span>" : "") + "</li>";
  }).join("") + "</ol>";
  var stage = rangeCtl({ key: "c3scale", min: 0, max: SCALES.length - 1, step: 1, label: "件数",
    fmt: function (x) { return c3Unit(SCALES[x].label, "件"); } })
    + strip + cmp + boxes + steps;

  return slideHead({ title: "件数を増やす", lead: "件数を " + c3Sp(SCALES[0].label) + "から " + c3Sp(last.label) + "まで増やして、2 つの聞き方の最大の回数を比べます。" })
    + slideBody(stage, pointsCard([
      "件数が " + c3Sp(SCALES[0].label) + "から " + c3Sp(SCALES[1].label) + "へ " + c3Unit(c3Man(SCALES[1].n / SCALES[0].n), "倍") + "になっても、真ん中から聞く回数は "
        + askMax(SCALES[0].n) + " 回から " + askMax(SCALES[1].n) + " 回にしか増えません。",
      "件数が 2 倍になるたびに、真ん中から聞く回数は 1 回増えます。",
      "端から順に聞く回数は、件数と同じだけ増えます。"
    ]) + bookTag())
    + c3LogSupp();
}

/* ── 3-2 の補足（厚い形）: 半分にできる回数 ─────────────────────────────────
   事実: 二十の扉〔G-8〕・はい・いいえ 20 回〔G-11〕・git bisect〔CS-5〕・真ん中の計算のあふれ〔CS-6〕・32 ビットに入らない〔CS-7〕 */
/* 扉の絵: 範囲の帯が 1 段ごとに半分になる（右側を残す。字は置かない） */
function c3HalvingArt(thumb) {
  var h = "", x0 = 20, x1 = 300, w0 = x1 - x0, n = thumb ? 4 : 7, gap = thumb ? 44 : 26, bh = thumb ? 30 : 16;
  for (var i = 0; i < n; i++) {
    var y = (thumb ? 18 : 12) + i * gap, w = w0 / Math.pow(2, i);
    if (w < w0 && !thumb) h += spR(x0, y, w0 - w, bh, 4, "sp-none sp-ln1 sp-dash");
    h += spR(x1 - w, y, Math.max(w, 4), bh, 4, (i === n - 1 ? "sp-c" : "sp-a") + " sp-ln");
  }
  return h;
}
/* git bisect の図: コミットの並びを、真ん中で試して半分ずつに絞る（丸と線だけ。Git のロゴは描かない〔CS-5 の目安〕） */
function c3BisectArt() {
  var N = 15, gap = 40, x0 = 40, h = "", seq = [[0, 14], [7, 14], [7, 10]];
  seq.forEach(function (lh, row) {
    var y = 26 + row * 52, lo = lh[0], hi = lh[1], mid = Math.floor((lo + hi) / 2);
    h += spP("M" + x0 + " " + y + "H" + (x0 + (N - 1) * gap), "sp-ln1");
    for (var i = 0; i < N; i++) {
      var x = x0 + i * gap;
      if (i < lo || i > hi) h += spC(x, y, 5, "sp-sh");
      else if (i === lo) h += spC(x, y, 9, "sp-a sp-ln");
      else if (i === hi) h += spC(x, y, 9, "sp-k");
      else if (i === mid) h += spC(x, y, 13, "sp-c sp-ln");
      else h += spC(x, y, 8, "sp-p sp-ln");
    }
  });
  return spArt(640, 160, h, "コミットの並びを、真ん中で試して半分ずつに絞る図");
}
function c3PowTable() {
  return '<table class="mini c3-pow"><thead><tr><th>件数</th><th>2 をかけて初めて超える数</th><th>最大の回数</th></tr></thead><tbody>'
    + SCALES.map(function (x) {
      var q = askMax(x.n);
      return "<tr><td>" + c3Unit(x.label, "件") + "</td><td>" + fmt(pow2(q)) + "（2 を " + q + " 回）</td><td><b>" + q + " 回</b></td></tr>";
    }).join("") + "</tbody></table>";
}

function c3LogSupp() {
  var last = SCALES[SCALES.length - 1], qL = askMax(last.n), T = C3_REF.tv, B = C3_REF.bisect, L = C3_REF.bloch;
  var yes20 = 20;
  return spPanel("c3-log", {
    title: c3Nb(last.label) + "でも " + qL + " 回のわけ",
    thumb: spArt(320, 200, c3HalvingArt(true)),
    hero: {
      art: spArt(320, 200, c3HalvingArt(), "範囲の帯が 1 段ごとに半分になる絵"),
      kicker: "HALVING ・ " + askMax(SCALES[0].n) + " 回 → " + qL + " 回",
      h: "半分にできる回数",
      lead: "1 回聞くたびに、残りは半分以下になります。" + c3Unit(last.label, "通り") + "から始めても、" + (qL - 1) + " 回聞くまでに残りは 1 通りに絞られ、"
        + qL + " 回目には必ず当たります。"
    },
    parts: [
      spKey("真ん中から聞く回数の最大は、2 を何回かけると件数を超えるかで決まります。"),
      spSpread(
        spPh(1, "半分にできる回数の表")
          + spTxt("件数の段ごとに、2 をかけていって初めて件数を超える数を並べました。かけた回数が、そのまま最大の回数です。")
          + c3PowTable()
          + spTxt("「2 を何回かけるとその数になるか」を表す数を、2 を底とする対数（たいすう、logarithm）と呼びます。件数の対数を超える最初の整数が、真ん中から聞く回数の最大です。"),
        spPh(2, "二十の扉と 20 回の質問")
          + spTxt("NHK の「二十の扉」は、アメリカのクイズ番組「Twenty Questions」をモデルにしたラジオのクイズ番組です。解答者は司会者に 20 回まで質問でき、20 回目までに正解を出します。"
            + T.y + " 年 " + T.m + " 月からは、テレビの実験放送でも同時に放送されました。")
          + spTxt("番組の形とは別に、はい・いいえで答える質問なら、" + yes20 + " 回の答えの並びは 2 を " + yes20 + " 回かけた " + fmt(pow2(yes20)) + " 通りあるので、"
            + yes20 + " 回の質問で " + c3Unit(SCALES[1].label, "通り") + "より多くを見分けられます。")
      ),
      spSpread(
        spPh(3, "git bisect")
          + spTxt("git bisect は、二分探索で、不具合を持ち込んだコミットを探す Git のコマンドです。壊れている版を <code class=\"c3-nw\">git bisect bad</code>、正しく動いた版を <code class=\"c3-nw\">git bisect good</code> で伝えると、Git はその間の真ん中のコミットを取り出します。")
          + c3BisectArt()
          + spTxt("上の段から順に、試す範囲が半分ずつに絞られます。範囲の左端が正しく動いた版、右端が壊れている版で、大きな丸が Git の取り出す真ん中のコミットです。")
          + spTxt("説明書の例では、最初に <code>Bisecting: " + B.left[0] + " revisions left to test after this (roughly " + B.steps[0] + " steps)</code> と表示されます。1 回答えると、残りは "
            + B.left[1] + " 件、見込みはおよそ " + B.steps[1] + " 回に減ります。取り出したコミットが正しいか壊れているかを決めるのは人で、Git は次に試すコミットを選びます。"),
        spPh(4, "真ん中の計算のあふれ")
          + spTxt(L.y + " 年 " + L.m + " 月 " + L.d + " 日、Joshua Bloch が Google Research の Blog で、二分探索の実装によくある不具合を知らせました。"

/* ═════ ch4.js ═════ */
/* ═════ 第 4 章　終わる条件（4-1 止まらない手順）══════════════════════════════════════
   ★ 聞いた数を「外す」か「残す」かを切り替え（押して動くものの型 ①）、正解 END_TARGET を 1 手ずつ送る（型 ③）。
     送った手数 c4k は 2 つの書き方で共通（切り替えると、同じ回数だけ聞いたところを見比べられる。外す書き方は当たりの手で頭打ち）。
     残す書き方は終わらないので、上限を置かずに何手でも進められる（「10 手進める」）。
   ★ 行は model.js の planEnd から。planEnd は同じ数が 3 回続いたところで打ち切るので、その先は最後の行と同じ動きを繰り返す
     （範囲が変わらないので、手順は同じ数を聞き続ける）。
   ★ 補足の事実は P1 の事実ファイルの「確かめた」節（CS-8・CS-9・CS-10）だけから書く。年と題と DOI は C4_REF（統合で model.js へ移す案）。
     「不変条件で終わりが言える」とは書かない（CS-8 の注意）。「Turing が停止問題を証明した」とも書かない（CS-10 の注意）。
   ★ 人物は、聞いた回数の札の横にカゾエ（書記官）を 1 体だけ。台詞は言わせない。 */

defaults({
  c4mode: "haz",   /* 書き方。"haz" 聞いた数を外す・"nok" 聞いた数を残す */
  c4k: 0           /* 送った手数（2 つの書き方で共通。上限なし。外す書き方では当たりの手で頭打ち） */
});

REFS["4-1"] = ["binary-log", "kmeans-conv"];

/* 補足の事実（数で持つ）。〔 〕は P1 の事実ファイルの節 */
var C4_REF = {
  floyd: { y: 1967, t: "Assigning Meanings to Programs", doi: "https://doi.org/10.1090/psapm/019/0235771" },                  /* 〔CS-9〕 */
  hoare: { y: 1969, t: "An Axiomatic Basis for Computer Programming", doi: "https://doi.org/10.1145/363235.363259" },          /* 〔CS-8〕 */
  turing: { y: 1936, t: "On Computable Numbers, with an Application to the Entscheidungsproblem", doi: "https://doi.org/10.1112/plms/s2-42.1.230" }   /* 〔CS-10〕 */

function c4Keep(mode) { return (mode || state.c4mode) === "nok"; }
/* いまの書き方で見せる手数（外す書き方は当たりの手で頭打ち） */
function c4Done(keep) { return keep ? state.c4k : Math.min(state.c4k, planEnd(false, END_TARGET).length); }

function c4At(keep, k) {
  var base = planEnd(keep, END_TARGET), rows = [];
  for (var i = 0; i < k; i++) rows.push(base[Math.min(i, base.length - 1)]);
  var r = rows[k - 1], lo = LO, hi = HI, hit = false, rep = 0;
  if (r) {
    hit = !!r.hit;
    if (hit) { lo = r.g; hi = r.g; } else { lo = r.after[0]; hi = r.after[1]; }
    for (var j = rows.length - 1; j >= 0 && rows[j].g === r.g; j--) rep++;

/* 残す書き方で、縮まなくなったときの範囲と聞く数（planEnd の最後の行） */

/* 手順（1 か所だけが書き方で違う）。見出しの行に切り替えを置く（見出しの下に置くと、1 画面から下へ出た） */
function c4Proc(keep) {

  return '<div class="c4-proc"><div class="c4-proch"><b>手順</b>'
    + seg("c4mode", [{ v: "haz", t: "聞いた数を外す" }, { v: "nok", t: "聞いた数を残す" }], state.c4mode) + "</div><ol>"
    + "<li>残っている範囲の真ん中（小数は切り捨て）を聞く。</li>"
    + "<li>「もっと上」なら下の端を<b class=\"c4-diff\">" + up + "</b>に、「もっと下」なら上の端を<b class=\"c4-diff\">" + dn + "</b>にする。</li>"

function renderS41() {

  var btns = '<div class="c4-btns">'

    + slideBody(stage, pointsCard([

function c4Sizes(keep) { return planEnd(keep, END_TARGET).map(function (r) { return r.hi - r.lo + 1; }); }

function c4Census() {

  }

}
/* 扉の絵: 左は外す書き方の件数（1 まで減る）、右は残す書き方の件数（2 から減らない）。棒の高さは件数。字は置かない */
function c4BarsArt(thumb) {
  var h = spP("M8 184H312", "sp-ln"), a = c4Sizes(false), b = c4Sizes(true).concat([2, 2]), k = 1.6;

/* ═════ 押したとき・打ったとき・キー ═════════════════════════════════════

function handleClick(d, e) {

      state[AXIS.key] = v;
    }, e);
    return true;
  }

  /* 理解の確認。押した肢に印が残る */
  if (d.qopt !== undefined) {
    var a = d.qopt.split(":");
    act(function () { state.answers[a[0]] = +a[1]; state.checked[a[0]] = true; }, e);
    return true;
  }

  /* 参考図書の引き出し */
  if (d.run === "drawer-open") { act(function () { state.drawer = true; state.shelf = false; }, e); return true; }
  if (d.run === "drawer-close") { act(function () { state.drawer = false; state.zoom = false; }, e); return true; }
  if (d.run === "shelf") { act(function () { state.shelf = !state.shelf; state.zoom = false; }, e); return true; }
  if (d.run === "zoom") { act(function () { state.zoom = !state.zoom; }, e); return true; }
  if (d.clip !== undefined) { act(function () { state.clip = +d.clip; state.shelf = false; }, e); return true; }
  if (d.goref !== undefined) {
    var g = d.goref.split(":");
    showSlide(+g[0]);
    act(function () { state.drawer = true; state.shelf = false; state.clip = +g[1]; });
    return true;
  }

  for (var i = 0; i < HANDLERS.length; i++) if (HANDLERS[i](d, e)) return true;
  return false;
}

function handleInput(d, t) {

      ev.preventDefault();
      act(function () { state.clip = Math.max(0, Math.min(refs.length - 1, state.clip + (k === "ArrowRight" ? 1 : -1))); });
    }
    return;
  }
  if (state.drawer) {
    if (k === "Escape" || k === "b" || k === "B") { ev.preventDefault(); act(function () { state.drawer = false; }); }
    else if ((k === "ArrowRight" || k === "ArrowLeft") && !state.shelf && refs.length) {

      act(function () { state.clip = Math.max(0, Math.min(refs.length - 1, state.clip + (k === "ArrowRight" ? 1 : -1))); });
    }
    return;
  }
  if (k === "ArrowRight" || k === "PageDown") { ev.preventDefault(); showSlide(state.slide + 1); }
  else if (k === "ArrowLeft" || k === "PageUp") { ev.preventDefault(); showSlide(state.slide - 1); }
  else if ((k === "b" || k === "B") && refs.length) { ev.preventDefault(); act(function () { state.drawer = true; state.shelf = false; }); }
  else if ((k === "k" || k === "K") && typeof gOpen === "function") { ev.preventDefault(); act(function () { gOpen("kb", ""); }); }   /* 操作の早見の棚 */
}
