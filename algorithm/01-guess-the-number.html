/* @@pxfont } */
.pxf{font-family:'px-dot',var(--round);font-weight:400;letter-spacing:.02em;-webkit-font-smoothing:none;font-smooth:never}

/* ── ドット絵の色（模型の色）── */
.px{display:inline-block;vertical-align:bottom;image-rendering:pixelated;overflow:visible}
.px .pk{fill:#1b1530} .px .ph{fill:#4a2f22} .px .ps{fill:#f4c9a0} .px .pS{fill:#d99b72}
.px .pw{fill:#fbf8ff} .px .pp{fill:#7b5cd6} .px .pP{fill:#4a3595} .px .pl{fill:#c8b6ff}
.px .pg{fill:#f2c14e} .px .pG{fill:#b8862b} .px .pb{fill:#aebcd8} .px .pB{fill:#5f6d8c}
.px .pc{fill:#8a5a3b} .px .pC{fill:#5a3a26} .px .pr{fill:#d94b4b} .px .pR{fill:#8e2a3a}
.px .pn{fill:#2e2b55} .px .pN{fill:#1f1d3d} .px .py{fill:#ffc94a} .px .po{fill:#ff7a2f}
.px .pe{fill:#e8416b} .px .pq{fill:#77738f} .px .pQ{fill:#4b4862} .px .pm{fill:#e9e4f5}

/* ── ゲームの画面の模型 ── */
.rpg{display:flex;flex-direction:column;gap:12px}
.rpg-screen{background:#0e0b1c;border-radius:12px;padding:10px;box-shadow:inset 0 0 0 3px #2a2446}
.rpg-screen .px-scene{display:block;width:100%;height:auto;max-height:300px}
.rpg-hud{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;color:#fbf8ff;background:#16122b;border-radius:10px;padding:8px 14px;
  font-size:var(--fs-label);box-shadow:0 0 0 3px #16122b,inset 0 0 0 2px #fbf8ff}
.rpg-hud b{color:#ffc94a;font-weight:400}

/* ── メッセージウィンドウ（黒い地・白い二重の縁・止まった ▼）── */
.mw{position:relative;background:#16122b;color:#fbf8ff;border-radius:12px;padding:22px 22px 16px;
  box-shadow:0 0 0 4px #16122b,inset 0 0 0 3px #fbf8ff,inset 0 0 0 6px #16122b;font-size:20px;line-height:1.75}
.mw-who{position:absolute;left:18px;top:-15px;background:#16122b;color:#ffc94a;padding:1px 12px;border-radius:8px;
  box-shadow:inset 0 0 0 2px #fbf8ff;font-size:var(--fs-label);line-height:1.8}
.mw-t{margin:0;min-height:3.5em}
.mw-next{display:block;margin:6px 0 0 auto;background:transparent;color:#fbf8ff;border:0;font:inherit;font-size:var(--fs-label);
  padding:4px 8px;border-radius:6px;cursor:pointer}
.mw-next:hover,.mw-next:focus-visible{background:#2d2650;outline:none}
.mw-ch{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px}
.mw-c{background:transparent;color:#fbf8ff;border:0;font:inherit;font-size:18px;padding:4px 10px 4px 26px;border-radius:6px;cursor:pointer;position:relative}
.mw-c::before{content:"";position:absolute;left:8px;top:50%;margin-top:-6px;border:6px solid transparent;border-left:9px solid #fbf8ff;opacity:0}
.mw-c:hover::before,.mw-c:focus-visible::before,.mw-c.on::before{opacity:1}
.mw-c:hover,.mw-c:focus-visible{background:#2d2650;outline:none}
.mw-c.on{color:#ffc94a}

/* ── 話し手の札（ドット絵＋名前。本文のどこに置いてもよい）── */
.pxtalk{display:flex;gap:12px;align-items:flex-end}
.pxtalk .px{flex:none}
.pxtalk-b{position:relative;background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:8px 12px;box-shadow:3px 3px 0 var(--ink)}
.pxtalk-b b{display:block;font-size:var(--fs-label);color:var(--ink-3)}
.pxtalk-b span{display:block}

/* ── 数当ての図（役目の色）── */
.band{display:block;width:100%;height:auto}
.band .bd-drop{fill:none;stroke:var(--drop);stroke-width:1.8;stroke-dasharray:7 6}
.band .bd-keep{fill:color-mix(in srgb,var(--c-main) 12%,var(--paper));stroke:var(--c-main);stroke-width:2.6}
.band .bd-hit{fill:var(--hit-soft);stroke:var(--hit);stroke-width:2.6}
.band .bd-ask{stroke:var(--ask);stroke-width:2.8}
.band .bd-askbox{fill:var(--ask)}
.band .bd-askt{fill:var(--deck);font-size:19px;font-weight:700}   /* 琥珀の地に墨の字（白だと 3.48。P9 のデザインの役） */
.band .bd-end{fill:var(--ink-4);font-size:18px}
.band .bd-lbl{fill:var(--ink-3);font-size:18px;font-weight:700}
.boxes{display:block;width:100%;height:auto}
.boxes .bx-on{fill:color-mix(in srgb,var(--c-main) 16%,var(--paper));stroke:var(--c-main);stroke-width:2.4}
.boxes .bx-off{fill:var(--paper);stroke:var(--line);stroke-width:1.4}
.stat{display:flex;flex-wrap:wrap;gap:10px}
.stat .st{flex:1 1 120px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.stat .st-v{font-size:28px;line-height:1.2;color:var(--ink);font-variant-numeric:tabular-nums}
.stat .st-v small{font-size:var(--fs-label);margin-left:3px;color:var(--ink-3)}
.stat .st-l{font-size:var(--fs-label);color:var(--ink-3)}
.stat .st.hit{border-color:var(--hit);box-shadow:inset 0 0 0 1px var(--hit)} .stat .st.hit .st-v{color:var(--hit)}
.stat .st.ask{border-color:var(--ask);box-shadow:inset 0 0 0 1px var(--ask)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.log li{display:grid;grid-template-columns:3em 4em 1fr;gap:8px;align-items:center;padding:4px 10px;border-radius:8px;background:var(--paper-2)}
.log li.hit{background:var(--hit-soft)} .log li.gap{display:block;text-align:center;color:var(--ink-4)}
.log .lg-n{color:var(--ink-4);font-size:var(--fs-label)} .log .lg-g{font-weight:700}
.log.empty li{display:block;color:var(--ink-4)}

/* スマホの幅（500px 未満）では、本文の切り替えのボタン列を折り返す（narrow_qa で 3-1・4-1 が 390px 以下で器から出た。2026-09-27） */
@media (max-width:499px){ .s-body .segmented{flex-wrap:wrap;max-width:100%} }

/* ═════ ch0.css ═════ */
/* ═════ 表紙（科目）═════
   正典の style.css の表紙の塊（@@subject）を写し、16 進を役目のトークンへ、v1 の名前を役目の名前へ替えた。 */
/* 表紙の中身 */
.cv-grid{display:grid;grid-template-columns:auto minmax(0,1fr) 330px;gap:28px;align-items:center;padding:14px 36px 18px}
.bignum .cv-min{font-size:1.3rem;letter-spacing:0;margin-left:2px}
.bignum .cv-pre{font-size:1.3rem;letter-spacing:0;margin-right:4px}   /* 「第 1 回」。大きな数は回の番号（7 回と読み違えないよう、2026-09-27 に替えた） */
.cv-lead{margin-top:14px;color:var(--ink-2);font-size:1.06rem;max-width:36em}
.cv-side{display:grid;gap:14px}
.cv-os{background:var(--paper-2);border:2px dashed var(--line);border-radius:20px;padding:14px 18px}
.cv-os strong{display:block;font-family:var(--round);color:var(--ink);font-size:var(--fs-label);letter-spacing:.1em;margin-bottom:4px}
.cv-keys{font-size:var(--fs-label);color:var(--ink-3)}
.cv-go{justify-self:start;font-size:1.1rem;padding:10px 26px}
.cv-map{padding:6px 36px 22px}
.cv-h{font-family:var(--round);font-size:1.1rem;color:var(--ink);margin-bottom:10px}
.cv-cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.cv-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
  border:2px solid var(--line);background:var(--paper);border-radius:18px;padding:22px 8px 12px;box-shadow:0 4px 0 var(--line-2)}
.cv-card:hover{border-color:var(--c-main);transform:translateY(-2px)}
.cv-no{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--c-accent);color:var(--paper);border-radius:999px;
  padding:0 10px;font-family:var(--round);font-weight:800;font-size:var(--fs-label);border:2px solid var(--paper)}
.cv-t{font-family:var(--round);font-weight:800;font-size:var(--fs-body);line-height:1.35}
.cv-s{font-size:var(--fs-body);color:var(--ink-3);line-height:1.45}
@media(max-width:1050px){
  .cv-grid{grid-template-columns:auto minmax(0,1fr);padding:12px 24px 16px}
  .cv-side{grid-column:1/-1}
  .cv-cards{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:18px}
  .cv-map{padding:6px 24px 20px}
}
@media(max-width:760px){
  .cv-grid{grid-template-columns:minmax(0,1fr)}
  .cv-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}

.cv-party{display:flex;align-items:flex-end;gap:10px;margin-top:14px;padding:10px 14px 0;border-bottom:4px solid var(--line)}
.cv-party .px{margin-bottom:-2px}
.cv-gap{flex:1}
.cv-art{display:flex;align-items:center;justify-content:center;height:44px}
@media (max-width:1050px){.cv-cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){.cv-cards{grid-template-columns:repeat(2,minmax(0,1fr))}.cv-party .px{width:48px;height:48px}}

/* ═════ ch1.css ═════ */
/* ═════ 第 1 章　本物のゲーム（1-1 返事の数え方・1-2 返事で候補を仕分ける）═════
   色は役目のトークンだけ（16 進を書かない。例外はヒット&ブローの色の丸の模型の色）。テーマだけに効く規則は書かない。
   14px の札は名前に -lbl を付ける（qa の LABEL_SEL が拾う）。2026-09-27 夜に 1 枚を 2 枚に作り直した（審査役の仕様 SCR/p15/judge/spec.md） */

.c1-game .segmented{flex-wrap:wrap}
.c1-nw{white-space:nowrap}   /* 切り替えの「ヒット&ブロー」を途中で折らない */
.c1-reset{margin-left:auto}

/* ── 1-1 ── */
/* 1 行目: 答えを見る／隠す・別の答えで・隣の人が決める・答えの番号・最初から */
.c1-ansbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.c1-ansno-lbl{font-size:var(--fs-label);color:var(--ink-3);font-weight:700;margin-left:4px}
.c1-set-hint{font-size:var(--fs-label);color:var(--ink-2);flex:1 1 16em}

/* 盤の中: 左に判定の台、右に返事と記録 */
.c1-main{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:12px;margin-top:10px;align-items:start}
.c1-jbox{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.c1j-view-lbl{margin:0 0 6px;font-size:var(--fs-label);font-weight:700;color:var(--ink-3)}
.c1j-why{margin:8px 0 0;color:var(--ink);line-height:1.6}
.c1-col2{display:flex;flex-direction:column;gap:10px;min-width:0}

/* 判定の台。札の幅（--c1j-t）と間（--c1j-g）は ch1.js の C1J_SIZE と同じ値を style で渡す（線の SVG と札の位置をそろえる） */
.c1j{display:grid;grid-template-columns:auto auto;justify-content:start;column-gap:12px;row-gap:0;align-items:center}
.c1j-row-lbl{font-size:var(--fs-label);color:var(--ink-3);font-weight:700;text-align:right}
.c1j-tiles{display:flex;gap:var(--c1j-g)}
.c1j-t{flex:0 0 auto;width:var(--c1j-t);height:var(--c1j-t);display:inline-flex;align-items:center;justify-content:center;border-radius:10px;
  border:2px solid var(--line-3);background:var(--paper);color:var(--ink);font-family:var(--mono);font-weight:700;font-size:28px}
.c1j-t.q{background:var(--paper-2);border-style:dashed;color:var(--ink-3)}
.c1j-t.empty{background:transparent;border-style:dashed;border-color:var(--line)}
.c1j-t .c1j-peg{width:calc(var(--c1j-t) - 8px);height:calc(var(--c1j-t) - 8px);font-size:var(--fs-label)}
.c1j-lines{display:block}
.c1j-ln{stroke-width:3;stroke-linecap:round;fill:none}
.c1j-ln.eat{stroke:var(--hit)}
.c1j-ln.bite{stroke:var(--ask);stroke-dasharray:6 4}
.c1j-marks{margin-top:4px}
/* 印の札は札の幅の枠の中央に置き、字が長いとき（小さい台の「ブロー」）は左右の間へはみ出す */
.c1j-mk{flex:0 0 auto;width:var(--c1j-t);display:flex;justify-content:center;overflow:visible}
.c1j-mk-lbl{flex:0 0 auto;white-space:nowrap;padding:0 4px;min-width:var(--c1j-t);text-align:center;font-size:var(--fs-label);font-weight:700;border-radius:6px;line-height:1.5;border:2px solid transparent}
.c1j-mk-lbl.eat{background:var(--hit);color:var(--paper)}
.c1j-mk-lbl.bite{background:var(--ask-soft);border-color:var(--ask);color:var(--ask-ink)}
.c1j-mk-lbl.none{color:var(--ink-3)}
.c1j.dim .c1j-tiles:last-of-type{opacity:.45}
.c1j-s .c1j-t{font-size:18px;border-radius:7px;border-width:1.5px}
.c1j-s .c1j-mk-lbl{border-radius:5px;padding:0 2px}
html.big .c1j-t{font-size:32px}
html.big .c1j-s .c1j-t{font-size:20px}
html.big .c12-row{min-height:22px}
html.big .c12-lane{height:11px}
html.big .c12-band{height:12px}
/* 帯の切れ目（行の棒と同じ位置・幅の切れ端。返事のあとは残る切れ端だけが主の色） */
.c12-band.cut{position:relative;background:transparent}
.c12-seg{position:absolute;top:0;bottom:0;background:var(--c-main);box-shadow:inset -2px 0 0 var(--paper)}
.c12-seg.drop{background:var(--drop)}
.c12-seg.hit{background:var(--hit)}
.c1-setin{width:calc(var(--c1j-t) * 3 + var(--c1j-g) * 2);height:var(--c1j-t);font:inherit;font-family:var(--mono);font-size:28px;letter-spacing:.3em;text-align:center;
  border:2px dashed var(--line-3);border-radius:10px;background:var(--paper-2);color:var(--ink)}
.c1-setin:focus-visible{outline:3px solid var(--c-main);outline-offset:1px}

/* 返事の札 */
.c1-reply{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.c1-reply h3{margin:0;font-size:var(--fs-label);color:var(--ink-3)}
.c1-reply-v{margin:2px 0 0;font-size:1.6rem;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.3}
.c1-reply-v.hit{color:var(--hit)}
.c1-reply-s{margin:2px 0 0;color:var(--ink-2)}
.c1-reply-s.msg{color:var(--ink-2);font-weight:700}
.c1-reply-s.msg.err{color:var(--stop)}   /* 赤は入力の断りだけ（答えを変えた・決めたの知らせは墨） */

/* 記録（盤の右の列）。手・返事・残り */
.c1-log{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.c1-log-h{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:4px}
.c1-log-h h3{margin:0}
.c11-log{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.c11-log th{font-size:var(--fs-label);line-height:1.4;color:var(--ink-3);font-weight:700;text-align:left;padding:0 6px 2px;border-bottom:1px solid var(--line)}
.c11-log td{padding:1px 6px;line-height:1.4;border-bottom:1px solid var(--line-2);white-space:nowrap}
.c11-log tr.hit td{background:var(--hit-soft)}
.c11-log tr.c11-skip td{color:var(--ink-4)}
.c11-log b{font-family:var(--mono);letter-spacing:.06em}
.c11-log th:last-child,.c11-left{text-align:right}
.c11-rec-none{margin:0;color:var(--ink-3)}
.c1-log-note-lbl{margin:4px 0 0;font-size:var(--fs-label);color:var(--ink-3)}

/* 予想を組み立てる段（数字の札・色の丸） */
.c1-pad{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-top:10px}
.c1-slots{display:inline-flex;gap:6px;padding:4px 6px;background:var(--paper-2);border:1px dashed var(--line-3);border-radius:10px}
.c1-dslot{display:inline-flex;align-items:center;justify-content:center;width:30px;height:34px;border-radius:6px;background:var(--paper);border:2px solid var(--line-3);
  font-family:var(--mono);font-weight:700;font-size:1.2rem;color:var(--ink)}
.c1-dslot.empty{background:transparent;border-style:dashed;border-color:var(--line)}
.c1-digs{display:inline-flex;flex-wrap:wrap;gap:5px}
.c1-dig{width:36px;height:40px;border-radius:8px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-family:var(--mono);
  font-weight:700;font-size:1.2rem;cursor:pointer;padding:0}
.c1-dig:hover:not(:disabled),.c1-dig:focus-visible{border-color:var(--c-main);outline:none}
.c1-dig:disabled{background:var(--paper-2);color:var(--ink-4);cursor:default}

/* ── 1-2 ── */
.c12-bar-row{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.c12-say{margin:8px 0 0;font-weight:700;color:var(--ink);min-height:1.6em}
.c12-main{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px;margin-top:8px;align-items:start}

/* 段: 上の帯＝いまの候補。行は返事の順に、帯を切った位置のまま下へずらした棒（左の位置と幅は候補の数の割合） */
.c12-fig{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.c12-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.c12-band-lbl,.c12-chain-lbl{font-size:var(--fs-label);font-weight:700;color:var(--ink-2)}
.c12-chain-lbl{font-variant-numeric:tabular-nums;color:var(--c-main)}
/* 行の列: 返事の札 --c12-l・棒の道・数 --c12-n・印 --c12-t。帯は棒の道と同じ幅（左右の余白に札の列の幅を取る） */
.c12-fig{--c12-l:6.9em;--c12-n:4.4em;--c12-t:2.9em;--c12-gap:6px}
.c12-band{height:18px;border-radius:5px;background:var(--c-main);margin:2px calc(var(--c12-n) + var(--c12-t) + var(--c12-gap) * 2) 4px calc(var(--c12-l) + var(--c12-gap))}
.c12-row{display:grid;grid-template-columns:var(--c12-l) minmax(0,1fr) var(--c12-n) var(--c12-t);gap:var(--c12-gap);align-items:center;width:100%;min-height:26px;padding:0;
  border:0;border-radius:6px;background:transparent;color:var(--ink);font:inherit;text-align:left;font-variant-numeric:tabular-nums}
button.c12-row{cursor:pointer}
button.c12-row:hover,button.c12-row:focus-visible{outline:2px solid var(--line-3);outline-offset:1px}
.c12-row[aria-pressed=true]{outline:2px solid var(--c-main);outline-offset:1px;background:var(--paper-2)}
.c12-row-lbl,.c12-n-lbl,.c12-tag-lbl{font-size:var(--fs-label);white-space:nowrap}
.c12-n-lbl{text-align:right;font-weight:700}
.c12-tag-lbl{font-weight:700;color:var(--ink-3)}
.c12-lane{position:relative;height:14px;border-radius:4px;background:var(--paper-2)}
.c12-bar{position:absolute;top:0;bottom:0;min-width:3px;border-radius:3px;background:var(--c-main)}
.c12-row.max .c12-tag-lbl{color:var(--c-main)}
.c12-row.keep .c12-row-lbl,.c12-row.keep .c12-n-lbl{font-weight:700}
.c12-row.keep .c12-tag-lbl{color:var(--c-main)}
.c12-row.drop .c12-bar{background:var(--drop)}
.c12-row.drop .c12-row-lbl,.c12-row.drop .c12-n-lbl{color:var(--ink-4)}
.c12-row.hit .c12-bar{background:var(--hit)}
.c12-row.hit .c12-tag-lbl{color:var(--hit)}

/* もしもの札 */
.c12-if{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.c12-if h3{margin:0;font-size:var(--fs-body)}
.c12-if p{margin:0;line-height:1.6}
.c12-if-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 8px}
.c12-other{padding:4px 10px}

@media (max-width:760px){
  .c1-main,.c12-main{grid-template-columns:minmax(0,1fr)}
  .c1-reset{margin-left:0}
}
/* スマホの幅: 「答え」「予想」の札を札の列の上に置いて横幅を詰める（375px で判定の台が 15px 出た。narrow_qa 2026-09-27） */
@media (max-width:499px){
  /* 1-2 の行は 2 段に組む（返事・数・印の段と、棒の段）。390px で棒の道が 27px しかなかった（学生役 2026-09-27 夜） */
  .c12-row{grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"l n t" "b b b";row-gap:2px}
  .c12-row-lbl{grid-area:l}.c12-lane{grid-area:b}.c12-n-lbl{grid-area:n}.c12-tag-lbl{grid-area:t}
  .c12-band{margin:2px 0 4px}
  .c1j{grid-template-columns:auto}
  .c1j > span:empty{display:none}
  .c1j-row-lbl{text-align:left;margin-top:4px}
}

/* ── 補足（厚）いちばん削れる聞き方 ── */
.c1-bars{display:flex;flex-direction:column;gap:5px;font-variant-numeric:tabular-nums}
.c1-bar{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr) 5.2em;gap:10px;align-items:center}
.c1-bar-l{color:var(--ink-2)}
.c1-bar-t{height:14px;background:var(--paper-2);border-radius:7px;overflow:hidden;border:1px solid var(--line-2)}
.c1-bar-t i{display:block;height:100%;background:var(--c-main);border-radius:7px;opacity:.55}
.c1-bar.hot .c1-bar-t i{opacity:1}
.c1-bar b{text-align:right}
.c1-counts{margin:6px 0 0;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.c1-mm{display:grid;gap:10px}
.c1-mm-picks{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.c1-mm-b{font-family:var(--mono);letter-spacing:.08em;padding:5px 14px}
.c1-mm-lbl{font-size:var(--fs-label);color:var(--ink-3)}
.c1-mm-art{max-width:640px}
.c1-mm-r{margin:0}
@media (max-width:760px){
  .c1-bar{grid-template-columns:minmax(0,1fr) 5.2em}
  .c1-bar-l{grid-column:1/-1}
}

/* 補足の資料の URL（code）は途中でも折る（390px・375px で補足が器から 27〜42px 出ていた。narrow_qa 2026-09-27） */
@media (max-width:499px){ details.check.sp code{overflow-wrap:anywhere;white-space:normal} }   /* 620px で break-all が「…htm／l」を作ったので、はみ出すときだけ・スマホの幅だけに絞った */

/* ── ヒット&ブロー（色の並び）──
   ★ 色の丸は模型の色（テーマで変えない。deck.json の lint.hex_allow）。丸の中に色の頭文字を置き、色だけで見分けさせない */
.c1-pal-row{display:inline-flex;flex-wrap:wrap;gap:6px}
.c1-pegs{display:inline-flex;gap:3px;vertical-align:middle}
.c1-peg,.c1-pal{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;font:inherit;font-size:var(--fs-label);font-weight:700;
  line-height:1;border:2px solid #1b1530;padding:0}
.c1-pegs .c1-peg{width:24px;height:24px;border-width:1.5px}
.c1-pal{cursor:pointer}
.c1-pal:disabled{opacity:.35;cursor:default}
.c1-pal:hover:not(:disabled),.c1-pal:focus-visible{outline:3px solid var(--c-main);outline-offset:1px}
.c1p-empty{background:transparent;border:2px dashed var(--line-3)}
.c1p-0{background:#c62f3c;color:#ffffff}
.c1p-1{background:#2f5fb3;color:#ffffff}
.c1p-2{background:#1f7a45;color:#ffffff}
.c1p-3{background:#f2c14e;color:#1b1530}
.c1p-4{background:#6a4fd0;color:#ffffff}
.c1p-5{background:#ffffff;color:#1b1530}

/* ═════ ch2.css ═════ */
/* ═════ 第 2 章　手順とは（2-1 勘と手順・2-2 数当てをやってみる）═════
   色は役目のトークンだけ（16 進を書かない）。テーマだけに効く規則は書かない。14px の札は名前に -lbl か -tag を付ける（qa の LABEL_SEL が拾う） */

/* ── 2-1 ── */
.c21-box{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;gap:8px}
.c21-cap-lbl{margin:0;font-size:var(--fs-label);color:var(--ink-3);font-weight:700}
.c21-runs{display:grid;gap:6px}
.c21-run{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.c21-run-tag{font-size:var(--fs-label);font-weight:700;color:var(--ink-3);min-width:4em}
.c21-seq{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-variant-numeric:tabular-nums}
.c21-g{display:inline-block;min-width:2.2em;text-align:center;padding:1px 6px;border-radius:8px;background:var(--paper-2);border:1px solid var(--line);font-weight:700}
.c21-g.hit{background:var(--hit-soft);border-color:var(--hit);color:var(--hit)}
.c21-g.gap{background:transparent;border-color:transparent;color:var(--ink-4)}
.c21-ar{color:var(--ink-4)}
.c21-n{margin-left:auto;font-variant-numeric:tabular-nums}
.c21-note{margin:0;font-weight:700;color:var(--ink)}
.c21-tbl{width:100%;margin-top:12px;border-collapse:separate;border-spacing:0;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.c21-tbl th,.c21-tbl td{padding:8px 10px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:middle}
.c21-tbl tbody tr:last-child th,.c21-tbl tbody tr:last-child td{border-bottom:0}
.c21-tbl thead th{font-size:var(--fs-label);color:var(--ink-3);background:var(--paper-2)}
.c21-tbl tbody th{font-weight:700;color:var(--ink-2);width:38%}
.c21-tbl .cur{background:var(--main-soft)}
.c21-tbl thead th.cur{color:var(--ink)}
.c21-mk{font-weight:800;margin-right:6px}
.c21-tbl td.ok .c21-mk{color:var(--hit)}
.c21-tbl td.ng .c21-mk{color:var(--stop)}
.c21-why{color:var(--ink-2)}

/* ── 2-2 ── */
.c22-ctl{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.c22-no-lbl{font-size:var(--fs-label);font-weight:700;color:var(--ink-3);background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:2px 12px}
.c22-in{width:6.5em;font:inherit;font-size:1.2rem;font-family:var(--mono);text-align:center;padding:6px 10px;
  border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.c22-in:focus-visible{outline:3px solid var(--c-main);outline-offset:1px}
.c22-next{margin-left:auto}
.c22-msg{margin:8px 0 0;color:var(--stop);font-weight:700}
.c22-say{margin:10px 0 0;font-weight:700;color:var(--ink);min-height:1.6em}
.c22-count{display:flex;align-items:flex-end;gap:10px;margin-top:10px}
.c22-count .px{flex:none;margin-bottom:4px}
.c22-count .stat{flex:1 1 auto}
.c22-band{margin-top:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px 8px}
.c22-cmp{margin:10px 0 0;padding:6px 12px;border-radius:10px;background:var(--hit-soft);color:var(--ink)}
.c22-log{margin-top:10px}
.c22-log .log{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 8px}
.c22-log .log.empty{display:block}
.c22-log .log li{grid-template-columns:auto auto minmax(0,1fr);gap:6px}

@media (max-width:760px){
  .c21-tbl tbody th{width:auto}
  .c22-log .log{grid-template-columns:repeat(2,minmax(0,1fr))}
  .c22-next{margin-left:0}
}

/* 2-1 の切り替えは、狭い幅と文字の拡大では折り返す（語を「端から順に聞く」「真ん中から聞く」にそろえて長くなった。contain-big@500 で +4px。2026-09-27） */
.c21-seg .segmented{flex-wrap:wrap;max-width:100%}

/* ═════ ch3.css ═════ */
/* ═════ 第 3 章　2 つの聞き方 ═════ */
/* ★ 色は役目のトークンだけ（16 進を書かない）。テーマだけに効く規則（data-theme）はここに書かない。
   ★ 14px の札は、名前に -lbl か -tag を含める（検査の LABEL_SEL が札として測る）。 */

/* 3-1: 切り替え → 聞いた回数と送るボタン → 範囲の帯 → 返事 → 聞いた数の札の並び */
.c3a-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px;margin-top:12px}
.c3a-count{display:flex;align-items:flex-end;gap:12px;flex:1 1 360px;min-width:0}
.c3a-count>.px{flex:none}
.c3a-count>.stat{flex:1 1 auto;min-width:0}
.c3a-btns{display:flex;flex-wrap:wrap;gap:10px}
.c3a-band{margin-top:6px}
.c3a-say{margin:2px 0 0;font-weight:700;color:var(--ink);min-height:1.7em}
.c3a-log{margin-top:8px}
.c3a-empty{margin:0;color:var(--ink-4)}
.c3a-term p{margin:0}
.c3a-term .c3a-yomi{display:flex;flex-wrap:wrap;gap:4px 8px;margin:0 0 6px}
.c3a-lbl{font-size:var(--fs-label);font-weight:700;color:var(--ink-3);background:var(--paper-2);border:1px solid var(--line);border-radius:6px;padding:0 8px}

/* 聞いた数の札の並び（4 章の .c4-chips と同じ形） */
.c3-chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.c3-chips li{display:inline-flex;align-items:baseline;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:2px 10px;
  font-variant-numeric:tabular-nums}
.c3-chips li b{font-size:1.1rem;color:var(--ink)}
.c3-chips li.hit{background:var(--hit-soft);border-color:var(--hit)}
.c3-chips li.gap{color:var(--ink-4);border-style:dashed}
.c3-chip-n{font-size:var(--fs-label);color:var(--ink-4)}
.c3-chip-t{font-size:var(--fs-label);color:var(--ink-3)}

/* 3-2: 件数の段・2 つの聞き方の最大・四角・通った段の並び */
.c3b-what{margin:10px 0 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.c3b-digits{font-size:1.25rem;font-variant-numeric:tabular-nums;color:var(--ink)}
.c3b-mean{color:var(--ink-2)}
.c3b-cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.c3b-way{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.c3b-way.bin{border-color:var(--c-main)}
.c3b-lbl{font-size:var(--fs-label);font-weight:700;color:var(--ink-3)}
.c3b-v{font-size:1.9rem;line-height:1.25;color:var(--ink);font-variant-numeric:tabular-nums}
.c3b-way.bin .c3b-v{color:var(--c-main)}
.c3b-boxes{margin-top:12px}
.c3b-cap{margin:4px 0 0;color:var(--ink-3)}
.c3b-steps{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.c3b-steps li{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.c3b-steps li.on{border:2px solid var(--c-main)}
.c3b-steps li.later{background:var(--paper-2);color:var(--ink-4)}
.c3b-steps b{font-size:1.2rem;font-variant-numeric:tabular-nums}
.c3b-n{color:var(--ink-2)}
.c3b-tag{align-self:flex-start;font-size:var(--fs-label);font-weight:700;color:var(--ink-3);background:var(--paper-2);border-radius:6px;padding:0 6px}

/* 3-2 の補足: 短いコマンドは途中で折らない */
.c3-nw{white-space:nowrap}

/* 3-2 の補足: 半分にできる回数の表（補足の中なので .diagram-scroll で包まない。狭い幅では折り返す） */
.c3-pow td{font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.c3-pow td:first-child,.c3-pow td:last-child{white-space:nowrap}

/* 帯の幅は 761px 以上でだけ絞る（760px 以下は .diagram-scroll の中で帯が 640px を保つので、絞ると右が切れて横に送る形になった） */
@media (min-width:761px){
  .c3a-band{max-width:600px}
}
@media (max-width:760px){
  .c3b-steps{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .c3b-cmp{grid-template-columns:minmax(0,1fr)}
}

/* 375px 前後ではコードの 1 行も折る（narrow_qa で +3px。2026-09-27） */
@media (max-width:420px){ .c3-nw{white-space:normal;overflow-wrap:anywhere} }

/* 3-2 の番号札の列（2026-09-27 の依頼で足した）。縞は線の役目の色、札は地と縁の役目の色 */
.c3s{margin-top:10px}
.c3s-cap{margin:0 0 6px;color:var(--ink-2)}
.c3s-cap b{font-variant-numeric:tabular-nums;color:var(--ink)}
.c3s-row{display:flex;align-items:stretch;gap:4px;min-width:0}
.c3s-card{flex:none;display:flex;align-items:center;justify-content:center;min-width:2.4em;padding:6px 8px;background:var(--paper);border:1px solid var(--line-3);border-radius:6px;
  font-variant-numeric:tabular-nums;font-weight:700;box-shadow:0 2px 0 var(--line)}
.c3s-omit{flex:1 1 auto;min-width:120px;position:relative;display:flex;align-items:center;justify-content:center;border-radius:6px;
  background:repeating-linear-gradient(90deg,var(--line-3) 0 1px,var(--paper) 1px var(--c3gap));border:1px solid var(--line)}
.c3s-omit-t{position:relative;background:var(--paper);padding:2px 10px;border-radius:999px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.c3b-time{color:var(--ink-3)}
.c3b-time b{color:var(--ink);font-size:1.15rem;font-variant-numeric:tabular-nums}
.c3b-way.bin .c3b-time b{color:var(--c-main)}
@media (max-width:760px){ .c3s-row{flex-wrap:wrap} .c3s-omit{flex-basis:100%;min-height:34px;order:0} }

/* ═════ ch4.css ═════ */
/* ═════ 第 4 章　終わる条件 ═════ */
/* ★ 色は役目のトークンだけ（16 進を書かない）。テーマだけに効く規則（data-theme）はここに書かない。
   ★ 14px の札は、名前に -lbl・-tag・-chip を含める（検査の LABEL_SEL が札として測る）。 */

/* 4-1: 手順（見出しの行に切り替え）→ 聞いた回数と送るボタン → 範囲の帯 → 返事 → 聞いた数の札の並び */
.c4-proc{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 14px 10px}
.c4-proch{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-bottom:4px}
.c4-proch>b{color:var(--ink-2)}
.c4-proc ol{margin:0;padding-left:1.4em;color:var(--ink-2)}
.c4-proc li+li{margin-top:2px}
.c4-diff{color:var(--ink);background:var(--ask-soft);border-bottom:2px solid var(--ask);padding:0 3px;border-radius:3px}
.c4-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px;margin-top:12px}
.c4-count{display:flex;align-items:flex-end;gap:12px;flex:1 1 360px;min-width:0}
.c4-count>.px{flex:none}
.c4-count>.stat{flex:1 1 auto;min-width:0}
.c4-btns{display:flex;flex-wrap:wrap;gap:10px}
.c4-band{margin-top:6px}
@media (min-width:761px){ .c4-band{max-width:600px} }   /* 760px 以下で絞ると、640px を保つ帯の右が切れた */
.c4-say{margin:2px 0 0;font-weight:700;color:var(--ink);min-height:1.7em}
.c4-say.stuck{color:var(--stop)}
.c4-log{margin-top:8px}
.c4-empty{margin:0;color:var(--ink-4)}

/* 聞いた数の札の並び（3 章の .c3-chips と同じ形） */
.c4-chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.c4-chips li{display:inline-flex;align-items:baseline;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:2px 10px;
  font-variant-numeric:tabular-nums}
.c4-chips li b{font-size:1.1rem;color:var(--ink)}
.c4-chips li.hit{background:var(--hit-soft);border-color:var(--hit)}
.c4-chips li.same{background:var(--stop-soft);border-color:var(--stop)}
.c4-chips li.gap{color:var(--ink-4);border-style:dashed}
.c4-chip-n{font-size:var(--fs-label);color:var(--ink-4)}
.c4-chip-t{font-size:var(--fs-label);color:var(--ink-3)}

/* ═════ ch5.css ═════ */
/* ═════ 第 5 章　ヘイセイの冒険 第1話 ═════ */
/* 5-1: 選んだ後の「1 つ戻る」は画面の上の札に置く（窓の中の送りと分ける） */
.rpg-back{margin-left:auto;background:transparent;color:#fbf8ff;border:1px solid #6f6694;border-radius:6px;font:inherit;font-size:var(--fs-label);padding:0 10px;cursor:pointer}
.rpg-back:hover,.rpg-back:focus-visible{background:#2d2650;outline:none}

/* 5-2: 左にゲーム、右に数の盤 */
.c52-play{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:18px;align-items:start}
.c52-game{min-width:0;display:flex;flex-direction:column;gap:12px}
.c52-game .rpg-screen .px-scene{max-height:250px}
.c52-side{display:flex;flex-direction:column;gap:10px}
.c52-board{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;background:#16122b;padding:6px;border-radius:10px}
.c52-n{aspect-ratio:1;min-width:0;padding:0;border:0;border-radius:4px;background:#2d2650;color:#fbf8ff;font-family:'px-dot',var(--round);
  font-size:var(--fs-label);line-height:1;cursor:pointer;font-variant-numeric:tabular-nums}
.c52-n:hover:not(:disabled),.c52-n:focus-visible{box-shadow:inset 0 0 0 2px #fbf8ff;outline:none}
.c52-n.out{background:#0e0b1c;color:#6f6694;cursor:default}
.c52-n.asked{background:#ffc94a;color:#16122b}   /* 聞いた数＝琥珀（本文の「いま聞いた数」の札と同じ意味） */
.c52-n.hit{background:#4f8a3c;color:#fbf8ff}   /* 当たり＝緑（本文の当たりと同じ意味） */
.c52-n:disabled{cursor:default}
.c52-reset{align-self:flex-start}

/* 5-2: 全部の番号で試した結果（棒の長さは件数） */
.c52-all{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.c52-allh{margin:0 0 4px;font-weight:700}
.c52-bar{display:grid;grid-template-columns:3.2em minmax(0,1fr) 4.6em;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.c52-bk{color:var(--ink-3);font-size:var(--fs-label)}
.c52-bt{height:14px;background:var(--paper-2);border-radius:7px;overflow:hidden}
.c52-bt i{display:block;height:100%;background:var(--c-main);border-radius:7px}
.c52-bar b{font-size:var(--fs-label);text-align:right}

@media (max-width:1050px){
  .c52-play{grid-template-columns:minmax(0,1fr)}
  .c52-side{max-width:420px}
}

/* 文字を拡大したとき（html.big）は、ゲームの画面を低くして 1 画面に収める（onescreen-big で 5-1 が +30px だった。2026-09-27） */
html.big .rpg-screen .px-scene{max-height:240px}
html.big .c52-game .rpg-screen .px-scene{max-height:200px}

/* ═════ ch6.css ═════ */
/* ═════ まとめ ═════ */
.c6-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.c6-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px}
.c6-card b{font-size:1.1rem}
.c6-card p{margin:0;color:var(--ink-2)}
.c6-no{position:absolute;top:10px;right:14px;color:var(--ink-4);font-size:var(--fs-label)}
.c6-next{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:center;margin-top:14px;background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:12px}
.c6-next-art .px-scene{display:block;width:100%;height:auto;border-radius:8px}
.c6-next-k{display:block;font-size:var(--fs-label);color:var(--ink-3)}
.c6-next-b b{display:block;font-size:1.2rem;margin:2px 0 4px}
.c6-next-b p{margin:0}
.s-side .pxtalk{margin-top:12px}
@media (max-width:760px){.c6-cards{grid-template-columns:minmax(0,1fr)}.c6-next{grid-template-columns:minmax(0,1fr)}}

/* ═════ theme-v2-algo-01.css ═════ */
/* ============================================================================
   algo-01 の v2（2026-09-27）。正典 v2（theme-v2.css・棚 theme-v2）を写し、色相をスレートとミントから淡い紫へ回した
   （本人「色合いは「淡い紫」のスタイリッシュなデザイン」。回し方は spec/20_デザイン.md。theme.md §5.1 の 4）。
   末尾の「レトロの印」の塊だけが、この教材で足した規則（本人「レトロゲー風。8bit的な雰囲気で、メッセージウィンドウも古き良き」）。
   ============================================================================ */
/* ============================================================================
   v2「ターミナル由来のテック」（2026-09-25。本人「ポップすぎる。理系の大学生向けに洗練＋少しポップ・丸文字で」）。/designslide の棚 theme-v2
   ★ 「@@subject {」から「}」までは、この教材の章だけに効く規則（新しい教材へは写らない）
   3 案（ラボノート・ソフトなプロダクト UI・ターミナル由来）を 3 つの立場で審査して C を採り、A・B の良い所を接いだ（Workflow pcl-v2-design）
   v1 の CSS の後ろに足す上書き。html に data-theme="v2" があるときだけ効く。文と JS の組み方は変えない。
   ★ トークンだけ html[data-theme=v2]{…} で :root に勝たせる。ほかの規則はすべて :where(html[data-theme=v2]) を頭に付け、
     詳細度を v1 と揃える（v1 の状態の規則 .on・:disabled・[aria-pressed]・.ok/.ng・.ask などが、そのまま勝ち残る）。
   ★ 色は 3 系統だけ: 墨（この教材は色相 258° の紫の墨。字・札・濃い帯）／印（淡い紫 #a78bfa→#e6d3ff。印だけ）／意味の 4 色＋注目の赤。
   ★ 白地の上では、ネオンは字に使わない（1.69:1）。ネオンの地には墨の字を載せる。
   ★ 選んだ・押した: 暗い地の上ではネオンの地に墨の字、明るい地の上では墨の地に白い字。
   ★ いま＝琥珀・自分＝ネオン・注目（画面の中の場所を指す枠と番号）＝赤。本文が「赤い枠」「赤い番号」と書いている。
   ============================================================================ */

html[data-theme=v2]{
  --bg:#f1eef9; --bg-2:#f1eef9;
  --paper:#fff; --paper-2:#f5f3fb;
  --ink:#1b142b; --ink-2:#332b46; --ink-3:#4f4664; --ink-4:#625a75;
  --line:#d7ceeb; --line-2:#e8e2f5; --line-3:#c8c3d4; --line-4:#a199b3;
  /* 濃い帯（上の帯・章ナビ・しおり・引き出しと早見の頭） */
  --deck:#140f20; --deck-2:#1e1532; --deck-3:#2b2143; --deck-ink:#e9e3f6; --deck-ink-2:#b1a8c5;
  /* 差し色（ネオン）。白地では印だけ */
  --acc:#a78bfa; --lime:#e6d3ff; --acc-deep:#5b3fd0; --acc-tint:#efe9ff; --lime-tint:#f4edff; --lime-deep:#6f4fd6;
  /* 役目の名前の印（theme.md §4.1）。v2 の印はネオン。ほかの役目の名前は、塗り替えた v1 の名前から引く（style.css の :root） */
  --c-mark:var(--acc);
  /* v1 の名前を v2 の値に付け替える（v1 の規則をそのまま生かす） */
  --main:#5b3fd0; --main-deep:#241c35; --main-dark:#1b142b; --main-soft:#eeeaf9; --main-line:#d0cbdc; --pill:transparent;
  --pink:#241c35; --pink-deep:#3c3253; --pink-soft:#eae4f7;
  --yellow:#e6d3ff; --marker:#e3d3ff; --brown:#241c35;
  /* 注目の赤は残す（正典の規則。この教材の本文は色の語で名指ししない。deck.json の theme_check の roles は空）。白い番号が 4.5:1 に届くよう一段だけ濃く（v1 #e03b3b は 4.32） */
  --red:#d63333;
  --peach:#f5f3fb; --peach-line:#d7ceeb; --orange:#6f4fd6;
  /* 意味の色（意味は v1 と同じ。値だけ v2 の地に合わせる） */
  --hit:#18793a; --hit-soft:#e5f4e9;
  --ask:#c07a0b; --ask-soft:#fff3d9; --ask-ink:#7a4a00;
  --stop:#c42a3b; --stop-soft:#fdecee;
  --drop:#a6b0b8;
  /* 字体 */
  --round:'v2-round','Hiragino Maru Gothic ProN','BIZ UDPGothic','Yu Gothic UI','Meiryo',sans-serif;
  --tag:'SF Mono','Menlo','Consolas','v2-round','BIZ UDGothic',monospace;
  --r:14px;
  --shadow-1:0 1px 2px rgba(22,16,44,.06);
  --shadow-2:0 1px 2px rgba(22,16,44,.06),0 12px 28px -20px rgba(22,16,44,.35);
}
/* 文字を拡大（投影）では、明るい教室で消えやすい縁と影を一段濃くする（案 B から） */
html.big[data-theme=v2]{--line:#c8c3d4;--line-3:#a199b3;--shadow-1:0 1px 3px rgba(22,16,44,.16)}

/* ── 土台 ─────────────────────────────────────── */
:where(html[data-theme=v2]) body{font-family:var(--round);font-weight:500;background:var(--bg)}
:where(html[data-theme=v2]) :is(b,strong){font-weight:700}
:where(html[data-theme=v2]) :is(button,summary,input):focus-visible{outline-color:var(--acc-deep)}
:where(html[data-theme=v2]) code{background:#eeeaf9;border:1px solid var(--line-2);border-radius:4px;padding:0 .3em}
:where(html[data-theme=v2]) mark{background:linear-gradient(transparent 56%,var(--marker) 56%);font-weight:700}
:where(html[data-theme=v2]) .kbd{border:1px solid #b9b2c8;border-bottom-width:3px;font-weight:700}
:where(html[data-theme=v2]) kbd.kbd[data-gk]{border-color:var(--line-4)}
:where(html[data-theme=v2]) kbd.kbd[data-gk]:hover{background:var(--lime-tint);border-color:var(--ink)}
/* 模型なのに body の字体を受けていた所（本物の字体に戻す） */
:where(html[data-theme=v2]) :is(.dlg,.c72-ss,.c72-app,.c72-start,.c72-set,.c43-tray,.c43-menu,.term.t-win .t-bar){font-family:'Yu Gothic UI','Segoe UI','Hiragino Kaku Gothic ProN',sans-serif}
:where(html[data-theme=v2]) :is(.dlg.d-mac,.c43-spot,.c43-spot-hit,.term.t-mac .t-bar){font-family:-apple-system,'Hiragino Kaku Gothic ProN',sans-serif}

/* ── 上の帯（濃い帯）──────────────────────────── */
:where(html[data-theme=v2]) .topbar{background:var(--deck);-webkit-backdrop-filter:none;backdrop-filter:none;border-bottom:1px solid var(--deck-3);color:var(--deck-ink)}
:where(html[data-theme=v2]) .brand{font-weight:700}
:where(html[data-theme=v2]) .brand-icon{background:var(--acc);box-shadow:none;border-radius:9px}
:where(html[data-theme=v2]) .brand-icon svg{stroke:var(--deck)}
:where(html[data-theme=v2]) .brand .course{color:var(--acc);font-family:var(--tag);font-weight:600;letter-spacing:.14em}
:where(html[data-theme=v2]) .osswitch{background:var(--deck-2);border:1px solid var(--deck-3)}
:where(html[data-theme=v2]) .osswitch button{color:var(--deck-ink-2);font-weight:700}
:where(html[data-theme=v2]) .osswitch button[aria-pressed=true]{background:var(--acc);color:var(--deck);box-shadow:none}
:where(html[data-theme=v2]) :is(.tb-guide button,.topbar .plain){background:transparent;border:1px solid var(--deck-3);color:var(--deck-ink);font-weight:700}
:where(html[data-theme=v2]) :is(.tb-guide button,.topbar .plain):hover{border-color:var(--acc)}

/* ── 枚と見出し ─────────────────────────────── */

:where(html[data-theme=v2]) .awning{height:4px;background:linear-gradient(90deg,var(--acc),var(--lime))}

/* 第 1 回: 墨の角丸の札の中の輪（正典の案 A のストップウォッチから）。全 15 回を 15 の目盛りにし、1 回目の弧をネオンで、弧の終わり（下）にライムの点。
   2026-09-27 本人「第7回目の講義に見える」で、7 回・30 分の輪から替えた */
:where(html[data-theme=v2]) .bignum{border-radius:28px;background:var(--deck);color:var(--deck-ink)}
:where(html[data-theme=v2]) .bignum::after{content:"";inset:5px;border:0;border-radius:50%;
  background:repeating-conic-gradient(from calc(var(--arc0,156deg) - .8deg),var(--deck) 0 1.6deg,transparent 1.6deg var(--tick,24deg)),conic-gradient(from var(--arc0,156deg),var(--acc) 0 var(--arc,6.667%),var(--deck-3) var(--arc,6.667%) 100%);   /* 弧と目盛りは ch0.js が LESSON から --arc・--tick・--arc0 で渡す（弧の終わりが下の点） */
  -webkit-mask:radial-gradient(closest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));
  mask:radial-gradient(closest-side,transparent calc(100% - 7px),#000 calc(100% - 6px))}

:where(html[data-theme=v2]) .bignum .tag{background:var(--acc);color:var(--deck);border:2px solid #fff;border-radius:6px;top:-12px}

:where(html[data-theme=v2]) .title-yellow::after{content:"";display:inline-block;width:.4em;height:.9em;margin-left:.12em;vertical-align:-.1em;border-radius:3px;
  background:linear-gradient(180deg,var(--acc),var(--lime))}

      + '<div class="zoom-in">' + clipImg(zn, "zimg") + "<p>" + BOOK_TITLE + " " + esc((FIGS[zn] || {}).cite || "") + "</p></div></div>";
  }
  return '<button class="scrim" data-run="drawer-close" aria-label="引き出しを閉じる"></button>'
    + '<aside class="drawer" aria-label="参考図書"><div class="dr-head"><span class="dr-ico">' + BOOK_ICON + '</span><div>'
    + '<div class="dr-kick">参考図書</div><div class="dr-title">' + esc(tt(s.t)) + "</div></div>"
    + '<button class="dr-shelf' + (state.shelf ? " on" : "") + '" data-run="shelf">この回の一覧</button>'
    + '<button class="dr-x" data-run="drawer-close" aria-label="閉じる">✕</button></div>'
    + '<div class="dr-body">' + body + "</div></aside>" + zoom;
}

/* この回の一覧。枚ごとに切り抜きを並べ、押すとその枚へ行って開く */
function shelfList() {
  var h = '<p class="dr-note">' + BOOK_TITLE + BOOK_META + "。この回で使う誌面の一覧です。押すと、そのページへ移って開きます。</p>";
  for (var i = 0; i < SLIDES.length; i++) {
    var refs = REFS[SLIDES[i].id] || [];
    if (!refs.length) continue;
    h += '<div class="sh-row"><div class="sh-slide">' + (SLIDES[i].ch >= 0 ? CHAPTERS[SLIDES[i].ch].no + " " : "") + esc(tt(SLIDES[i].t)) + "</div>"
      + '<div class="sh-clips">' + refs.map(function (r, k) {
        var g = FIGS[r] || {};
        return '<button class="sh-clip" data-goref="' + i + ":" + k + '"><b>p.' + (g.page || "?") + "</b>" + esc(g.cap || r) + "</button>";
      }).join("") + "</div></div>";
  }
  return h;
}

/* ── 上の帯・章ナビ・下の送り ───────────────────────────────────────── */
/* 上の帯。左の字は deck.json の brand（lab・course。本人が 2026-09-26 に決めた字）、
   右は切り替え（AXIS があるときだけ）・操作の早見（棚 guide があるときだけ）・文字を拡大 */
function topbar() {
  var B = DECK.brand || {};
  return '<div class="topbar"><div class="wrap tb-wrap"><div class="brand"><span class="brand-icon">'
    + (B.icon_svg || '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>')
    + '</span><span>' + esc(B.lab || "") + '</span><span class="course">' + esc(B.course || "") + "</span></div>"
    + '<div class="header-actions">' + axisSwitch()
    + (typeof guideTopButtons === "function" ? guideTopButtons() : "")
    + '<button id="bigtoggle" class="plain" aria-pressed="' + state.big + '">文字を拡大</button></div></div></div>';
}
/* 切り替えのボタン（全部の枚に効く）。属性は data-<AXIS.key>（PCL は data-os）。押したときは boot.js の handleClick が受ける */
function axisSwitch() {
  if (!AXIS) return "";
  return '<div class="osswitch" role="group" aria-label="' + esc(AXIS.aria || "") + '">' + AXIS.values.map(function (v) {
    return "<button data-" + AXIS.key + '="' + v + '" aria-pressed="' + (axVal() === v) + '">' + esc(AXIS.labels[v] || v) + "</button>";
  }).join("") + "</div>";
}

function chapters() {
  var cur = slideNow().ch;
  return '<nav class="chapters" aria-label="章">' + CHAPTERS.map(function (c, i) {
    var list = slidesOfChapter(i);
    var dots = list.length > 1 ? '<span class="ch-dots">' + list.map(function (n) {
      return '<i' + (n === state.slide ? ' class="on"' : "") + "></i>";
    }).join("") + "</span>" : "";
    return '<button class="chapter" data-slide="' + list[0] + '"' + (cur === i ? ' aria-current="page"' : "") + '>'
      + '<span class="num">' + c.no + '</span><span class="ch-t">' + tt(c.s) + "</span>" + dots + "</button>";
  }).join("") + "</nav>";
}

function pager() {
  var n = state.slide, N = SLIDES.length;
  var prev = n > 0 ? SLIDES[n - 1] : null, next = n < N - 1 ? SLIDES[n + 1] : null;
  return '<div class="pager">'
    /* 矢印と題の間は折らない空白（矢印だけが次の行に落ちないように） */
    + (prev ? '<button class="btn pg-prev" data-slide="' + (n - 1) + '">←\u00a0' + esc(tt(prev.t)) + "</button>" : "<span></span>")
    + '<span class="pg-count">' + (n + 1) + " / " + N + '<span class="pg-keys">' + kbd("←") + kbd("→") + " で送る</span></span>"
    + (next ? '<button class="btn pg-next" data-slide="' + (n + 1) + '">' + esc(tt(next.t)) + "\u00a0→</button>" : "<span></span>")
    + "</div>";
}

function foot() {
  return '<div class="foot"><span>' + esc((DECK.brand || {}).foot || "") + "</span></div>";   /* deck.json の brand.foot。科目の名前は外した（本人 2026-09-26） */
}

function shell() {
  var s = slideNow();
  return topbar()
    + '<div class="wrap">' + chapters()
    + '<main id="main"><article class="slide' + (s.ch < 0 && !s.plain ? " cover" : "") + (s.cls ? " " + s.cls : "") + '" data-slide-id="' + s.id + '">' + s.render() + "</article>"
    + pager() + "</main>"
    + foot() + "</div>"
    + shiori() + drawer() + (typeof guideOverlay === "function" ? guideOverlay() : "");
}

   ═════════════════════════════════════════════════════════════════════════════════════════════ */

/* ── 下ごしらえ ───────────────────────────────────────────── */
function spAttr(a) {
  var h = "";
  for (var k in a) if (a[k] !== undefined && a[k] !== null) h += " " + k + '="' + a[k] + '"';
  return h;
}
/* 図形 1 つ。cls は塗りと線のクラス（下の一覧）。st は模型の年代の色（style） */
function spE(tag, a, cls, st) {
  return "<" + tag + spAttr(a) + (cls ? ' class="' + cls + '"' : "") + (st ? ' style="' + st + '"' : "") + "/>";
}
function spR(x, y, w, h, r, cls, st) { return spE("rect", { x: x, y: y, width: w, height: h, rx: r || 0 }, cls, st); }
function spC(cx, cy, r, cls, st) { return spE("circle", { cx: cx, cy: cy, r: r }, cls, st); }
function spP(d, cls, st) { return spE("path", { d: d }, cls, st); }
/* 年代の色（style の fill だけ・stroke だけ） */
function spF(c) { return "fill:" + c; }
function spS(c, w) { return "fill:none;stroke:" + c + ";stroke-width:" + (w || 1); }

/* 塗りと線のクラス（色は sp.css の .sp の変数）
   sp-ln 墨の線 2px（縮めても太さは同じ）／sp-ln1 細い線 1.5px／sp-dash 破線／sp-hl 注目の赤い輪
   sp-p 紙（白）／sp-a 主の淡い色／sp-b 差し色の淡い色／sp-c 印の色（1 枚に 1 か所）／sp-sh 影・奥／sp-k 墨のベタ／sp-box 箱の地
   sp-arl 矢印の線／sp-arf 矢じり／sp-hotl・sp-hotf 番号札の引き出し線と点（注目の赤） */

/* SVG の外枠。字を置かない。w×h が 1 倍の大きさで、それより大きくは引き伸ばさない */
function spArt(w, h, inner, label, cls) {
  return '<svg class="sp-art' + (cls ? " " + cls : "") + '" viewBox="0 0 ' + w + " " + h + '" width="' + w + '" height="' + h + '"'
    + (label ? ' role="img" aria-label="' + label + '"' : ' aria-hidden="true"') + ">" + inner + "</svg>";
}

/* 画面の大きさ（320×200）の図を 1 枚の SVG にする。crop = [x, y, 幅, 高さ] でその部分だけ（見出しの小さな絵にもそのまま使う） */
function spFrame(inner, crop, label) {
  var c = crop || [0, 0, 320, 200];
  return '<svg class="sp-art sp-shot" viewBox="' + c.join(" ") + '" width="' + c[2] + '" height="' + c[3] + '"'
    + (label ? ' role="img" aria-label="' + label + '"' : ' aria-hidden="true"') + ">" + inner + "</svg>";
}


/* 展示台（博物館の台座）。上の板・胴・銘板 */
function spPlinth(x, y, w, plates) {
  var h = spR(x - 8, y, w + 16, 11, 3, "sp-p sp-ln") + spR(x, y + 11, w, 26, 0, "sp-a sp-ln");
  (plates || []).forEach(function (cx) { h += spR(cx - 30, y + 18, 60, 11, 3, "sp-p sp-ln1"); });
  return h;
}
/* 書類のアイコン（角を折った紙）。lines = 中の行の数 */
function spDoc(x, y, w, h, lines, cls) {
  var f = Math.min(w, h) * .3;
  var s = spP("M" + x + " " + y + "h" + (w - f) + "l" + f + " " + f + "v" + (h - f) + "h-" + w + "z", (cls || "sp-p") + " sp-ln")
    + spP("M" + (x + w - f) + " " + y + "v" + f + "h" + f, "sp-ln sp-none");
  for (var i = 0; i < (lines || 0); i++) s += spR(x + w * .16, y + h * .38 + i * h * .14, w * (i % 2 ? .5 : .66), h * .06, 1, "sp-sh");
  return s;
}
/* フォルダー */
function spFolder(x, y, w, h, cls) {
  return spP("M" + x + " " + (y + h * .16) + "h" + w * .36 + "l" + w * .08 + " " + h * .12 + "h" + w * .56 + "v" + h * .72 + "h-" + w + "z", (cls || "sp-c") + " sp-ln");
}
/* 荷札（左がとがった札と、ひもを通す穴）。
   ★ 尖りの幅と穴の半径は札の高さに比例させる（h の 0.5 と 0.18。大きい札は 16 と 5 で頭打ち＝前と同じ形）。
     前は 16 と 5 の決め打ちで、見出しの小さな絵（20×14）では胴が 4 しか残らず、穴がはみ出して「三角と点」に見えた（2026-09-26） */
function spTag(x, y, w, h) {
  var p = Math.min(16, h * .5), r = Math.min(5, h * .18);
  return spP("M" + (x + p) + " " + y + "H" + (x + w) + "V" + (y + h) + "H" + (x + p) + "L" + x + " " + (y + h / 2) + "z", "sp-p sp-ln")
    + spC(x + p + 1, y + h / 2, r, "sp-b sp-ln1");
}
/* 鉛筆（(x, y) が芯の先。ang 度だけ回す） */
function spPencil(x, y, len, ang) {
  return '<g transform="translate(' + x + " " + y + ") rotate(" + ang + ')">'
    + spP("M0 0L16 -7V7z", "sp-p sp-ln") + spP("M0 0L6 -2.6V2.6z", "sp-k")
    + spR(16, -7, len - 30, 14, 0, "sp-c sp-ln") + spR(len - 14, -7, 14, 14, 3, "sp-b sp-ln")
    + spP("M16 0H" + (len - 14), "sp-ln1") + "</g>";
}
/* マウスの矢印（挿絵の色） */
function spPointer(x, y, s) {
  s = s || 1;
  return '<g transform="translate(' + x + " " + y + ") scale(" + s + ')">' + spP("M0 0l0 17 4.6-4.2 3.2 7 3-1.4-3.2-6.8 6.2-.2z", "sp-p sp-ln") + "</g>";
}


/* ── 部品（HTML）───────────────────────────────────────────── */
function spKari() { return '<i class="sp-kari" title="確かめている途中です">仮</i>'; }
/* 文の中の [[仮]] を札に替える（中身の側で書きやすくするため） */
function spK(s) { return String(s === undefined || s === null ? "" : s).replace(/\[\[仮\]\]/g, spKari()); }

/* 扉（大きな見出しの図）。o = {art, kicker, h, lead, chips, years} */
function spHero(o) {
  var yrs = o.years && o.years.length
    ? '<div class="sp-hero-yrs" style="grid-template-columns:repeat(' + o.years.length + ',minmax(0,1fr))">'
      + o.years.map(function (y) { return '<span class="sp-hero-yr">' + y + "</span>"; }).join("") + "</div>"
    : "";
  return '<header class="sp-hero"><div class="sp-hero-art"><div class="sp-hero-fig">' + o.art + yrs + "</div></div>"

/* 見開き（左右 2 ページ。760px 以下で縦に積む）。
   3 つ目（fill）は広い画面で片方のページの下へ回る。短いほうのページの下を埋めて、左右の高さをそろえるための口 */
function spSpread(left, right, fill) {
  var f = fill && typeof fill === "object" ? fill : { fill: fill, side: "right" };
  var under = f.fill ? '<section class="sp-page sp-page-fill">' + f.fill + "</section>" : "";
  return '<div class="sp-spread' + (under ? " sp-spread-f" + (f.side === "left" ? " sp-fill-l" : "") : "") + '">'
    + '<section class="sp-page sp-page-l">' + left + '</section><section class="sp-page sp-page-r">' + right + "</section>" + under + "</div>";

/* ページの見出し（番号の札つき） */
function spPh(no, t) { return '<h4 class="sp-ph"><i class="sp-no">' + no + "</i><span>" + t + "</span></h4>"; }
function spTxt(s) { return '<p class="sp-txt">' + spK(s) + "</p>"; }
/* 図の札（全幅の figure）。番号はページの見出し（spPh）と同じ札で、節の番号の続きを渡す。
   ★ 2026-09-26 まで「図 5」と出していた。節の 1〜4 の次に「図 5」があると、図 1〜4 を探してしまう（見た目と学生の検査役）。
     番号の数え方は変えず、札を節と同じにして「図」の字を外した */
function spPlate(no, cap, inner) {
  return '<figure class="sp-plate"><figcaption><i class="sp-no">' + no + "</i><span>" + spK(cap) + "</span></figcaption>" + inner + "</figure>";

/* 鋭い一言の札（案 C の KEY）。1 本の補足に 1 つまで */
function spKey(html, label) {

/* 年表の路線図。o = {lanes:[{k,name}], stops:[{y, name, ver, p, kari, st:{laneKey: "start|dot|pass|end|join|xfer|aside|none"}}], [aside]}
   ★ aside（2026-09-26）: どちらの系統にも入らない駅の印（点線の菱形。線は引かない）。その欄に線の無い行で使う
     （例: Mac の路線図の Xerox Alto・Apple Lisa は st: {cl: "aside", ux: "pass"}。UNIX の線の上に載って、UNIX 系に見えていた）。
     o.aside に文（HTML）を渡すと、凡例の 3 つ目に菱形の印とその文が並ぶ */
function spRail(o) {
  var keys = o.lanes.map(function (l) { return l.k; });
  var legend = '<div class="sp-legend">' + o.lanes.map(function (l, i) {
    return '<span><i class="sp-sw l' + (i + 1) + '"></i>' + l.name + "</span>";
  }).join("") + (o.aside ? '<span><i class="sp-sw aside"></i>' + spK(o.aside) + "</span>" : "") + "</div>";
  var rows = o.stops.map(function (s) {
    var lanes = keys.map(function (k, i) {
      return '<i class="sp-lane l' + (i + 1) + " " + (s.st[k] || "none") + '"></i>';
    }).join("");
    return '<li class="sp-st"><span class="sp-lanes" aria-hidden="true">' + lanes + "</span>"
      + '<span class="sp-st-y">' + s.y + "</span>"
      + '<span class="sp-st-n"><b>' + s.name + "</b>" + (s.ver ? '<span class="sp-ver">' + spK(s.ver) + "</span>" : "") + (s.kari ? spKari() : "")
      + (s.p ? '<span class="sp-st-p">' + spK(s.p) + "</span>" : "") + "</span></li>";
  }).join("");
  return legend + '<ol class="sp-rail">' + rows + "</ol>";
}

/* 標本の並び（年・名前・字の無い図・一言） */
function spSpecs(list) {
  return '<div class="sp-specs">' + list.map(function (s) {
    return '<div class="sp-spec"><div class="sp-spec-t"><p class="sp-spec-h"><b class="sp-y">' + s.y + "</b>" + s.name + (s.kari ? spKari() : "") + "</p>"
      + (s.p ? '<p class="sp-spec-p">' + spK(s.p) + "</p>" : "") + '</div><div class="sp-spec-fig">' + s.art + "</div></div>";
  }).join("") + "</div>";
}

/* 標本の格子（画面の模型を並べる。案 B の「並べる」）。list = [{scr, y, name, p, crop, kari}]
   札の最小の幅は o.min（rem。既定 11.5）。1440 で 5 列、760 で 3 列、500 で 2 列ほどになる */
function spGrid(list, o) {
  o = o || {};
  return '<div class="sp-grid"' + (o.min ? ' style="--sp-cell:' + o.min + 'rem"' : "") + ">" + list.map(function (s) {
    var fig = s.art !== undefined ? spFrame(s.art, s.crop) : (typeof spShot === "function" ? spShot(s.scr, s.crop) : "");
    return '<figure class="sp-cell"><div class="sp-cell-fig">' + fig + "</div>"
      + '<figcaption><p class="sp-cell-h"><b class="sp-y">' + s.y + '</b><span class="sp-cell-n">' + s.name + "</span>" + (s.kari ? spKari() : "") + "</p>"
      + (s.p ? '<p class="sp-cell-p">' + spK(s.p) + "</p>" : "") + "</figcaption></figure>";
  }).join("") + "</div>";
}


/* 数の並び（版の番号など）。段ごとに 年の札＋番号の札。skip は使わなかった番号（破線の札）
   rows = [{h:"…", nums:["10.0",…], cls:"g1", skip:"…"}] */
function spNums(rows) {
  return '<div class="sp-nums">' + rows.map(function (r) {
    return '<div class="sp-numrow-l ' + (r.cls || "") + '"><p class="sp-numh">' + spK(r.h) + '</p><div class="sp-numrow">'
      + (r.skip ? '<span class="sp-num skip" title="使わなかった番号">' + r.skip + "</span>" : "")
      + r.nums.map(function (n) { return '<span class="sp-num">' + n + "</span>"; }).join("") + "</div></div>";
  }).join("") + "</div>";
}

/* 展開した木（案 C の spTree）。node = [名前, 注記, [子…], 印]。名前が / で終わるものはフォルダー。印が真なら地に印の色 */
function spTree(root) {
  function li(n) {
    var dir = /\/$/.test(n[0]);
    return "<li" + (n[3] ? ' class="hl"' : "") + '><span class="sp-tn' + (dir ? " dir" : "") + '">' + esc(n[0]) + "</span>"
      + (n[1] ? '<span class="sp-ann">' + spK(n[1]) + "</span>" : "")
      + (n[2] && n[2].length ? "<ul>" + n[2].map(li).join("") + "</ul>" : "") + "</li>";
  }
  return '<ul class="sp-tree">' + li(root) + "</ul>";
}

/* 豆知識の札（高さは行ごとにそろう）。外の .sp-tidbox は幅を測る器（列の数に応じて、最後の段に 1 枚だけ残った札を横いっぱいにする。sp.css） */
function spTidbits(list) {
  if (!list || !list.length) return "";
  return '<div class="sp-tidbox"><div class="sp-tids">' + list.map(function (t) {
    return '<aside class="sp-tid"><span class="sp-tid-h">' + (t.h || "豆知識") + "</span><p>" + spK(t.p) + "</p></aside>";
  }).join("") + "</div></div>";
}
/* 資料（出典）の札 */
function spSource(s) { return s ? '<p class="sp-src"><span class="sp-src-h">資料</span><span>' + spK(s) + "</span></p>" : ""; }

/* 名前の札（ファイル名。拡張子は注目の赤） */
function spName(base, ext) {
  return '<span class="sp-fname">' + esc(base) + (ext ? '<b class="sp-ext">' + esc(ext) + "</b>" : '<b class="sp-ext sp-ext-none">（なし）</b>') + "</span>";
}
/* 判定の札（当たり＝緑／止まる＝赤／決まらない＝琥珀） */
function spVerdict(kind, t) { return '<span class="sp-vd ' + kind + '">' + t + "</span>"; }

/* 書き換えの例 1 行。o = {from:[base,ext], to:[base,ext], art, res, vd:[kind,text]} */
function spCase(o) {
  return '<div class="sp-case"><div class="sp-case-fig">' + o.art + '</div><div class="sp-case-main">'
    + '<p class="sp-case-names">' + spName(o.from[0], o.from[1]) + '<span class="sp-arrow" aria-label="を">→</span>' + spName(o.to[0], o.to[1]) + "</p>"
    + '<p class="sp-case-res">' + spVerdict(o.vd[0], o.vd[1]) + "<span>" + spK(o.res) + "</span></p></div></div>";
}

/* バイトの並び（札）。list = ["50", …] か [["50","P"], …]。hot = 先頭から印を付ける数（true なら全部） */
function spBytes(list, hot) {
  var n = hot === true ? list.length : (hot || 0);
  /* 字の段は、1 つでも字を書いたら全部に付ける（書いていないバイトは「·」＝字にならない） */
  var ch = list.some(function (x) { return typeof x !== "string" && x.length > 1; });
  return '<span class="sp-bytes">' + list.map(function (x, i) {
    var b = typeof x === "string" ? [x] : x;
    return '<span class="sp-byte' + (i < n ? " hot" : "") + '"><b>' + b[0] + "</b>" + (ch ? "<i>" + (b[1] || "·") + "</i>" : "") + "</span>";
  }).join("") + "</span>";
}
/* 先頭のバイトの並び。rows = [{ext, name, bytes:[["50","P"],…], hot, note, kari}] */
function spSig(rows) {
  return '<div class="sp-sig">' + rows.map(function (r) {
    var b = r.bytes && r.bytes.length
      ? spBytes(r.bytes.map(function (x) { return [x[0], x[1] || "·"]; }), r.hot ? true : 0)
      : '<span class="sp-nobytes">' + spK(r.note) + "</span>";
    return '<div class="sp-sig-row">' + ficon(r.ext, 26) + '<span class="sp-sig-n">' + r.name + (r.kari ? spKari() : "") + "</span>" + b + "</div>";
  }).join("") + "</div>";
}

/* 札 → 札 → 判定 の流れ（「名前だけ変える」と「作ったアプリで保存し直す」を並べる形）。
   rows = [{h:"見出し", steps:[HTML, …], vd:[kind, text]}]
   ★ 矢印は次の札と一組（.sp-flow-g）にして、折り返しが矢印の手前でしか起きないようにする。
     前は矢印が行の終わりに残り、その先に何も無い行ができた（2026-09-26 の見た目の検証） */
function spFlow(rows) {
  var ar = '<span class="sp-flow-ar" aria-hidden="true">→</span>';
  function g(h, first) { return '<span class="sp-flow-g">' + (first ? "" : ar) + h + "</span>"; }
  return '<div class="sp-flows">' + rows.map(function (r) {
    return '<div class="sp-flow"><p class="sp-flow-h">' + r.h + '</p><div class="sp-flow-r">'
      + r.steps.map(function (s, i) { return g('<span class="sp-flow-st">' + spK(s) + "</span>", i === 0); }).join("")
      + (r.vd ? g(spVerdict(r.vd[0], r.vd[1])) : "") + "</div></div>";
  }).join("") + "</div>";
}

/* 右向きの矢印（矢じりは形で描く。線の太さで育たない） */
function spArrow(w) {
  w = w || 56;
  return '<svg class="sp-art sp-arw" viewBox="0 0 ' + w + ' 24" width="' + w + '" height="24" aria-hidden="true">'
    + spP("M2 12H" + (w - 12), "sp-arl") + spP("M" + (w - 14) + " 4L" + (w - 2) + " 12L" + (w - 14) + " 20z", "sp-arf") + "</svg>";
}


/* 実験台の器（案 B の 5-1）。状態は持たない。章のファイルが state と data 属性で持ち、ここへ渡す。
   o = {label, aria, cur, attr(v) → 属性の文字列, items:[{v, t, sub, icon, attrs}],
        file:{icon, name, changed, bytes, hot, size, same}, app, view, verdict:[kind, text], why, dialog, dialogCap, labels:{name, bytes, to}}
   ★ 押すボタンの分岐は章の onClick。確認の画面は ui.js の dialogBox で章が組んで dialog に渡す */
function spLab(o) {
  var L = o.labels || {}, F = o.file || {};
  var picks = '<div class="sp-picks" role="group" aria-label="' + (o.aria || o.label || "") + '">' + (o.items || []).map(function (it) {
    var at = it.attrs || (o.attr ? o.attr(it.v) : "");
    return '<button class="sp-pick" ' + at + ' aria-pressed="' + (it.v === o.cur) + '">' + ficon(it.icon || "", 30)
      + "<b>" + it.t + "</b>" + (it.sub ? "<small>" + it.sub + "</small>" : "") + "</button>";
  }).join("") + "</div>";
  var file = '<div class="sp-lab-file">' + ficon(F.icon || "", 52)
    + '<div class="sp-lab-parts"><p class="sp-lab-meta">' + (L.name || "名前の札") + "</p>"
    + '<p class="sp-nametag' + (F.changed ? " changed" : "") + '">' + (F.name || "") + "</p>"
    + (F.bytes ? '<p class="sp-lab-meta">' + (L.bytes || "中身（先頭のバイト）") + '</p><div class="sp-inside">' + spBytes(F.bytes, F.hot)
      + (F.size ? '<span class="sp-fsize">' + F.size + "</span>" : "") + "</div>" : "")
    + (F.same ? '<span class="badge ok">' + F.same + "</span>" : "") + "</div></div>";
  var to = '<div class="sp-lab-to">' + spArrow(56) + "<span>" + (L.to || "開くのは") + '</span><b class="sp-app">' + (o.app || "") + "</b></div>";
  var view = '<div class="sp-lab-view">' + (o.view || "") + (o.verdict ? spVerdict(o.verdict[0], o.verdict[1]) : "") + "</div>";
  return '<div class="sp-lab"><p class="sp-lab-t">' + (o.label || "押して比べる") + "</p>" + picks
    + '<div class="sp-lab-stage">' + file + to + view + "</div>"
    + (o.why ? '<p class="sp-lab-why">' + spK(o.why) + "</p>" : "")
    + (o.dialog ? '<figure class="sp-lab-dlg">' + o.dialog + (o.dialogCap ? "<figcaption>" + spK(o.dialogCap) + "</figcaption>" : "") + "</figure>" : "")
    + "</div>";
}

/* 格子 → rect の並び（行ごとに同じ色の続きを 1 本に） */
function pxRects(rows, ox, oy) {
  var h = "";
  for (var j = 0; j < rows.length; j++) {
    var r = rows[j], i = 0;
    while (i < r.length) {
      var c = r[i];
      if (c === ".") { i++; continue; }
      var k = i;
      while (k < r.length && r[k] === c) k++;
      h += '<rect class="p' + c + '" x="' + (ox + i) + '" y="' + (oy + j) + '" width="' + (k - i) + '" height="1"/>';
      i = k;
    }
  }
  return h;
}
function pxGrid(name) { return name === "door" ? pxDoorRows(false) : name === "doorOpen" ? pxDoorRows(true) : PX[name]; }
function pxW(name) { var g = pxGrid(name); return g[0].length; }
function pxH(name) { return pxGrid(name).length; }

/* 1 体のドット絵（SVG）。scale は 1 画素の大きさ（px）。o = {flip, cls, label} */
function pxSprite(name, scale, o) {
  o = o || {};
  var g = pxGrid(name), w = g[0].length, hh = g.length, s = scale || 4;
  var body = pxRects(g, 0, 0);
  if (o.flip) body = '<g transform="translate(' + w + ',0) scale(-1,1)">' + body + "</g>";
  return '<svg class="px' + (o.cls ? " " + o.cls : "") + '" viewBox="0 0 ' + w + " " + hh + '" width="' + (w * s) + '" height="' + (hh * s)
    + '" shape-rendering="crispEdges" role="img" aria-label="' + esc(o.label || pxName(name)) + '">' + body + "</svg>";
}

/* 扉（24×30）。アーチの石の枠・縦の板・鉄の帯・金の錠。open なら中が暗く、宝箱が見える */
function pxDoorRows(open) {
  var W = 24, H = 30, rows = [];
  for (var y = 0; y < H; y++) {
    var r = "";
    for (var x = 0; x < W; x++) {
      var cx = 11.5, dx = x - cx, top = 11;              /* 上 11 行がアーチ */
      var inArch = y >= top || (dx * dx + (y - top) * (y - top) * 1.0 <= 11.8 * 11.8);
      var inWood = y >= top ? (x >= 3 && x <= 20 && y >= 2) : (dx * dx + (y - top) * (y - top) <= 8.6 * 8.6);
      var ch = ".";
      if (inArch) ch = "Q";
      if (inArch && !inWood && ((x + y) % 5 === 0)) ch = "q";
      if (inWood) {
        if (open) ch = (y >= H - 6 ? "N" : "k");
        else {
          ch = (x - 3) % 5 === 4 ? "C" : "c";
          if (y === top + 1 || y === H - 6) ch = "B";
          if (Math.abs(x - 11.5) <= 1.5 && y >= 16 && y <= 19) ch = (y === 16 || y === 19 || Math.abs(x - 11.5) > 1) ? "G" : "g";
        }
      }
      if (y === H - 1 && inArch) ch = "Q";
      r += ch;
    }
    rows.push(r);
  }
  if (open) {   /* 開いた扉の奥に宝箱 */
    var c = PX.chest;
    for (var j = 0; j < c.length; j++) {
      var row = rows[H - 2 - c.length + j].split("");
      for (var i = 0; i < c[j].length; i++) if (c[j][i] !== ".") row[4 + i] = c[j][i];
      rows[H - 2 - c.length + j] = row.join("");
    }
  }
  return rows;
}

/* 石の壁（16×8 のれんが）。w×h の範囲を埋める */
function pxBricks(w, h, y0) {
  var s = '<rect class="pQ" x="0" y="' + y0 + '" width="' + w + '" height="' + h + '"/>';
  for (var y = y0, row = 0; y < y0 + h; y += 8, row++) {
    for (var x = (row % 2 ? -8 : 0); x < w; x += 16) {
      var x1 = Math.max(0, x + 1), x2 = Math.min(w, x + 15);
      if (x2 > x1) s += '<rect class="pq" x="' + x1 + '" y="' + (y + 1) + '" width="' + (x2 - x1) + '" height="' + Math.min(6, y0 + h - y - 1) + '"/>';
    }
  }
  return s;
}

/* ゲームの画面の模型。o = {scene:"curse"|"throne"|"vault", w, h, items:[{n, x, y, flip}], torches:[点いているか…], open, label}
   ★ 画面の字は HTML（msgWin）に置き、この SVG には字を置かない。 */
function pxScene(o) {
  var W = o.w || 160, H = o.h || 72, s = "";
  if (o.scene === "curse") {
    s += '<rect class="pP" x="0" y="0" width="' + W + '" height="' + H + '"/>' + '<rect class="pn" x="0" y="' + (H - 20) + '" width="' + W + '" height="20"/>';
    /* 番号で閉じた箱（床一面。第1話の呪い） */
    for (var cy = H - 19, cr = 0; cy < H - 7; cy += 9, cr++) for (var cx = (cr % 2 ? 9 : 1); cx < W - 16; cx += 18) s += pxRects(PX.chest, cx, cy);
  } else if (o.scene === "library") {
    s += '<rect class="pP" x="0" y="0" width="' + W + '" height="' + H + '"/>' + '<rect class="pn" x="0" y="' + (H - 20) + '" width="' + W + '" height="20"/>';
    /* 増えた本（床一面。第2話の予告） */
    for (var yy = H - 18; yy < H - 1; yy += 6) for (var xx = 2; xx < W - 4; xx += 7) s += pxRects(PX.book, xx + (yy % 12 ? 3 : 0), yy);
  } else if (o.scene === "throne") {
    s += pxBricks(W, H - 16, 0) + '<rect class="pC" x="0" y="' + (H - 16) + '" width="' + W + '" height="16"/>'
      + '<rect class="pR" x="' + (W / 2 - 14) + '" y="' + (H - 16) + '" width="28" height="16"/>'
      + '<rect class="pr" x="' + (W / 2 - 12) + '" y="' + (H - 16) + '" width="24" height="16"/>';
    for (var px = 14; px < W; px += W - 28) s += '<rect class="pq" x="' + (px - 3) + '" y="4" width="6" height="' + (H - 20) + '"/>'
      + '<rect class="pk" x="' + (px - 3) + '" y="4" width="1" height="' + (H - 20) + '"/>';
  } else {
    s += pxBricks(W, H - 10, 0) + '<rect class="pQ" x="0" y="' + (H - 10) + '" width="' + W + '" height="10"/>'
      + '<rect class="pq" x="0" y="' + (H - 10) + '" width="' + W + '" height="1"/>';
    var dx = Math.round(W / 2 - 12);
    s += pxRects(pxDoorRows(!!o.open), dx, H - 10 - 30 + 1);
  }
  /* 灯りの列（ミッションの残りの回数）。o.torches = [true, true, false …] */
  if (o.torches) {
    var n = o.torches.length, gap = 12, x0 = Math.round(W / 2 - (n * gap) / 2) + 2;
    o.torches.forEach(function (on, i) { s += pxRects(on ? PX.torch : PX.torchOff, x0 + i * gap, 2); });
  }
  (o.items || []).forEach(function (it) {
    var g = pxGrid(it.n), body = pxRects(g, 0, 0);
    s += '<g transform="translate(' + it.x + "," + it.y + ")" + (it.flip ? " translate(" + g[0].length + ",0) scale(-1,1)" : "") + '">' + body + "</g>";
  });
  return '<svg class="px px-scene" viewBox="0 0 ' + W + " " + H + '" width="100%" preserveAspectRatio="xMidYMid meet" shape-rendering="crispEdges" role="img" aria-label="'
    + esc(o.label || "ゲームの画面") + '">' + s + "</svg>";
}

/* ── 2. メッセージウィンドウ ────────────────────────────────────────────
   o = {who:話し手, text:文（HTML 可）, next:{run, t}, choices:[{attr, v, t, on}], foot:HTML, live:true}
   ★ 話し手の札・文・送るボタンの 3 つ。▼ は止まった印（点滅させない）。字はドット字体（.pxf） */
function msgWin(o) {
  var foot = "";
  if (o.choices) {
    foot = '<div class="mw-ch">' + o.choices.map(function (c) {
      return '<button class="mw-c' + (c.on ? " on" : "") + '" data-' + c.attr + '="' + c.v + '"' + (c.on ? ' aria-pressed="true"' : "") + ">" + c.t + "</button>";
    }).join("") + "</div>";

    + (o.who ? '<span class="mw-who">' + o.who + "</span>" : "")
    + '<p class="mw-t">' + o.text + "</p>" + (o.foot || "") + foot + "</div>";
}

/* ゲームの画面と窓をまとめた器。hud は画面の上の札の並び（HTML） */
function rpgFrame(scene, win, hud) {
  return '<div class="rpg">' + (hud ? '<div class="rpg-hud pxf">' + hud + "</div>" : "") + '<div class="rpg-screen">' + scene + "</div>" + win + "</div>";

/* 話し手の顔の札（ドット絵＋名前）。本文のどこに置いてもよい */
function pxTalk(name, text, o) {
  o = o || {};
  return '<div class="pxtalk' + (o.cls ? " " + o.cls : "") + '">' + pxSprite(name, o.scale || 3) + '<div class="pxtalk-b"><b class="pxf">'
    + (o.who || pxName(name)) + "</b><span>" + text + "</span></div></div>";
}

/* ── 3. 数当ての図（既存の第1回から。色は役目のクラス）─────────────────── */
/* 範囲の帯。1〜n のうち lo〜hi が残っていて、guess を聞いた。hit なら当たり */
function bandSvg(lo, hi, guess, hit, opt) {
  opt = opt || {};
  var N = opt.n || HI, W = 640, H = 128, x0 = 34, x1 = W - 34, span = x1 - x0;
  function px(v) { return x0 + (v - 1) / (N - 1) * span; }
  var a = px(lo), b = px(hi) + (hi === lo ? 4 : 0);
  var h = '<svg class="band" viewBox="0 0 ' + W + " " + H + '" width="100%" role="img" aria-label="1 から ' + N + ' のうち、残っている範囲は '
    + lo + " から " + hi + ' です">';
  if (a > x0) h += '<rect class="bd-drop" x="' + x0 + '" y="46" width="' + (a - x0) + '" height="40" rx="9"/>';
  if (b < x1) h += '<rect class="bd-drop" x="' + b + '" y="46" width="' + (x1 - b) + '" height="40" rx="9"/>';
  h += '<rect class="' + (hit ? "bd-hit" : "bd-keep") + '" x="' + a + '" y="46" width="' + Math.max(8, b - a) + '" height="40" rx="9"/>';
  if (guess) {
    var g = px(guess);
    h += '<line class="bd-ask" x1="' + g + '" y1="34" x2="' + g + '" y2="94"/>'
      + '<rect class="bd-askbox" x="' + (g - 30) + '" y="2" width="60" height="30" rx="9"/>'
      + '<text class="bd-askt" x="' + g + '" y="24" text-anchor="middle">' + guess + "</text>";
  }
  h += '<text class="bd-end" text-anchor="start" x="' + x0 + '" y="118">1</text>'
    + '<text class="bd-end" text-anchor="end" x="' + x1 + '" y="118">' + N + "</text>";
  if (opt.label) h += '<text class="bd-lbl" text-anchor="middle" x="' + (W / 2) + '" y="118">' + opt.label + "</text>";
  return h + "</svg>";
}

/* 四角を並べて「あと最大で何回」を見せる。★ 数が増えたら四角を縮めて器に収める（33 個でも両端を切らない） */
function boxesSvg(total, left) {
  var W = 640, IN = 600, n = total, s = 30, gap = 9;
  var k = Math.min(1, IN / (n * s + (n - 1) * gap));
  s *= k; gap *= k;
  var w = n * s + (n - 1) * gap, x0 = (W - w) / 2, y0 = 8 + (30 - s) / 2;
  var h = '<svg class="boxes" viewBox="0 0 ' + W + ' 48" width="100%" role="img" aria-label="あと最大 ' + left + " 回。四角 " + n + ' 個のうち、色のついたものが残りの回数です">';
  for (var i = 0; i < n; i++) {
    h += '<rect class="' + (i < left ? "bx-on" : "bx-off") + '" x="' + (x0 + i * (s + gap)).toFixed(1) + '" y="' + y0.toFixed(1)
      + '" width="' + s.toFixed(1) + '" height="' + s.toFixed(1) + '" rx="' + (6 * k).toFixed(1) + '"/>';
  }
  return h + "</svg>";
}

/* 値の札の並び。items = [{v, u, l, cls}] */
function statRow(items) {
  return '<div class="stat">' + items.map(function (it) {
    return '<div class="st' + (it.cls ? " " + it.cls : "") + '"><b class="st-v">' + it.v + (it.u ? '<small>' + it.u + "</small>" : "")
      + '</b><span class="st-l">' + it.l + "</span></div>";
  }).join("") + "</div>";
}

/* 記録の並び。rows = [{k, n, g, r, cls}]（k は差分のキー）。13 件目から畳む */
function logList(rows, empty) {
  if (!rows.length) return '<ol class="log empty"><li>' + (empty || "まだ記録がありません") + "</li></ol>";
  var shown = rows.length > 12 ? rows.slice(0, 5).concat([{ k: "gap", gap: rows.length - 10 }]).concat(rows.slice(-5)) : rows;
  return '<ol class="log">' + shown.map(function (r) {
    if (r.gap) return '<li class="gap" data-k="gap">… ' + r.gap + " 件 …</li>";
    return '<li data-k="' + r.k + '" class="' + (r.cls || "") + '"><span class="lg-n">' + r.n + '</span><span class="lg-g">' + r.g
      + '</span><span class="lg-r">' + r.r + "</span></li>";
  }).join("") + "</ol>";
}

/* ═════ 第 1 章　本物のゲーム（1-1 返事の数え方・1-2 返事で候補を仕分ける）══════════════════════════════════
   ★ 2026-09-27 夜に本人の依頼（「ルール説明が正直分かりにくい」「理屈もやや分かりにくく」「たくさんある候補が徐々に削られていってる、
     と言う感覚しか得られない」「答えは固定されてる…変更できるように」）で、1 枚を 2 枚に分けた。設計は審査役の仕様
     （SCR/p15/judge/spec.md。3 案の採点で「判定が先」が勝ち、「教室の流れが先」「理屈が先」を接ぎ木）。
     1-1 は判定の台（答えを見せて、EAT は縦の実線・BITE は斜めの破線・なし）→［答えを隠す］で返事の数だけが残る。
     1-2 は例の手を 1 本道で聞き、候補が返事ごとのまとまりに分かれて 1 つだけ残る段の図と、「もしも答えが○○なら」の札。
   ★ 遊びは 2 つ。フジテレビの番組『Numer0n（ヌメロン）』の 3 けたの数（EAT・BITE。台帳 G-2・G-3）と、任天堂『世界のアソビ大全51』の
     「ヒット&ブロー」（色。V-1）。色の数・穴の数は公式の文字で取れていないので「このページでは 6 色から違う色を 4 つ」と書く（V-U-1）。
   ★ 答えは HB_ANSWERS・CB_ANSWERS を［別の答えで］で順に回すか、［隣の人が決める］で伏せ字の欄から入れる。乱数は使わない
     （投影と手元と検査がそろう）。答えは 1-1 と 1-2 で共有する。答えを隠しているあいだは、答えの字を属性にも書かない（qa の c1rule が見る）。
   ★ ヌメロンの URL は本文にも補足にも載せない（本人「無理につけなくても良い」。台帳にだけ残す）。
   ★ 数は model.js の hbAll・hbScore・hbRemain・hbSplit・hbJudge・hbDemo・cbAll・cbRemain・cbDemo・numSplit から引く。章の中で数を書き写さない。
   ★ 補足（厚）「いちばん削れる聞き方」は 1-2 に置く。固定の答えを前提にせず、「012 の返事が 0 EAT・0 BITE だったとき」で書く。 */

defaults({

  c1set: false,       /* 隣の人が答えを入れている途中か */
  c1setin: "",        /* 答えを入れる欄の字（data-field。打っているあいだは描き直さない） */

/* ── 判定の台（1-1 の主役。1-2 のもしもの札でも小さく使う）─────────────────────────

/* ── 1-2 返事で候補を仕分ける ────────────────────────────────────── */
/* 例の手を順に聞いた道筋（いまの答えで）。手ごとに {g, before, rows, key, after, won} */
function c12Path() {
  var C = c1Cfg(), ans = c1Ans(), before = C.all(), out = [];
  for (var k = 0; k < C.suggest.length; k++) {
    var g = C.suggest[k], rows = hbSplit(g, before), s = hbScore(g, ans), key = s.hit + ":" + s.blow;
    var keep = rows.filter(function (r) { return r.hit + ":" + r.blow === key; })[0];
    out.push({ g: g, before: before, rows: rows, key: key, after: keep.list, won: g === ans });

}
function c12Key(r) { return r.hit + ":" + r.blow; }
/* 帯と、帯を返事で切って切った位置のまま下へずらした行。o = {total, head, chain, rows:[{k, l, n, cls, tag, pressed}], pick} */
function c12Rows(o) {
  var acc = 0;
  var rows = o.rows.map(function (r) {
    var left = acc / o.total * 100, w = r.n / o.total * 100; acc += r.n;
    var inner = '<span class="c12-row-lbl">' + r.l + '</span><span class="c12-lane"><i class="c12-bar" style="left:' + left.toFixed(2) + "%;width:" + w.toFixed(2) + '%"></i></span>'
      + '<span class="c12-n-lbl">' + r.n + " 通り</span>" + '<span class="c12-tag-lbl">' + (r.tag || "") + "</span>";
    return o.pick ? '<button class="c12-row ' + (r.cls || "") + '" data-c12row="' + r.k + '" aria-pressed="' + (r.pressed ? "true" : "false") + '">' + inner + "</button>"
      : '<div class="c12-row ' + (r.cls || "") + '">' + inner + "</div>";
  }).join("");
  /* 帯にも切れ目を入れる（行の棒が帯のどの切れ端かを見せる。学生役の指摘 2026-09-27 夜「1 本が返事で切れて 1 切れだけ残る」が見えない） */
  var segs = "", a2 = 0;
  o.rows.forEach(function (r) {
    segs += '<i class="c12-seg ' + (r.cls || "") + '" style="left:' + (a2 / o.total * 100).toFixed(2) + "%;width:" + (r.n / o.total * 100).toFixed(2) + '%"></i>'; a2 += r.n;
  });
  return '<div class="c12-fig" data-n="' + o.total + '"><div class="c12-head"><span class="c12-band-lbl">' + o.head + "</span>"
    + (o.chain ? '<span class="c12-chain-lbl">' + o.chain + "</span>" : "") + '</div><div class="c12-band' + (segs ? " cut" : "") + '">' + segs + "</div>" + rows + "</div>";
}
/* いまの段の見え方（行・既定のもしも・文）をまとめて作る */
function c12View() {
  var C = c1Cfg(), path = c12Path(), all = C.all(), max = path.length * 2, step = Math.max(0, Math.min(state.c12step, max));
  var v = { C: C, path: path, step: step, all: all, max: max };
  if (!step) return v;
  var i = Math.ceil(step / 2) - 1, P = path[i], replied = step % 2 === 0, big = Math.max.apply(null, P.rows.map(function (r) { return r.n; }));

  if (!replied) def = P.rows.filter(function (r) { return r.n === big; })[0];
  else {
    var dropped = P.rows.filter(function (r) { return c12Key(r) !== P.key; });
    var bd = dropped.length ? Math.max.apply(null, dropped.map(function (r) { return r.n; })) : 0;
    def = dropped.length ? dropped.filter(function (r) { return r.n === bd; })[0] : P.rows.filter(function (r) { return c12Key(r) === P.key; })[0];

}
/* もしもの札 */
function c12If(v) {

    + CHAPTERS[2].no + "「" + tt(CHAPTERS[2].t) + "」で比べます。") + "</p></div>";
  if (!v.step) return '<div class="c12-if"><h3>1 つ取り出して確かめる</h3><p>聞いたあとでまとまりの行を押すと、その中の' + C.w.thing + "を 1 つ取り出して、返事が本当にそうなるかを確かめられます。</p></div>";

  else if (kept) txt = C.q(P.g) + " への返事は " + s + " で、実際の返事と同じです。" + C.q(c) + " は答えの候補に残ります。";
  else txt = C.q(P.g) + " への返事は " + s + " のはずです。実際の返事は " + actual + " でした。食い違うので、" + C.q(c) + " は答えではありません。"
    + (one ? "この 1 通りは消えます。" : "このまとまりの " + r.n + " 通りは、どれも同じ理由で消えます。");
  return '<div class="c12-if" data-cand="' + c + '"><div class="c12-if-h"><h3>' + c1Jp("もしも答えが " + C.q(c) + " なら") + "</h3>"   /* data-cand は qa の c12split が読む（候補の数。答えではない） */

/* 盤の文 */
function c12Say(v) {
  var C = v.C;
  if (state.c12num) { var ms = numSplit(LO, HI, midOf(LO, HI)); return LO + "〜" + HI + " の数当てで " + midOf(LO, HI) + " を聞くと、候補は返事ごとに 3 つのまとまりに分かれます。「もっと上」なら " + ms[2].n + " 通り、「もっと下」なら " + ms[0].n + " 通りが残ります。"; }
  if (!v.step) return "上のボタンで聞くと、この " + v.all.length + " 通りが返事ごとのまとまりに分かれます。";
  var P = v.P, t;
  if (!v.replied) {
    t = P.rows.length === 1
      ? C.q(P.g) + " を聞いても、" + P.before.length + " 通りはどれも " + C.reply(P.rows[0]) + " と返るので、まとまりは 1 つのままです。聞いても 1 通りも減りません。"
      : C.q(P.g) + " を聞くと、" + P.before.length + " 通りは返事ごとに " + c1Tsu(P.rows.length) + "まとまりに分かれます。いちばん大きいまとまりは "
        + C.reply(P.rows.filter(function (r) { return r.n === v.big; })[0]) + " の " + v.big + " 通りです。";
    return c1Tx(t);
  }
  var keep = P.rows.filter(function (r) { return c12Key(r) === P.key; })[0];
  if (P.won) return c1Tx("返事は " + C.reply(keep) + " でした。当たりです。");
  t = keep.n === P.before.length ? "返事は " + C.reply(keep) + " でした。まとまりが 1 つしかないので、" + keep.n + " 通りのまま 1 通りも減りません。"
    : "返事は " + C.reply(keep) + " でした。このまとまりの " + keep.n + " 通りが残り、ほかの " + (P.before.length - keep.n) + " 通りは消えます。";
  if (v.i > 0 && keep.n === v.big && P.rows.length > 1) t += "残ったのは、いちばん大きいまとまりです。この手でいちばん減らない返事でした。";
  if (v.step === v.max) t += v.path.length + " 手で " + v.all.length + " 通りが " + keep.n + " 通りになりました。"
    + (keep.n > 1 ? "残った " + keep.n + " 通りも同じように聞いて仕分け、1 通りになるまで続けます。" : "残った 1 通りが答えです。次に聞けば当たります。");

}
function renderS12() {

      : "012 のように先頭が 0 の数も入れると、3 けたの候補は 10×9×8＝" + hbAll().length + " 通りです。答えは前のページと同じ数のまま、<span class=\"c1-nw\">" + HB_SUGGEST.join("・") + "</span> の 3 つを例として順に聞きます。"

/* ── 補足（厚）いちばん削れる聞き方（1-2）────────────────────────────────── */
function c1Worst(g, cands) { return Math.max.apply(null, hbSplit(g, cands).map(function (r) { return r.n; })); }

/* 横の棒（字は HTML）。rows = [{l, n, hot}]。長さは max に対する割合 */
function c1Bars(rows, max, unit) {

      + (r.n / max * 100).toFixed(1) + '%"></i></span><b>' + r.n + " " + (unit || "通り") + "</b></div>";
  }).join("") + "</div>";
}

/* マスターマインド（6 色・4 か所・同じ色あり）の答えを全部並べる。色は 1〜6 の数字で書く */
function c1MmCodes() {
  var out = [""];
  for (var i = 0; i < C1_MM.holes; i++) {
    var next = [];
    out.forEach(function (p) { for (var c = 1; c <= C1_MM.colors; c++) next.push(p + c); });
    out = next;
  }
  return out;
}
/* 返事: 色も位置も合うピンの数と、色だけ合うピンの数 */
function c1MmScore(g, s) {
  var both = 0, cg = {}, cs = {}, match = 0;
  for (var i = 0; i < g.length; i++) {
    if (g[i] === s[i]) both++;
    cg[g[i]] = (cg[g[i]] || 0) + 1;
    cs[s[i]] = (cs[s[i]] || 0) + 1;
  }
  for (var k in cg) match += Math.min(cg[k], cs[k] || 0);
  return both + ":" + (match - both);

/* 1 手目 g で、答えの全部が返事ごとに何通りずつに分かれるか（多い順） */
function c1MmSplit(g) {
  var m = {}, out = [];
  c1MmCodes().forEach(function (s) { var k = c1MmScore(g, s); m[k] = (m[k] || 0) + 1; });
  for (var k in m) out.push(m[k]);
  return out.sort(function (a, b) { return b - a; });
}
/* 柱の図（字は置かない）。いちばん高い柱に印の色。高さと柱の幅は 3 つの手の中の最大にそろえる（押し替えても目盛りが動かない） */
function c1MmChart(split, top, slots) {

  });
  return spArt(W, H, s, "返事ごとに残る答えの数を、多い順に並べた柱。いちばん高い柱は " + split[0] + " 通り", "c1-mm-art");
}
function c1MmLab() {

  var top = Math.max.apply(null, splits.map(function (x) { return x[0]; })), slots = Math.max.apply(null, splits.map(function (x) { return x.length; }));
  var k = Math.min(Math.max(0, state.c1mm), C1_MM.picks.length - 1), g = C1_MM.picks[k], sp = c1MmSplit(g);

    + '<div class="c1-mm-picks" role="group" aria-label="1 手目に置く色の並び">' + C1_MM.picks.map(function (p, i) {
      return '<button class="btn c1-mm-b" data-c1mm="' + i + '" aria-pressed="' + (i === k) + '">' + p + "</button>";
    }).join("") + '<span class="c1-mm-lbl">1 手目（数字 1〜' + C1_MM.colors + " が色）</span></div>"

function c1Thumb() {

function c1Best() {
