<!DOCTYPE html><html lang="ja"><head><meta name="robots" content="noindex,nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アルゴリズムとデータ構造 第1回｜聞き方で、回数が変わる</title><meta name="description" content="1 から 100 までの整数を当てる。端から順に聞く方法と、真ん中から半分に絞る方法を1 手ずつ比べ、手順として書けているかを確かめる。"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23152540'/%3E%3Cpath d='M6 10h10M6 16h6M6 22h12' stroke='%23a99bd6' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='12' r='4' fill='none' stroke='white' stroke-width='2.4'/%3E%3Cpath d='M26 15l3.5 4' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E"><style>/* ============================================================================
   アルゴリズムとデータ構造 第1回 — 器（第2版・2026-09-21）

   基準は 論理回路_単体版.html。寸法・余白・折返しの考え方は引き継ぎ、
   字づかい・階層・奥行きを強くする。**装飾は足さない。** 効かせるのは
   大きさの差、太さの差、余白、そして 1 色の使いどころだけにする。

   ★ 投影して読める大きさを犠牲にしない。本文 16px を下限にする。
   ★ 外部の字体を読み込まない（単体で動く）。字体は端末のものを使う。
   ============================================================================ */

:root{
  --bg:#eef1f8;
  --bg-2:#f6f8fc;
  --ink:#141d2e;
  --ink-2:#3a4a66;
  --ink-3:#5a6b85;
  --ink-4:#8395ad;
  --line:#dbe2ed;
  --line-2:#e8edf5;
  --paper:#fff;
  --paper-2:#f7f9fd;

  --deep:#141f37;
  --deep-2:#1d2c4c;

  --main:#6f5cab;
  --main-deep:#4c3f78;
  --main-lit:#9683d6;
  --main-soft:#ece8f8;

  --hit:#0f7a61;
  --hit-soft:#e1f1ec;
  --ask:#b07a1f;
  --ask-soft:#fbf2df;
  --drop:#9fabbb;
  --cool:#5a6b85;
  /* 止まる・ちがう。★ 新しい色ではありません。ch2 / ch5 / .qopt.ng に直書きしてあった
     赤（#8c4359 / #8a3f56 / #a55068 と地の #f7eaee / #f8ebee）に名前を付けただけです。
     直書きのままだと、同じ意味の赤が場所ごとに少しずつ違う値になります。 */
  --stop:#8c4359;
  --stop-line:#a55068;
  --stop-soft:#f8ebee;

  /* ★ 文字の大きさの下限は 3 段。数字を直に書かず、ここから引く。
     --fs-body  地の文・押すもの・表の中身・図の説明   16px（html.big で 19.5px）
     --fs-label ラベル・出典・表の見出し・単位・凡例   14px（html.big で 17.1px）
     図の中（SVG の font-size）は 15px を下限にする（ch*.js。rem が効かないので実数）。
     ★ 在庫は 2026-09-21 に実測。いちばん小さいのは .brand .course の 11.2px だった。
       ラベル側を 16px にすると上の帯と章ナビと表が割れるので、14px で止める。 */
  --fs-body:1rem;
  --fs-label:.875rem;
  /* 誌面（参考書の画像）は、この幅を下回ったら .diagram-scroll の中で横に送る。
     2026-09-21 に assets/*.png を開いて、和文の行の高さを実測した。原寸（画像の幅 1100px）で
     いちばん小さいのは binary-steps の 16px。def-algo は 21px、linear-steps は 18px。
     いちばん小さいものに合わせ、825px（＝1100 × 0.75）まで。ここで中の字が 12px になる。
     これが「図の中 12px」の下限に当たる。qa_drive.py の FIG_EM_PX と対。 */
  --fig-min:825px;

  --shadow-1:0 1px 2px rgba(20,29,46,.05);
  --shadow-2:0 2px 4px rgba(20,29,46,.05), 0 12px 28px -20px rgba(20,29,46,.35);
  --r:14px;
}

*{box-sizing:border-box}
html{font-size:16px;scrollbar-gutter:stable;-webkit-text-size-adjust:100%}
html.big{font-size:19.5px}
body{margin:0;color:var(--ink);line-height:1.78;
  font-family:'Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',sans-serif;
  font-feature-settings:"palt" 1;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 520px at 50% -180px, #fdfdff 0%, rgba(253,253,255,0) 70%),
    linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 340px);
  background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--paper);border-radius:10px;
  transition:background .18s,border-color .18s,color .18s,box-shadow .18s,transform .12s}
button:disabled,input:disabled{cursor:default}
/* ★ opacity で薄くしない。紫の地に白字が乗ったまま薄くなり、字が読めなくなります
   （2026-09-21 に第2章「聞く」・第3章「進む」「最後まで」・第5章「進む」で実測）。
   使えないものは、地と字を置き換えて「読めるまま、止まっている」形にします。 */
.btn:disabled,.btn.primary:disabled,.btn.ghost:disabled{
  background:var(--paper-2);color:var(--ink-3);border-color:var(--line);
  box-shadow:none;transform:none}
.keypad input:disabled{background:var(--paper-2);color:var(--ink-4)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--main);outline-offset:2px}
a{color:var(--main-deep)}
svg{display:block}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(2.1rem,3.4vw,3rem);font-weight:800;line-height:1.24;letter-spacing:.01em}
h2{font-size:clamp(1.45rem,2.1vw,1.95rem);font-weight:800;line-height:1.44;letter-spacing:.012em}
h3{font-size:1.06rem;font-weight:800;letter-spacing:.01em}
p+p{margin-top:.72em}
b,strong{font-weight:800}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── 上の帯 ──────────────────────────────────────────────────────── */
.wrap{max-width:1320px;margin:auto;padding:0 40px}
.topbar{min-height:72px;padding:9px 0;display:flex;align-items:center;background:rgba(255,255,255,.86);
  backdrop-filter:saturate(140%) blur(10px);-webkit-backdrop-filter:saturate(140%) blur(10px);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:13px;font-weight:800;letter-spacing:.015em}
.brand-icon{width:38px;height:38px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--deep-2),var(--deep));
  box-shadow:0 2px 8px -2px rgba(20,31,55,.5)}
.brand-icon svg{width:20px;height:20px}
.brand .course{font-size:var(--fs-label);font-weight:700;color:var(--ink-4);letter-spacing:.12em}
.header-actions{display:flex;gap:10px}
.plain{background:var(--paper);color:var(--ink-3);border:1px solid var(--line);
  border-radius:10px;padding:9px 15px;font-size:var(--fs-body);font-weight:700;white-space:nowrap}
.plain:hover{border-color:var(--main);color:var(--main-deep)}
.plain[aria-pressed=true]{background:var(--deep);color:#fff;border-color:var(--deep)}

/* ── 表紙 ────────────────────────────────────────────────────────── */
.hero{position:relative;overflow:hidden;border-radius:22px;margin:30px 0 26px;
  background:linear-gradient(135deg,var(--deep) 0%,#23325a 58%,#3b3468 100%);
  color:#fff;padding:52px 46px 46px;box-shadow:0 20px 50px -34px rgba(20,31,55,.9)}
.hero::after{content:"01";position:absolute;right:20px;bottom:-112px;
  font-size:23rem;font-weight:800;line-height:1;letter-spacing:-.05em;
  color:rgba(255,255,255,.055);pointer-events:none;font-variant-numeric:tabular-nums;z-index:0}
/* ★ 符丁は .section-no と同じ形（短い棒＋大文字）に揃えます。
   もとは本文の下に 56×4px の棒を 1 本置いていましたが、緑（#7fd8c0）が系の外の色で、
   しかも右半分が空いたまま浮いていました。棒は見出しの頭へ移します。 */
.hero .kicker{display:inline-flex;align-items:center;gap:11px;
  color:#b9c6e4;font-size:var(--fs-label);font-weight:800;letter-spacing:.16em;margin-bottom:14px}
.hero .kicker::before{content:"";width:26px;height:3px;border-radius:2px;
  background:var(--main-lit);flex:0 0 auto}
.hero h1{color:#fff}
.hero .lead{margin-top:16px;max-width:37em;color:#c6d3ec;font-size:1.06rem}
.herogrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:40px;align-items:end;
  position:relative;z-index:1}
.herocard{background:rgba(9,15,30,.46);border:1px solid rgba(255,255,255,.14);
  border-left:3px solid var(--main-lit);
  border-radius:4px 14px 14px 4px;padding:20px 22px;backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px)}
.herocard strong{display:block;font-size:var(--fs-label);letter-spacing:.12em;color:#a9bbdf;margin-bottom:9px}
.herocard p{font-size:var(--fs-body);color:#e2e9f7;line-height:1.75}

/* ── 章ナビ ──────────────────────────────────────────────────────── */
.chapters{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-bottom:34px;
  border-bottom:1px solid var(--line)}
.chapter{background:transparent;border:none;border-bottom:3px solid transparent;
  color:var(--ink-3);display:flex;align-items:baseline;gap:9px;text-align:left;
  padding:15px 10px 13px;border-radius:0;font-size:var(--fs-body);font-weight:700;
  transition:color .18s,border-color .18s,background .18s}
/* ★ 見ていない章の番号は #dbe2ed で、白地の上にほとんど残っていませんでした。
   番号は「何章目か」を示す唯一の手がかりなので、読める灰まで上げます。 */
.chapter .num{font-size:var(--fs-label);font-weight:800;letter-spacing:.06em;
  font-variant-numeric:tabular-nums;color:var(--ink-4);opacity:.72}
.chapter:hover{color:var(--ink-2);background:var(--line-2)}
.chapter:hover .num{opacity:1}
/* ★ いま見ている章は、下線・地・字の濃さの 3 つで出します。
   下線 2px と字の色だけだと、投影したときに「いまどこか」が読み取れません。 */
.chapter[aria-current=page]{color:var(--ink);font-weight:800;border-bottom-color:var(--main);
  background:linear-gradient(180deg,rgba(111,92,171,.09),rgba(111,92,171,0))}
.chapter[aria-current=page] .num{color:var(--main);opacity:1}

/* ── 節の見出し ──────────────────────────────────────────────────── */
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
  margin-bottom:26px;flex-wrap:wrap}
.section-head p{color:var(--ink-2);margin-top:10px;font-size:1rem;max-width:54em}
.section-no{display:inline-flex;align-items:center;gap:11px;font-size:var(--fs-label);font-weight:800;
  color:var(--main-deep);letter-spacing:.16em;margin-bottom:10px}
.section-no::before{content:"";width:26px;height:3px;border-radius:2px;background:var(--main)}

/* ── 切り替え ────────────────────────────────────────────────────── */
.segmented{display:inline-flex;gap:3px;padding:4px;background:var(--line-2);border-radius:11px;
  box-shadow:inset 0 1px 2px rgba(20,29,46,.04)}
.segmented button{background:transparent;border:none;color:var(--ink-3);padding:9px 18px;
  border-radius:8px;font-size:var(--fs-body);font-weight:700;white-space:nowrap}
.segmented button:hover{color:var(--ink)}
.segmented button[aria-pressed=true]{background:var(--paper);color:var(--ink);
  box-shadow:var(--shadow-1)}

/* ── パネル ──────────────────────────────────────────────────────── */
/* ★ align-items:start だと、短いほうの列の下に死んだ余白が残ります
   （2026-09-21 の実測で 第1章 180px・第3章 130px・第4章 107px）。
   stretch にして、盤（.lab）に余った高さを吸わせます。 */
.grid-main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:stretch}
/* ★ 左右に並べる形（第5章）。class で持ちます。inline の style で書くと、
   折返しの決めより強く、狭い画面でも 2 列のまま残ります
   （2026-09-21 に 500px で実測。1 列あたり 215px で、手順の 1 行が 3 行に割れていました）。 */
.grid-main.two{grid-template-columns:1fr 1fr}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--shadow-2);display:flex;flex-direction:column}
/* ★ 余った高さは、いちばん下の段（たいていは白い .panel-body）が吸います。
   盤（.lab）に吸わせると、点の地だけが伸びて図が真ん中に浮きます。
   白い札の底に置けば、両方の列の底がそろったうえで、余りは見えません。 */
.panel>:last-child{flex:1 1 auto}
/* ★ 奥行きは 2 段だけ。手前＝押して動くもの、奥＝その裏づけ（脇の説明・誌面・補足）。
   全部が同じ影だと、主役とわき役が同じ高さに見えます。 */
.side .panel{box-shadow:var(--shadow-1)}
.panel-top{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 14px;
  padding:16px 22px;border-bottom:1px solid var(--line-2)}
.panel-top h3{display:flex;align-items:center;gap:10px;font-size:1.02rem}
.panel-top h3::before{content:"";width:4px;height:17px;border-radius:2px;background:var(--main);
  flex:0 0 auto}
.panel-top .meta{font-size:var(--fs-label);color:var(--ink-3);font-weight:700;letter-spacing:.02em;
  margin-left:auto;white-space:nowrap}
.panel-body{padding:20px 22px}
.panel-body p{color:var(--ink-2)}
.panel-body p b{color:var(--ink)}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;font-size:var(--fs-label);font-weight:800;
  background:var(--main-soft);color:var(--main-deep)}
/* ★ align-content:start。これを書かないと、脇の 2 枚が高さを分け合って間延びします。 */
.side{display:grid;gap:20px;align-content:start}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}

/* ── 作業盤 ──────────────────────────────────────────────────────── */
/* ★ 余った高さは、盤と札の底で半分ずつ持ちます（どちらも flex-grow:1）。
   盤に全部吸わせると点の地だけが 300px 伸びて図が浮き、札の底に全部置くと
   白が 150px 余ります。半分ずつなら、どちらも気になりません。 */
.lab{padding:26px 22px;border-bottom:1px solid var(--line-2);
  flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;
  background:
    radial-gradient(circle,#dbe3ef 1px,transparent 1px) 0 0/15px 15px,
    linear-gradient(180deg,#fbfcfe,#f4f7fc)}
/* ★ 盤の中身は、図と同じ 640px に揃えて真ん中に置きます。
   図は viewBox 640 を倍率 1 で描くので、盤いっぱいに広げても図は広がりません。
   凡例だけが盤の両端（1440px では左右に 116px ずつ離れた位置）へ飛び、
   どの線の話なのかが読めませんでした。 */
.lab>.diagram-scroll,.lab-legend,.lab-row{max-width:640px;width:100%;margin-left:auto;margin-right:auto}
.lab-row{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.lab-legend{display:flex;gap:30px;justify-content:center;margin-top:16px;
  font-size:var(--fs-label);font-weight:700;color:var(--ink-3)}
.lab-legend span{display:inline-flex;align-items:center;gap:8px}
.lab-legend i{width:26px;height:0;border-top:3px solid var(--main);border-radius:2px}
.lab-legend i.drop{border-top-style:dashed;border-top-color:var(--drop)}

/* ── 結果の帯 ────────────────────────────────────────────────────── */
.result{display:flex;align-items:center;gap:20px;padding:19px 22px;
  background:linear-gradient(180deg,#fbfcfe,#f5f8fc)}
/* ★ 当たった帯は地も変えます。数の札だけを緑にすると、当たった瞬間の落差が出ません。 */
.result.hit{background:linear-gradient(180deg,var(--hit-soft),#f4faf8)}
.result .num{width:64px;height:64px;border-radius:15px;display:grid;place-items:center;
  font-size:1.72rem;font-weight:800;color:#fff;flex:0 0 auto;font-variant-numeric:tabular-nums;
  background:linear-gradient(145deg,var(--deep-2),var(--deep));
  box-shadow:0 6px 16px -8px rgba(20,31,55,.8)}
.result.hit .num{background:linear-gradient(145deg,#15947a,var(--hit));
  box-shadow:0 6px 16px -8px rgba(15,122,97,.8)}
/* ★ その章の答えが出る 1 行。地の文と同じ大きさだと、結論が結論に見えません。 */
.result .rh{font-weight:800;font-size:1.14rem;line-height:1.55}
.result .rt{color:var(--ink-2);font-size:var(--fs-body);margin-top:3px}

/* ── 押す・入れる ────────────────────────────────────────────────── */
.keypad{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* ★ 入力欄とボタンの高さをそろえます。padding だけで合わせると 1〜2px ずれて、
   並んだときに底がそろいません。 */
.keypad input,.keypad .btn,.stepbar .btn{min-height:46px}
.keypad input{width:128px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;
  background:#fff;font-size:1.06rem;font-weight:800;text-align:center;
  font-variant-numeric:tabular-nums;box-shadow:inset 0 1px 2px rgba(20,29,46,.05)}
.keypad input:focus{border-color:var(--main);outline:none;
  box-shadow:0 0 0 3px rgba(111,92,171,.16)}
.btn{display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 19px;
  font-size:var(--fs-body);font-weight:700;box-shadow:var(--shadow-1)}
.btn:hover{border-color:var(--main);color:var(--main-deep);transform:translateY(-1px)}
/* ★ 押した手応え。もとは :hover で 1px 浮いたものが :active で元に戻るだけで、
   「押した」という戻りがありませんでした。沈めて、影を消します。 */
.btn:active{transform:translateY(1px);box-shadow:inset 0 2px 5px -3px rgba(20,29,46,.5)}
.btn.primary{background:linear-gradient(160deg,var(--main-lit),var(--main));
  border-color:var(--main-deep);color:#fff;box-shadow:0 4px 12px -6px rgba(76,63,120,.9)}
.btn.primary:hover{background:linear-gradient(160deg,var(--main),var(--main-deep));color:#fff}
.btn.primary:active{box-shadow:inset 0 3px 7px -3px rgba(28,20,58,.75)}
.btn.ghost{background:transparent;box-shadow:none}

/* ── 表 ──────────────────────────────────────────────────────────── */
table{border-collapse:collapse;width:100%;font-size:var(--fs-body)}
th,td{padding:12px;text-align:center;border-bottom:1px solid var(--line-2)}
th{font-size:var(--fs-label);font-weight:800;color:var(--ink-3);background:var(--paper-2);
  letter-spacing:.04em;border-bottom:2px solid var(--line)}
/* ★ 9 行 4 列の表に縦の手がかりがなく、「聞く前の範囲」と「聞いたあとの範囲」が
   同じ見た目で並んでいました。1 行おきに地を敷いて、目を横へ渡します。 */
tbody tr:nth-child(even){background:#f9fbfe}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--line-2)}
tr.on td{background:var(--hit-soft);color:var(--hit);font-weight:800}
td.num,th.num{font-variant-numeric:tabular-nums}
td.stop{color:var(--stop);font-weight:800}

/* ── 記録 ────────────────────────────────────────────────────────── */
.log{display:flex;flex-wrap:wrap;gap:9px;list-style:none;margin:0;padding:0}
.log li{display:inline-flex;align-items:baseline;gap:8px;padding:7px 14px;border-radius:999px;
  background:var(--paper-2);border:1px solid var(--line);font-size:var(--fs-body);color:var(--ink-3);
  font-weight:600}
.log li b{font-size:1.12rem;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.log li.hit{background:var(--hit-soft);border-color:var(--hit);color:var(--hit)}
.log li.hit b{color:var(--hit)}
.log li.none{background:none;border-style:dashed;color:var(--ink-4)}

/* ── 理解の確認 ──────────────────────────────────────────────────── */
.quiz{border:1px solid var(--line);border-top:3px solid var(--main);border-radius:var(--r);
  background:var(--paper);padding:24px;margin-top:26px;box-shadow:var(--shadow-2)}
.quiz .qtag{display:inline-block;padding:4px 11px;border-radius:7px;font-size:var(--fs-label);font-weight:800;
  background:var(--main-soft);color:var(--main-deep);margin-right:12px;letter-spacing:.06em}
.quiz h3{display:inline}

   正解 100 なら 50,75,87,93,96,98,99 と進み、以後 99 を聞き続ける。 */
function planEnd(keep, target, cap) {
  var out = [], lo = LO, hi = HI;
  cap = cap || 12;
  for (var i = 0; i < cap; i++) {
    var g = Math.floor((lo + hi) / 2);
    var row = { g: g, lo: lo, hi: hi, hit: g === target };
    out.push(row);
    if (row.hit) break;
    if (target > g) lo = keep ? g : g + 1;
    else hi = keep ? g : g - 1;
    row.after = [lo, hi];
    if (out.length >= 3 && out[out.length - 1].g === out[out.length - 2].g
        && out[out.length - 2].g === out[out.length - 3].g) break;
  }
  return out;
}

/* 機械が次に聞く数と、残りの件数から「あと最大で何回」 */
function midOf(lo, hi) { return Math.floor((lo + hi) / 2); }
function restMax(lo, hi) { return askMax(hi - lo + 1); }

function fmt(n) { return n.toLocaleString("en-US"); }

function tryStart() {
  state.tryTarget = LO + Math.floor(Math.random() * (HI - LO + 1));
  state.tryLo = LO; state.tryHi = HI;
  state.tryLog = []; state.tryDone = false; state.tryStarted = true;
  state.tryInput = "";
}

function tryAsk(n) {
  if (!state.tryStarted || state.tryDone) return;
  if (!(n >= LO && n <= HI)) { state.tryMsg = "1 から 100 までの整数を入れてください。"; return; }
  state.tryMsg = "";
  var t = state.tryTarget;
  var row = { g: n, hit: n === t, reply: n < t ? "up" : "down" };
  state.tryLog.push(row);
  if (row.hit) { state.tryDone = true; state.tryLo = n; state.tryHi = n; }
  else if (n < t) { state.tryLo = Math.max(state.tryLo, n + 1); }
  else { state.tryHi = Math.min(state.tryHi, n - 1); }
  state.tryInput = "";
}

function renderTry() {

  return head("03", "1 手ずつ、並べて比べる",

/* ═════ ch4.js ═════ */
/* ═════ 04 機械に当てさせる ═════════════════════════════════════════════
   学生が心の中で数を決め、機械が真ん中を聞く。学生は 3 つのボタンで答える。
   ★ 四角の「数」は減りません。減るのは色のついた数です。 */

var RANGES = [
  { k: "100", hi: 100, t: "1〜100", what: "教室の人数くらい" },
  { k: "1e6", hi: 1000000, t: "1〜100 万", what: "大きな市の人口くらい" },
  { k: "1.2e8", hi: 122680000, t: "1〜1.2 億", what: "日本の人口" },
  { k: "8.3e9", hi: 8300000000, t: "1〜83 億", what: "世界の人口" }
];

function mRangeOf() {
  var k = state.mRange;
  for (var i = 0; i < RANGES.length; i++) if (RANGES[i].k === k) return RANGES[i];
  return RANGES[0];
}

function mReset() {
  var r = mRangeOf();
  state.mLo = 1; state.mHi = r.hi; state.mLog = []; state.mDone = false; state.mStuck = "";
}

function mReply(kind) {
  if (state.mDone) return;
  var g = midOf(state.mLo, state.mHi);
  if (kind === "hit") {
    state.mLog.push({ g: g, hit: true });
    state.mDone = true;
    return;
  }
  state.mLog.push({ g: g, hit: false, reply: kind });
  if (kind === "up") state.mLo = g + 1; else state.mHi = g - 1;
  if (state.mLo > state.mHi) {
    /* 返事が食い違ったとき。★ 黙って壊れない。 */
    state.mStuck = "返事が食い違っています。決めた数を思い出して、もう一度始めてください。";
    state.mDone = true;
  }
}

function renderMachine() {
  var r = mRangeOf();
  var done = state.mDone;
  var n = state.mLog.length;
  var total = askMax(r.hi);
  var left = done ? 0 : restMax(state.mLo, state.mHi);
  var g = done ? (n ? state.mLog[n - 1].g : 0) : midOf(state.mLo, state.mHi);
  var small = r.hi <= 100;

  var lab = '<div class="lab">'
    + (small
        ? '<div class="diagram-scroll">'
          + bandSvg(state.mLo, Math.min(state.mHi, 100), done ? 0 : g, done && !state.mStuck,
              { label: "残っているのは " + fmt(state.mHi - state.mLo + 1) + " 件" })
          + "</div>"
        : '<p style="text-align:center;font-size:1.02rem;color:var(--ink-2);margin:6px 0 18px">'
          /* ★「A から B の C 件」と続けると入れ子に読めます。下の端が 1 のときは
             B と C が同じ数になるので、なおさら意味が取れません。2 つの事実に分けます。 */
          + "残っている範囲は <b>" + fmt(state.mLo) + "</b> 〜 <b>" + fmt(state.mHi)
          + "</b>。件数は <b>" + fmt(state.mHi - state.mLo + 1) + "</b> 件です。</p>")
    + '<div class="diagram-scroll">' + boxesSvg(total, left) + "</div></div>";

  var result;
  if (state.mStuck) {
    result = '<div class="result"><div class="num">!</div><div>'
      + '<div class="rh">' + state.mStuck + "</div>"
      + '<div class="rt">機械は返事のとおりに範囲を狭めます。'
      + "食い違うと、残る数がなくなります。</div></div></div>";
  } else if (done) {
    result = '<div class="result hit"><div class="num">' + n + "</div><div>"
      + '<div class="rh">' + n + " 回で当たりました。</div>"
      + '<div class="rt">この範囲なら、いちばん運が悪いときでも最大 ' + total
      + " 回で終わります。</div></div></div>";
  } else {
    result = '<div class="result"><div class="num">' + (n + 1) + "</div><div>"
      + '<div class="rh">その数は <b>' + fmt(g) + "</b> ですか。</div>"
      + '<div class="rt">あと最大で ' + left + " 回聞けば当たります。</div></div></div>";
  }

  var ctrl = '<div class="panel-body"><div class="keypad">'
    + '<button class="btn" data-reply="up"' + (done ? " disabled" : "") + ">もっと大きい</button>"
    + '<button class="btn" data-reply="down"' + (done ? " disabled" : "") + ">もっと小さい</button>"
    + '<button class="btn primary" data-reply="hit"' + (done ? " disabled" : "") + ">当たり</button>"
    + '<button class="btn ghost" data-reply="reset">最初から</button></div>'
    + '<div style="margin-top:16px">'
    + logList(state.mLog, "機械が聞いた数がここに並びます") + "</div></div>";

  var side = '<div class="side">'
    + panel("mrange", "範囲を変える", r.what,
        '<div class="panel-body"><div class="keypad">'
        + RANGES.map(function (x) {
            return '<button class="btn' + (x.k === state.mRange ? " primary" : " ghost")
              + '" data-mrange="' + x.k + '" style="padding:9px 14px">'
              + x.t + "</button>";
          }).join("")
        + "</div><p style=\"margin-top:12px;color:var(--ink-2)\">"
        + "この範囲なら、いちばん運が悪いときでも最大 <b>" + total + "</b> 回です。"
        + "広げてから、何回で当たるかを予想してください。</p></div>")
    + panel("mhow", "機械がしていること", null,
        '<div class="panel-body"><p>残っている範囲の下の端と上の端を、数で持っています。'
        + "その 2 つの平均の整数部分を聞き、返事で片方の端を動かします。</p>"
        + "<p>聞いた数は範囲から外します。だから範囲は必ず狭くなり、いつか終わります。</p></div>")
    + "</div>";

  return head("04", "機械に当てさせる",
      "1 から " + r.t.split("〜")[1] + " までの整数を 1 つ、心の中で決めてください。"
      + "機械が聞くので、3 つのボタンで答えます。")
    + '<div class="grid-main">'
    + panel("mlab", "機械の番", "最大 " + total + " 回", lab + result + ctrl)
    + side + "</div>"
    + rail("範囲を広げても、回数はあまり増えません")
    + statRow(RANGES.map(function (x) {
        return { v: askMax(x.hi), u: "回", l: x.t, n: x.what, hi: x.k === state.mRange };
      }))
    + '<div class="figrow">'
    + fig("dictionary", { cap: "24 万語の辞書でも 18 回。件数が増えても、回数はゆっくりしか増えません。" })
    + fig("binary-steps", { cap: "必要のなくなった数は灰色に落ちます。残りが 1 つになるまでくり返します。" })
    + "</div>"
    + quiz("q4",
        { title: "四角の見方", body: "色のついた四角が 3 つ残っています。これは何を表していますか。" },
        ["あと 3 回は必ず聞く", "あと最大で 3 回聞けば当たる", "残っている候補が 3 件"],
        1,
        "あと最大で何回聞けば当たるかです。運がよければ、その前に当たります。"
        + "四角の数そのものは変わりません。変わるのは色のついた数です。");
}


/* ═════ ch5.js ═════ */
/* ═════ 05 手順の条件 ═══════════════════════════════════════════════════
   人に言えば通じる指示が、書かれたとおりにしか動かない相手には通じない。
   そのあと、聞いた数を「外す」と「残す」を同じ場面で並べ、終わり方を見る。
   ★ 数はすべて実測。正解 100 で 50,75,87,93,96,98,99 と進み、以後 99 を聞き続ける。
     7 手目の範囲は 98〜100。99〜100 になるのは 8 手目から。 */

var VAGUE = [
  { a: "50 を聞きました。「もっと大きい」と返ってきました。",
    b: "1 番で両端を決め、2 番で平均の整数部分の 50 を聞きます。", ng: false },
  { a: "「また真ん中あたり」。<b>どの範囲の真ん中かが書かれていません。</b>ここで止まります。",
    b: "「もっと大きい」なので、4 番で下の端を 51 にします。2 番に戻り、次に聞くのは 75 です。",
    ng: true },
  { a: "51 から 100 の真ん中と読めば 75、まだ 1 から 100 の真ん中と読めば 50 です。"
     + "<b>読む人で変わります。</b>",

];

var STEPS6 = [

  "「もっと大きい」なら、下の端をその数の 1 つ上にする。",
  "「もっと小さい」なら、上の端をその数の 1 つ下にする。",
  "2 番に戻る。"
];

function endTable(keep) {
  var rows = planEnd(keep, 100, 10);
  var h = "<table><thead><tr><th>手目</th><th>聞く前の範囲</th><th>聞く数</th>"
    + "<th>聞いたあとの範囲</th></tr></thead><tbody>";
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    var stuck = keep && i >= 7;
    h += "<tr" + (r.hit ? ' class="on"' : "") + "><td>" + (i + 1) + "</td>"
      + '<td class="num">' + r.lo + "〜" + r.hi + "</td>"
      + '<td class="num"><b>' + r.g + "</b></td>"
      + '<td class="num' + (stuck ? " stop" : "") + '">'
      + (r.hit ? "当たり" : (r.after ? r.after[0] + "〜" + r.after[1] : "")) + "</td></tr>";
  }
  return h + "</tbody></table>";
}

function renderRules() {
  var i = Math.min(state.vStep, VAGUE.length - 1);
  var s = VAGUE[i];

    + '<p style="margin-top:14px;padding:12px 14px;border-radius:9px;background:var(--main-soft);'

  var ctrl = '<div class="stepbar">'

    + (i + 1) + " 手目" + (last ? "（ここまで）" : "") + "</span></div>";

  var endPanel = panel("endlab", "聞いた数を、範囲に残すとどうなるか", "正解 100 で追う",
      '<div class="panel-body" style="border-bottom:1px solid var(--line-2)">'

          : "下の端を「その数の 1 つ上」にします。聞いた数はもう範囲にありません。"

  return head("05", "書かれたとおりにしか動かない相手に、どう渡すか",
      "左は、人に言えば通じる指示です。進むを押してください。")
    + '<div class="grid-main two">'
    + panel("vleft", "あいまいな指示", "止まる", left)
    + panel("vright", "両端を数で持つ手順", "決まる", right)
    + "</div>" + ctrl
    + '<div style="margin-top:22px">' + endPanel + "</div>"
    + rail("あいまいな書き方と、終わりの書き忘れ")
    + '<div class="figrow">'
    + fig("def-algo", { cap: "レシピのあいまいさは、作る人が補って読みます。"
        + "手順に残っていると、次の一手が読む人によって変わり、そこで止まります。" })
    + fig("loop-forever", { cap: "本の例は、数を 1 つずつ減らす手順に、"
        + "どこで終わるかを書き忘れた場合です。0 の次は −1、−2 と続き、止まりません。"
        + "こちらは範囲が縮まなくなって、同じ数を聞き続けます。"
        + "<b>止まらなくなり方は違いますが、どちらも終わりが決まっていません。</b>" })
    + "</div>"
    + quiz("q5",
        { title: "止まらなくなる瞬間",

        + "同じ数を聞き続けることになり、終わりません。"
        + "外す書き方なら下の端が 100 になり、範囲は 100 だけになって次で終わります。")
    + "<details><summary>手順として書くときの約束</summary><div class=\"dbody\">"
    + "<ol style=\"margin:0;padding-left:1.2em\">"
    + "<li>いま調べている範囲を、下の端と上の端の 2 つの数で書く。</li>"
    + "<li>次に聞く数を、その 2 つから計算で決める。</li>"
    + "<li>返事ごとに、どちらの端をいくつにするかを書く。</li>"
    + "<li>どうなったら終わりかを書く。</li></ol>"
    + '<div style="margin:14px auto 0;max-width:980px">'
    + fig("base-case", { cap: "4 番目にあたるところです。"
        + "これを書かないと、手順は終わりに行き着きません。" })
    + "</div>"
    + "<p style=\"margin-top:12px\">読む人が迷ったら、そこが足りないところです。"
    + "書き足して、もう一度渡してください。</p></div></details>";
}

/* ============================================================================
   共通の部品 — 器・見出し・パネル・切り替え・表・記録・理解の確認
   ★ 文字列を返すだけにします。DOM は core.js の差分更新が当てます。

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

var CHAPTERS = [
  { no: "01", t: "アルゴリズムとは" },
  { no: "02", t: "数当てをやってみる" },
  { no: "03", t: "2 つの聞き方" },
  { no: "04", t: "機械に当てさせる" },
  { no: "05", t: "手順の条件" }
];

function chapters() {
  return '<nav class="chapters" aria-label="章">' + CHAPTERS.map(function (c, i) {
    return '<button class="chapter" data-page="' + i + '"'
      + (state.page === i ? ' aria-current="page"' : "")
      + '><span class="num">' + c.no + '</span><span>' + c.t + '</span></button>';
  }).join("") + "</nav>";
}

function topbar() {
  return '<div class="topbar"><div class="wrap" style="display:flex;align-items:center;'
    + 'justify-content:space-between;width:100%">'
    + '<div class="brand"><span class="brand-icon">'
    + '<svg viewBox="0 0 24 24" fill="none" stroke="#a99bd6" stroke-width="2.2" stroke-linecap="round">'
    + '<path d="M4 7h7M4 12h4M4 17h9"/><circle cx="17" cy="9" r="3"/><path d="M19.2 11.2 L21.5 14"/></svg>'
    + '</span><span>小船講義<span class="course" style="margin-left:10px">'
    + 'ALGORITHMS &amp; DATA STRUCTURES</span></span></div>'
    + '<div class="header-actions"><button id="bigtoggle" class="plain" aria-pressed="'
    + (state.big ? "true" : "false") + '">文字を拡大</button></div>'
    + "</div></div>";
}

function intro() {
  return '<section class="hero"><div class="herogrid">'
    + "<div>"
    + '<div class="kicker">LESSON 01 ／ アルゴリズムとデータ構造</div>'
    + "<h1>聞き方で、回数が変わる</h1>"
    + '<p class="lead">1 から 100 までの整数を当てるのに、最大 100 回かかる聞き方と、'
    + "最大 7 回で済む聞き方があります。同じ問題でも、手順を決めておくと手間の桁が変わります。</p>"
    + "</div>"
    + '<div class="herocard"><strong>この回でやること</strong>'
    + "<p>自分で当てて回数を数え、2 つの聞き方を 1 手ずつ比べ、機械に当てさせ、"
    + "最後に、手順として書けているかを確かめます。</p></div>"
    + "</div></section>";
}

function head(no, title, desc, right) {
  return '<div class="section-head"><div>'
    + '<div class="section-no">LESSON ' + no + "</div>"
    + "<h2>" + title + "</h2>"
    + (desc ? "<p>" + desc + "</p>" : "")
    + "</div>" + (right || "") + "</div>";
}

function seg(name, items, current) {
  return '<div class="segmented" data-seg="' + name + '" role="group">'
    + items.map(function (it) {
      return '<button data-' + name + '="' + it.v + '" aria-pressed="'
        + (current === it.v ? "true" : "false") + '">' + it.t + "</button>";
    }).join("") + "</div>";
}

function panel(id, title, meta, body, foot) {
  return '<section class="panel" id="' + id + '">'
    + '<div class="panel-top"><h3>' + title + "</h3>"
    + (meta ? '<span class="meta">' + meta + "</span>" : "")
    + "</div>" + body + (foot || "") + "</section>";
}

/* 理解の確認。★ 押した肢に印を残し、1 回目で答えを出さない章もある。 */
function quiz(id, q, opts, ans, why, tag) {
  var picked = state.answers[id];
  var done = state.checked[id];
  return '<div class="quiz" data-quiz="' + id + '">'
    + '<span class="qtag">' + (tag || "理解の確認") + "</span>"
    + '<h3>' + q.title + "</h3>"
    + '<p class="qq">' + q.body + "</p>"
    + '<div class="qopts">' + opts.map(function (o, i) {
      var cls = "qopt";
      if (done) cls += (i === ans ? " ok" : " ng");
      if (picked === i) cls += " chosen";
      return '<button class="' + cls + '" data-qopt="' + id + ":" + i + '">' + o + "</button>";
    }).join("") + "</div>"
    + (done
      ? '<p class="qhead ' + (picked === ans ? "ok" : "ng") + '">'
        + (picked === ans ? "正解です。" : "ちがいます。") + "</p>"
      : "")
    + '<p class="qwhy' + (done ? " on" : "") + '">' + why + "</p>"
    + "</div>";
}

/* 記録の並び。多いときは後ろの 12 回ぶんだけ出す。 */
function logList(rows, empty) {
  if (!rows.length) return '<ul class="log"><li class="none">' + empty + "</li></ul>";
  var from = Math.max(0, rows.length - 12);
  var h = from > 0 ? '<li class="none">… はじめの ' + from + " 回ぶん</li>" : "";
  for (var i = from; i < rows.length; i++) {
    var r = rows[i];
    /* ★ 桁区切りを付けます。第4章では 4150000000 のような 10 桁が出ますが、
       同じ画面の結果の帯は fmt() で 4,150,000,001 と出していました。
       同じ量を出す場所で書き方が違うと、同じ数だと読み取れません。 */
    h += "<li" + (r.hit ? ' class="hit"' : "") + "><b>" + fmt(r.g) + "</b>"
      + (r.hit ? "当たり" : (r.reply === "up" ? "もっと大きい" : "もっと小さい")) + "</li>";
  }
  return '<ul class="log">' + h + "</ul>";
}

function pager() {
  var prev = state.page > 0 ? CHAPTERS[state.page - 1] : null;
  var next = state.page < CHAPTERS.length - 1 ? CHAPTERS[state.page + 1] : null;
  return '<div class="pager">'
    + (prev ? '<button class="btn ghost" data-page="' + (state.page - 1) + '">← ' + prev.no + " " + prev.t + "</button>" : "<span></span>")
    + (next ? '<button class="btn" data-page="' + (state.page + 1) + '">' + next.no + " " + next.t + " →</button>" : "<span></span>")
    + "</div>";
}

function foot() {
  return '<div class="foot"><span>アルゴリズムとデータ構造 ／ 第 1 回</span>'
    + "<span>平成国際大学 情報デザイン学部</span></div>";
}

var PAGES = [renderWhat, renderTry, renderTwoWays, renderMachine, renderRules];

function shell() {
  return topbar()
    + '<div class="wrap">' + intro() + chapters()
    + '<main id="main">' + PAGES[state.page]() + pager() + "</main>"
    + foot() + "</div>";
}

/* ── 範囲の帯 ────────────────────────────────────────────────────────────
   1〜100 を横一本で見せる。残っている範囲だけを主軸色で塗り、捨てた側は
   灰色の破線で「見なくてよくなった」と分かる形にする。
   ★ 「捨てた」と「まだ見ていない」を同じ描き方にしない（線種とラベルを併用）。 */
function bandSvg(lo, hi, guess, hit, opt) {
  opt = opt || {};
  var W = 640, H = 128, x0 = 34, x1 = W - 34, span = x1 - x0;
  function px(v) { return x0 + (v - 1) / 99 * span; }
  var a = px(lo), b = px(hi + 1 > 100 ? 100 : hi) + (hi === lo ? 4 : 0);
  var fill = hit ? "var(--hit)" : "var(--main)";
  var soft = hit ? "var(--hit-soft)" : "var(--main-soft)";
  var h = '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" height="' + H + '" '
    + 'role="img" aria-label="1 から 100 のうち、残っている範囲は ' + lo + " から " + hi
    + ' です">';
  /* 捨てた側 */
  if (a > x0) h += '<rect x="' + x0 + '" y="46" width="' + (a - x0) + '" height="40" rx="9" '
    + 'fill="none" stroke="var(--drop)" stroke-width="1.8" stroke-dasharray="7 6"/>';
  if (b < x1) h += '<rect x="' + b + '" y="46" width="' + (x1 - b) + '" height="40" rx="9" '
    + 'fill="none" stroke="var(--drop)" stroke-width="1.8" stroke-dasharray="7 6"/>';
  /* 残っている範囲 */
  /* 残りが 1 件のときの幅。5px だと、帯が 40px 高いぶん緑の棒に見えます。 */
  h += '<rect x="' + a + '" y="46" width="' + Math.max(8, b - a) + '" height="40" rx="9" '
    + 'fill="' + soft + '" stroke="' + fill + '" stroke-width="2.6"/>';
  /* いま聞いた数 */
  if (guess) {
    var g = px(guess);
    h += '<line x1="' + g + '" y1="34" x2="' + g + '" y2="94" stroke="var(--ask)" stroke-width="2.8"/>'
      + '<rect x="' + (g - 28) + '" y="2" width="56" height="30" rx="9" fill="var(--ask)"/>'
      + '<text x="' + g + '" y="24" text-anchor="middle" font-size="18" font-weight="800" '
      + 'fill="#fff">' + guess + "</text>";
  }
  h += '<text text-anchor="start" x="' + x0 + '" y="116" font-size="17" fill="var(--ink-4)">1</text>'
    + '<text text-anchor="end" x="' + x1 + '" y="116" font-size="17" fill="var(--ink-4)">100</text>';
  if (opt.label) h += '<text text-anchor="middle" x="' + (W / 2) + '" y="116" font-size="17" '
    + 'font-weight="700" fill="var(--ink-3)">' + opt.label + "</text>";
  return h + "</svg>";
}

/* 四角を並べて「あと最大で何回」を見せる */
/* ★ 四角の数は範囲で変わります（1〜100 で 7 個、83 億で 33 個）。
   数のぶん横に伸ばすと viewBox 640 を越え、**両端が黙って切られます**
   （2026-09-21 に 33 個で 237px ずつ切れていました）。
   だから数が増えたら四角のほうを縮め、並び全体を器の中に収めます。
   四角の数は減らしません。減らすと「あと何回聞けるか」が画面から消えます。 */
function boxesSvg(total, left) {
  var W = 640, IN = 600, n = total;
  var s = 30, gap = 9;
  var k = Math.min(1, IN / (n * s + (n - 1) * gap));
  s *= k; gap *= k;
  var w = n * s + (n - 1) * gap, x0 = (W - w) / 2, y0 = 14 + (30 - s) / 2;
  var h = '<svg viewBox="0 0 ' + W + ' 86" width="100%" height="86" role="img" '
    + 'aria-label="あと最大 ' + left + " 回。四角 " + n + ' 個のうち、色のついたものが残りの回数です">';
  for (var i = 0; i < n; i++) {
    var on = i < left;
    h += '<rect x="' + (x0 + i * (s + gap)).toFixed(1) + '" y="' + y0.toFixed(1)
      + '" width="' + s.toFixed(1) + '" height="' + s.toFixed(1)
      + '" rx="' + (8 * k).toFixed(1) + '" fill="' + (on ? "var(--main-soft)" : "#fff") + '" stroke="'
      + (on ? "var(--main)" : "var(--line)") + '" stroke-width="' + (on ? 2.4 : 1.4) + '"/>';
  }
  h += '<text text-anchor="middle" x="' + (W / 2) + '" y="78" font-size="17" font-weight="700" '
    + 'fill="var(--ink-3)">色のついた四角の数が、あと最大で何回聞けば当たるか</text>';
  return h + "</svg>";
}

/* ── 誌面からの図 ────────────────────────────────────────────────────────
   ★ すべて版元の誌面です。**出典を必ず添えます。**
   ★ 公開版（FIGS_PUBLIC）では中身が空になるので、出典だけの箱にします。 */
function fig(name, opt) {
  opt = opt || {};
  var f = FIGS[name];
  if (!f) return "";
  var cap = opt.cap || f.cap;
  if (!f.src) {
    return '<figure class="bookfig empty" data-fig="' + name + '"><div class="bfbox">'
      + '<p class="bfnote">この図は教室で配る版にだけ入っています。</p></div>'
      + "<figcaption>" + cap + '<cite>' + f.cite + "</cite></figcaption></figure>";
  }
  /* ★ 画像は .diagram-scroll で包みます。狭い画面で縮めると誌面の中の字が
       読めなくなるので、幅の下限（--fig-min）を持たせ、足りないぶんは横に送ります。
       横に動いてよいのは .diagram-scroll の中だけ、という決めをここでも使います。 */
  return '<figure class="bookfig' + (opt.wide ? " wide" : "") + '">'
    + '<div class="diagram-scroll">'
    /* data-fig は検査のための名札です。画像は data URI で入るので、
       ファイル名では元の誌面と突き合わせられません（qa_drive.py の type が使います）。 */
    + '<img data-fig="' + name + '" src="' + f.src + '" width="' + f.w + '" height="' + f.h
    + '" alt="' + esc(cap) + '" loading="lazy">'
    + "</div><figcaption>" + cap + "<cite>" + f.cite + "</cite></figcaption></figure>";
}

/* 数字を大きく見せる札。ポンチ絵の代わりに、数そのものを主役にする */
function statRow(items) {
  return '<div class="stats">' + items.map(function (s) {
    return '<div class="stat' + (s.hi ? " hi" : "") + '">'
      + '<div class="sv">' + s.v + (s.u ? '<span class="su">' + s.u + "</span>" : "") + "</div>"
      + '<div class="sl">' + s.l + "</div>"
      + (s.n ? '<div class="sn">' + s.n + "</div>" : "") + "</div>";
  }).join("") + "</div>";
}

/* 見出しの上に置く、細い帯（章の色分け） */
function rail(text) {
  return '<div class="rail"><span></span>' + text + "</div>";
}


/* ═════ boot.js ═════ */
/* ═════ 押したとき・打ったとき ═════════════════════════════════════════
   ★ 分岐はここ 1 か所にまとめます。章ごとに listener を足すと、
     どこで何が起きるかが追えなくなります。 */

function handleClick(d, e) {
  /* 01 場面の切り替え */
  if (d.scene !== undefined) { act(function () { state.scene = d.scene; }, e); return true; }

  /* 理解の確認。押した肢に印が残る */
  if (d.qopt !== undefined) {
    var a = d.qopt.split(":");
    act(function () { state.answers[a[0]] = +a[1]; state.checked[a[0]] = true; }, e);
    return true;
  }

  /* 02 自分で当てる */
  if (d.run === "try") {
    act(function () { tryAsk(parseInt(state.tryInput, 10)); }, e);
    return true;
  }
  if (d.run === "tryreset") { act(tryStart, e); return true; }

  /* 03 2 つの聞き方 */
  if (d.way !== undefined) {
    act(function () { state.way = d.way; state.step = -1; }, e);
    return true;
  }
  if (d.step !== undefined) {
    act(function () {
      var rows = plan(state.way, TARGET);
      if (d.step === "next") state.step = Math.min(rows.length - 1, state.step + 1);
      else if (d.step === "end") state.step = rows.length - 1;
      else state.step = -1;
    }, e);
    return true;
  }
  if (d.scale !== undefined) {
    act(function () {
      state.opened = state.opened || {};
      state.opened[d.scale] = true;
    }, e);
    return true;
  }

  /* 04 機械に当てさせる */
  if (d.mrange !== undefined) {
    act(function () { state.mRange = d.mrange; mReset(); }, e);
    return true;
  }
  if (d.reply !== undefined) {
    act(function () { d.reply === "reset" ? mReset() : mReply(d.reply); }, e);
    return true;
  }

  /* 05 手順の条件 */
  if (d.run === "vnext") {
    act(function () { state.vStep = Math.min(VAGUE.length - 1, state.vStep + 1); }, e);
    return true;
  }
  if (d.run === "vreset") { act(function () { state.vStep = 0; }, e); return true; }
  if (d.emode !== undefined) { act(function () { state.endMode = d.emode; }, e); return true; }

  return false;
}

function handleInput(d, t) {
  if (d.field === undefined) return;
  /* ★ render を呼ばない。打っている途中で差分を当てると、変換中の文字が消えます。
     値は state に控えるだけにし、押したときに使います。 */
  state[d.field] = t.value;
}

bind();
render();
