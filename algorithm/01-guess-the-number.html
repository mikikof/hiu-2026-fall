   ■ /designslide の共通の部品です。「@@shelf sp-os {」から「}」までは棚 sp-os（OS の画面の模型・年代の機械・タスクバー・アプリの窓）で、
     deck.json の shelves に sp-os があるときだけ新しい教材へ写ります。棚の外の部品は、棚の関数を typeof で確かめてから呼びます
   ═════════════════════════════════════════════════════════════════════════════════════════════ */

/* ── 下ごしらえ ───────────────────────────────────────────── */
function spAttr(a) {
  var h = "";
  for (var k in a) if (a[k] !== undefined && a[k] !== null) h += " " + k + '="' + a[k] + '"';
  return h;
}
/* 図形 1 つ。cls は塗りと線のクラス（下の一覧）。st は模型の年代の色（style） */
function spE(tag, a, cls, st) {
  return "<" + tag + spAttr(a) + (cls ? ' class="' + cls + '"' : "") + (st ? ' style="' + st + '"' : "") + "/>";
}
function spR(x, y, w, h, r, cls, st) { return spE("rect", { x: x, y: y, width: w, height: h, rx: r || 0 }, cls, st); }
function spC(cx, cy, r, cls, st) { return spE("circle", { cx: cx, cy: cy, r: r }, cls, st); }
function spP(d, cls, st) { return spE("path", { d: d }, cls, st); }
/* 年代の色（style の fill だけ・stroke だけ） */
function spF(c) { return "fill:" + c; }
function spS(c, w) { return "fill:none;stroke:" + c + ";stroke-width:" + (w || 1); }

/* 塗りと線のクラス（色は sp.css の .sp の変数）
   sp-ln 墨の線 2px（縮めても太さは同じ）／sp-ln1 細い線 1.5px／sp-dash 破線／sp-hl 注目の赤い輪
   sp-p 紙（白）／sp-a 主の淡い色／sp-b 差し色の淡い色／sp-c 印の色（1 枚に 1 か所）／sp-sh 影・奥／sp-k 墨のベタ／sp-box 箱の地
   sp-arl 矢印の線／sp-arf 矢じり／sp-hotl・sp-hotf 番号札の引き出し線と点（注目の赤） */

/* SVG の外枠。字を置かない。w×h が 1 倍の大きさで、それより大きくは引き伸ばさない */
function spArt(w, h, inner, label, cls) {
  return '<svg class="sp-art' + (cls ? " " + cls : "") + '" viewBox="0 0 ' + w + " " + h + '" width="' + w + '" height="' + h + '"'
    + (label ? ' role="img" aria-label="' + label + '"' : ' aria-hidden="true"') + ">" + inner + "</svg>";
}

/* 画面の大きさ（320×200）の図を 1 枚の SVG にする。crop = [x, y, 幅, 高さ] でその部分だけ（見出しの小さな絵にもそのまま使う） */
function spFrame(inner, crop, label) {
  var c = crop || [0, 0, 320, 200];
  return '<svg class="sp-art sp-shot" viewBox="' + c.join(" ") + '" width="' + c[2] + '" height="' + c[3] + '"'
    + (label ? ' role="img" aria-label="' + label + '"' : ' aria-hidden="true"') + ">" + inner + "</svg>";
}


/* 展示台（博物館の台座）。上の板・胴・銘板 */
function spPlinth(x, y, w, plates) {
  var h = spR(x - 8, y, w + 16, 11, 3, "sp-p sp-ln") + spR(x, y + 11, w, 26, 0, "sp-a sp-ln");
  (plates || []).forEach(function (cx) { h += spR(cx - 30, y + 18, 60, 11, 3, "sp-p sp-ln1"); });
  return h;
}
/* 書類のアイコン（角を折った紙）。lines = 中の行の数 */
function spDoc(x, y, w, h, lines, cls) {
  var f = Math.min(w, h) * .3;
  var s = spP("M" + x + " " + y + "h" + (w - f) + "l" + f + " " + f + "v" + (h - f) + "h-" + w + "z", (cls || "sp-p") + " sp-ln")
    + spP("M" + (x + w - f) + " " + y + "v" + f + "h" + f, "sp-ln sp-none");
  for (var i = 0; i < (lines || 0); i++) s += spR(x + w * .16, y + h * .38 + i * h * .14, w * (i % 2 ? .5 : .66), h * .06, 1, "sp-sh");
  return s;
}
/* フォルダー */
function spFolder(x, y, w, h, cls) {
  return spP("M" + x + " " + (y + h * .16) + "h" + w * .36 + "l" + w * .08 + " " + h * .12 + "h" + w * .56 + "v" + h * .72 + "h-" + w + "z", (cls || "sp-c") + " sp-ln");
}
/* 荷札（左がとがった札と、ひもを通す穴）。
   ★ 尖りの幅と穴の半径は札の高さに比例させる（h の 0.5 と 0.18。大きい札は 16 と 5 で頭打ち＝前と同じ形）。
     前は 16 と 5 の決め打ちで、見出しの小さな絵（20×14）では胴が 4 しか残らず、穴がはみ出して「三角と点」に見えた（2026-09-26） */
function spTag(x, y, w, h) {
  var p = Math.min(16, h * .5), r = Math.min(5, h * .18);
  return spP("M" + (x + p) + " " + y + "H" + (x + w) + "V" + (y + h) + "H" + (x + p) + "L" + x + " " + (y + h / 2) + "z", "sp-p sp-ln")
    + spC(x + p + 1, y + h / 2, r, "sp-b sp-ln1");
}
/* 鉛筆（(x, y) が芯の先。ang 度だけ回す） */
function spPencil(x, y, len, ang) {
  return '<g transform="translate(' + x + " " + y + ") rotate(" + ang + ')">'
    + spP("M0 0L16 -7V7z", "sp-p sp-ln") + spP("M0 0L6 -2.6V2.6z", "sp-k")
    + spR(16, -7, len - 30, 14, 0, "sp-c sp-ln") + spR(len - 14, -7, 14, 14, 3, "sp-b sp-ln")
    + spP("M16 0H" + (len - 14), "sp-ln1") + "</g>";
}
/* マウスの矢印（挿絵の色） */
function spPointer(x, y, s) {
  s = s || 1;
  return '<g transform="translate(' + x + " " + y + ") scale(" + s + ')">' + spP("M0 0l0 17 4.6-4.2 3.2 7 3-1.4-3.2-6.8 6.2-.2z", "sp-p sp-ln") + "</g>";
}


/* ── 部品（HTML）───────────────────────────────────────────── */
function spKari() { return '<i class="sp-kari" title="確かめている途中です">仮</i>'; }
/* 文の中の [[仮]] を札に替える（中身の側で書きやすくするため） */
function spK(s) { return String(s === undefined || s === null ? "" : s).replace(/\[\[仮\]\]/g, spKari()); }

/* 扉（大きな見出しの図）。o = {art, kicker, h, lead, chips, years} */
function spHero(o) {
  var yrs = o.years && o.years.length
    ? '<div class="sp-hero-yrs" style="grid-template-columns:repeat(' + o.years.length + ',minmax(0,1fr))">'
      + o.years.map(function (y) { return '<span class="sp-hero-yr">' + y + "</span>"; }).join("") + "</div>"
    : "";
  return '<header class="sp-hero"><div class="sp-hero-art"><div class="sp-hero-fig">' + o.art + yrs + "</div></div>"
    + '<div class="sp-hero-txt">' + (o.kicker ? '<p class="sp-kicker">' + o.kicker + "</p>" : "")
    + '<h3 class="sp-h"><span>' + o.h + "</span></h3>"
    + (o.lead ? '<p class="sp-lead">' + spK(o.lead) + "</p>" : "") + (o.chips ? '<div class="sp-hero-chips">' + o.chips + "</div>" : "") + "</div></header>";
}
/* 見開き（左右 2 ページ。760px 以下で縦に積む）。
   3 つ目（fill）は広い画面で片方のページの下へ回る。短いほうのページの下を埋めて、左右の高さをそろえるための口 */
function spSpread(left, right, fill) {
  var f = fill && typeof fill === "object" ? fill : { fill: fill, side: "right" };
  var under = f.fill ? '<section class="sp-page sp-page-fill">' + f.fill + "</section>" : "";
  return '<div class="sp-spread' + (under ? " sp-spread-f" + (f.side === "left" ? " sp-fill-l" : "") : "") + '">'
    + '<section class="sp-page sp-page-l">' + left + '</section><section class="sp-page sp-page-r">' + right + "</section>" + under + "</div>";
}
/* ページの見出し（番号の札つき） */
function spPh(no, t) { return '<h4 class="sp-ph"><i class="sp-no">' + no + "</i><span>" + t + "</span></h4>"; }
function spTxt(s) { return '<p class="sp-txt">' + spK(s) + "</p>"; }
/* 図の札（全幅の figure）。番号はページの見出し（spPh）と同じ札で、節の番号の続きを渡す。
   ★ 2026-09-26 まで「図 5」と出していた。節の 1〜4 の次に「図 5」があると、図 1〜4 を探してしまう（見た目と学生の検査役）。
     番号の数え方は変えず、札を節と同じにして「図」の字を外した */
function spPlate(no, cap, inner) {
  return '<figure class="sp-plate"><figcaption><i class="sp-no">' + no + "</i><span>" + spK(cap) + "</span></figcaption>" + inner + "</figure>";
}
/* 鋭い一言の札（案 C の KEY）。1 本の補足に 1 つまで */
function spKey(html, label) {
  return '<div class="sp-key"><span class="sp-key-lbl">' + (label || "KEY") + "</span><p>" + spK(html) + "</p></div>";
}

/* 年表の路線図。o = {lanes:[{k,name}], stops:[{y, name, ver, p, kari, st:{laneKey: "start|dot|pass|end|join|xfer|aside|none"}}], [aside]}
   ★ aside（2026-09-26）: どちらの系統にも入らない駅の印（点線の菱形。線は引かない）。その欄に線の無い行で使う
     （例: Mac の路線図の Xerox Alto・Apple Lisa は st: {cl: "aside", ux: "pass"}。UNIX の線の上に載って、UNIX 系に見えていた）。
     o.aside に文（HTML）を渡すと、凡例の 3 つ目に菱形の印とその文が並ぶ */
function spRail(o) {
  var keys = o.lanes.map(function (l) { return l.k; });
  var legend = '<div class="sp-legend">' + o.lanes.map(function (l, i) {
    return '<span><i class="sp-sw l' + (i + 1) + '"></i>' + l.name + "</span>";
  }).join("") + (o.aside ? '<span><i class="sp-sw aside"></i>' + spK(o.aside) + "</span>" : "") + "</div>";
  var rows = o.stops.map(function (s) {
    var lanes = keys.map(function (k, i) {
      return '<i class="sp-lane l' + (i + 1) + " " + (s.st[k] || "none") + '"></i>';
    }).join("");
    return '<li class="sp-st"><span class="sp-lanes" aria-hidden="true">' + lanes + "</span>"
      + '<span class="sp-st-y">' + s.y + "</span>"
      + '<span class="sp-st-n"><b>' + s.name + "</b>" + (s.ver ? '<span class="sp-ver">' + spK(s.ver) + "</span>" : "") + (s.kari ? spKari() : "")
      + (s.p ? '<span class="sp-st-p">' + spK(s.p) + "</span>" : "") + "</span></li>";
  }).join("");
  return legend + '<ol class="sp-rail">' + rows + "</ol>";
}

/* 標本の並び（年・名前・字の無い図・一言） */
function spSpecs(list) {
  return '<div class="sp-specs">' + list.map(function (s) {
    return '<div class="sp-spec"><div class="sp-spec-t"><p class="sp-spec-h"><b class="sp-y">' + s.y + "</b>" + s.name + (s.kari ? spKari() : "") + "</p>"
      + (s.p ? '<p class="sp-spec-p">' + spK(s.p) + "</p>" : "") + '</div><div class="sp-spec-fig">' + s.art + "</div></div>";
  }).join("") + "</div>";
}

/* 標本の格子（画面の模型を並べる。案 B の「並べる」）。list = [{scr, y, name, p, crop, kari}]
   札の最小の幅は o.min（rem。既定 11.5）。1440 で 5 列、760 で 3 列、500 で 2 列ほどになる */
function spGrid(list, o) {
  o = o || {};
  return '<div class="sp-grid"' + (o.min ? ' style="--sp-cell:' + o.min + 'rem"' : "") + ">" + list.map(function (s) {
    var fig = s.art !== undefined ? spFrame(s.art, s.crop) : (typeof spShot === "function" ? spShot(s.scr, s.crop) : "");
    return '<figure class="sp-cell"><div class="sp-cell-fig">' + fig + "</div>"
      + '<figcaption><p class="sp-cell-h"><b class="sp-y">' + s.y + '</b><span class="sp-cell-n">' + s.name + "</span>" + (s.kari ? spKari() : "") + "</p>"
      + (s.p ? '<p class="sp-cell-p">' + spK(s.p) + "</p>" : "") + "</figcaption></figure>";
  }).join("") + "</div>";
}


/* 数の並び（版の番号など）。段ごとに 年の札＋番号の札。skip は使わなかった番号（破線の札）
   rows = [{h:"…", nums:["10.0",…], cls:"g1", skip:"…"}] */
function spNums(rows) {
  return '<div class="sp-nums">' + rows.map(function (r) {
    return '<div class="sp-numrow-l ' + (r.cls || "") + '"><p class="sp-numh">' + spK(r.h) + '</p><div class="sp-numrow">'
      + (r.skip ? '<span class="sp-num skip" title="使わなかった番号">' + r.skip + "</span>" : "")
      + r.nums.map(function (n) { return '<span class="sp-num">' + n + "</span>"; }).join("") + "</div></div>";
  }).join("") + "</div>";
}

/* 展開した木（案 C の spTree）。node = [名前, 注記, [子…], 印]。名前が / で終わるものはフォルダー。印が真なら地に印の色 */
function spTree(root) {
  function li(n) {
    var dir = /\/$/.test(n[0]);
    return "<li" + (n[3] ? ' class="hl"' : "") + '><span class="sp-tn' + (dir ? " dir" : "") + '">' + esc(n[0]) + "</span>"
      + (n[1] ? '<span class="sp-ann">' + spK(n[1]) + "</span>" : "")
      + (n[2] && n[2].length ? "<ul>" + n[2].map(li).join("") + "</ul>" : "") + "</li>";
  }
  return '<ul class="sp-tree">' + li(root) + "</ul>";
}

/* 豆知識の札（高さは行ごとにそろう）。外の .sp-tidbox は幅を測る器（列の数に応じて、最後の段に 1 枚だけ残った札を横いっぱいにする。sp.css） */
function spTidbits(list) {
  if (!list || !list.length) return "";
  return '<div class="sp-tidbox"><div class="sp-tids">' + list.map(function (t) {
    return '<aside class="sp-tid"><span class="sp-tid-h">' + (t.h || "豆知識") + "</span><p>" + spK(t.p) + "</p></aside>";
  }).join("") + "</div></div>";
}
/* 資料（出典）の札 */
function spSource(s) { return s ? '<p class="sp-src"><span class="sp-src-h">資料</span><span>' + spK(s) + "</span></p>" : ""; }

/* 名前の札（ファイル名。拡張子は注目の赤） */
function spName(base, ext) {
  return '<span class="sp-fname">' + esc(base) + (ext ? '<b class="sp-ext">' + esc(ext) + "</b>" : '<b class="sp-ext sp-ext-none">（なし）</b>') + "</span>";
}
/* 判定の札（当たり＝緑／止まる＝赤／決まらない＝琥珀） */
function spVerdict(kind, t) { return '<span class="sp-vd ' + kind + '">' + t + "</span>"; }

/* 書き換えの例 1 行。o = {from:[base,ext], to:[base,ext], art, res, vd:[kind,text]} */
function spCase(o) {
  return '<div class="sp-case"><div class="sp-case-fig">' + o.art + '</div><div class="sp-case-main">'
    + '<p class="sp-case-names">' + spName(o.from[0], o.from[1]) + '<span class="sp-arrow" aria-label="を">→</span>' + spName(o.to[0], o.to[1]) + "</p>"
    + '<p class="sp-case-res">' + spVerdict(o.vd[0], o.vd[1]) + "<span>" + spK(o.res) + "</span></p></div></div>";
}

/* バイトの並び（札）。list = ["50", …] か [["50","P"], …]。hot = 先頭から印を付ける数（true なら全部） */
function spBytes(list, hot) {
  var n = hot === true ? list.length : (hot || 0);
  /* 字の段は、1 つでも字を書いたら全部に付ける（書いていないバイトは「·」＝字にならない） */
  var ch = list.some(function (x) { return typeof x !== "string" && x.length > 1; });
  return '<span class="sp-bytes">' + list.map(function (x, i) {
    var b = typeof x === "string" ? [x] : x;
    return '<span class="sp-byte' + (i < n ? " hot" : "") + '"><b>' + b[0] + "</b>" + (ch ? "<i>" + (b[1] || "·") + "</i>" : "") + "</span>";
  }).join("") + "</span>";
}
/* 先頭のバイトの並び。rows = [{ext, name, bytes:[["50","P"],…], hot, note, kari}] */
function spSig(rows) {
  return '<div class="sp-sig">' + rows.map(function (r) {
    var b = r.bytes && r.bytes.length
      ? spBytes(r.bytes.map(function (x) { return [x[0], x[1] || "·"]; }), r.hot ? true : 0)
      : '<span class="sp-nobytes">' + spK(r.note) + "</span>";
    return '<div class="sp-sig-row">' + ficon(r.ext, 26) + '<span class="sp-sig-n">' + r.name + (r.kari ? spKari() : "") + "</span>" + b + "</div>";
  }).join("") + "</div>";
}

/* 札 → 札 → 判定 の流れ（「名前だけ変える」と「作ったアプリで保存し直す」を並べる形）。
   rows = [{h:"見出し", steps:[HTML, …], vd:[kind, text]}]
   ★ 矢印は次の札と一組（.sp-flow-g）にして、折り返しが矢印の手前でしか起きないようにする。
     前は矢印が行の終わりに残り、その先に何も無い行ができた（2026-09-26 の見た目の検証） */
function spFlow(rows) {
  var ar = '<span class="sp-flow-ar" aria-hidden="true">→</span>';
  function g(h, first) { return '<span class="sp-flow-g">' + (first ? "" : ar) + h + "</span>"; }
  return '<div class="sp-flows">' + rows.map(function (r) {
    return '<div class="sp-flow"><p class="sp-flow-h">' + r.h + '</p><div class="sp-flow-r">'
      + r.steps.map(function (s, i) { return g('<span class="sp-flow-st">' + spK(s) + "</span>", i === 0); }).join("")
      + (r.vd ? g(spVerdict(r.vd[0], r.vd[1])) : "") + "</div></div>";
  }).join("") + "</div>";
}

/* 右向きの矢印（矢じりは形で描く。線の太さで育たない） */
function spArrow(w) {
  w = w || 56;
  return '<svg class="sp-art sp-arw" viewBox="0 0 ' + w + ' 24" width="' + w + '" height="24" aria-hidden="true">'
    + spP("M2 12H" + (w - 12), "sp-arl") + spP("M" + (w - 14) + " 4L" + (w - 2) + " 12L" + (w - 14) + " 20z", "sp-arf") + "</svg>";
}


/* 実験台の器（案 B の 5-1）。状態は持たない。章のファイルが state と data 属性で持ち、ここへ渡す。
   o = {label, aria, cur, attr(v) → 属性の文字列, items:[{v, t, sub, icon, attrs}],

   ★ 押すボタンの分岐は章の onClick。確認の画面は ui.js の dialogBox で章が組んで dialog に渡す */
function spLab(o) {

  var picks = '<div class="sp-picks" role="group" aria-label="' + (o.aria || o.label || "") + '">' + (o.items || []).map(function (it) {

      + "<b>" + it.t + "</b>" + (it.sub ? "<small>" + it.sub + "</small>" : "") + "</button>";
  }).join("") + "</div>";
  var file = '<div class="sp-lab-file">' + ficon(F.icon || "", 52)
    + '<div class="sp-lab-parts"><p class="sp-lab-meta">' + (L.name || "名前の札") + "</p>"
    + '<p class="sp-nametag' + (F.changed ? " changed" : "") + '">' + (F.name || "") + "</p>"
    + (F.bytes ? '<p class="sp-lab-meta">' + (L.bytes || "中身（先頭のバイト）") + '</p><div class="sp-inside">' + spBytes(F.bytes, F.hot)
      + (F.size ? '<span class="sp-fsize">' + F.size + "</span>" : "") + "</div>" : "")
    + (F.same ? '<span class="badge ok">' + F.same + "</span>" : "") + "</div></div>";

  var view = '<div class="sp-lab-view">' + (o.view || "") + (o.verdict ? spVerdict(o.verdict[0], o.verdict[1]) : "") + "</div>";
  return '<div class="sp-lab"><p class="sp-lab-t">' + (o.label || "押して比べる") + "</p>" + picks

/* 人物の読み上げ名（aria-label）。名前は model.js から */
function pxName(n) {
  return { hero: "勇者" + HERO, scribe: "書記官" + SCRIBE, king: KING, guard: GUARD, demon: DEMON,
    torch: "灯り", torchOff: "消えた灯り", chest: "宝箱", book: "本", door: "扉", doorOpen: "開いた扉" }[n] || n;
}

/* 格子 → rect の並び（行ごとに同じ色の続きを 1 本に） */
function pxRects(rows, ox, oy) {
  var h = "";
  for (var j = 0; j < rows.length; j++) {
    var r = rows[j], i = 0;
    while (i < r.length) {
      var c = r[i];
      if (c === ".") { i++; continue; }
      var k = i;
      while (k < r.length && r[k] === c) k++;
      h += '<rect class="p' + c + '" x="' + (ox + i) + '" y="' + (oy + j) + '" width="' + (k - i) + '" height="1"/>';
      i = k;
    }
  }
  return h;
}
function pxGrid(name) { return name === "door" ? pxDoorRows(false) : name === "doorOpen" ? pxDoorRows(true) : PX[name]; }
function pxW(name) { var g = pxGrid(name); return g[0].length; }
function pxH(name) { return pxGrid(name).length; }

/* 1 体のドット絵（SVG）。scale は 1 画素の大きさ（px）。o = {flip, cls, label} */
function pxSprite(name, scale, o) {
  o = o || {};
  var g = pxGrid(name), w = g[0].length, hh = g.length, s = scale || 4;
  var body = pxRects(g, 0, 0);
  if (o.flip) body = '<g transform="translate(' + w + ',0) scale(-1,1)">' + body + "</g>";
  return '<svg class="px' + (o.cls ? " " + o.cls : "") + '" viewBox="0 0 ' + w + " " + hh + '" width="' + (w * s) + '" height="' + (hh * s)
    + '" shape-rendering="crispEdges" role="img" aria-label="' + esc(o.label || pxName(name)) + '">' + body + "</svg>";
}

/* 扉（24×30）。アーチの石の枠・縦の板・鉄の帯・金の錠。open なら中が暗く、宝箱が見える */
function pxDoorRows(open) {
  var W = 24, H = 30, rows = [];
  for (var y = 0; y < H; y++) {
    var r = "";
    for (var x = 0; x < W; x++) {
      var cx = 11.5, dx = x - cx, top = 11;              /* 上 11 行がアーチ */
      var inArch = y >= top || (dx * dx + (y - top) * (y - top) * 1.0 <= 11.8 * 11.8);
      var inWood = y >= top ? (x >= 3 && x <= 20 && y >= 2) : (dx * dx + (y - top) * (y - top) <= 8.6 * 8.6);
      var ch = ".";
      if (inArch) ch = "Q";
      if (inArch && !inWood && ((x + y) % 5 === 0)) ch = "q";
      if (inWood) {
        if (open) ch = (y >= H - 6 ? "N" : "k");
        else {
          ch = (x - 3) % 5 === 4 ? "C" : "c";
          if (y === top + 1 || y === H - 6) ch = "B";
          if (Math.abs(x - 11.5) <= 1.5 && y >= 16 && y <= 19) ch = (y === 16 || y === 19 || Math.abs(x - 11.5) > 1) ? "G" : "g";
        }
      }
      if (y === H - 1 && inArch) ch = "Q";
      r += ch;
    }
    rows.push(r);
  }
  if (open) {   /* 開いた扉の奥に宝箱 */
    var c = PX.chest;
    for (var j = 0; j < c.length; j++) {
      var row = rows[H - 2 - c.length + j].split("");
      for (var i = 0; i < c[j].length; i++) if (c[j][i] !== ".") row[4 + i] = c[j][i];
      rows[H - 2 - c.length + j] = row.join("");
    }
  }
  return rows;
}

/* 石の壁（16×8 のれんが）。w×h の範囲を埋める */
function pxBricks(w, h, y0) {
  var s = '<rect class="pQ" x="0" y="' + y0 + '" width="' + w + '" height="' + h + '"/>';
  for (var y = y0, row = 0; y < y0 + h; y += 8, row++) {
    for (var x = (row % 2 ? -8 : 0); x < w; x += 16) {
      var x1 = Math.max(0, x + 1), x2 = Math.min(w, x + 15);
      if (x2 > x1) s += '<rect class="pq" x="' + x1 + '" y="' + (y + 1) + '" width="' + (x2 - x1) + '" height="' + Math.min(6, y0 + h - y - 1) + '"/>';
    }
  }
  return s;
}

/* ゲームの画面の模型。o = {scene:"curse"|"throne"|"vault", w, h, items:[{n, x, y, flip}], torches:[点いているか…], open, label}
   ★ 画面の字は HTML（msgWin）に置き、この SVG には字を置かない。 */
function pxScene(o) {
  var W = o.w || 160, H = o.h || 72, s = "";
  if (o.scene === "curse") {
    s += '<rect class="pP" x="0" y="0" width="' + W + '" height="' + H + '"/>' + '<rect class="pn" x="0" y="' + (H - 20) + '" width="' + W + '" height="20"/>';
    /* 番号で閉じた箱（床一面。第1話の呪い） */
    for (var cy = H - 19, cr = 0; cy < H - 7; cy += 9, cr++) for (var cx = (cr % 2 ? 9 : 1); cx < W - 16; cx += 18) s += pxRects(PX.chest, cx, cy);
  } else if (o.scene === "library") {
    s += '<rect class="pP" x="0" y="0" width="' + W + '" height="' + H + '"/>' + '<rect class="pn" x="0" y="' + (H - 20) + '" width="' + W + '" height="20"/>';
    /* 増えた本（床一面。第2話の予告） */
    for (var yy = H - 18; yy < H - 1; yy += 6) for (var xx = 2; xx < W - 4; xx += 7) s += pxRects(PX.book, xx + (yy % 12 ? 3 : 0), yy);
  } else if (o.scene === "throne") {
    s += pxBricks(W, H - 16, 0) + '<rect class="pC" x="0" y="' + (H - 16) + '" width="' + W + '" height="16"/>'
      + '<rect class="pR" x="' + (W / 2 - 14) + '" y="' + (H - 16) + '" width="28" height="16"/>'
      + '<rect class="pr" x="' + (W / 2 - 12) + '" y="' + (H - 16) + '" width="24" height="16"/>';
    for (var px = 14; px < W; px += W - 28) s += '<rect class="pq" x="' + (px - 3) + '" y="4" width="6" height="' + (H - 20) + '"/>'
      + '<rect class="pk" x="' + (px - 3) + '" y="4" width="1" height="' + (H - 20) + '"/>';
  } else {
    s += pxBricks(W, H - 10, 0) + '<rect class="pQ" x="0" y="' + (H - 10) + '" width="' + W + '" height="10"/>'
      + '<rect class="pq" x="0" y="' + (H - 10) + '" width="' + W + '" height="1"/>';
    var dx = Math.round(W / 2 - 12);
    s += pxRects(pxDoorRows(!!o.open), dx, H - 10 - 30 + 1);
  }
  /* 灯りの列（ミッションの残りの回数）。o.torches = [true, true, false …] */
  if (o.torches) {
    var n = o.torches.length, gap = 12, x0 = Math.round(W / 2 - (n * gap) / 2) + 2;
    o.torches.forEach(function (on, i) { s += pxRects(on ? PX.torch : PX.torchOff, x0 + i * gap, 2); });
  }
  (o.items || []).forEach(function (it) {
    var g = pxGrid(it.n), body = pxRects(g, 0, 0);
    s += '<g transform="translate(' + it.x + "," + it.y + ")" + (it.flip ? " translate(" + g[0].length + ",0) scale(-1,1)" : "") + '">' + body + "</g>";
  });
  return '<svg class="px px-scene" viewBox="0 0 ' + W + " " + H + '" width="100%" preserveAspectRatio="xMidYMid meet" shape-rendering="crispEdges" role="img" aria-label="'
    + esc(o.label || "ゲームの画面") + '">' + s + "</svg>";
}

/* ── 2. メッセージウィンドウ ────────────────────────────────────────────
   o = {who:話し手, text:文（HTML 可）, next:{run, t}, choices:[{attr, v, t, on}], foot:HTML, live:true}
   ★ 話し手の札・文・送るボタンの 3 つ。▼ は止まった印（点滅させない）。字はドット字体（.pxf） */
function msgWin(o) {
  var foot = "";
  if (o.choices) {
    foot = '<div class="mw-ch">' + o.choices.map(function (c) {
      return '<button class="mw-c' + (c.on ? " on" : "") + '" data-' + c.attr + '="' + c.v + '"' + (c.on ? ' aria-pressed="true"' : "") + ">" + c.t + "</button>";
    }).join("") + "</div>";
  } else if (o.next) {
    foot = '<button class="mw-next" data-run="' + o.next.run + '">' + (o.next.t || "次へ") + ' <span aria-hidden="true">▼</span></button>';
  }
  return '<div class="mw pxf"' + (o.live ? ' aria-live="polite"' : "") + ">"
    + (o.who ? '<span class="mw-who">' + o.who + "</span>" : "")
    + '<p class="mw-t">' + o.text + "</p>" + (o.foot || "") + foot + "</div>";
}

/* ゲームの画面と窓をまとめた器。hud は画面の上の札の並び（HTML） */
function rpgFrame(scene, win, hud) {
  return '<div class="rpg">' + (hud ? '<div class="rpg-hud pxf">' + hud + "</div>" : "") + '<div class="rpg-screen">' + scene + "</div>" + win + "</div>";
}

/* 話し手の顔の札（ドット絵＋名前）。本文のどこに置いてもよい */
function pxTalk(name, text, o) {
  o = o || {};
  return '<div class="pxtalk' + (o.cls ? " " + o.cls : "") + '">' + pxSprite(name, o.scale || 3) + '<div class="pxtalk-b"><b class="pxf">'
    + (o.who || pxName(name)) + "</b><span>" + text + "</span></div></div>";
}

/* ── 3. 数当ての図（既存の第1回から。色は役目のクラス）─────────────────── */
/* 範囲の帯。1〜n のうち lo〜hi が残っていて、guess を聞いた。hit なら当たり */
function bandSvg(lo, hi, guess, hit, opt) {
  opt = opt || {};
  var N = opt.n || HI, W = 640, H = 128, x0 = 34, x1 = W - 34, span = x1 - x0;
  function px(v) { return x0 + (v - 1) / (N - 1) * span; }
  var a = px(lo), b = px(hi) + (hi === lo ? 4 : 0);

/* 四角を並べて「あと最大で何回」を見せる。★ 数が増えたら四角を縮めて器に収める（33 個でも両端を切らない） */
function boxesSvg(total, left) {
  var W = 640, IN = 600, n = total, s = 30, gap = 9;
  var k = Math.min(1, IN / (n * s + (n - 1) * gap));
  s *= k; gap *= k;
  var w = n * s + (n - 1) * gap, x0 = (W - w) / 2, y0 = 8 + (30 - s) / 2;
  var h = '<svg class="boxes" viewBox="0 0 ' + W + ' 48" width="100%" role="img" aria-label="あと最大 ' + left + " 回。四角 " + n + ' 個のうち、色のついたものが残りの回数です">';
  for (var i = 0; i < n; i++) {
    h += '<rect class="' + (i < left ? "bx-on" : "bx-off") + '" x="' + (x0 + i * (s + gap)).toFixed(1) + '" y="' + y0.toFixed(1)
      + '" width="' + s.toFixed(1) + '" height="' + s.toFixed(1) + '" rx="' + (6 * k).toFixed(1) + '"/>';
  }
  return h + "</svg>";
}

  var shown = rows.length > 12 ? rows.slice(0, 5).concat([{ k: "gap", gap: rows.length - 10 }]).concat(rows.slice(-5)) : rows;

  state.c11msg = "答えを決めました。当てる人に端末を返します。"; state.c11err = false;
}
function c1SetNo() { state.c1set = false; state.c1setin = ""; state.c1setpick = ""; state.c11msg = ""; }

/* ── 判定の台（1-1 の主役。1-2 のもしもの札でも小さく使う）─────────────────────────
   o = {ans, guess, show, size:"l"|"s", rowA, rowG, setting}。答えの段・線の段・予想の段・印の段。
   show が false なら答えの札は「？」で、線と印を描かない（答えの字は属性にも書かない） */
function c1Judge(o) {
  var col = c1Col(), C = c1Cfg(), z = C1J_SIZE[o.size || "l"], tw = z[col ? "col" : "num"][0], gap = z[col ? "col" : "num"][1];
  var n = C.len, W = n * tw + (n - 1) * gap, H = z.h, cx = function (i) { return i * (tw + gap) + tw / 2; };
  var st = ' style="--c1j-t:' + tw + "px;--c1j-g:" + gap + 'px"';
  var tile = function (ch, cls) { return '<span class="c1j-t' + (cls ? " " + cls : "") + '">' + ch + "</span>"; };
  var face = function (d) { return col ? c1Peg(d, "c1j-peg") : d; };
  var jd = o.guess && o.show ? hbJudge(o.guess, o.ans) : null;

  var aRow = "";
  if (o.setting) aRow = o.setting;
  else for (var i = 0; i < n; i++) aRow += o.show ? tile(face(o.ans[i]), "a") : tile("？", "q");
  var gRow = "";
  for (var j = 0; j < n; j++) gRow += o.guess ? tile(face(o.guess[j]), "g") : tile("", "empty");
  var lines = "", marks = "";
  if (jd) jd.forEach(function (r, i) {
    if (r.kind === "eat") lines += '<line class="c1j-ln eat" data-to="' + r.to + '" x1="' + cx(i) + '" y1="' + H + '" x2="' + cx(r.to) + '" y2="0"/>';
    if (r.kind === "bite") lines += '<line class="c1j-ln bite" data-to="' + r.to + '" x1="' + cx(i) + '" y1="' + H + '" x2="' + cx(r.to) + '" y2="0"/>';
    marks += '<span class="c1j-mk"><span class="c1j-mk-lbl ' + r.kind + '">' + (r.kind === "eat" ? C.w.eat : r.kind === "bite" ? C.w.bite : "なし") + "</span></span>";
  });
  return '<div class="c1j c1j-' + (o.size || "l") + (o.dim ? " dim" : "") + '"' + st + ">"
    + '<span class="c1j-row-lbl">' + (o.rowA || "答え") + '</span><span class="c1j-tiles">' + aRow + "</span>"
    + '<span></span><svg class="c1j-lines" viewBox="0 0 ' + W + " " + H + '" width="' + W + '" height="' + H + '" aria-hidden="true">' + lines + "</svg>"
    + '<span class="c1j-row-lbl">' + (o.rowG || "予想") + '</span><span class="c1j-tiles">' + gRow + "</span>"
    + (jd ? '<span></span><span class="c1j-tiles c1j-marks">' + marks + "</span>" : "")
    + "</div>";
}
/* 台の下の一文（見せているとき）。EAT の字 → BITE の字 → なしの字の順に、同じ種類は「と」でつなぐ */
function c1Why(ans, guess) {
  var C = c1Cfg(), col = c1Col(), jd = hbJudge(guess, ans), by = { eat: [], bite: [], none: [] };
  jd.forEach(function (r) { by[r.kind].push(C.name1(r.d)); });
  if (by.eat.length === C.len) return c1Tx(C.len + " つの" + C.w.unit + "が" + C.w.pos + "まで合うので " + C.len + " " + C.w.eat + "、当たりです。");
  var eatWhy = col ? "は色も場所も合うのでヒット" : "は数字も位も合うので EAT";
  var biteWhy = col ? "は色が合って場所が違うのでブロー" : "は数字が合って位が違うので BITE";
  var segs = [];
  if (by.eat.length) segs.push(by.eat.join(" と ") + " " + eatWhy);
  if (by.bite.length) segs.push(by.bite.join(" と ") + " " + biteWhy);
  if (by.none.length) segs.push(by.none.join(" と ") + (by.none.length === C.len ? " は、どれも答えにありません" : " は答えにありません"));
  var s = segs.join("、");
  if (!by.none.length) s += " です";
  return c1Tx(s + "。");
}

/* ── 1-1 の部品 ───────────────────────────────────────────── */
/* 1 行目: 答えを見る／隠す・別の答えで・隣の人が決める・答えの番号・最初から（入れる途中は 決めて隠す・やめる・案内） */
function c1AnsBar() {
  var C = c1Cfg(), col = c1Col();
  if (state.c1set) {
    return '<div class="c1-ansbar"><button class="btn primary" data-run="c1setok">決めて隠す</button><button class="btn" data-run="c1setno">やめる</button>'
      + '<span class="c1-set-hint">' + (col ? "答えを決める人が違う色を " + CB_LEN + " つ置いて［決めて隠す］を押します。置いた色は画面に出ません。"
        : "答えを決める人が、同じ数字を使わずに 3 けたを入れて［決めて隠す］を押します。入れた数字は画面に出ません。") + "</span></div>";
  }
  var no = state[C.ownKey] ? "隣の人が決めた答え" : "問題 " + (state[C.kKey] + 1) + " / " + C.list.length;
  return '<div class="c1-ansbar">'
    + '<button class="btn" data-run="c1show">' + (state.c1show ? "答えを隠す" : "答えを見る") + "</button>"
    + '<button class="btn" data-run="c1next">別の答えにする</button>'
    + '<button class="btn" data-run="c1set">隣の人が決める</button>'
    + '<span class="c1-ansno-lbl">' + no + "</span>"
    + '<button class="btn c1-reset" data-run="c11reset"' + (c1Asked().length || state[C.pickKey] ? "" : " disabled") + ">最初から</button></div>";
}
/* 入れる途中の答えの段（ヌメロン＝伏せ字の欄・ヒット&ブロー＝置いた数だけ「?」） */
function c1SetRow() {
  if (!c1Col()) return '<input class="c1-setin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="ここに 3 けた" data-field="c1setin" data-enter="c1setok" aria-label="答えの 3 けた（画面に出ません）">';
  var h = "";
  for (var i = 0; i < CB_LEN; i++) h += '<span class="c1j-t ' + (i < state.c1setpick.length ? "q" : "empty") + '">' + (i < state.c1setpick.length ? "？" : "") + "</span>";
  return h;
}
/* 予想を組み立てる段（ヌメロン＝数字の札・ヒット&ブロー＝色の丸）。入れる途中のヒット&ブローは答えを置く段になる */
function c1Pad() {
  var C = c1Cfg(), col = c1Col(), won = c1Won();
  if (state.c1set) {
    if (!col) return "";
    var full = state.c1setpick.length >= CB_LEN;
    return '<div class="c1-pad"><span class="c1-pal-row" role="group" aria-label="答えの色を置く">' + CB_COLORS.map(function (name, i) {
      return '<button class="c1-pal c1p-' + i + '" data-c1col="' + i + '"' + (full ? " disabled" : "") + ' aria-label="' + name + 'を置く">' + name + "</button>";
    }).join("") + "</span>"
      + '<button class="btn" data-run="c1back"' + (state.c1setpick.length ? "" : " disabled") + ">1 つ消す</button></div>";
  }
  var pick = state[C.pickKey], slots = "";
  for (var i = 0; i < C.len; i++) slots += i < pick.length ? (col ? c1Peg(pick[i]) : '<span class="c1-dslot">' + pick[i] + "</span>")
    : (col ? '<span class="c1-peg c1p-empty" aria-hidden="true"></span>' : '<span class="c1-dslot empty" aria-hidden="true"></span>');
  var keys;
  if (col) {
    keys = '<span class="c1-pal-row" role="group" aria-label="色を選ぶ">' + CB_COLORS.map(function (name, i) {
      var used = pick.indexOf(String(i)) >= 0 || pick.length >= CB_LEN || won;
      return '<button class="c1-pal c1p-' + i + '" data-c1col="' + i + '"' + (used ? " disabled" : "") + ' aria-label="' + name + 'を置く">' + name + "</button>";
    }).join("") + "</span>";
  } else {
    var ds = "";
    for (var d = 0; d < 10; d++) {
      var off = pick.indexOf(String(d)) >= 0 || pick.length >= HB_LEN || won;
      ds += '<button class="c1-dig" data-c11d="' + d + '"' + (off ? " disabled" : "") + ' aria-label="数字 ' + d + '">' + d + "</button>";
    }
    keys = '<span class="c1-digs" role="group" aria-label="数字を選ぶ">' + ds + "</span>";
  }
  return '<div class="c1-pad"><span class="c1-slots" aria-label="組み立て中の予想">' + slots + "</span>" + keys
    + '<button class="btn" data-run="c1back"' + (!pick.length || won ? " disabled" : "") + ">1 つ消す</button>"
    + '<button class="btn primary" data-run="c11ask"' + (pick.length !== C.len || won ? " disabled" : "") + ">聞く</button></div>";
}
/* 返事の札。大きい字は最後の手（なければ見本）への返事。小さい行は 断り・知らせ ＞ 当たり ＞ 聞いた手 ＞ 見本 ＞ 案内 */
function c1ReplyCard(demo) {
  var C = c1Cfg(), asked = c1Asked(), n = asked.length, ans = c1Ans(), g = n ? asked[n - 1] : demo, big = g && !state.c1set ? C.reply(hbScore(g, ans)) : "";
  var small = state.c11msg ? state.c11msg
    : c1Won() ? "当たりです。" + n + " 手で当てました。"
    : state.c1set ? "答えを決めて予想を聞くと、ここに返事が出ます。"
    : n ? c1Tx(C.q(g) + " への返事です。")
    : demo ? c1Tx("見本の予想 " + C.q(demo) + " への返事です。")
    : "［聞く］を押すと、ここに返事が出ます。";
  return '<div class="c1-reply" aria-live="polite"><h3>返事</h3><p class="c1-reply-v' + (c1Won() ? " hit" : "") + '">' + (big || "　") + "</p>"
    + '<p class="c1-reply-s' + (state.c11msg ? " msg" + (state.c11err ? " err" : "") : "") + '">' + small + "</p></div>";
}
/* ── 残りの候補の札（2026-09-27 夜、本人「候補がいくつあって、それがこの聞き方であれば絞っていける、と言うのがぱっと見でわかるように…復活させて」）──
   大きな残りの数・推移（720 → 210 → 72）・点の図（残り／いま消えた／前に消えた）・［いちばん絞れる手を聞く］と、その手で残る数の上限 */
var C1_BEST_CACHE = {};
/* いまの候補での、いちばん絞れる手（hbBest）。1 手目はどの手でも分かれ方が同じなので、先頭の手（012・0123）と、その分かれ方の最大 */
function c1BestNow() {
  var C = c1Cfg(), asked = c1Asked(), ans = c1Ans(), all = C.all();
  if (c1Won() || state.c1set) return null;
  if (!asked.length) return { g: all[0], worst: Math.max.apply(null, hbSplit(all[0], all).map(function (r) { return r.n; })) };
  var key = state.c1game + "|" + ans + "|" + asked.join(",");
  return C1_BEST_CACHE[key] || (C1_BEST_CACHE[key] = hbBest(C.remainBy(asked, ans), all));
}
/* 点の図。1 点が候補 1 つ（左上から hbAll・cbAll の順）。残り・いま消えた（最後の手で消えた）・前に消えた・当たり を塗り分ける */
function c1Dots(all, rem, prev, won, ans) {
  var keep = {}, was = {};
  rem.forEach(function (c) { keep[c] = true; });
  prev.forEach(function (c) { was[c] = true; });
  var cols = all.length > 400 ? 60 : 40, W = 360, px = W / cols, cell = px * 0.74, rows = Math.ceil(all.length / cols), H = rows * px - (px - cell);
  var h = '<svg class="c1-dots" viewBox="0 0 ' + W + " " + H.toFixed(1) + '" width="100%" role="img" aria-label="'
    + all.length + " 通りの候補のうち、残っているのは " + rem.length + ' 通り">';
  all.forEach(function (c, i) {
    var cls = won && c === ans ? "c1-d hit" : keep[c] ? "c1-d on" : was[c] ? "c1-d cut" : "c1-d";
    h += '<rect class="' + cls + '" x="' + ((i % cols) * px).toFixed(1) + '" y="' + (Math.floor(i / cols) * px).toFixed(1) + '" width="' + cell.toFixed(1) + '" height="' + cell.toFixed(1) + '" rx="1"/>';
  });
  return h + "</svg>";
}
/* 残りが少ないときに並べる候補の札の数（押すとその候補で聞く）。色は札が広いので少なめ */
var C1_CHIPS = { num: 8, col: 4 };
function c1CandCard(demo) {
  var C = c1Cfg(), col = c1Col(), asked = c1Asked(), n = asked.length, ans = c1Ans(), all = C.all(), won = c1Won();
  var chain = [all.length];
  for (var i = 1; i <= n; i++) chain.push(C.remainBy(asked.slice(0, i), ans).length);
  if (won && chain.length > 2 && chain[chain.length - 2] === 1) chain.pop();   /* 当たりの手で 1 → 1 と減らないように読めるので、同じ 1 を重ねない */
  var shownChain = chain.length > 6 ? [chain[0], "…"].concat(chain.slice(-4)) : chain;   /* 長いときも頭の数は残す */
  var rem = n ? C.remainBy(asked, ans) : all, prev = n ? C.remainBy(asked.slice(0, -1), ans) : all;
  var b = c1BestNow(), cap = "";
  /* 押したあと: 最後の手の見込み（いちばん悪い返事で残る数）と、実際に残った数を並べる */
  if (n && !won) {
    var g0 = asked[n - 1], w0 = Math.max.apply(null, hbSplit(g0, prev).map(function (r) { return r.n; }));
    cap += C.q(g0) + " の見込みは " + w0 + " 通り以下で、実際は " + rem.length + " 通りでした。";
  }
  if (won) cap = "残りは答えの 1 通りだけです。";
  else if (state.c1set) cap = "答えが決まると、ここで候補が減っていくのを見られます。";
  else if (rem.length === 1) cap += "残りは 1 通りです。" + C.q(b.g) + " を聞けば当たります。";
  else {
    if (demo && !n) cap += "見本の予想は数えていないので、候補は " + all.length + " 通りのままです。";
    cap += "次にいちばん絞れる手は " + C.q(b.g) + " です。どの返事が来ても残りは "
      + (b.worst === 1 ? "1 通りに決まり" : b.worst + " 通り以下に減り") + "、これより上限の小さい手はありません。";
  }
  var chips = "";
  if (!won && !state.c1set && n && rem.length > 1 && rem.length <= C1_CHIPS[state.c1game]) {
    chips = '<div class="c1-chips" role="group" aria-label="残りの候補（押すと、その' + C.w.thing + 'で聞きます）">' + rem.map(function (c) {
      return '<button class="c1-chip" data-c1cand="' + c + '" aria-label="' + C.text(c) + ' で聞く">' + (col ? c1Pegs(c) : c) + "</button>";
    }).join("") + "</div>";
  }
  return '<div class="c1-cand"><div class="c1-cand-h"><span class="c1-cand-lbl">残りの候補</span><b class="c1-cand-n">' + rem.length + '</b><span class="c1-cand-u">通り</span>'
    + '<span class="c1-chain">' + shownChain.join(" → ") + "</span></div>"
    + c1Dots(all, rem, prev, won, ans)
    + '<p class="c1-dots-lbl"><span><i class="on"></i>残り</span><span><i class="cut"></i>いまの手で消えた</span><span><i class="old"></i>前に消えた</span>'
    + (won ? '<span><i class="hit"></i>当たり</span>' : "")
    + (col ? "" : "<span>先頭が 0 の数も入れて " + all.length + " 通り</span>") + "</p>"
    + chips
    + '<div class="c1-best"><button class="btn" data-run="c1best"' + (b ? "" : " disabled") + ">いちばん絞れる手で聞く</button>"
    + '<p class="c1-best-s" aria-live="polite">' + c1Tx(cap) + "</p></div></div>";
}
/* 記録（右端のポイントの下）。手・返事・残りの候補の数。多くなったら新しい手だけを出し、前の手は数で示す */
function c1Log() {
  var C = c1Cfg(), asked = c1Asked(), n = asked.length, ans = c1Ans(), lim = state.big ? C11_LOG - 1 : C11_LOG;
  if (n > lim) lim -= 1;   /* 「前の N 手は省略」の行を足すときは 1 手減らし、表の高さを増やさない（右端の列が 1 画面を 2px 越えた） */
  var shown = asked.slice(-lim), skip = n - shown.length;
  return '<div class="c1-log"><div class="c1-log-h"><h3>記録</h3>' + pxSprite("scribe", 1.5) + "</div>"
    + (n ? '<table class="c11-log"><thead><tr><th>手</th><th>返事</th><th>残り</th></tr></thead><tbody>'
      + (skip ? '<tr class="c11-skip"><td colspan="3">前の ' + skip + " 手は省略</td></tr>" : "") + shown.map(function (g, j) {
        var i = skip + j, left = C.remainBy(asked.slice(0, i + 1), ans).length;
        return '<tr class="' + (g === ans ? "hit" : "") + '"><td>' + C.html(g) + "</td><td>" + C.reply(hbScore(g, ans)) + '</td><td class="c11-left">' + left + "</td></tr>";
      }).join("") + "</tbody></table>"
      : '<p class="c11-rec-none">聞いた手と返事、残りの候補の数が並びます。</p>')
    + "</div>";
}
function c1GameSeg() {
  return '<div class="c1-game">' + seg("c1game", [{ v: "num", t: "ヌメロン（テレビ番組）" }, { v: "col", t: '<span class="c1-nw">ヒット&ブロー</span>（Switch）' }], state.c1game) + "</div>";
}

function renderS11() {
  var C = c1Cfg(), col = c1Col(), asked = c1Asked(), n = asked.length, ans = c1Ans(), show = state.c1show && !state.c1set;
  /* 見本は、いまの答えを一度見せたときだけ（答えから作るので、見せていない答えでは手がかりになる）。隠すと線と印だけが消え、返事の数が残る */
  var demo = state.c1peek && !state.c1set && !n && !state[C.pickKey] ? C.demo(ans) : "";
  var guess = state.c1set ? "" : n ? asked[n - 1] : demo;
  var view = show || state.c1set ? "答えを決める人の目線" : "当てる人の目線";
  var why = state.c1set ? ""
    : show && guess ? c1Why(ans, guess)
    : guess ? "線と印は、答えを知っている人にしか描けません。当てる人の画面に出るのは、返事の数だけです。"
    : col ? "色を " + CB_LEN + " つ選んで［聞く］を押します。" : "数字を 3 つ選んで［聞く］を押します。";
  var judge = '<div class="c1-jbox"><p class="c1j-view-lbl">' + view + "</p>"
    + c1Judge({ ans: ans, guess: guess, show: show, size: "l", setting: state.c1set ? c1SetRow() : "", dim: state.c1set })
    + (why ? '<p class="c1j-why">' + why + "</p>" : "") + c1ReplyCard(demo) + "</div>";   /* 返事は判定の台の下にまとめる（右の列を残りの候補の札に空ける） */
  var stage = c1AnsBar()
    + '<div class="c1-main">' + judge + '<div class="c1-col2">' + c1CandCard(demo) + "</div></div>"
    + c1Pad();

  return slideHead({
    title: "返事の数え方",
    right: c1GameSeg(),
    lead: col
      ? "任天堂の Nintendo Switch ソフト『世界のアソビ大全51』（2020 年 6 月 5 日発売）には、色を当てる推理ゲーム「<span class=\"c1-nw\">ヒット&ブロー</span>」が入っています。"
        + "このページでは、6 色のうち違う色 " + CB_LEN + " つの並びを当てます。"
      : "『Numer0n（ヌメロン）』は、フジテレビが 2012 年 10 月から 2013 年 6 月までレギュラー放送した、数を当て合う対戦の番組です。"
        + "2 人がそれぞれ 0〜9 の違う数字 3 つで 3 けたの数を決め、互いに予想（コール）と判定（ジャッジ）をくり返して、相手の数を先に当てた方が勝ちです。"
  })
    + slideBody(stage, pointsCard((col ? [
      "色も場所も合っていればヒット、色は合っていて場所が違えばブローと数えます。",
      "返事はヒットとブローの数で出ます。どの色が合っていたかは、次からの予想で確かめます。",
      "最初から［いちばん絞れる手で聞く］だけを押すと、答えが " + cbAll().length + " 通りのどれでも " + CB_GREEDY.max + "\u00a0手以内に当たります。"
    ] : [
      "予想と答えで数字も位も合っていれば「EAT」、数字は合っていて位が違えば「BITE」と数えます。",
      "返事は EAT と BITE の数で出ます。どの数字が合っていたかは、次からの予想で確かめます。",
      "最初から［いちばん絞れる手で聞く］だけを押すと、答えが " + hbAll().length + " 通りのどれでも " + HB_BEST.max + "\u00a0手以内に当たります。"
    ]).map(c1Tx)) + c1Log(), { cls: "c1-body" });
}

/* ── 1-2 返事で候補を仕分ける ────────────────────────────────────── */
/* 例の手を順に聞いた道筋（いまの答えで）。手ごとに {g, before, rows, key, after, won} */
function c12Path() {

    source: C1_SRC.map(function (s) { return s.t + (s.u ? "　<code>" + s.u.replace(/([/.])/g, "$1<wbr>") + "</code>" : ""); }).join("<br>")   /* URL はスラッシュと点の後ろでだけ折る */
  });
}

onClick(function (d, e) {
  var C = c1Cfg();
  /* 遊びを替えても 1-2 の段は保つ（段の数は c12View が遊びの 1 本道の長さに収める。［最初から］の前に切り替えを押しても段が残る） */
  if (d.c1game !== undefined) { act(function () { state.c1game = d.c1game; state.c11msg = ""; c1SetNo(); state.c12row = ""; state.c12i = 0; state.c1peek = state.c1show; }, e); return true; }
  /* 1-1 */
  if (d.run === "c1show") { act(function () { state.c1show = !state.c1show; if (state.c1show) state.c1peek = true; state.c11msg = ""; }, e); return true; }
  if (d.run === "c1next") { act(c1Next, e); return true; }
  if (d.run === "c1set") {
    act(function () { state.c1set = true; state.c1setin = ""; state.c1setpick = ""; state.c11msg = ""; }, e);
    var inp = document.querySelector("#main .c1-setin"); if (inp) inp.focus();   /* 押したらすぐ打てるように（学生役の指摘。押しても欄に行かなかった） */
    return true;
  }
  if (d.run === "c1setok") { act(c1SetOk, e); return true; }
  if (d.run === "c1setno") { act(c1SetNo, e); return true; }
  if (d.run === "c11reset") { act(function () { c1Clear(); state.c11msg = ""; }, e); return true; }
  if (d.c11d !== undefined) { act(function () { var p = state.c11pick; if (p.length < HB_LEN && p.indexOf(d.c11d) < 0) state.c11pick = p + d.c11d; state.c11msg = ""; }, e); return true; }
  if (d.c1col !== undefined) {
    act(function () {
      if (state.c1set) { if (state.c1setpick.length < CB_LEN) state.c1setpick += d.c1col; }   /* 答えを置く途中は同じ色も置ける（押せなくすると使った色が見えてしまう） */
      else if (state.c1pick.length < CB_LEN && state.c1pick.indexOf(d.c1col) < 0) state.c1pick += d.c1col;
      state.c11msg = "";
    }, e); return true;
  }
  if (d.run === "c1back") { act(function () { if (state.c1set) state.c1setpick = state.c1setpick.slice(0, -1); else state[C.pickKey] = state[C.pickKey].slice(0, -1); }, e); return true; }
  if (d.run === "c11ask") { act(function () { c1Ask(state[C.pickKey]); }, e); return true; }
  if (d.c1cand !== undefined) { act(function () { state[C.pickKey] = ""; c1Ask(d.c1cand); }, e); return true; }
  if (d.run === "c1best") { act(function () { var b = c1BestNow(); if (b) { state[C.pickKey] = ""; c1Ask(b.g); } }, e); return true; }
  /* 1-2 */
  if (d.run === "c12next") { act(function () { state.c12step++; state.c12row = ""; state.c12i = 0; }, e); return true; }
  if (d.c12row !== undefined) { act(function () { state.c12row = d.c12row; state.c12i = 0; }, e); return true; }
  if (d.run === "c12i") { act(function () { state.c12i++; }, e); return true; }
  if (d.run === "c12num") { act(function () { state.c12num = !state.c12num; }, e); return true; }
  if (d.run === "c12reset") { act(c12Reset, e); return true; }
  /* 補足 */
  if (d.c1mm !== undefined) { act(function () { state.c1mm = +d.c1mm; }, e); return true; }
  return false;
});


/* ═════ ch2.js ═════ */
/* ═════ 第 2 章　手順とは（2-1 勘と手順・2-2 数当てをやってみる）══════════════════════════
   ★ 数は model.js から引く（LO・HI・TARGET・KAN_RUNS・PLAY_TARGETS・planLinear・planBinary・midOf・askMax・binaryDist・meanBinary）。
   ★ 2-1（押して動くものの型 ①）: やり方を 3 つ切り替えると、正解 97 のときに聞く数の並びと、表の中の選んだ列が変わる。
     勘の並びは model.js の KAN_RUNS（乱数を使わない固定の 2 日ぶん）。
   ★ 2-2（型 ②）: 数を打つと「もっと上」「もっと下」が返り、範囲の帯（bandSvg）と記録（logList）が変わる。
     正解は PLAY_TARGETS の順（教室で全員が同じ順に出会う。乱数は使わない）。打つ欄は全角の数字と空白も受ける。
     範囲の帯は .diagram-scroll で包む（760px 以下で帯が 640px を保ち、図の中の字が 14px を割らない。style.css の決まり）。
   ★ 参考資料: 2-1 は図鑑 序章 0-1（def-algo・any-input）。2-2 は付けない（P1 の測り役の判断。練習の枚で、誌面が答えの聞き方を先に見せる）。 */

defaults({
  c21way: "kan",    /* 2-1 のやり方（C21_WAYS の v） */
  c22n: 0,          /* 2-2 の何問目か（PLAY_TARGETS の添字） */
  c22asked: [],     /* 2-2 で聞いた数の並び */
  c22in: "",        /* 2-2 の打ちかけの字 */
  c22msg: ""        /* 2-2 の入れ方の断り */
});

REFS["2-1"] = ["def-algo", "any-input", "algo-any-n"];

/* ── 2-1 勘と手順 ─────────────────────────────────────────────────────── */
var C21_WAYS = [
  { v: "kan", t: "勘で言う" },
  { v: "seq", t: "端から順に聞く" },
  { v: "mid", t: "真ん中から聞く" }
];
/* 表の行。値は [丸か罰, 添える字] */
function c21Rows() {
  var most = askMax(HI - LO + 1);
  return [
    { t: "同じ番号なら毎回同じ順に聞く", kan: [false, "日によって違う"], seq: [true, ""], mid: [true, ""] },
    { t: "どの番号でも必ず当たって終わる", kan: [false, "言い切れない"], seq: [true, ""], mid: [true, ""] },
    { t: "何回以内に終わるかを前もって言える", kan: [false, "言えない"], seq: [true, HI + " 回以内"], mid: [true, most + " 回以内"] }
  ];
}
/* やり方ごとの、正解 TARGET のときに聞く数の並び */
function c21Runs(way) {
  if (way === "kan") return KAN_RUNS.map(function (r, i) { return { h: (i + 1) + " 日目", seq: r }; });
  var seq = (way === "seq" ? planLinear(TARGET) : planBinary(TARGET)).map(function (r) { return r.g; });
  return [{ h: "毎回", seq: seq }];
}
/* 数の並びの札。長い並び（1 から順）は頭の 3 つと終わりの 2 つだけを出す */
function c21Seq(seq) {
  var shown = seq.length > 8 ? seq.slice(0, 3).concat([null]).concat(seq.slice(-2)) : seq;
  return '<span class="c21-seq">' + shown.map(function (g, i) {
    var cls = g === null ? "c21-g gap" : g === TARGET ? "c21-g hit" : "c21-g";
    return (i ? '<span class="c21-ar" aria-hidden="true">→</span>' : "") + '<span class="' + cls + '">' + (g === null ? "…" : g) + "</span>";
  }).join("") + "</span>";
}
function c21Note(way) {
  if (way === "kan") return "同じ " + TARGET + " でも、1 日目は " + KAN_RUNS[0].length + " 回、2 日目は " + KAN_RUNS[1].length + " 回かかりました。";
  if (way === "seq") return TARGET + " を当てるまで " + planLinear(TARGET).length + " 回です。どの番号でも、番号と同じ回数で当たります。";
  return TARGET + " を当てるまで " + planBinary(TARGET).length + " 回です。どの番号でも " + askMax(HI - LO + 1) + " 回以内に当たります。";
}

function renderS21() {
  var way = state.c21way, runs = c21Runs(way);
  var runsHtml = '<div class="c21-runs">' + runs.map(function (r) {
    return '<div class="c21-run"><span class="c21-run-tag">' + r.h + "</span>" + c21Seq(r.seq) + '<b class="c21-n">' + r.seq.length + " 回</b></div>";
  }).join("") + "</div>";

  var head = "<tr><th></th>" + C21_WAYS.map(function (w) {
    return "<th" + (w.v === way ? ' class="cur"' : "") + ">" + w.t + "</th>";
  }).join("") + "</tr>";
  var body = c21Rows().map(function (row) {
    return "<tr><th>" + row.t + "</th>" + C21_WAYS.map(function (w) {
      var c = row[w.v];
      return '<td class="' + (c[0] ? "ok" : "ng") + (w.v === way ? " cur" : "") + '"><span class="c21-mk" aria-label="' + (c[0] ? "はい" : "いいえ") + '">'
        + (c[0] ? "○" : "×") + "</span>" + (c[1] ? '<span class="c21-why">' + c[1] + "</span>" : "") + "</td>";
    }).join("") + "</tr>";
  }).join("");

  var stage = "<div class=\"c21-seg\">" + seg("c21way", C21_WAYS, way) + "</div>"
    + '<div class="c21-box"><p class="c21-cap-lbl">正解が ' + TARGET + " のときに聞く数</p>" + runsHtml
    + '<p class="c21-note" aria-live="polite">' + c21Note(way) + "</p></div>"
    + '<div class="diagram-scroll"><table class="c21-tbl"><thead>' + head + "</thead><tbody>" + body + "</tbody></table></div>";

  return slideHead({
    title: "勘と手順",
    lead: "1〜100 の数当てで、3 通りのやり方を比べます。正解は " + TARGET + " です。"
  })
    + slideBody(stage, pointsCard([
      "どんな入力でも同じ動きで答えに着き、必ず終わる手順を、アルゴリズム（algorithm）と呼びます。",
      "勘は当たることがあっても、次も同じ回数で当たるとは言えません。",
      "端から順も真ん中からも手順で、違うのは回数です。"
    ]) + bookTag())
    + checkBox("c2-kan", "勘でも当たるなら、何が違うのか", c21Why());
}

/* 補足（薄い形）: 正解ごとの回数の表。手順なら正解が決まれば回数が 1 つに決まる */
function c21Why() {
  var targets = [LO, midOf(LO, HI), TARGET, HI];
  return "<p>手順は、正解が決まれば聞く回数も 1 つに決まります。正解ごとに数えると、次のとおりです。</p>"
    + '<div class="dfig">' + miniTable(["正解", "端から順に聞く", "真ん中から聞く"], targets.map(function (t) {
      return [t, planLinear(t).length + " 回", planBinary(t).length + " 回"];
    }), "c21-tbl2") + "</div>"
    + "<p>勘では、正解ごとの回数の表が作れません。同じ " + TARGET + " でも、例の 2 日は " + KAN_RUNS[0].length + " 回と " + KAN_RUNS[1].length + " 回でした。</p>";
}

/* ── 2-2 数当てをやってみる ─────────────────────────────────────────────── */
function c22Target() { return PLAY_TARGETS[state.c22n % PLAY_TARGETS.length]; }
/* 聞いた数から、残っている範囲と勝ち負けを出す */
function c22State() {
  var t = c22Target(), lo = LO, hi = HI, asked = state.c22asked;
  asked.forEach(function (g) { if (g < t) lo = Math.max(lo, g + 1); else if (g > t) hi = Math.min(hi, g - 1); });
  var win = asked.length > 0 && asked[asked.length - 1] === t;
  return { t: t, lo: win ? t : lo, hi: win ? t : hi, win: win, last: asked.length ? asked[asked.length - 1] : 0 };
}
/* 打った字を整数へ（全角の数字を半角に、半角と全角の空白を外す）。整数でなければ NaN */
function c22Num(s) {
  var v = String(s === undefined || s === null ? "" : s)
    .replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xfee0); })
    .replace(/[\s　]+/g, "");
  return /^\d+$/.test(v) ? parseInt(v, 10) : NaN;
}
function c22Ask(raw) {
  var s = c22State();
  if (s.win) return;
  var g = c22Num(raw);
  if (!(g >= LO && g <= HI)) { state.c22msg = LO + "〜" + HI + " の整数を入れます。"; return; }
  state.c22msg = "";
  state.c22in = "";
  state.c22asked = state.c22asked.concat([g]);
}

function renderS22() {
  var s = c22State(), n = state.c22asked.length, most = askMax(HI - LO + 1), rest = s.hi - s.lo + 1;
  var say;
  if (!n) say = LO + "〜" + HI + " から数を 1 つ選びました。数を入れて［聞く］を押します。";
  else if (s.win) say = "当たりです。選ばれた数は " + s.t + " でした。";
  else say = s.last + " ではありません。返事は" + (s.last < s.t ? "「もっと上」" : "「もっと下」") + "です。";

  var ctl = '<div class="c22-ctl"><span class="c22-no-lbl">問題 ' + (state.c22n + 1) + "</span>"
    + '<input class="c22-in" type="text" inputmode="numeric" maxlength="8" autocomplete="off" data-field="c22in" data-enter="c22ask"'
    + ' aria-label="聞く数（' + LO + "〜" + HI + '）" placeholder="' + LO + "〜" + HI + '" value="' + esc(state.c22in) + '"' + (s.win ? " disabled" : "") + ">"
    + '<button class="btn primary" data-run="c22ask"' + (s.win ? " disabled" : "") + ">聞く</button>"
    + '<button class="btn c22-next" data-run="c22next">別の数で</button></div>';

  var log = logList(state.c22asked.map(function (g, i) {
    return { k: "c22-" + i, n: (i + 1) + " 回目", g: g, r: g === s.t ? "当たり" : g < s.t ? "もっと上" : "もっと下", cls: g === s.t ? "hit" : "" };
  }), "聞いた数がここに並びます");

  var stage = ctl
    + (state.c22msg ? '<p class="c22-msg" role="alert">' + state.c22msg + "</p>" : "")
    + '<p class="c22-say" aria-live="polite">' + say + "</p>"
    + '<div class="c22-count c22-stat-lbl">' + pxSprite("scribe", 2.5) + statRow([   /* -lbl は qa の LABEL_SEL が札として測る印（ch1 と同じ） */
      { v: n, l: "聞いた回数", cls: s.win ? "hit" : "" },
      s.win ? { v: s.t, l: "選ばれた数", cls: "hit" } : { v: rest + "\u00a0件", l: "残っている数（" + s.lo + "〜" + s.hi + "）" }
    ]) + "</div>"
    + '<div class="diagram-scroll c22-band">' + bandSvg(s.lo, s.hi, s.last, s.win,
      { label: n ? (s.win ? "当たり" : "残りは " + rest + " 件") : "ここに残っている範囲が出ます" }) + "</div>"
    + (s.win ? '<p class="c22-cmp">当てるまで <b>' + n + " 回</b>　真ん中から聞けば最大 <b>" + most + " 回</b></p>" : "")
    + '<div class="c22-log">' + log + "</div>";

  return slideHead({
    title: "数当てをやってみる",
    lead: LO + "〜" + HI + " から 1 つ選ばれた数を、「もっと上」「もっと下」の返事だけで当てます。"
  })
    + slideBody(stage, pointsCard([
      "当たるまでに聞いた回数を控え、" + most + " 回と比べます。",
      "返事を聞くたびに、残りの範囲が縮みます。",
      "範囲の外の数を聞いても、残りは 1 つも減りません。"
    ]))
    + checkBox("c2-mid2", "真ん中が " + midOf(LO, HI) + " と " + (midOf(LO, HI) + 1) + " の 2 つあるとき", c22Why());
}

/* 補足（薄い形）: 真ん中を切り上げて聞いたときの回数の分布を、切り捨て（model.js の binaryDist）と並べる */
function c22PlanCeil(target) {
  var lo = LO, hi = HI, n = 0;
  for (;;) {
    var m = Math.ceil((lo + hi) / 2);
    n++;
    if (m === target) return n;
    if (m < target) lo = m + 1; else hi = m - 1;
  }
}
function c22DistCeil() {
  var d = {};
  for (var t = LO; t <= HI; t++) { var c = c22PlanCeil(t); d[c] = (d[c] || 0) + 1; }
  return d;
}
function c22Why() {
  var m = midOf(LO, HI), dF = binaryDist(), dC = c22DistCeil(), most = askMax(HI - LO + 1), rows = [], sumC = 0;
  for (var k = 1; k <= most; k++) {
    rows.push([k + " 回", (dF[k] || 0) + " 通り", (dC[k] || 0) + " 通り"]);
    sumC += k * (dC[k] || 0);
  }
  var meanC = sumC / (HI - LO + 1);
  return "<p>" + LO + "〜" + HI + " の真ん中は " + (LO + HI) / 2 + " で、整数では " + m + " と " + (m + 1) + " の 2 つが候補になります。"
    + m + " を聞く（切り捨て）か " + (m + 1) + " を聞く（切り上げ）かで聞く数の並びは変わりますが、全部の番号で数えた回数の分布は同じです。</p>"
    + '<div class="dfig">' + miniTable(["回数", "切り捨て（" + m + " から）", "切り上げ（" + (m + 1) + " から）"], rows, "c22-tbl") + "</div>"
    + "<p>どちらでも、いちばん多いときは " + most + " 回です。平均はどちらも " + meanBinary().toFixed(1) + " 回です。</p>";
}

onClick(function (d, e) {
  if (d.c21way !== undefined) { act(function () { state.c21way = d.c21way; }, e); return true; }
  if (d.run === "c22ask") { act(function () { c22Ask(state.c22in); }, e); return true; }
  if (d.run === "c22next") {
    act(function () { state.c22n += 1; state.c22asked = []; state.c22in = ""; state.c22msg = ""; }, e);
    return true;
  }
  return false;
});


/* ═════ ch3.js ═════ */
/* ═════ 第 3 章　2 つの聞き方（3-1 端から順と、真ん中・3-2 件数を増やす）═══════════════════════════
   ★ 3-1: 聞き方を切り替え（押して動くものの型 ①）、正解 TARGET を 1 手ずつ送る（型 ③）。送った手数 c3k は 2 つの聞き方で共通
     （切り替えると「同じ回数だけ聞いたところ」を見比べられる。真ん中から聞く方が先に当たったら、そこで止まって見える）。
     「最初から」は、まだ聞いていないときは押せない。
   ★ 3-2: 件数の段 SCALES をスライダーで動かす（型 ⑥）。最大の回数は askMax。通った段だけ、下の並びに回数が出る（予想してから動かす）。
   ★ 数は model.js（LO・HI・TARGET・plan・planLinear・planBinary・askMax・binaryDist・meanLinear・meanBinary・SCALES・pow2・fmt・SCRIBE）から引く。
   ★ 補足の事実は P1 の事実ファイルの「確かめた」節だけから書く（節の番号を注記に書く）。台帳に無い記述は [[仮]]（spKari）。
     model.js に無い事実の数（年・説明書の例の件数）は C3_REF に数で持ち、文は組み立てる（章の文に 3 桁以上の数を直に書かない。統合で model.js へ移す案）。
   ★ 人物は、3-1 の聞いた回数の札の横にカゾエ（書記官・手数を数える役）を 1 体だけ置く。台詞は言わせない（台詞は第5章だけ）。 */

defaults({

  c3k: 0,         /* 3-1 送った手数（2 つの聞き方で共通。聞き方ごとの手数はこれを当たりの手で頭打ちにしたもの） */
  c3scale: 0      /* 3-2 件数の段（SCALES の添字） */

/* 参考図書（名前は既存の第1回の切り抜きと同じ。spec/00_設計.md §5） */

REFS["3-2"] = ["size-growth", "binary-log", "binary-exp"];

  bloch: { y: 2006, m: 6, d: 2, from: 30, bits: 32,                                                      /* 〔CS-6〕〔CS-7〕 */
    url: "https://research.google/blog/extra-extra-read-all-about-it-nearly-all-binary-searches-and-mergesorts-are-broken/" }
