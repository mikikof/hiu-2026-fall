<!DOCTYPE html><html lang="ja" data-theme="v2"><head><meta name="robots" content="noindex,nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アルゴリズムとデータ構造｜第7回 再帰と分割統治</title><meta name="description" content="同じ8枚の札で、呼ぶ順と戻る順を追います。終わりの条件と分け方を比べ、第7話「呼ぶ魔法使い」でハノイの塔の封印を解きます。"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b3fd0'/%3E%3Crect x='6' y='8' width='20' height='13' rx='2' fill='none' stroke='white' stroke-width='2.4'/%3E%3Cpath d='M11 26h10M16 21v5' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E"><style>/* ============================================================================
   器（2026-09-24。/designslide の共通の器。この教材が正典）
   ★ 「@@shelf 名前 {」から「}」までは棚の塊（deck.json の shelves にあるときだけ写る）、「@@subject {」から「}」までは
     この教材だけの規則（写さない）。印の無い規則は共通。共通の規則を教材の側で直さない（足りない規則は parts.css か章の CSS）

   ★ 本人の指示: 全体のトーンとデザインは参考書を真似て、かなり親しみやすく。UI も。
     正典（algorithm-data-structure の単体版）の「装飾を足さない」は、この科目では外す（科目の CLAUDE.md）。
     親しみは 形（丸み・ピル・吹き出し）と 色（ミント・ピンク・黄・クリーム）と 道具の絵 で出す。キャラクターは描かない。
   ★ 守るもの: 地の文 16px（文字を拡大で 19.5px）・ラベル 14px・図の中 14px の下限（2026-09-25 に 12 → 14）。外部の字体を読まない。
     色の意味（当たり＝緑 --hit／止まる・ちがう＝赤 --stop／いま見ている＝琥珀 --ask／捨てた＝灰の破線 --drop）。
   ★ 折返しは 1050 / 760 / 560 / 430。狭い画面で横に動いてよいのは .diagram-scroll の中だけ。
   ============================================================================ */

:root{
  --bg:#fbf7ee; --bg-2:#fffdf8;
  --paper:#fff; --paper-2:#fbf9f4;
  --ink:#3a2d27; --ink-2:#54453c; --ink-3:#6b5a4f; --ink-4:#7a695e;
  --line:#e9dfd2; --line-2:#f2ebe1;

  /* 主軸（参考書のミント）と差し色（ピンク・黄） */
  --main:#7ccdc1; --main-deep:#2b8f84; --main-dark:#1f6f66; --main-soft:#e5f5f1; --main-line:#b7e2da;
  /* 見出しのピルの地。参考書のピル（#6bb8b0 前後）に寄せた一段濃いミント。--main は明るすぎて、白い字が投影で沈む（仕上げ C 2026-09-25） */
  --pill:#5db7ab;
  --pink:#e9677f; --pink-deep:#c8455d; --pink-soft:#fde8ec;
  --yellow:#ffd84a; --marker:#fff08a; --brown:#4a3226;
  --red:#e03b3b; --peach:#fdebdc; --peach-line:#f6d3b8; --orange:#e3783a;

  /* 役目の名前（/designslide の theme.md §4.1。2026-09-26）。新しい教材の章の JS と CSS はこちらを使い、16 進を書かない。
     値は上の v1 の名前から引く（テーマが v1 の名前を塗り替えると、役目の色もいっしょに替わる。逆向きにすると v2 で v1 の色が残る） */
  --c-main:var(--main); --c-accent:var(--pink); --c-mark:var(--yellow); --c-alert:var(--red);

  /* 意味の色（正典と同じ意味） */
  --hit:#23905f; --hit-soft:#e2f4ea;
  --ask:#c9860a; --ask-soft:#fdf2d6;
  --stop:#cf3f55; --stop-soft:#fcebee;
  --drop:#b9ada4;

  /* ★ 文字の下限は 3 段。数字を直に書かず、ここから引く。
     --fs-body  地の文・押すもの・表の中身               16px（html.big で 19.5px）
     --fs-label ラベル・出典・表の見出し・札・模型の小物  14px（html.big で 17.1px）
     図の中（SVG の font-size）は 12px を下限にする（ch*.js。rem が効かないので実数）。 */
  --fs-body:1rem; --fs-label:.875rem;
  --round:'Hiragino Maru Gothic ProN','ヒラギノ丸ゴ ProN','BIZ UDPGothic','Yu Gothic UI','Meiryo',sans-serif;
  --mono:'SF Mono','Menlo','Consolas','BIZ UDGothic','MS Gothic',monospace;
  --r:18px;
  --shadow-1:0 1px 2px rgba(74,50,38,.06);
  --shadow-2:0 2px 4px rgba(74,50,38,.05),0 14px 30px -20px rgba(74,50,38,.35);
}
*{box-sizing:border-box}
html{font-size:16px;scrollbar-gutter:stable;-webkit-text-size-adjust:100%}
html.big{font-size:19.5px}
body{margin:0;color:var(--ink);line-height:1.75;line-break:strict;
  font-family:'Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',sans-serif;
  font-feature-settings:"palt" 1;-webkit-font-smoothing:antialiased;
  background:linear-gradient(180deg,var(--bg-2),var(--bg) 420px);background-attachment:fixed}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--paper);border-radius:12px;
  transition:background .18s,border-color .18s,color .18s,box-shadow .18s,transform .12s}
button:disabled{cursor:default}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--main-deep);outline-offset:2px}
h1,h2,h3,p{margin:0}
p+p{margin-top:.6em}
b,strong{font-weight:800}
svg{display:block}
code{font-family:var(--mono);font-size:1em;background:var(--line-2);border-radius:6px;padding:0 .35em;overflow-wrap:break-word}
/* ★ パスは切れ目の無い 1 語なので、狭い器では箱の外へはみ出していた（7-1 のポイント、4-3 の画面の文字。文字を拡大したとき）。
   収まらないときだけ語の中で折る。break-word は最小幅を変えないので、収まっている所の組み方は変わらない（anywhere は使わない）。2026-09-25 */
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:1320px;margin:auto;padding:0 40px}

/* ── 上の帯 ───────────────────────────────────── */
.topbar{min-height:64px;padding:6px 0;display:flex;align-items:center;background:rgba(255,253,248,.92);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px solid var(--main-line);
  position:sticky;top:0;z-index:30}
.tb-wrap{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;width:100%;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--round);font-weight:800}
.brand-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--main);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.brand .course{font-size:var(--fs-label);color:var(--main-dark);letter-spacing:.14em}
.header-actions{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.plain{background:var(--paper);color:var(--ink-2);border:2px solid var(--line);
  border-radius:999px;padding:6px 16px;font-size:var(--fs-body);font-weight:700;white-space:nowrap}
.plain:hover{border-color:var(--main)}
.plain[aria-pressed=true]{background:var(--brown);color:#fff;border-color:var(--brown)}
.osswitch{display:inline-flex;padding:3px;border-radius:999px;background:var(--main-soft);border:2px solid var(--main-line)}
.osswitch button{border:none;background:transparent;border-radius:999px;padding:5px 16px;font-weight:800;
  font-size:var(--fs-body);color:var(--main-dark);font-family:var(--round);white-space:nowrap}
.osswitch button[aria-pressed=true]{background:var(--main-deep);color:#fff;box-shadow:0 3px 0 var(--main-dark)}

/* ── 章ナビ（1 行。いまの章はピンク）─────────────── */
.chapters{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;margin:16px 0 16px}
.chapter{position:relative;border:2px solid var(--line);background:#fff;border-radius:14px;padding:6px 8px;text-align:left;
  display:flex;align-items:center;gap:7px;font-weight:800;font-size:var(--fs-label);color:var(--ink-3);
  font-family:var(--round);line-height:1.3;min-height:52px}
.chapter .num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  background:var(--line-2);color:var(--ink-3);font-size:var(--fs-label)}
.chapter .ch-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb{word-break:keep-all;overflow-wrap:break-word}   /* anywhere は最小幅を 1 字にして、狭い箱で語の中を折らせる。break-word にする */
.chapter .ch-dots{position:absolute;right:8px;bottom:4px;display:flex;gap:3px}
.chapter .ch-dots i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block}
.chapter .ch-dots i.on{background:var(--pink)}
.chapter:hover{border-color:var(--main-line)}
/* ★ いまの章（仕上げ C）: 前は縁だけがピンクで、後ろの席からは 8 つの札の見分けが付きにくかった。地もピンクにし、下の影を濃くする */
.chapter[aria-current=page]{border-color:var(--pink);background:var(--pink-soft);color:var(--ink);box-shadow:0 3px 0 var(--pink)}
.chapter[aria-current=page] .num{background:var(--pink);color:#fff}
.chapter[aria-current=page] .ch-dots i{background:#f2bcc6}
.chapter[aria-current=page] .ch-dots i.on{background:var(--pink-deep)}

/* ── 枚 ─────────────────────────────────────────── */
.slide{position:relative;background:#fff;border:2px solid var(--line);border-radius:26px;box-shadow:var(--shadow-2);
  padding:20px 28px 24px}
.s-head{display:flex;align-items:flex-end;gap:14px 20px;flex-wrap:wrap;margin-bottom:14px}
.s-titles{flex:1 1 560px;min-width:0}
.s-no{display:flex;align-items:center;gap:10px;font-family:var(--round);font-weight:800;color:var(--pink-deep);
  font-size:var(--fs-label);letter-spacing:.06em;margin-bottom:8px}
.s-chip{background:var(--pink);color:#fff;border-radius:999px;padding:0 10px;letter-spacing:0}
.s-of{color:var(--ink-4);letter-spacing:0}
/* ★ 見出しのピル（仕上げ C 2026-09-25）。参考書のピルと同じ作り＝平らな地・内側の白い破線（縫い目）・外側の淡い縁。
     前は下に 4px の台（押せるボタンと同じ形）があり、押せない見出しが押せそうに見えていた。台を外し、縁に替える。
     白い字は濃いミントで細く縁取る（黄の題字と同じ「縁取り文字」）。明るいミントの上の白は、投影すると輪郭が溶ける。 */
.pill{position:relative;display:inline-flex;align-items:center;gap:12px;font-family:var(--round);font-size:clamp(1.45rem,2.2vw,1.9rem);
  color:#fff;background:var(--pill);padding:8px 30px 8px 18px;border-radius:999px;line-height:1.3;
  box-shadow:0 0 0 3px var(--main-line);
  text-shadow:1.5px 0 0 var(--main-dark),-1.5px 0 0 var(--main-dark),0 1.5px 0 var(--main-dark),0 -1.5px 0 var(--main-dark),
    1px 1px 0 var(--main-dark),-1px 1px 0 var(--main-dark),1px -1px 0 var(--main-dark),-1px -1px 0 var(--main-dark),
    0 3px 0 rgba(31,111,102,.3)}
.pill::after{content:"";position:absolute;inset:5px;border:2px dashed rgba(255,255,255,.9);border-radius:999px;pointer-events:none}
.pill svg{width:24px;height:24px;flex:0 0 auto}
/* 文字を拡大したとき、題の字も地の文と同じ割合で大きくする（前は 30.4px → 31.7px にしか伸びず、地の文 19.5px との差が詰まっていた） */
html.big .pill{font-size:clamp(1.45rem,calc(2.2vw + .3rem),1.9rem)}
.s-lead{color:var(--ink-2);font-size:1.04rem;margin-top:10px;max-width:52em}
.s-right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.s-body{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.s-body.wide{grid-template-columns:minmax(0,1fr)}
.s-side{display:grid;gap:14px;align-content:start}

/* 切り替え（枚の中） */
.segmented{display:inline-flex;gap:3px;padding:4px;background:var(--main-soft);border-radius:999px;border:2px solid var(--main-line)}
.segmented button{background:transparent;border:none;color:var(--main-dark);padding:5px 16px;border-radius:999px;
  font-size:var(--fs-body);font-weight:800;white-space:nowrap;font-family:var(--round)}
.segmented button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--main-line)}

/* 状態の札 */
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 14px;font-weight:800;
  font-size:var(--fs-label);border:2px solid var(--line);background:#fff;color:var(--ink-2);white-space:nowrap}
.badge.ok{background:var(--hit-soft);border-color:var(--hit);color:var(--hit)}
.badge.ask{background:var(--ask-soft);border-color:var(--ask);color:#7a5200}
.badge.stop{background:var(--stop-soft);border-color:var(--stop);color:var(--stop)}

/* カード・ポイント */
.card{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card h3{font-family:var(--round);font-size:1.04rem;color:var(--main-dark);margin-bottom:8px}
/* ★ カードの見出しの格（仕上げ C 2026-09-25）
     前は「ポイント」も「押してみる」も同じ小さなミントの字で、どれがその枚で覚えることなのかが形で分からなかった。
     ポイント＝濃いミントの札（参考書の丸番号の上の札と同じ形）。そのほかの見出し＝参考書の小見出しと同じ「★」。 */
.card.points-card>h3{display:inline-block;background:var(--main-dark);color:#fff;border-radius:999px;padding:1px 16px;
  font-size:var(--fs-body);letter-spacing:.08em;margin-bottom:12px}
.card:not(.points-card)>h3::before,.c4-cheat-h::before,.cv-h::before{content:"★";color:var(--main);margin-right:.3em}
.points{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.points li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;color:var(--ink-2);align-items:start}
mark{background:linear-gradient(transparent 52%,var(--marker) 52%);color:var(--ink);font-weight:800;padding:0 2px}
.mark{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font-style:normal;font-weight:800;
  display:inline-grid;place-items:center;font-size:var(--fs-label);font-family:var(--round);flex:0 0 auto;
  box-shadow:0 0 0 2px #fff;line-height:1}
.jw-nb{white-space:nowrap}   /* キーの札と、続く助詞をまとめた箱（core.js の jwTree が作る） */
.kbd{display:inline-block;border:1.5px solid #bca99a;border-bottom-width:3px;border-radius:6px;background:#fff;
  padding:0 7px;font-size:var(--fs-label);font-weight:800;line-height:1.6;margin:0 2px;font-family:inherit;color:var(--ink)}

/* 作業盤（点の地） */
.stage{position:relative;background:radial-gradient(circle,#efe6d8 1.2px,transparent 1.3px) 0 0/16px 16px,#fdfaf3;
  border:2px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.stage-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--line);background:#fff;
  border-radius:999px;padding:7px 16px;font-size:var(--fs-body);font-weight:800;font-family:var(--round);
  box-shadow:0 3px 0 var(--line)}
.btn:hover{border-color:var(--main)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--pink);border-color:var(--pink-deep);color:#fff;box-shadow:0 3px 0 var(--pink-deep)}
.btn.mint{background:var(--main-deep);border-color:var(--main-dark);color:#fff;box-shadow:0 3px 0 var(--main-dark)}
.btn:disabled{background:var(--paper-2);color:var(--ink-4);border-color:var(--line);box-shadow:none;transform:none}
.btn[aria-pressed=true]{background:var(--main-soft);border-color:var(--main-deep);color:var(--main-dark)}

.diagram-scroll{min-width:0}


/* ── やってみる（自分の PC で）──────────────────── */
.tryit{margin-top:16px;border-radius:var(--r);background:var(--peach);border:2px solid var(--peach-line);padding:12px 18px;
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.tryit .ti{font-family:var(--round);font-weight:800;color:#fff;background:var(--orange);border-radius:999px;
  padding:3px 14px;white-space:nowrap;font-size:var(--fs-body)}
.ti-lead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.ti-os{font-size:var(--fs-label);font-weight:800;color:var(--orange)}
.tryit ol{margin:4px 0 0;padding-left:1.4em;color:var(--ink-2)}

/* ── これもチェック！（補足）──────────────────── */
details.check{margin-top:14px;border-radius:var(--r);background:var(--main-soft);border:2px solid var(--main-line)}
details.check summary{cursor:pointer;list-style:none;padding:12px 18px;font-family:var(--round);font-weight:800;
  color:var(--main-dark);font-size:1.04rem;display:flex;align-items:center;gap:12px}
details.check summary::-webkit-details-marker{display:none}
details.check .ctag{background:#fff;color:var(--brown);border:2px solid var(--brown);border-radius:999px;
  padding:0 12px;font-size:var(--fs-label);transform:rotate(-5deg);white-space:nowrap;flex:0 0 auto}
details.check .ct{flex:1}
details.check summary::after{content:"＋";width:30px;height:30px;border-radius:50%;background:#fff;flex:0 0 auto;
  display:grid;place-items:center;color:var(--main-deep);border:2px solid var(--main-line)}
details.check[open] summary::after{content:"−"}
details.check .dbody{padding:0 18px 16px;color:var(--ink-2)}
details.check .dbody p{margin-top:10px}
.dfig{margin-top:12px;background:#fff;border:2px solid var(--main-line);border-radius:14px;padding:12px;overflow-x:auto}
table.mini{border-collapse:collapse;width:100%;font-size:var(--fs-body);background:#fff}
table.mini th{font-size:var(--fs-label);font-weight:800;color:#fff;background:var(--pink);padding:6px 10px;text-align:left}
table.mini td{padding:6px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.mini tr:nth-child(even) td{background:#fffaf5}

/* ── 理解の確認 ─────────────────────────────── */
.quiz{border:2px solid var(--line);border-top:5px solid var(--pink);border-radius:var(--r);background:#fff;padding:18px 20px;margin-top:14px}
.quiz .qtag{display:inline-block;padding:2px 12px;border-radius:999px;font-size:var(--fs-label);font-weight:800;
  background:var(--pink-soft);color:var(--pink-deep);margin-right:10px;font-family:var(--round)}
.quiz h3{display:inline;font-family:var(--round)}
.quiz .qq{margin:10px 0 12px;font-weight:700}
.qopts{display:flex;gap:10px;flex-wrap:wrap}
.qopt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 16px;min-height:44px;max-width:100%;
  font-size:var(--fs-body);font-weight:700;text-align:left}
.qopt:hover{border-color:var(--main)}
.qopt.ok{background:var(--hit-soft);border-color:var(--hit);color:var(--hit)}
.qopt.ng{background:var(--stop-soft);border-color:var(--stop);color:var(--stop)}
.qopt.chosen{box-shadow:0 0 0 2px var(--ink) inset}
.qhead{margin-top:12px;font-weight:800}
.qhead.ok{color:var(--hit)} .qhead.ng{color:var(--stop)}
.qwhy{margin-top:6px;color:var(--ink-2);display:none}
.qwhy.on{display:block}

/* ── 参考書の入口（枚の中）としおり ─────────────── */
.booktag{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--brown);background:#fff7e0;color:var(--brown);
  border-radius:999px;padding:4px 14px;font-weight:800;font-family:var(--round);font-size:var(--fs-label)}
.booktag b{background:var(--brown);color:#fff;border-radius:999px;padding:0 8px}
.booktag:hover{background:var(--yellow)}
.shiori{position:fixed;right:0;top:38%;z-index:40;display:flex;flex-direction:column;align-items:center;gap:8px;
  background:var(--brown);color:#fff;border:none;border-radius:14px 0 0 14px;padding:14px 8px;font-family:var(--round);
  font-weight:800;font-size:var(--fs-label);box-shadow:-4px 6px 16px -8px rgba(0,0,0,.5);
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 2px,transparent 2px 4px)}
.shiori .sh-t{writing-mode:vertical-rl;letter-spacing:.2em}
.shiori b{background:var(--yellow);color:var(--brown);border-radius:999px;padding:0 7px}
.shiori:hover{padding-right:14px}

/* ── 引き出し（参考図書）───────────────────────── */
.scrim{position:fixed;inset:0;z-index:45;background:rgba(58,45,39,.32);border:none;border-radius:0;padding:0;cursor:default}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(820px,94vw);z-index:50;background:#fffdf7;border-left:4px solid var(--brown);
  box-shadow:-24px 0 50px -30px rgba(0,0,0,.6);display:flex;flex-direction:column}
.dr-head{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--brown);color:#fff}
.dr-ico{width:36px;height:36px;border-radius:10px;background:#fff7e0;display:grid;place-items:center;flex:0 0 auto}
.dr-kick{font-size:var(--fs-label);letter-spacing:.2em;color:var(--yellow);font-weight:800;font-family:var(--round)}
.dr-title{font-family:var(--round);font-weight:800;font-size:1.1rem}
.dr-shelf{margin-left:auto;border-radius:999px;border:2px solid rgba(255,255,255,.4);background:transparent;color:#fff;
  padding:4px 14px;font-weight:800;font-size:var(--fs-label);white-space:nowrap}
.dr-shelf.on{background:var(--yellow);color:var(--brown);border-color:var(--yellow)}
.dr-x{border-radius:50%;width:36px;height:36px;border:2px solid rgba(255,255,255,.4);background:transparent;color:#fff;font-weight:800}
.dr-body{flex:1;overflow:auto;padding:16px 22px 18px}
.dr-tabs{display:flex;gap:8px;flex-wrap:wrap}
.dr-tab{border:2px solid var(--line);border-radius:999px;padding:2px 14px;font-weight:800;font-size:var(--fs-label);background:#fff;color:var(--ink-3)}
.dr-tab.on{background:var(--pink);border-color:var(--pink-deep);color:#fff}
.dr-cap{margin-top:12px;background:#fff;border-left:5px solid var(--pink);border-radius:0 12px 12px 0;padding:10px 14px;color:var(--ink);font-weight:700}
.taped{position:relative;margin:26px 6px 8px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px;
  box-shadow:0 12px 26px -16px rgba(0,0,0,.45);transform:rotate(-.4deg)}
.taped::before,.taped::after{content:"";position:absolute;top:-13px;width:96px;height:24px;background:rgba(255,216,74,.72);border-radius:3px}
.taped::before{left:12%;transform:rotate(-4deg)}
.taped::after{right:12%;transform:rotate(3deg)}
.tp-img{display:block;width:100%;padding:0;border:none;border-radius:0;background:#fff;cursor:zoom-in}
.tp-img img{display:block;width:100%;height:auto}
.taped figcaption{margin-top:10px}
.taped cite{font-style:normal;font-size:var(--fs-label);color:var(--ink-3);font-weight:700}
.clip-empty{display:grid;place-items:center;min-height:160px;background:var(--paper-2);border:2px dashed var(--line);color:var(--ink-4);font-size:var(--fs-body)}
.dr-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:12px}
.dr-nav{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);font-weight:800;font-size:1.1rem}
.dr-count{font-weight:800;font-family:var(--round);min-width:4em;text-align:center}
.dr-zoom{border-radius:999px;border:2px solid var(--brown);padding:4px 16px;font-weight:800;background:#fff7e0;color:var(--brown)}
.dr-keys{margin-left:auto;font-size:var(--fs-label);color:var(--ink-3)}
.dr-note{color:var(--ink-3);font-size:var(--fs-label)}
.sh-row{margin-top:14px;border-top:2px dashed var(--line);padding-top:10px}
.sh-slide{font-family:var(--round);font-weight:800;color:var(--pink-deep)}
.sh-clips{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.sh-clip{display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--line);border-radius:12px;padding:6px 12px;background:#fff;font-size:var(--fs-body)}
.sh-clip b{color:var(--brown);font-size:var(--fs-label);white-space:nowrap}
.zoom{position:fixed;inset:0;z-index:60;display:grid;place-items:center}
.zoom-bg{position:absolute;inset:0;background:rgba(30,22,18,.78);border:none;border-radius:0;cursor:zoom-out}
.zoom-in{position:relative;max-width:96vw;max-height:94vh;overflow:auto;background:#fff;border-radius:6px;padding:12px}
.zoom-in .zimg{display:block;max-width:min(94vw,1600px);width:auto;height:auto}
.zoom-in p{font-size:var(--fs-label);color:var(--ink-3);margin-top:6px}

/* ── 下の送り ───────────────────────────────── */
.pager{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:18px}
.pager .btn{max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg-next{background:var(--pink);border-color:var(--pink-deep);color:#fff;box-shadow:0 3px 0 var(--pink-deep)}
.pg-next:hover{border-color:var(--pink-deep)}
.pg-count{font-family:var(--round);font-weight:800;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:2px}
.pg-keys{font-size:var(--fs-label);font-weight:700}
.foot{margin-top:26px;padding:20px 0 40px;border-top:2px dashed var(--line);color:var(--ink-4);font-size:var(--fs-label);
  display:flex;justify-content:flex-end;gap:16px;flex-wrap:wrap;font-weight:700}   /* 大学名は右に残す（左の科目名を外した） */

/* ── 表紙 ────────────────────────────────────── */
.slide.cover{padding:0;overflow:hidden}
.awning{height:34px;background:repeating-linear-gradient(90deg,var(--main) 0 44px,#dff3ef 44px 88px)}
.scallop{height:18px;margin-top:-1px;background:
  radial-gradient(circle at 22px 0,var(--main) 21px,transparent 22px) 0 0/88px 18px repeat-x,
  radial-gradient(circle at 66px 0,#dff3ef 21px,transparent 22px) 0 0/88px 18px repeat-x}
.flowers{height:26px;background:
  radial-gradient(circle,#ffe78a 5px,transparent 6px) 10px 6px/64px 26px,
  radial-gradient(circle,#bfe6d9 5px,transparent 6px) 42px 12px/64px 26px,
  radial-gradient(circle,#f9c9d2 4px,transparent 5px) 26px 16px/64px 26px}
.bignum{width:150px;height:150px;border-radius:50%;background:var(--pink);display:grid;place-items:center;
  position:relative;color:#fff;flex:0 0 auto}
/* 参考書の章番号の丸と同じ、内側の白い破線（前は実線の輪）。札（.tag）は輪の上に重ねる */
.bignum::after{content:"";position:absolute;inset:8px;border:2.5px dashed rgba(255,255,255,.95);border-radius:50%;pointer-events:none}
.bignum .tag{z-index:1}
.bignum b{font-family:var(--round);font-size:4.2rem;line-height:1;letter-spacing:-.04em}
.bignum .tag{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--main-deep);color:#fff;
  font-family:var(--round);font-weight:800;font-size:var(--fs-label);padding:2px 14px;border-radius:999px;
  border:2px solid #fff;white-space:nowrap;letter-spacing:.06em}
.title-yellow{font-family:var(--round);font-size:clamp(2.1rem,3.6vw,3.1rem);line-height:1.25;color:var(--yellow);
  text-shadow:3px 0 0 var(--brown),-3px 0 0 var(--brown),0 3px 0 var(--brown),0 -3px 0 var(--brown),
    2px 2px 0 var(--brown),-2px -2px 0 var(--brown),2px -2px 0 var(--brown),-2px 2px 0 var(--brown),
    4px 5px 0 rgba(74,50,38,.25)}



/* ── 折返し ─────────────────────────────────── */
@media(max-width:1050px){
  .wrap{padding:0 24px}
  .chapters{grid-template-columns:repeat(4,minmax(0,1fr))}
  .s-body{grid-template-columns:minmax(0,1fr)}
  .drawer{width:min(760px,96vw)}
}
@media(max-width:760px){
  .wrap{padding:0 16px}
  .chapters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .slide{padding:16px 14px 18px;border-radius:20px}
  .diagram-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .diagram-scroll>.win,.diagram-scroll>.term,.diagram-scroll>svg,.diagram-scroll>.wide-min{min-width:640px}
  .tryit{grid-template-columns:1fr}
  .dr-keys,.pg-keys{display:none}
  .bignum{width:110px;height:110px}.bignum b{font-size:3rem}
}
@media(max-width:560px){
  .brand .course{display:none}
  .header-actions .plain{padding:6px 10px}
  .chapters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pager .btn{max-width:44%}
}
@media(max-width:430px){
  .brand>span:not(.brand-icon){display:none}
}

/* 共通の直し（章の作り手の報告 2026-09-24） */
.win.no-nav .w-body{grid-template-columns:minmax(0,1fr)}
.win.no-nav .w-nav{display:none}
.w-status.hot,.w-tab.hot,.m-bar.hot{outline:3px solid var(--red);outline-offset:-3px}
.s-ctl{margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.qopt code{overflow-wrap:anywhere}

/* 拡大したとき、章ナビの「ダウンロード」が 3px 足りずに「ダウンロ…」になっていた。余白を詰める */
html.big .chapter{padding:6px 6px;gap:5px}
/* 文節で折り返す（core.js の jwTree が ZWSP を入れる。入れられるブラウザのときだけ html に .jw が付く）。
   コード・キーボード・ターミナルの中は、ふつうの折返しのまま */
html.jw body{word-break:keep-all}
html.jw :is(code,pre,kbd,textarea,input,.t-body,.kb){word-break:normal}
/* 前後の枚のボタン: 題を「…」で切らず、文節で 2 行に折る（狭い画面で題が読めなかった） */
.pager .btn{white-space:normal;overflow:visible;text-overflow:clip;text-align:center}

/* ── 仕上げ C（デザイン 2026-09-25）────────────────────────────────
   ★ 左右の列の下端を揃える。前は右の列（ポイント・参考書の札）が盤より 75〜185px 短く、
     「参考書の誌面を見る」の札が列の途中に浮いていた（2-1・3-1・5-1・5-2・7-1・7-2・8）。
     盤と右の列を同じ高さに伸ばし、参考書の札を列の下端に置く。右の列のほうが長い枚（4-1）は、盤の点の地が下まで伸びる。
     高さは 2 列のうち長いほうのままなので、1 画面の収まりは変わらない。 */
.s-body{align-items:stretch}
.s-side{display:flex;flex-direction:column;gap:14px}
.s-side>.booktag:last-child{margin-top:auto}
/* 右の列のほうが長い枚（Mac の Finder は Explorer より背が低い・文字を拡大したとき）: 盤をそのまま伸ばすと、点の地だけが 50〜190px 空く。
   盤の頭が窓の模型の枚（2-2・3-1・5-1・5-2）と 3-2 では、窓を下へ伸ばして埋める（本物の窓も、一覧の下は空いている）。
   それ以外の盤は中身の高さのまま（前と同じ）。:has の無いブラウザでは、前と同じ形に戻るだけ */
.s-body>.stage{align-self:start}
/* 窓の模型は 3 通りの包まれ方をしている: 盤 > 図の器 > 窓（2-2・5-1・5-2）／盤 > 図の器 > .c3-win > 窓（3-1）／盤 > .c3-board > 図の器 > .c3-walk > 窓（3-2） */
.s-body>.stage:has(>.diagram-scroll:first-child>.win),.s-body>.stage:has(>.diagram-scroll:first-child>.c3-win>.win),
.s-body>.stage:has(>.c3-board){align-self:stretch;display:flex;flex-direction:column}
.s-body>.stage>.diagram-scroll:first-child:has(>.win),.s-body>.stage>.diagram-scroll:first-child:has(>.c3-win>.win),
.s-body>.stage>.c3-board{flex:1 1 auto}
.s-body>.stage>.diagram-scroll:first-child:has(>.win),.s-body>.stage>.diagram-scroll:first-child:has(>.c3-win>.win),
.s-body>.stage>.diagram-scroll:first-child>.c3-win,.s-body>.stage>.c3-board>.diagram-scroll,.s-body>.stage>.c3-board>.diagram-scroll>.c3-walk{display:flex;flex-direction:column}
.s-body>.stage>.diagram-scroll:first-child>.win,.s-body>.stage>.diagram-scroll:first-child>.c3-win>.win,
.s-body>.stage>.c3-board>.diagram-scroll>.c3-walk>.win{flex:1 1 auto;display:flex;flex-direction:column}
.s-body>.stage>.diagram-scroll:first-child>.win>.w-body,.s-body>.stage>.diagram-scroll:first-child>.c3-win>.win>.w-body,
.s-body>.stage>.c3-board>.diagram-scroll>.c3-walk>.win>.w-body{flex:1 1 auto}
/* ★ 押したときの手応え。.btn と命令の札にはあった沈み込みを、ほかの押すものにも付ける（transform だけ） */
.chapter:active,.qopt:active,.booktag:active,.gtip:active,.cv-card:active,.c43-item:active,.dr-tab:active,.sh-clip:active{transform:translateY(1px)}

/* ── 値を連続で動かす（ui.js の rangeCtl。押して動くものの型 6）───────────────── */
.rng{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:var(--fs-body)}
.rng-l{font-weight:700;color:var(--ink-2)}
.rng input[type=range]{flex:1 1 12rem;min-width:8rem;accent-color:var(--main-deep);height:28px}
.rng-v{font-family:var(--mono);font-variant-numeric:tabular-nums;min-width:4em;color:var(--ink)}
/* 式（ui.js の mx。組むときに描いた SVG）。行の中の式は字の並びに乗せ、独立の式は中央に置く */
.mx{display:inline-block;vertical-align:middle;line-height:1}
.mx svg{display:inline-block}
.mx-d{display:block;margin:10px auto;text-align:center;max-width:100%;overflow-x:auto}
/* 図の上で指す所（data-pick）。押せることが形で分かるように、指の形と、キーで選んだときの輪 */
[data-pick]{cursor:pointer}
[data-pick]:focus-visible{outline:3px solid var(--red);outline-offset:2px}

/* ═════ sp.css ═════ */
/* ═════ sp.css — 補足の厚い形（details.check.sp）。この中だけに効く（2026-09-26）═════
   ★ v1 の器（style.css）の上で成り立つ。色は v1 のトークンだけから引く（16 進を足さない。例外は画面の模型の年代の色＝sp.js の style、
     v1 の .badge.ask と同じ琥珀の字 #7a5200、模型のアプリの窓 .sp-aw の色）。v2 の上書きは theme-v2.css の末尾
   ★ 字の大きさは 2 段だけ: 文は var(--fs-body)（16px・拡大で 19.5px）、札・年・番号・出典は var(--fs-label)（14px・拡大で 17.1px）。
     14px の札のクラスは qa_drive.py の LABEL_SEL に並べてある。足したら、そちらにも足す
   ★ 狭い画面で横に動くものを作らない（sp の中に .diagram-scroll は置かない）。字の無い絵だけが縮む
   ★ イラスト（自作の SVG）を置いてよいのは details.check.sp の中だけ（本人 2026-09-26 の依頼。spec/20 §7 の例外） */

/* ── 絵の色（v1）。v2 は theme-v2.css の末尾で同じ名前を塗り替える ── */
.sp{
  --sp-ink:var(--brown);        /* 線 */
  --sp-paper:#fff;              /* 紙 */
  --sp-a:var(--main-soft);      /* 主の淡い色（台座・道具の胴） */
  --sp-b:var(--pink-soft);      /* 差し色の淡い色（ひもの穴・消しゴム） */
  --sp-c:var(--yellow);         /* 印（1 枚に 1 か所だけ） */
  --sp-sh:var(--line);          /* 奥・影 */
  --sp-box:var(--peach);        /* 箱の地 */
  --sp-hl:var(--red);           /* 注目の輪・番号札の引き出し線（画面の中の場所を指す） */
  --sp-bg:var(--main-soft);     /* 扉の絵の地 */
  --sp-l1:var(--pink);          /* 路線図: 途中で終わる系統 */
  --sp-l2:var(--main-deep);     /* 路線図: いまに続く系統 */
  --sp-arw:var(--main-deep);    /* 矢印 */
  --sp-dy:1.125rem;             /* 路線図: 1 行目の字の中心（駅の点の高さ） */
}

/* ── 絵（SVG）の塗りと線 ── */
.sp-art{display:block;width:100%;height:auto;overflow:visible}
.sp-art .sp-ln{stroke:var(--sp-ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.sp-art .sp-ln1{stroke:var(--sp-ink);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.sp-art .sp-hl{fill:none;stroke:var(--sp-hl);stroke-width:3;vector-effect:non-scaling-stroke}
.sp-art .sp-dash{stroke-dasharray:5 4}
.sp-art .sp-none{fill:none}
.sp-art .sp-p{fill:var(--sp-paper)}
.sp-art .sp-a{fill:var(--sp-a)}
.sp-art .sp-b{fill:var(--sp-b)}
.sp-art .sp-c{fill:var(--sp-c)}
.sp-art .sp-sh{fill:var(--sp-sh)}
.sp-art .sp-k{fill:var(--sp-ink)}
.sp-art .sp-box{fill:var(--sp-box)}
.sp-art .sp-stopf{fill:var(--stop)}
.sp-art .sp-wl{stroke:#fff;stroke-width:2.4;stroke-linecap:round;fill:none}
.sp-art .sp-hotl{fill:none;stroke:var(--sp-hl);stroke-width:2.5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.sp-art .sp-hotf{fill:var(--sp-hl);stroke:#fff;stroke-width:1.5;vector-effect:non-scaling-stroke}
.sp-art .sp-arl{fill:none;stroke:var(--sp-arw);stroke-width:3;stroke-linecap:round}
.sp-art .sp-arf{fill:var(--sp-arw)}

/* ── 見出しの行（閉じた状態） ── */
.sp-thumb{flex:0 0 auto;width:64px;height:40px;border-radius:8px;overflow:hidden;background:#fff;border:2px solid var(--main-line)}
.sp-thumb svg{display:block;width:100%;height:100%}

/* ── 本体 ── */
details.check.sp .dbody{padding:4px 18px 20px}
details.check .dbody .sp-body p{margin:0}
.sp-body{display:grid;gap:18px;min-width:0}
.sp-body h3,.sp-body h4{margin:0}
.sp-lead{color:var(--ink-2)}
.sp-lead-solo{max-width:52em}

/* 扉（大きな見出しの図） */
.sp-hero{display:grid;grid-template-columns:minmax(0,11fr) minmax(0,10fr);background:#fff;border:2px solid var(--main-line);border-radius:18px;overflow:hidden}
.sp-hero-art{display:flex;align-items:flex-end;justify-content:center;padding:18px 18px 0;
  background:radial-gradient(var(--main-line) 1.3px,transparent 1.6px) 0 0/18px 18px,var(--sp-bg)}
.sp-hero-fig{width:100%;max-width:600px;min-width:0}
.sp-hero-yrs{display:grid;justify-items:center;gap:6px;padding:6px 0 12px}
.sp-hero-yr{font-family:var(--round);font-weight:800;font-size:var(--fs-label);line-height:1.6;color:var(--ink);background:#fff;
  border:2px solid var(--main-line);border-radius:999px;padding:0 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sp-hero-txt{display:flex;flex-direction:column;justify-content:center;gap:10px;padding:22px 26px;min-width:0}
.sp-kicker{font-family:var(--round);font-weight:800;font-size:var(--fs-label);letter-spacing:.1em;color:var(--pink-deep)}
.sp-h{font-family:var(--round);font-weight:800;font-size:clamp(1.4rem,2.1vw,1.8rem);line-height:1.35;color:var(--ink)}
.sp-h>span{background:linear-gradient(transparent 62%,var(--marker) 62%)}
.sp-hero-chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

/* 見開き（左右 2 ページ。真ん中にのど）。3 つ目のページ（fill）は短いほうの下へ回して、左右の高さをそろえる */
.sp-spread{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:2px solid var(--line);border-radius:18px;
  background:linear-gradient(90deg,transparent calc(50% - 22px),rgba(74,50,38,.06) 50%,transparent calc(50% + 22px)),var(--bg-2)}
.sp-spread::before{content:"";position:absolute;top:16px;bottom:16px;left:50%;border-left:2px dashed var(--line)}
.sp-spread-f{grid-template-rows:auto 1fr;grid-template-areas:"l r" "l f"}
.sp-spread-f.sp-fill-l{grid-template-areas:"l r" "f r"}
.sp-spread-f>.sp-page-l{grid-area:l}
.sp-spread-f>.sp-page-r{grid-area:r}
.sp-spread-f>.sp-page-fill{grid-area:f;padding-top:4px}
.sp-page{min-width:0;padding:18px 22px 22px;display:flex;flex-direction:column;gap:10px}
.sp-ph{display:flex;align-items:center;gap:10px;font-family:var(--round);font-weight:800;font-size:1.12rem;line-height:1.4;color:var(--ink)}
.sp-no{flex:0 0 auto;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--pink);color:#fff;
  font-style:normal;font-size:var(--fs-label);font-weight:800}
.sp-txt{color:var(--ink-2)}

/* 鋭い一言（案 C の KEY） */
.sp-key{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:start;background:#fff;border:2px solid var(--line);
  border-left:6px solid var(--pink-deep);border-radius:14px;padding:12px 16px}
.sp-key-lbl{font-family:var(--mono);font-size:var(--fs-label);font-weight:800;letter-spacing:.08em;line-height:1.7;color:#fff;background:var(--pink-deep);
  border-radius:6px;padding:0 8px;white-space:nowrap}
.sp-key p{font-weight:800;color:var(--ink)}

/* 路線図（年表の系統）。駅の行は、線 2 本の欄・年・名前 */
.sp-legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:var(--fs-label);font-weight:700;color:var(--ink-3)}
.sp-legend span{display:inline-flex;align-items:center;gap:6px}
.sp-sw{display:inline-block;width:22px;height:5px;border-radius:3px;font-style:normal}
.sp-sw.l1{background:var(--sp-l1)} .sp-sw.l2{background:var(--sp-l2)}
/* 系統の外の印（凡例の 3 つ目。駅の印と同じ点線の菱形。2026-09-26） */
.sp-sw.aside{width:12px;height:12px;margin:0 5px;border-radius:1px;box-sizing:border-box;border:2px dotted var(--ink-4);background:#fff;transform:rotate(45deg)}
.sp-rail{list-style:none;margin:2px 0 0;padding:0}
.sp-st{display:grid;grid-template-columns:52px 3.2em minmax(0,1fr);column-gap:10px}
.sp-lanes{display:grid;grid-template-columns:26px 26px}
.sp-lane{position:relative;font-style:normal}
.sp-lane.l1{--ln:var(--sp-l1)} .sp-lane.l2{--ln:var(--sp-l2)}
.sp-lane::before{content:"";position:absolute;left:50%;width:4px;margin-left:-2px;top:0;bottom:0;background:var(--ln)}
.sp-lane.none::before{content:none}
.sp-lane.start::before{top:var(--sp-dy)}
.sp-lane.end::before{bottom:auto;height:var(--sp-dy)}
.sp-lane:is(.dot,.start,.end)::after{content:"";position:absolute;left:50%;top:var(--sp-dy);width:16px;height:16px;margin:-8px 0 0 -8px;
  border-radius:50%;background:#fff;border:3.5px solid var(--ln);box-sizing:border-box;z-index:1}
/* 合流（1 本目の線が曲がって 2 本目の駅に入る）と乗り換え（破線） */
.sp-lane:is(.join,.xfer)::before{content:"";bottom:auto;height:calc(var(--sp-dy) - 12px)}
.sp-lane:is(.join,.xfer)::after{content:"";position:absolute;left:calc(50% - 2px);top:calc(var(--sp-dy) - 14px);width:28px;height:16px;
  border-left:4px solid var(--ln);border-bottom:4px solid var(--ln);border-bottom-left-radius:14px;box-sizing:border-box}
.sp-lane.xfer::before{background:none;border-left:4px dashed var(--ln);width:0}
.sp-lane.xfer::after{border-left-style:dashed;border-bottom-style:dashed}
/* どちらの系統にも入らない駅（st の値 "aside"）。線を引かず、点線の菱形だけを置く。
   隣の欄の線が通っていても、その系統の駅ではないと見分けられるように（Mac の路線図の Xerox Alto・Apple Lisa。2026-09-26） */
.sp-lane.aside::before{content:none}
.sp-lane.aside::after{content:"";position:absolute;left:50%;top:var(--sp-dy);width:16px;height:16px;margin:-8px 0 0 -8px;box-sizing:border-box;
  border:2px dotted var(--ink-4);border-radius:2px;background:#fff;transform:rotate(45deg);z-index:1}
  /* 破線（dashed）は 2px 以上だと、等倍の画面で角の 4 つの鉤（「<·>」）に見えた。点線にすると菱形の切れた縁に読める（2026-09-26 に 7 通りを撮って決めた） */
.sp-st-y{padding-top:.375rem;line-height:1.5rem;font-family:var(--round);font-weight:800;font-size:var(--fs-label);color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.sp-st-n{padding:.375rem 0 .55rem;line-height:1.5rem;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;min-width:0}
.sp-st-n b{color:var(--ink)}
.sp-ver{font-family:var(--mono);font-size:var(--fs-label);font-weight:700;color:var(--ink-3);border:1.5px solid var(--line);border-radius:6px;padding:0 5px;line-height:1.45}
.sp-st-p{flex-basis:100%;color:var(--ink-2);line-height:1.6}

/* 標本（字の無い図つきの札） */
.sp-specs{display:grid;gap:10px}
.sp-spec{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.sp-spec-t{flex:1 1 13rem;min-width:0;display:grid;gap:2px}
.sp-spec-h{font-weight:800;color:var(--ink);display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px}
.sp-y{font-family:var(--round);font-size:var(--fs-label);font-weight:800;color:var(--pink-deep);font-variant-numeric:tabular-nums}
.sp-spec-p{color:var(--ink-2);line-height:1.6}
.sp-spec-fig{flex:1 1 11rem;max-width:280px;min-width:0}
.sp-spec-fig .sp-mac{max-width:240px}

/* 標本の格子（画面の模型を並べる） */
.sp-grid{--sp-cell:11.5rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--sp-cell)),1fr));gap:12px}
.sp-cell{margin:0;min-width:0;display:flex;flex-direction:column;gap:6px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 8px 10px}
.sp-cell-fig{border-radius:8px;overflow:hidden;border:2px solid var(--sp-ink);line-height:0}
.sp-cell-fig .sp-shot{border-radius:6px}
.sp-cell figcaption{display:grid;gap:2px;padding:0 4px;min-width:0}
.sp-cell-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px;line-height:1.45}
.sp-cell-n{font-weight:800;color:var(--ink)}
.sp-cell-p{color:var(--ink-2);line-height:1.6}


/* 図の札 */
.sp-plate{margin:0;background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 20px 18px;display:grid;gap:12px;min-width:0}
/* 題の頭の番号は、ページの見出し（.sp-ph）と同じ札（.sp-no）。「図 5」と書くと図 1〜4 を探してしまう（2026-09-26） */
.sp-plate figcaption{display:flex;align-items:center;gap:10px;font-family:var(--round);font-weight:800;font-size:1.12rem;line-height:1.4;color:var(--ink)}

/* 数の並び（段ごとに 年の札＋番号の札。760px 以下と見開きの半ページでは、段の見出しを上に） */
.sp-nums{display:grid;gap:8px;container:sp-nums/inline-size}
.sp-numrow-l{display:grid;grid-template-columns:9.5em minmax(0,1fr);align-items:center;gap:4px 12px}
.sp-numh{font-size:var(--fs-label);font-weight:800;color:var(--ink-3)}
.sp-numrow{display:flex;flex-wrap:wrap;gap:4px}
.sp-num{font-family:var(--mono);font-size:var(--fs-label);font-weight:700;line-height:1.7;padding:0 6px;border-radius:7px;border:2px solid var(--main-line);background:var(--main-soft);color:var(--ink)}
/* ★ 番号の札の色は、路線図の凡例と同じ意味にする。並ぶ版はどれも「いまに続く系統」の版なので、g1・g2 は主の淡い色のまま。
     前は g2（11〜15）を桃にしていて、同じ見開きの凡例の「Mac OS 9 までの系統」の色と重なった（2026-09-26）。g3 は凡例に無い色なので残す */
.sp-numrow-l.g3 .sp-num{border-color:var(--yellow);background:var(--marker)}
.sp-numrow-l .sp-num.skip{border-style:dashed;border-color:var(--ink-4);background:transparent;color:var(--ink-3);text-decoration:line-through}
/* 見開きの半ページでは段の見出しを上に置く（左に 9.5em 取ると、右ページの 8 枚が 6＋2・7＋1 に割れた。2026-09-26） */
.sp-page .sp-numrow-l{grid-template-columns:minmax(0,1fr)}
/* 8 枚が 1 行に入らない幅では 5＋3 に分ける（1 枚だけ次の段に回らないように）。幅は番号の並びの器で測る。
   8 枚の幅は 1-1 の Mac の変遷で測って v1 26.6em・v2 25.6em（拡大では 24.9em・24.0em）。Windows の等幅の字体の差を見て 28.5em に引いた（2026-09-26） */
@container sp-nums (width < 28.5em){ .sp-numrow{display:grid;grid-template-columns:repeat(5,max-content)} }

/* 展開した木（案 C）。線は li ごとに引く（地の色で線を消す手を使わない） */
.sp-tree,.sp-tree ul{list-style:none;margin:0;padding:0}
.sp-tree{font-family:var(--mono);font-size:var(--fs-body);line-height:1.7;min-width:0}
.sp-tree ul{margin-left:.5em}
.sp-tree ul>li{position:relative;padding-left:1.4em}
.sp-tree ul>li::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:2px solid var(--line)}
.sp-tree ul>li:last-child::before{bottom:auto;height:.85em}
.sp-tree ul>li::after{content:"";position:absolute;left:0;top:.85em;width:1em;border-top:2px solid var(--line)}
.sp-tn{color:var(--ink);overflow-wrap:anywhere}
.sp-tn.dir{font-weight:800}
.sp-tree li.hl>.sp-tn{background:var(--marker);padding:0 4px;border-radius:4px}
.sp-ann{font-family:var(--round);font-size:var(--fs-label);color:var(--ink-3);margin-left:12px}
.sp-ann::before{content:"← "}

/* 豆知識の札（上にピン）。行ごとに高さがそろう。器（.sp-tidbox）の幅で列の数を知り、最後の段に 1 枚だけ残ったら横いっぱいにする */
.sp-tidbox{container:sp-tids/inline-size;min-width:0}
.sp-tids{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));align-items:stretch;gap:16px 14px;padding-top:6px}
.sp-tid{position:relative;background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px 16px 14px;box-shadow:0 3px 0 var(--line-2)}
.sp-tid::before{content:"";position:absolute;top:-8px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--pink);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.14)}
.sp-tid-h{display:inline-block;font-family:var(--round);font-weight:800;font-size:var(--fs-label);color:var(--brown);background:var(--marker);
  border-radius:999px;padding:0 10px}
.sp-tid p{margin-top:6px!important;color:var(--ink-2)}
/* 列の数は上の auto-fit（260px 以上・間 14px）で決まる: 2 列は 534px から、3 列は 808px から、4 列は 1082px から（2026-09-26。組んで測った） */
@container sp-tids (534px <= width < 808px){ .sp-tid:last-child:nth-child(2n+1){grid-column:1/-1} }
@container sp-tids (808px <= width < 1082px){ .sp-tid:last-child:nth-child(3n+1){grid-column:1/-1} }
@container sp-tids (1082px <= width){ .sp-tid:last-child:nth-child(4n+1){grid-column:1/-1} }

/* 資料 */
.sp-src{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:var(--fs-label);color:var(--ink-3);border-top:2px dotted var(--line);padding-top:10px}
.sp-src-h{flex:0 0 auto;font-weight:800;color:var(--ink-2);border:1.5px solid var(--ink-4);border-radius:999px;padding:0 8px}

/* 名前の札・判定の札・書き換えの例 */
/* ★ 名前の札は語の中では折らない（nowrap）。器より長いときだけ、本体と拡張子のあいだで 2 行に分ける（flex-wrap）。
     拡大 620px の 5-1 の図 3 で「<名前>.txt.docx」が器から 10px（v1）・2px（v2）出ていた（2026-09-26 の検査 contain-big） */
.sp-fname{display:inline-flex;flex-wrap:wrap;align-items:baseline;max-width:100%;font-family:var(--mono);font-weight:700;background:#fff;border:2px solid var(--brown);border-radius:8px;padding:0 8px;
  color:var(--ink);white-space:nowrap}
.sp-ext{color:var(--red)}
.sp-ext-none{font-family:var(--round);font-size:var(--fs-label);color:var(--ink-4)}
.sp-arrow{font-weight:800;color:var(--pink-deep);margin:0 6px}
.sp-vd{display:inline-block;flex:0 0 auto;font-size:var(--fs-label);font-weight:800;line-height:1.6;border:2px solid;border-radius:999px;padding:0 10px;margin-right:8px}
.sp-vd.stop{color:var(--stop);background:var(--stop-soft);border-color:var(--stop)}
.sp-vd.hit{color:var(--hit);background:var(--hit-soft);border-color:var(--hit)}
.sp-vd.ask{color:#7a5200;background:var(--ask-soft);border-color:var(--ask)}
.sp-case{display:grid;grid-template-columns:80px minmax(0,1fr);gap:6px 14px;align-items:center;padding:12px 0 2px;border-top:2px dashed var(--line)}
.sp-case-fig .sp-art{max-width:96px}
.sp-case-main{display:grid;gap:6px;min-width:0}
.sp-case-names{display:flex;flex-wrap:wrap;align-items:center;row-gap:4px}
.sp-case-res{color:var(--ink-2);line-height:1.6}

/* 先頭のバイト */
.sp-sig{display:grid;gap:8px}
.sp-sig-row{display:grid;grid-template-columns:26px 7.6em minmax(0,1fr);align-items:center;gap:6px 10px}
.sp-sig-n{font-family:var(--mono);font-weight:700;color:var(--ink)}
.sp-bytes{display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:middle}
.sp-byte{display:inline-grid;text-align:center;min-width:2.5em;font-family:var(--mono);border:2px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}
.sp-byte b{font-size:var(--fs-body);line-height:1.5;color:var(--ink)}
.sp-byte i{font-style:normal;font-size:var(--fs-label);line-height:1.5;color:var(--ink-3);border-top:1.5px dashed var(--line);background:var(--paper-2)}
.sp-byte.hot{border-color:var(--yellow)} .sp-byte.hot b{background:var(--marker)}
.sp-nobytes{color:var(--ink-3);font-weight:700}

/* 札 → 札 → 判定 の流れ */
.sp-flows{display:grid;gap:12px}
.sp-flow{display:grid;gap:6px}
.sp-flow-h{font-family:var(--round);font-weight:800;color:var(--ink)}
.sp-flow-r{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.sp-flow-st{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;border:2px solid var(--line);border-radius:10px;background:#fff;padding:3px 10px;min-width:0}
.sp-flow-ar{flex:0 0 auto;color:var(--sp-arw);font-weight:800}
/* 矢印と次の札を一組にする（折り返しは組の前だけ。矢印が行の終わりに残らない。2026-09-26） */
.sp-flow-g{display:inline-flex;align-items:center;gap:8px;min-width:0;max-width:100%}
.sp-flow-r .sp-vd{margin-right:0}

/* 実験台（押して比べる。案 B の 5-1） */
.sp-lab{background:radial-gradient(circle,var(--line) 1.2px,transparent 1.3px) 0 0/16px 16px,var(--bg-2);border:2px solid var(--line);border-radius:18px;
  padding:14px 16px 16px;display:grid;gap:12px;min-width:0}
.sp-lab-t{display:inline-flex;align-items:center;gap:8px;font-family:var(--round);font-weight:800;font-size:var(--fs-label);color:var(--main-dark)}
.sp-lab-t::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--ask);box-shadow:0 0 0 3px var(--ask-soft)}
.sp-picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,8.2rem),1fr));gap:8px}
.sp-pick{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:8px;align-items:center;text-align:left;
  padding:8px 10px;border:2px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 2px 0 var(--line-2);line-height:1.3;min-width:0}
.sp-pick svg{grid-row:1/3}
.sp-pick:hover{border-color:var(--main)}
.sp-pick[aria-pressed=true]{border-color:var(--ask);background:var(--ask-soft);box-shadow:0 3px 0 var(--ask)}
.sp-pick b{font-family:var(--mono);font-size:var(--fs-body);color:var(--ink)}
.sp-pick small{font-size:var(--fs-label);font-weight:700;color:var(--ink-2)}
.sp-lab-stage{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.25fr);gap:14px;align-items:center}
.sp-lab-file{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;min-width:0}
.sp-lab-parts{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.sp-lab-meta{font-size:var(--fs-label);color:var(--ink-3)}
.sp-nametag{display:inline-flex;align-items:center;gap:8px;margin-bottom:4px!important;padding:2px 14px 2px 8px;background:#fff;border:2px solid var(--line);
  border-radius:8px 12px 12px 8px;font-family:var(--round);font-weight:800;color:var(--ink);max-width:100%}
.sp-nametag::before{content:"";flex:0 0 auto;width:9px;height:9px;border-radius:50%;border:2px solid var(--ink-4);background:var(--bg)}
.sp-nametag.changed{border-color:var(--ask);background:var(--ask-soft)}
.sp-nametag .sp-fname{border:none;background:none;padding:0}
.sp-inside{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 10px;background:var(--paper-2);border:2px dashed var(--line);border-radius:10px;margin-bottom:4px}
.sp-fsize{font-size:var(--fs-label);color:var(--ink-3)}
.sp-lab-to{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.sp-lab-to .sp-arw{width:56px}
.sp-lab-to>span{font-size:var(--fs-label);font-weight:800;color:var(--ink-3)}
.sp-app{background:var(--main-soft);border:2px solid var(--main-line);border-radius:999px;padding:2px 12px;font-family:var(--round);color:var(--main-dark);max-width:13em}
.sp-lab-view{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.sp-lab-view>.sp-aw{align-self:stretch}
.sp-lab-view .sp-vd{margin-right:0}
.sp-lab-why{background:#fff;border:2px solid var(--line);border-left:6px solid var(--ask);border-radius:12px;padding:10px 14px;color:var(--ink-2)}
.sp-lab-dlg{margin:0;display:grid;justify-items:center;gap:8px}
.sp-lab-dlg figcaption{font-size:var(--fs-label);color:var(--ink-3)}


/* 確認の札（画面に出る文言） */
.sp-note{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;background:#fff;border:2px solid var(--line);border-left:6px solid var(--pink);border-radius:14px;padding:12px 16px}
.sp-note-os{flex:0 0 auto;font-size:var(--fs-label);font-weight:800;color:#fff;background:var(--brown);border-radius:999px;padding:0 10px}
.sp-note p{flex:1 1 20rem;min-width:0;color:var(--ink-2)}

/* 仮の印（出荷の版では 0 件。qa_drive.py sp と build_web.py が数える） */
.sp-kari{display:inline-block;font-style:normal;font-family:var(--round);font-size:var(--fs-label);font-weight:800;line-height:1.35;color:var(--ink);
  background:var(--ask-soft);border:1.5px dashed var(--ask);border-radius:6px;padding:0 4px;margin-left:4px;vertical-align:.08em}

/* ── 狭い画面 ── */
@media(max-width:1050px){
  .sp-lab-stage{grid-template-columns:minmax(0,1fr)}
  .sp-lab-to{flex-direction:row;justify-content:flex-start;gap:10px}
  .sp-lab-to .sp-arw{transform:rotate(90deg);width:40px}
}
/* ★ 見開きを 1 列に畳む境は 1100px（前は 760px）。1100 以下の 2 列では、右の下に回した格子が細い列に詰まって縦に伸び、
     左右の差が 300〜1984px になった（1280 以上は ±220px 以内。2026-09-26 に 800〜1440 の 6 幅 × 通常・拡大で測った） */
@media(max-width:1100px){
  .sp-spread{grid-template-columns:minmax(0,1fr);background:var(--bg-2)}
  .sp-spread-f,.sp-spread-f.sp-fill-l{grid-template-rows:none;grid-template-areas:none}
  .sp-spread-f>.sp-page{grid-area:auto}
  .sp-spread-f>.sp-page-fill{padding-top:16px}
  .sp-spread::before{content:none}
  .sp-page+.sp-page{border-top:2px dashed var(--line)}
}
@media(max-width:760px){
  .sp-hero{grid-template-columns:minmax(0,1fr)}
  .sp-hero-txt{padding:16px 18px 18px}
  .sp-hero-fig{max-width:460px}
  .sp-numrow-l{grid-template-columns:minmax(0,1fr)}
  .sp-page{padding:16px 16px 18px}
  .sp-lab{padding:12px 12px 14px}
  .sp-mon{padding:8px}
  details.check.sp .dbody{padding:4px 12px 16px}
}
@media(max-width:560px){
  .sp-thumb{display:none}
  .sp-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .sp-cell{padding:6px 6px 8px}
  .sp-case{grid-template-columns:60px minmax(0,1fr)}
