/* @@pxfont } */
.pxf{font-family:'px-dot',var(--round);font-weight:400;letter-spacing:.02em;-webkit-font-smoothing:none;font-smooth:never}

/* ── ドット絵の色（模型の色）── */
.px{display:inline-block;vertical-align:bottom;image-rendering:pixelated;overflow:visible}
.px .pk{fill:#1b1530} .px .ph{fill:#4a2f22} .px .ps{fill:#f4c9a0} .px .pS{fill:#d99b72}
.px .pw{fill:#fbf8ff} .px .pp{fill:#7b5cd6} .px .pP{fill:#4a3595} .px .pl{fill:#c8b6ff}
.px .pg{fill:#f2c14e} .px .pG{fill:#b8862b} .px .pb{fill:#aebcd8} .px .pB{fill:#5f6d8c}
.px .pc{fill:#8a5a3b} .px .pC{fill:#5a3a26} .px .pr{fill:#d94b4b} .px .pR{fill:#8e2a3a}
.px .pn{fill:#2e2b55} .px .pN{fill:#1f1d3d} .px .py{fill:#ffc94a} .px .po{fill:#ff7a2f}
.px .pe{fill:#e8416b} .px .pq{fill:#77738f} .px .pQ{fill:#4b4862} .px .pm{fill:#e9e4f5}

/* ── ゲームの画面の模型 ── */
.rpg{display:flex;flex-direction:column;gap:12px}
.rpg-screen{background:#0e0b1c;border-radius:12px;padding:10px;box-shadow:inset 0 0 0 3px #2a2446}
.rpg-screen .px-scene{display:block;width:100%;height:auto;max-height:300px}
.rpg-hud{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;color:#fbf8ff;background:#16122b;border-radius:10px;padding:8px 14px;
  font-size:var(--fs-label);box-shadow:0 0 0 3px #16122b,inset 0 0 0 2px #fbf8ff}
.rpg-hud b{color:#ffc94a;font-weight:400}

/* ── メッセージウィンドウ（黒い地・白い二重の縁・止まった ▼）── */
.mw{position:relative;background:#16122b;color:#fbf8ff;border-radius:12px;padding:22px 22px 16px;
  box-shadow:0 0 0 4px #16122b,inset 0 0 0 3px #fbf8ff,inset 0 0 0 6px #16122b;font-size:20px;line-height:1.75}
.mw-who{position:absolute;left:18px;top:-15px;background:#16122b;color:#ffc94a;padding:1px 12px;border-radius:8px;
  box-shadow:inset 0 0 0 2px #fbf8ff;font-size:var(--fs-label);line-height:1.8}
.mw-t{margin:0;min-height:3.5em}
.mw-next{display:block;margin:6px 0 0 auto;background:transparent;color:#fbf8ff;border:0;font:inherit;font-size:var(--fs-label);
  padding:4px 8px;border-radius:6px;cursor:pointer}
.mw-next:hover,.mw-next:focus-visible{background:#2d2650;outline:none}
.mw-ch{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px}
.mw-c{background:transparent;color:#fbf8ff;border:0;font:inherit;font-size:18px;padding:4px 10px 4px 26px;border-radius:6px;cursor:pointer;position:relative}
.mw-c::before{content:"";position:absolute;left:8px;top:50%;margin-top:-6px;border:6px solid transparent;border-left:9px solid #fbf8ff;opacity:0}
.mw-c:hover::before,.mw-c:focus-visible::before,.mw-c.on::before{opacity:1}
.mw-c:hover,.mw-c:focus-visible{background:#2d2650;outline:none}
.mw-c.on{color:#ffc94a}

/* ── 話し手の札（ドット絵＋名前。本文のどこに置いてもよい）── */
.pxtalk{display:flex;gap:12px;align-items:flex-end}
.pxtalk .px{flex:none}
.pxtalk-b{position:relative;background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:8px 12px;box-shadow:3px 3px 0 var(--ink)}
.pxtalk-b b{display:block;font-size:var(--fs-label);color:var(--ink-3)}
.pxtalk-b span{display:block}

/* ── 数当ての図（役目の色）── */
.band{display:block;width:100%;height:auto}
.band .bd-drop{fill:none;stroke:var(--drop);stroke-width:1.8;stroke-dasharray:7 6}
.band .bd-keep{fill:color-mix(in srgb,var(--c-main) 12%,var(--paper));stroke:var(--c-main);stroke-width:2.6}
.band .bd-hit{fill:var(--hit-soft);stroke:var(--hit);stroke-width:2.6}
.band .bd-ask{stroke:var(--ask);stroke-width:2.8}
.band .bd-askbox{fill:var(--ask)}
.band .bd-askt{fill:var(--deck);font-size:19px;font-weight:700}   /* 琥珀の地に墨の字（白だと 3.48。P9 のデザインの役） */
.band .bd-end{fill:var(--ink-4);font-size:18px}
.band .bd-lbl{fill:var(--ink-3);font-size:18px;font-weight:700}
.boxes{display:block;width:100%;height:auto}
.boxes .bx-on{fill:color-mix(in srgb,var(--c-main) 16%,var(--paper));stroke:var(--c-main);stroke-width:2.4}
.boxes .bx-off{fill:var(--paper);stroke:var(--line);stroke-width:1.4}
.stat{display:flex;flex-wrap:wrap;gap:10px}
.stat .st{flex:1 1 120px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.stat .st-v{font-size:28px;line-height:1.2;color:var(--ink);font-variant-numeric:tabular-nums}
.stat .st-v small{font-size:var(--fs-label);margin-left:3px;color:var(--ink-3)}
.stat .st-l{font-size:var(--fs-label);color:var(--ink-3)}
.stat .st.hit{border-color:var(--hit);box-shadow:inset 0 0 0 1px var(--hit)} .stat .st.hit .st-v{color:var(--hit)}
.stat .st.ask{border-color:var(--ask);box-shadow:inset 0 0 0 1px var(--ask)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.log li{display:grid;grid-template-columns:3em 4em 1fr;gap:8px;align-items:center;padding:4px 10px;border-radius:8px;background:var(--paper-2)}
.log li.hit{background:var(--hit-soft)} .log li.gap{display:block;text-align:center;color:var(--ink-4)}
.log .lg-n{color:var(--ink-4);font-size:var(--fs-label)} .log .lg-g{font-weight:700}
.log.empty li{display:block;color:var(--ink-4)}

/* スマホの幅（500px 未満）では、本文の切り替えのボタン列を折り返す（narrow_qa で 3-1・4-1 が 390px 以下で器から出た。2026-09-27） */
@media (max-width:499px){ .s-body .segmented{flex-wrap:wrap;max-width:100%} }

/* ── 札の列（cardRow。第2回で足した）── */
.crow{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px;padding:4px 2px}
.cr-col{display:flex;flex-direction:column;align-items:stretch;gap:2px;min-width:0}
.crow .cr{display:flex;align-items:center;justify-content:center;height:56px;border-radius:10px;border:2px solid var(--line);
  background:var(--paper);color:var(--ink);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;padding:0}
.crow .cr.down{background:color-mix(in srgb,var(--c-main) 14%,var(--paper));border-color:color-mix(in srgb,var(--c-main) 45%,var(--line));color:var(--c-main)}
.crow .cr.out{background:var(--paper-2);border-style:dashed;border-color:var(--drop);color:var(--ink-4);opacity:.55}
.crow .cr.mid{border-color:var(--ask);box-shadow:inset 0 0 0 2px var(--ask)}
.crow .cr.hit{border-color:var(--hit);background:var(--hit-soft);color:var(--ink)}
.crow .cr.sel{outline:3px solid var(--c-main);outline-offset:2px}
.crow .cr.miss{border-color:var(--stop);box-shadow:inset 0 0 0 2px var(--stop)}
.crow button.cr:hover{border-color:var(--c-main)}
.cr-p{font-size:var(--fs-label);color:var(--ink-4);text-align:center;font-variant-numeric:tabular-nums}
.cr-f{font-size:var(--fs-label);color:var(--c-main);font-weight:800;text-align:center;min-height:2.9em;line-height:1.45;white-space:nowrap}
.cr-f.x{color:var(--stop)}

/* ── 棚（shelfRow）と鎖の荷（chainRow）。第3回で足した ── */
.shelf{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;padding:4px 2px}
.sh-col{display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:0}
.sh-tag{min-height:1.5em;height:1.5em;line-height:1.5;text-align:center;font-size:var(--fs-label);font-weight:800;color:var(--ask-ink,var(--ask));white-space:nowrap}
.shelf .sh-slot{display:flex;align-items:center;justify-content:center;height:64px;border-radius:8px;border:2px solid var(--ink);
  background:var(--paper);color:var(--ink);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;padding:0;
  box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--ink) 12%,transparent)}
.shelf .sh-slot.empty{background:var(--paper-2);border-style:dashed;border-color:var(--line);box-shadow:none}
.shelf .sh-slot.mv{border-color:var(--ask);box-shadow:inset 0 0 0 3px var(--ask)}
.shelf .sh-slot.done{background:color-mix(in srgb,var(--ask) 12%,var(--paper))}
.shelf .sh-slot.new{border-color:var(--hit);background:var(--hit-soft)}
.shelf .sh-slot.sel{outline:3px solid var(--c-main);outline-offset:2px}
.shelf .sh-slot.hit{border-color:var(--hit);box-shadow:inset 0 0 0 3px var(--hit)}
.shelf button.sh-slot:hover{border-color:var(--c-main)}
.sh-p{font-size:var(--fs-label);color:var(--ink-3);text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.sh-a{font-size:var(--fs-label);color:var(--ink-4);text-align:center;font-variant-numeric:tabular-nums}
.chain{display:flex;align-items:center;gap:2px;padding:6px 2px}
@media (max-width:760px){ .chain.wide-min{min-width:880px} }
.chain .cn{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--ink);border-radius:10px;
  background:var(--paper);padding:5px 1px 6px;font-variant-numeric:tabular-nums}
.chain .cn-head{flex:0 0 auto;padding:5px 8px;border-style:dashed;background:var(--paper-2)}
.chain .cn-head .cn-v{font-size:18px;line-height:1.35}
.cn-at{font-size:var(--fs-label);color:var(--ink-4);white-space:nowrap}
.cn-v{font-size:24px;font-weight:800;color:var(--ink);line-height:1.15}
.cn-nx{font-size:var(--fs-label);color:var(--c-main);font-weight:800;white-space:nowrap;letter-spacing:-.02em}
.cn-ar{flex:none;color:var(--ink-3);font-size:18px;font-weight:800;width:18px;text-align:center}
.chain .cn.seen{background:color-mix(in srgb,var(--ask) 12%,var(--paper))}
.chain .cn.cur{border-color:var(--ask);box-shadow:inset 0 0 0 3px var(--ask)}
.chain .cn.hit{border-color:var(--hit);background:var(--hit-soft)}
.chain .cn.new{border-color:var(--hit);background:var(--hit-soft)}
.chain .cn-nx.chg{color:var(--ink);background:color-mix(in srgb,var(--ask) 30%,var(--paper));border-radius:6px;padding:0 6px}
.chain .cn.off{opacity:.5}
/* 上の段つきの鎖（chainRow の raise）。下の段のもとの荷は動かさず、新しい荷を上の段に置く（2026-10-10 点検 VF1） */
.chain.raised{display:grid;grid-template-rows:auto auto;align-items:center;column-gap:2px;row-gap:2px}
.chain.raised>div,.chain.raised>.cn-ar{grid-row:2;min-width:0}
.chain.raised>div>.cn{height:100%}
.chain.raised>.cd-node{grid-row:1}
.chain.raised>.cd-up,.chain.raised>.cd-dn{grid-row:1;align-self:end;font-size:24px;font-weight:800;line-height:1;color:color-mix(in srgb,var(--ink-4) 35%,transparent)}
.chain.raised>.cd-up{text-align:right}
.chain.raised>.cd-up.on,.chain.raised>.cd-dn.on{color:var(--hit)}
.chain.raised>.cd-long{grid-row:2;display:flex;align-items:center;color:var(--ink-4);font-size:16px;font-weight:800;padding:0 2px}
.chain.raised>.cd-long i{flex:1 1 0;border-top:2px solid currentColor}
.chain.raised>.cd-long.cut i{border-top-style:dashed;opacity:.45}
.chain.raised>.cd-long b{color:var(--stop);padding:0 2px}

/* 送りの数（「4 / 8」）を折らない。前後の題が長いと 500px の拡大で「4 /」と「8」に割れた（2026-10-08 P6・P10）*/
.pager .pg-count{white-space:nowrap}

/* ── 積む山（stackCol）・並ぶ列（queueRow）・出た順（outRow）。第4回で足した ── */
.tk{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;height:46px;padding:0 10px;border:2px solid var(--ink);border-radius:9px;
  background:var(--paper);color:var(--ink);font:inherit;box-shadow:2px 2px 0 color-mix(in srgb,var(--ink) 22%,transparent)}
.tk .tk-v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.tk .tk-ic{flex:none}
.tk .tk-tix{flex:none;width:14px;height:20px;border:2px solid var(--ink-3);border-radius:3px;background:var(--ask-soft);
  background-image:linear-gradient(var(--ink-4),var(--ink-4));background-size:6px 2px;background-position:2px 5px;background-repeat:no-repeat}
.tk.top{border-color:var(--c-main);box-shadow:inset 0 0 0 2px var(--c-main),2px 2px 0 color-mix(in srgb,var(--c-main) 40%,transparent)}
.tk.new{background:var(--hit-soft);border-color:var(--hit);box-shadow:inset 0 0 0 2px var(--hit)}
.tk.sel{outline:3px solid var(--ask);outline-offset:2px}
.tk.miss{border-color:var(--stop);box-shadow:inset 0 0 0 2px var(--stop)}
.tk.dim{opacity:.45}
button.tk{cursor:pointer} button.tk:hover{border-color:var(--c-main)}
.sk-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.sk-end,.sk-bot{font-size:var(--fs-label);color:var(--c-main);font-weight:400;white-space:nowrap}
.sk-bot{color:var(--ink-4)}
.sk{display:flex;flex-direction:column;gap:5px;width:172px;padding:8px 10px 10px;border:3px solid var(--ink-3);border-top:0;border-radius:0 0 14px 14px;
  background:linear-gradient(color-mix(in srgb,var(--c-main) 5%,var(--paper)),var(--paper-2))}
.sk .tk{width:100%}
.sk-gap,.qu-gap{display:block;height:46px;border-radius:9px;border:2px dashed color-mix(in srgb,var(--line) 70%,transparent)}
.sk-gap{border-color:transparent}
.qu-wrap{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px}
.qu-end{font-size:var(--fs-label);color:var(--c-main);text-align:center;line-height:1.5;padding:2px 0;white-space:nowrap}
.qu-end small{display:block;font-size:var(--fs-label);color:var(--ink-4);font-family:var(--round)}
.qu-end.back{color:var(--ink-3)}
.qu{display:grid;grid-template-columns:repeat(var(--cap),minmax(84px,1fr));gap:6px;padding:8px;border:3px solid var(--ink-3);border-left:0;border-right:0;
  background:linear-gradient(90deg,color-mix(in srgb,var(--c-main) 6%,var(--paper)),var(--paper-2))}
.ot-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.ot-lbl{font-size:var(--fs-label);color:var(--ink-3);font-weight:700;white-space:nowrap}
.ot-cells{display:flex;flex-wrap:wrap;gap:6px}
.ot{position:relative;display:flex;align-items:center;justify-content:center;width:72px;height:44px;padding-left:14px;border-radius:8px;border:2px solid var(--ink-3);
  background:var(--paper);font-size:21px;font-variant-numeric:tabular-nums}
.ot b{font-weight:800}
.ot.gap{border-style:dashed;border-color:var(--line);background:var(--paper-2)}
.ot .ot-n{position:absolute;left:5px;top:50%;transform:translateY(-50%);font-style:normal;font-size:var(--fs-label);color:var(--ink-4);font-weight:700}
.ot.hit{border-color:var(--hit);background:var(--hit-soft)}
.ot.miss{border-color:var(--stop);box-shadow:inset 0 0 0 2px var(--stop)}

/* 第5話の石と苔。模型だけの色。 */
.px .pz{fill:#8a8d91}.px .pZ{fill:#565a60}.px .pd{fill:#bdc1c4}.px .pf{fill:#5c6c43}
.hk-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.hk-chip{display:inline-flex;align-items:center;justify-content:center;min-width:42px;min-height:36px;padding:2px 7px;border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
button.hk-chip{cursor:pointer}button.hk-chip:hover{border-color:var(--c-main)}
.hk-chip.selected,.hk-chip.fresh{border-color:var(--c-main);background:color-mix(in srgb,var(--c-main) 12%,var(--paper))}
.hk-chip.entered{border-style:dashed;color:var(--ink-3)}
.hk-chip.seen{border-color:var(--ask);background:var(--ask-soft)}
.hk-chip.found,.hk-step.found{border-color:var(--hit);background:var(--hit-soft)}
.hb-grid{display:grid;grid-template-columns:repeat(var(--hb-cols),minmax(0,1fr));gap:8px;margin:10px 0}
.hb-box{border:2px solid var(--line);background:var(--paper);border-radius:11px;padding:7px;min-width:0}
.hb-box.opened{border-color:var(--c-main);box-shadow:inset 0 0 0 1px var(--c-main)}
.hb-box.empty{background:var(--paper-2)}
.hb-label{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:var(--fs-label);font-weight:700;flex-wrap:wrap}
.hb-label .px{flex-shrink:0}.hb-open-label{color:var(--c-main);font-size:var(--fs-label)}
.hb-chain{display:flex;flex-wrap:wrap;gap:3px;align-items:center;min-height:38px;margin-top:5px}
.hb-link{display:inline-flex;align-items:center;gap:3px}.hb-arrow{color:var(--ink-3)}.hb-empty{font-size:var(--fs-label);color:var(--ink-3)}
.hash-calc{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper-2);padding:9px 12px;margin:8px 0}
.hash-calc b{font-variant-numeric:tabular-nums}.hk-trace{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:8px 0}
.hk-step{display:flex;flex-direction:column;align-items:center;padding:3px 8px;border:2px solid var(--line);border-radius:8px;background:var(--paper)}
.hk-step-label{font-size:var(--fs-label);color:var(--ink-3)}.hk-step b{font-size:20px}
@media(max-width:620px){.hb-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hb-grid.single{grid-template-columns:minmax(0,1fr)}}

/* ═════ ch0.css ═════ */
/* ═════ 表紙（科目）═════
   第5回の ch0.css を持ち越した（第7回）。章の札は 4 枚（3 章とまとめ）。
   ★ 色は役目のトークンだけ。16 進を書かない。テーマだけに効く規則は書かない。 */
/* 表紙の中身 */
.cv-grid{display:grid;grid-template-columns:auto minmax(0,1fr) 330px;gap:28px;align-items:center;padding:14px 36px 18px}
.bignum .cv-min{font-size:1.3rem;letter-spacing:0;margin-left:2px}
.bignum .cv-pre{font-size:1.3rem;letter-spacing:0;margin-right:4px}   /* 「第 7 回」。大きな数は回の番号 */
.cv-lead{margin-top:14px;color:var(--ink-2);font-size:1.06rem;max-width:36em}
.cv-side{display:grid;gap:14px}
.cv-os{background:var(--paper-2);border:2px dashed var(--line);border-radius:20px;padding:14px 18px}
.cv-os strong{display:block;font-family:var(--round);color:var(--ink);font-size:var(--fs-label);letter-spacing:.1em;margin-bottom:4px}
.cv-go{justify-self:start;font-size:1.1rem;padding:10px 26px}
.cv-map{padding:6px 36px 22px}
.cv-h{font-family:var(--round);font-size:1.1rem;color:var(--ink);margin-bottom:10px}
.cv-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.cv-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
  border:2px solid var(--line);background:var(--paper);border-radius:18px;padding:22px 8px 12px;box-shadow:0 4px 0 var(--line-2)}
.cv-card:hover{border-color:var(--c-main);transform:translateY(-2px)}
.cv-no{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--c-accent);color:var(--paper);border-radius:999px;
  padding:0 10px;font-family:var(--round);font-weight:800;font-size:var(--fs-label);border:2px solid var(--paper)}
.cv-t{font-family:var(--round);font-weight:800;font-size:var(--fs-body);line-height:1.35}
.cv-s{font-size:var(--fs-body);color:var(--ink-3);line-height:1.45}
.cv-party{display:flex;align-items:flex-end;gap:10px;margin-top:14px;padding:10px 14px 0;border-bottom:4px solid var(--line)}
.cv-party .px{margin-bottom:-2px}
.cv-gap{flex:1}
.cv-art{display:flex;align-items:center;justify-content:center;height:44px}
@media(max-width:1050px){
  .cv-grid{grid-template-columns:auto minmax(0,1fr);padding:12px 24px 16px}
  .cv-side{grid-column:1/-1}
  .cv-cards{row-gap:18px}
  .cv-map{padding:6px 24px 20px}
}
@media(max-width:760px){
  .cv-grid{grid-template-columns:minmax(0,1fr)}
  .cv-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:620px){.cv-party .px{width:48px;height:48px}}

/* ═════ ch1.css ═════ */
/* 数札と行き・戻り。色だけでなく矢印の向きも変える。表（c1-trace）は 2-2 の「先頭＋残り」で使う。 */
.c1-watch{margin:0 0 10px;font-weight:700;color:var(--c-main)}
.c1-watch.back{color:var(--hit)}
.c1-cards{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.c1-number{display:inline-flex;justify-content:center;align-items:center;min-width:31px;padding:0 4px;border:1px solid var(--line-3);border-radius:5px;background:var(--paper);font-size:1.125rem;font-weight:700;line-height:1.5;font-variant-numeric:tabular-nums}
.c1-trace{border:1px solid var(--line-3);border-radius:12px;overflow:hidden;background:var(--paper)}
.c1-trace-head,.c1-trace-row{display:grid;grid-template-columns:38px 112px minmax(0,1fr) 100px;align-items:center;gap:7px;padding:3px 10px}
.c1-trace-head{font-size:var(--fs-label);font-weight:700;background:var(--paper-2);padding-top:6px;padding-bottom:6px}
.c1-trace-row{min-height:32px;border-top:1px solid var(--line-2)}
.c1-trace-row.pending{background:var(--paper-2);color:var(--ink-4)}
.c1-trace-row.pending .c1-rest{font-size:var(--fs-label)}
.c1-trace-row.current.out{background:var(--main-soft);box-shadow:inset 4px 0 var(--c-main)}
.c1-trace-row.current.back{background:var(--hit-soft);box-shadow:inset 4px 0 var(--hit)}
.c1-depth{font-size:var(--fs-label);font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink-3)}
.c1-rest{display:flex;align-items:center;gap:5px;min-width:0;font-size:1.125rem}
.c1-arrow{font-size:1.3125rem;font-weight:700;color:var(--c-main)}
.c1-return{color:var(--ink-3);font-size:var(--fs-label)}
.solved .c1-return{font-size:1.25rem;color:var(--hit)}
.c1-base{font-size:1.125rem;color:var(--hit)}
.c1-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.c1-say{min-height:1.6em;margin:8px 0 0}
.c1-code{white-space:pre-wrap;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--paper-2);font-size:1.125rem;line-height:1.8;overflow-wrap:anywhere}
.c1-source{color:var(--ink-3);font-size:var(--fs-label)}
@media(max-width:760px){.c1-trace-head,.c1-trace-row{grid-template-columns:28px 86px minmax(0,1fr) 76px;gap:5px;padding-left:6px;padding-right:6px}.c1-trace-row{min-height:38px}.c1-number{min-width:28px;padding:0 3px}.c1-trace-head{font-size:0.875rem}}

.c1-back-log{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;border-left:4px solid var(--hit);background:var(--hit-soft);margin-top:12px;padding:9px 12px}
.c1-back-log span{font-size:var(--fs-label);color:var(--ink-3)}
.c1-back-log b{color:var(--hit);font-size:1.25rem;overflow-wrap:anywhere}

/* 9段の数と操作を投影1画面に収める。字の大きさは保つ。 */
.c1-trace{line-height:1.3}
.c1-trace-row{padding-top:2px;padding-bottom:2px}
.c1-trace .c1-number{line-height:1.35}
.c1-arrow{line-height:1}
.c1-rest,.c1-return{line-height:1.3}
.c1-back-log{padding-top:6px;padding-bottom:6px}
.c1-back-log b{line-height:1.35}
html.big .c1-trace .c1-number,html.big .c1-rest{line-height:1.15}

/* 1-1・1-2 の霧の列。後ろ（左）から前（右）へ聞き、答えは右から左へ戻る。狭い画面では上から下へ並べる。 */
.c1-q{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"b f" "l l";gap:4px 8px}
.c1-end{font-size:var(--fs-label);font-weight:700;color:var(--ink-3)}
.c1-end.back{grid-area:b}
.c1-end.back::before{content:"← "}
.c1-end.front{grid-area:f;text-align:right}
.c1-end.front::after{content:" →"}
.c1-line{grid-area:l;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;padding:8px 6px;border:1px solid var(--line-3);border-radius:12px;background:var(--paper)}
.c1-slot{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;padding:6px 2px 4px;border-radius:10px}
.c1-slot.fog{background:var(--paper-2)}
.c1-slot.fog .c1-who svg{opacity:.28}
.c1-slot.fog .c1-nobody{border-style:dotted}
.c1-slot.current.out{background:var(--main-soft);box-shadow:inset 0 -4px var(--c-main)}
.c1-slot.current.back{background:var(--hit-soft);box-shadow:inset 0 -4px var(--hit)}
.c1-bub{min-height:2.2em;display:flex;align-items:flex-end;justify-content:center}
.c1-ask,.c1-ans{display:inline-block;min-width:1.8em;padding:1px 6px;border-radius:8px;text-align:center;font-size:1.25rem;line-height:1.35;font-variant-numeric:tabular-nums}
.c1-ask{border:2px solid var(--c-main);color:var(--c-main);background:var(--paper)}
.c1-ans{border:2px solid var(--hit);color:var(--hit);background:var(--hit-soft)}
.c1-wait{display:inline-block;padding:1px 5px;border:1px dashed var(--line-3);border-radius:6px;color:var(--ink-3);font-size:var(--fs-label);line-height:1.35}
.c1-who{height:48px;display:flex;align-items:center;justify-content:center}
.c1-nobody{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border:2px dashed var(--line-3);border-radius:8px;color:var(--ink-3);font-size:var(--fs-label);font-weight:700}
.c1-slot.empty.solved .c1-nobody,.c1-slot.empty.current .c1-nobody{border-color:var(--hit);color:var(--hit)}
.c1-name{min-height:1.35em;font-size:var(--fs-label);font-weight:700;color:var(--ink-2);line-height:1.35;white-space:nowrap}
.c1-hold .c1-number{font-size:1.0625rem}
.c1-zero{font-size:var(--fs-label);color:var(--ink-3);line-height:1.5}
.c1-dan{font-size:var(--fs-label);color:var(--ink-3);font-variant-numeric:tabular-nums;line-height:1.3}
.c1-expr{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-top:10px;padding:8px 12px;border-left:4px solid var(--c-main);background:var(--paper-2)}
.c1-expr.back{border-left-color:var(--hit)}
.c1-expr-l{font-size:var(--fs-label);font-weight:700;color:var(--ink-3)}
.c1-expr-b{display:flex;flex-wrap:wrap;align-items:center;row-gap:4px;font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.4}
.c1-x{white-space:nowrap}
.c1-core{display:inline-block;min-width:1.7em;margin:0 2px;padding:0 5px;border:2px solid var(--c-main);border-radius:6px;color:var(--c-main);text-align:center}
.c1-core.got{border-color:var(--hit);color:var(--hit);background:var(--hit-soft)}
.c1-pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.c1-pair .c1-code{margin:0}
.c1-pair b{color:var(--hit);text-decoration:underline;text-underline-offset:3px}
@media(max-width:760px){
  .c1-q{grid-template-columns:1fr;grid-template-areas:"b" "l" "f"}
  .c1-end.back::before{content:"↑ "}
  .c1-end.front{text-align:left}
  .c1-end.front::after{content:""}
  .c1-end.front::before{content:"↓ "}
  .c1-line{grid-template-columns:1fr;gap:2px;padding:6px}
  .c1-slot{display:grid;grid-template-columns:3em 48px minmax(4.5em,auto) auto 1fr;align-items:center;justify-items:start;gap:8px;padding:3px 6px}
  .c1-slot .c1-dan{grid-column:1;grid-row:1}
  .c1-slot .c1-who{grid-column:2;grid-row:1;height:auto}
  .c1-slot .c1-name{grid-column:3;grid-row:1}
  .c1-slot .c1-hold{grid-column:4;grid-row:1}
  .c1-slot .c1-bub{grid-column:5;grid-row:1;min-height:0;justify-self:end}
  .c1-slot.current.out{box-shadow:inset 4px 0 var(--c-main)}
  .c1-slot.current.back{box-shadow:inset 4px 0 var(--hit)}
}

/* ═════ ch2.css ═════ */
.c2-settings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.c2-settings>div>b{display:block;font-size:var(--fs-label);margin-bottom:4px}
.c2-watch{margin:8px 0 12px;color:var(--ink-2)}
.c2-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.c2-stop-layout{display:grid;grid-template-columns:minmax(250px,1.2fr) minmax(180px,1fr);gap:20px;align-items:start}
.c2-stack{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper)}
.c2-stack-rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;padding:8px}
.c2-stack-row{display:grid;grid-template-columns:40px 1fr;align-items:center;gap:0 5px;border:1px solid var(--line);background:var(--paper-2);border-radius:6px;padding:3px 7px}
.c2-stack-row>span:first-child{font-size:var(--fs-label);font-weight:700}
.c2-stack-row>b{font-size:1.125rem}
.c2-stack-row>span:last-child{grid-column:1/-1;font-size:var(--fs-label);color:var(--c-main)}
.c2-stack-row.done{background:var(--hit-soft);border-color:var(--hit)}
.c2-stack-row.done>span:last-child{color:var(--hit)}
.c2-stack-last{display:flex;justify-content:space-between;padding:3px 12px;background:var(--stop-soft)}
.c2-omission{font-size:var(--fs-label);text-align:center;line-height:1.3;border-top:1px dashed var(--line-3);padding:3px}
.c2-limit{border-top:3px solid var(--stop);padding:5px 10px;color:var(--stop);font-weight:700;font-size:var(--fs-label)}
.c2-limit.reached{background:var(--stop-soft)}
.c2-stop-note{border-left:3px solid var(--c-main);padding:8px 0 8px 14px}
.c2-stop-note>b{font-size:1.75rem}
.c2-stop-note p{margin:8px 0}
.c2-count-path{display:flex;align-items:center;flex-wrap:wrap;gap:7px;padding:16px 0}
.c2-count-path span{border:1px solid var(--line);border-radius:7px;padding:4px 12px;font-weight:700;font-variant-numeric:tabular-nums}
.c2-count-path .now{background:var(--c-main);color:var(--paper)}
.c2-count-path i{font-style:normal;color:var(--ink-3)}
.c2-loop{display:flex;flex-wrap:wrap;gap:24px;margin:16px 0;border:1px solid var(--line);padding:14px;border-radius:12px}
.c2-tree{position:relative;padding-left:38px;min-height:300px;margin:4px 0 8px}
.c2-edges{position:absolute;left:38px;top:0;width:calc(100% - 38px);height:300px;overflow:visible;pointer-events:none}
.c2-edges path{fill:none;stroke:var(--line-4);stroke-width:2.5}
.c2-tree-level{display:grid;position:relative;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;height:82px;align-items:start;padding-top:8px}
.c2-tree-level:last-child{height:54px}
.c2-level-tag{position:absolute;left:-38px;top:16px;font-size:var(--fs-label);font-weight:700;color:var(--ink-3)}
.c2-node{position:relative;min-height:39px;display:flex;justify-content:center;align-items:center;background:var(--paper-2);border:1px solid var(--line-3);border-radius:9px;padding:3px 4px;z-index:1}
.c2-node .c1-cards{flex-wrap:nowrap;gap:3px}
.c2-node .c1-number{border:0;background:none;padding:0 2px;min-width:28px}
.c2-node>b{font-size:1.5rem;font-variant-numeric:tabular-nums;color:var(--hit)}
.c2-node.solved{background:var(--hit-soft);border-color:var(--hit)}
.c2-node.current{outline:3px solid var(--hit);outline-offset:2px}
.c2-node.pending{visibility:hidden}
.c2-metrics{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;border-top:1px solid var(--line);margin-top:10px;padding-top:8px;font-size:var(--fs-label)}
.c2-metrics b{font-size:1.25rem;margin-left:5px}
.c2-bars{display:grid;gap:12px;padding:20px 0}
.c2-bars>div{display:grid;grid-template-columns:140px 1fr 100px;align-items:center;gap:12px}
.c2-bars i{display:block;width:var(--amount);min-width:3px;height:24px;background:var(--main);border-radius:3px}
.c2-bars>div:nth-child(2) i{background:var(--hit)}
.c2-bars b{text-align:right;font-size:1.375rem}
.c2-compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.c2-compare>div{border:1px solid var(--line);border-radius:12px;padding:16px}
.c2-branch-words{display:flex;gap:10px;margin-top:16px;padding-top:12px;border-top:2px solid var(--c-main)}
.c2-branch-words span{flex:1;text-align:center;background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:10px}
.c2-hanoi-count{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;margin:20px 0}
.c2-hanoi-count span{border:1px solid var(--line);background:var(--paper-2);border-radius:12px;padding:10px;text-align:center}
.c2-hanoi-count b{font-size:1.5625rem}.c2-hanoi-count i{font-style:normal}.c2-hanoi-count strong{font-size:1.875rem;color:var(--hit)}
@media(max-width:760px){.c2-stop-layout{grid-template-columns:1fr}.c2-settings{gap:8px}.c2-stop-note{padding-top:0;padding-bottom:0}.c2-stop-note>b{font-size:1.5rem}.c2-tree{padding-left:28px}.c2-edges{left:28px;width:calc(100% - 28px)}.c2-level-tag{left:-28px;font-size:0.875rem}.c2-tree-level{gap:3px}.c2-node{padding:3px 1px}.c2-node .c1-number{min-width:25px;padding:0 1px}.c2-node .c1-cards{gap:1px}.c2-compare{grid-template-columns:1fr}.c2-bars>div{grid-template-columns:110px 1fr 90px;gap:8px}.c2-bars b{font-size:1.25rem}}

/* 段を二つの縦の列へ続ける。各段は1行にそろえる。 */
.c2-stack-rows{grid-auto-flow:column;grid-template-rows:repeat(6,auto)}
.c2-stack-row{grid-template-columns:40px 36px minmax(0,1fr);gap:4px;line-height:1.2}
.c2-stack-row>span:last-child{grid-column:auto;line-height:1.2}
.c2-stack-row>b{line-height:1.2}
@media(max-width:620px){.c2-settings{grid-template-columns:1fr}}

/* ═════ ch3.css ═════ */
/* 第7話。色はテーマの役目と既存 PX の色を使う。押す円盤と札を同じ柱に置く。 */
.rpg-back{margin-left:auto;background:transparent;color:inherit;border:1px solid currentColor;border-radius:6px;font:inherit;font-size:var(--fs-label);padding:0 10px;cursor:pointer}
.rpg-back:hover{background:color-mix(in srgb,currentColor 18%,transparent)}
.c31-play{max-width:1040px;margin:0 auto}
.c31-play .rpg-screen .px-scene{max-height:238px}
.c31-play .mw-t:empty{display:none}
.c31-play .mw-ch{display:grid;grid-template-columns:1fr;gap:3px}
.c31-play .mw-c{text-align:left}
.c31-scene-note{font-size:var(--fs-label);margin:4px 0 0;color:var(--paper);text-align:right}
.c31-choice-label{font-size:var(--fs-label);margin-bottom:3px}
.c31-seal-preview{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;padding:8px 14px;border:1px solid var(--line);background:var(--paper);border-radius:9px;font-size:var(--fs-label)}
.c32-game{display:flex;flex-direction:column;gap:11px}
.c3-door-records{display:flex;gap:8px;flex-wrap:wrap}
.c3-door-record{display:block;border:1px solid var(--line);border-radius:8px;padding:5px 11px;background:var(--paper);font-size:var(--fs-label);color:var(--ink-3)}
.c3-door-record.done{color:var(--hit);border-color:var(--hit);background:var(--hit-soft)}
.c3-lamp-row{display:flex;align-items:center;flex-wrap:wrap;gap:7px 12px;border-bottom:1px solid var(--line);padding-bottom:9px}
.c3-lamp-label,.c3-used{font-size:var(--fs-body);white-space:nowrap}
.c3-lamp-label b{font-size:1.5rem;color:var(--main-dark)}
.c3-lamps{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.c3-lamps .px{display:block;width:16px;height:22px}
.c3-used{margin-left:auto}
.c3-status{margin:0;min-height:1.7em;font-size:var(--fs-body);color:var(--ink)}
.c3-last-move{display:inline-block;margin-left:12px;font-size:var(--fs-label);color:var(--ink-3)}
.c3-pegs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;align-items:end}
.c3-peg{min-width:0;display:flex;flex-direction:column;align-items:center;position:relative;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);padding:6px 7px 8px;font:inherit}
button.c3-peg{cursor:pointer;transition:border-color .12s,background .12s}
button.c3-peg:disabled{opacity:1;cursor:default;color:var(--ink-3);border-style:dashed}
button.c3-peg:enabled:hover,button.c3-peg:focus-visible{border-color:var(--ask);background:var(--ask-soft);outline:3px solid var(--ask);outline-offset:2px}
button.c3-peg.selected{border-color:var(--ask);background:var(--ask-soft)}
button.c3-peg.destination{border-color:var(--hit)}
.c3-peg-art{display:block;width:100%;height:auto;max-height:153px}
.c3-peg .c3-disk-select{fill:none;stroke:var(--ask);stroke-width:3}
.c3-peg-label{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:30px;font-size:1.375rem;font-weight:700}
.c3-goal{display:inline-block;font-size:var(--fs-label);font-weight:400;border-radius:6px;background:var(--hit-soft);color:var(--hit);padding:1px 6px}
.c3-peg-action{font-size:var(--fs-label);min-height:1.6em;margin-top:3px}
.c3-controls{display:flex;gap:8px;flex-wrap:wrap}
.c3-ready,.c3-seal-result{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--paper)}
.c3-ready p{margin:0;font-size:var(--fs-body)}
.c3-seal-result{border-color:var(--hit);background:var(--hit-soft)}
.c3-seal-result.fail{border-color:var(--stop);background:var(--paper)}
.c3-seal-result b{font-size:var(--fs-body)}
.c3-seal-result span{font-size:var(--fs-label)}
.c3-next{display:flex;justify-content:flex-end}
.c32-message .mw{margin-top:8px}
.c32-message .mw-t{min-height:1.8em}
.c3-tower-view{margin-bottom:14px}
.c3-tower-view .px-scene{max-height:126px;display:block}
.c3-rule-note{font-size:var(--fs-label);color:var(--ink-3);margin:10px 0 0}
.c3-split{padding:10px 12px;border:2px solid var(--hit);border-radius:12px;background:var(--paper)}
.c3-split-title{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:5px 12px;font-size:var(--fs-body);margin:0 0 12px;font-weight:700}
.c3-split-title span{color:var(--hit)}
.c3-split-steps{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);gap:5px;align-items:center}
.c3-split-step{min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.c3-split-caption{display:block;min-height:2.8em;text-align:center;font-size:var(--fs-label);line-height:1.4}
.c3-split-count{font-size:1.4375rem;color:var(--hit);font-weight:700}
.c3-split-arrow{font-size:1.375rem;color:var(--ink-3)}
.c3-pegs.small{width:100%;gap:1px}
.c3-pegs.small .c3-peg{padding:0;border:0;border-radius:0;background:transparent}
.c3-pegs.small .c3-peg-label{font-size:var(--fs-label);font-weight:400;min-height:1.7em}
.c3-pegs.small .c3-goal{display:none}
.c3-pegs.small .c3-peg-art{max-height:75px}
@media(max-width:1050px){.c3-lamps{gap:1px}.c3-lamps .px{width:13px;height:18px}.c3-used{margin-left:0}.c3-split-steps{gap:2px}.c3-split{padding:9px 7px}.c3-peg-label{font-size:1.25rem;gap:4px}.c3-goal{padding:1px 4px}}
@media(max-width:760px){.c3-pegs{gap:6px}.c3-peg{padding:5px 2px}.c3-peg-label{flex-wrap:wrap;gap:3px}.c3-peg-action{font-size:0.875rem}.c3-split-steps{grid-template-columns:minmax(0,1fr);gap:8px}.c3-split-arrow{transform:rotate(90deg)}.c3-split-step{width:100%}.c3-split-caption{min-height:0}.c3-pegs.small{max-width:300px}.c31-play .rpg-screen .px-scene{max-height:200px}.c3-lamp-row{column-gap:8px}}

.c31-play .rpg-screen .px-scene{max-height:200px}
.c3-tower-view{margin-bottom:10px}
.c3-rule-note{line-height:1.4;margin-top:8px}
html.big .c3-tower-view .px-scene{max-height:64px}
html.big .c3-tower-view + .points-card .points li{line-height:1.4}

/* ═════ ch4.css ═════ */
/* ═════ まとめ（4-1）═════
   第2回の ch6.css（まとめ）の形を写した。
   ★ 色は役目のトークンだけ。16 進を書かない。テーマだけに効く規則は書かない。14px の札のクラスは名前に -tag を含める（検査の札の側で測る）。 */
.c4-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.c4-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:var(--paper);border:1px solid var(--line);
  border-radius:14px;padding:14px 16px 14px}
.c4-h{font-size:1.1rem;padding-right:3.4em}
.c4-card p{margin:0;color:var(--ink-2)}
/* 右上の札: その話をした枚へ戻る */
.c4-go-tag{position:absolute;top:10px;right:12px;border:1px solid var(--line);background:var(--paper-2);color:var(--ink-3);
  border-radius:999px;padding:1px 10px;font-size:var(--fs-label);font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}
.c4-go-tag:hover,.c4-go-tag:focus-visible{border-color:var(--c-main);color:var(--ink)}
.c4-next{margin-top:14px;background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.c4-next-tag{display:block;font-size:var(--fs-label);color:var(--ink-3)}
.c4-next b{display:block;font-size:1.2rem;margin:2px 0 4px}
.c4-next p{margin:0}
@media (max-width:760px){.c4-cards{grid-template-columns:minmax(0,1fr)}}

/* ============================================================================
   v2「ターミナル由来のテック」（2026-09-25。本人「ポップすぎる。理系の大学生向けに洗練＋少しポップ・丸文字で」）。/designslide の棚 theme-v2
   ★ 「@@subject {」から「}」までは、この教材の章だけに効く規則（新しい教材へは写らない）
   3 案（ラボノート・ソフトなプロダクト UI・ターミナル由来）を 3 つの立場で審査して C を採り、A・B の良い所を接いだ（Workflow pcl-v2-design）
   v1 の CSS の後ろに足す上書き。html に data-theme="v2" があるときだけ効く。文と JS の組み方は変えない。
   ★ トークンだけ html[data-theme=v2]{…} で :root に勝たせる。ほかの規則はすべて :where(html[data-theme=v2]) を頭に付け、
     詳細度を v1 と揃える（v1 の状態の規則 .on・:disabled・[aria-pressed]・.ok/.ng・.ask などが、そのまま勝ち残る）。
   ★ 色は 3 系統だけ: 墨（この教材は色相 258° の紫の墨。字・札・濃い帯）／印（淡い紫 #a78bfa→#e6d3ff。印だけ）／意味の 4 色＋注目の赤。
   ★ 白地の上では、ネオンは字に使わない（1.69:1）。ネオンの地には墨の字を載せる。
   ★ 選んだ・押した: 暗い地の上ではネオンの地に墨の字、明るい地の上では墨の地に白い字。
   ★ いま＝琥珀・自分＝ネオン・注目（画面の中の場所を指す枠と番号）＝赤。本文が「赤い枠」「赤い番号」と書いている。
   ============================================================================ */

html[data-theme=v2]{
  --bg:#f1eef9; --bg-2:#f1eef9;
  --paper:#fff; --paper-2:#f5f3fb;
  --ink:#1b142b; --ink-2:#332b46; --ink-3:#4f4664; --ink-4:#625a75;
  --line:#d7ceeb; --line-2:#e8e2f5; --line-3:#c8c3d4; --line-4:#a199b3;
  /* 濃い帯（上の帯・章ナビ・しおり・引き出しと早見の頭） */
  --deck:#140f20; --deck-2:#1e1532; --deck-3:#2b2143; --deck-ink:#e9e3f6; --deck-ink-2:#b1a8c5;
  /* 差し色（ネオン）。白地では印だけ */
  --acc:#a78bfa; --lime:#e6d3ff; --acc-deep:#5b3fd0; --acc-tint:#efe9ff; --lime-tint:#f4edff; --lime-deep:#6f4fd6;
  /* 役目の名前の印（theme.md §4.1）。v2 の印はネオン。ほかの役目の名前は、塗り替えた v1 の名前から引く（style.css の :root） */
  --c-mark:var(--acc);
  /* v1 の名前を v2 の値に付け替える（v1 の規則をそのまま生かす） */
  --main:#5b3fd0; --main-deep:#241c35; --main-dark:#1b142b; --main-soft:#eeeaf9; --main-line:#d0cbdc; --pill:transparent;
  --pink:#241c35; --pink-deep:#3c3253; --pink-soft:#eae4f7;
  --yellow:#e6d3ff; --marker:#e3d3ff; --brown:#241c35;
  /* 注目の赤は残す（正典の規則。この教材の本文は色の語で名指ししない。deck.json の theme_check の roles は空）。白い番号が 4.5:1 に届くよう一段だけ濃く（v1 #e03b3b は 4.32） */
  --red:#d63333;
  --peach:#f5f3fb; --peach-line:#d7ceeb; --orange:#6f4fd6;
  /* 意味の色（意味は v1 と同じ。値だけ v2 の地に合わせる） */
  --hit:#18793a; --hit-soft:#e5f4e9;
  --ask:#c07a0b; --ask-soft:#fff3d9; --ask-ink:#7a4a00;
  --stop:#c42a3b; --stop-soft:#fdecee;
  --drop:#a6b0b8;
  /* 字体 */
  --round:'v2-round','Hiragino Maru Gothic ProN','BIZ UDPGothic','Yu Gothic UI','Meiryo',sans-serif;
  --tag:'SF Mono','Menlo','Consolas','v2-round','BIZ UDGothic',monospace;
  --r:14px;
  --shadow-1:0 1px 2px rgba(22,16,44,.06);
  --shadow-2:0 1px 2px rgba(22,16,44,.06),0 12px 28px -20px rgba(22,16,44,.35);
}
/* 文字を拡大（投影）では、明るい教室で消えやすい縁と影を一段濃くする（案 B から） */
html.big[data-theme=v2]{--line:#c8c3d4;--line-3:#a199b3;--shadow-1:0 1px 3px rgba(22,16,44,.16)}

/* ── 土台 ─────────────────────────────────────── */
:where(html[data-theme=v2]) body{font-family:var(--round);font-weight:500;background:var(--bg)}
:where(html[data-theme=v2]) :is(b,strong){font-weight:700}
:where(html[data-theme=v2]) :is(button,summary,input):focus-visible{outline-color:var(--acc-deep)}
:where(html[data-theme=v2]) code{background:#eeeaf9;border:1px solid var(--line-2);border-radius:4px;padding:0 .3em}
:where(html[data-theme=v2]) mark{background:linear-gradient(transparent 56%,var(--marker) 56%);font-weight:700}
:where(html[data-theme=v2]) .kbd{border:1px solid #b9b2c8;border-bottom-width:3px;font-weight:700}
:where(html[data-theme=v2]) kbd.kbd[data-gk]{border-color:var(--line-4)}
:where(html[data-theme=v2]) kbd.kbd[data-gk]:hover{background:var(--lime-tint);border-color:var(--ink)}
/* 模型なのに body の字体を受けていた所（本物の字体に戻す） */
:where(html[data-theme=v2]) :is(.dlg,.c72-ss,.c72-app,.c72-start,.c72-set,.c43-tray,.c43-menu,.term.t-win .t-bar){font-family:'Yu Gothic UI','Segoe UI','Hiragino Kaku Gothic ProN',sans-serif}
:where(html[data-theme=v2]) :is(.dlg.d-mac,.c43-spot,.c43-spot-hit,.term.t-mac .t-bar){font-family:-apple-system,'Hiragino Kaku Gothic ProN',sans-serif}

/* ── 上の帯（濃い帯）──────────────────────────── */
:where(html[data-theme=v2]) .topbar{background:var(--deck);-webkit-backdrop-filter:none;backdrop-filter:none;border-bottom:1px solid var(--deck-3);color:var(--deck-ink)}
:where(html[data-theme=v2]) .brand{font-weight:700}
:where(html[data-theme=v2]) .brand-icon{background:var(--acc);box-shadow:none;border-radius:9px}
:where(html[data-theme=v2]) .brand-icon svg{stroke:var(--deck)}
:where(html[data-theme=v2]) .brand .course{color:var(--acc);font-family:var(--tag);font-weight:600;letter-spacing:.14em}
:where(html[data-theme=v2]) .osswitch{background:var(--deck-2);border:1px solid var(--deck-3)}
:where(html[data-theme=v2]) .osswitch button{color:var(--deck-ink-2);font-weight:700}
:where(html[data-theme=v2]) .osswitch button[aria-pressed=true]{background:var(--acc);color:var(--deck);box-shadow:none}
:where(html[data-theme=v2]) :is(.tb-guide button,.topbar .plain){background:transparent;border:1px solid var(--deck-3);color:var(--deck-ink);font-weight:700}
:where(html[data-theme=v2]) :is(.tb-guide button,.topbar .plain):hover{border-color:var(--acc)}
:where(html[data-theme=v2]) :is(.tb-guide button,.topbar .plain)[aria-pressed=true]{background:var(--deck-2);color:var(--acc);border-color:var(--acc)}   /* 前は白地に墨の字。早見の幕の下で灰に沈み、押せないボタンに見えた（学生役） */

/* ── 章ナビ（濃い帯。いまの章だけネオン）──────────────
   余白（上 16・下 16）は v1 のまま。帯の色は box-shadow で左右へ伸ばし、clip-path で上 16px・下 10px までに切る。
   レイアウトの高さは v1 と同じ（1 画面の収まりを動かさない）。 */
:where(html[data-theme=v2]) .chapters{background:var(--deck);box-shadow:0 0 0 100vmax var(--deck);clip-path:inset(-16px -100vmax -10px)}
:where(html[data-theme=v2]) .chapter{background:var(--deck-2);border:1px solid var(--deck-3);border-radius:10px;color:var(--deck-ink-2);font-weight:700}
:where(html[data-theme=v2]) .chapter .num{width:auto;height:auto;min-width:2ch;background:none;border-radius:0;color:var(--deck-ink-2);font-family:var(--tag);font-weight:600}
:where(html[data-theme=v2]) .chapter .ch-dots i{background:var(--deck-3)}
:where(html[data-theme=v2]) .chapter .ch-dots i.on{background:var(--acc)}
:where(html[data-theme=v2]) .chapter:hover{border-color:var(--acc);color:var(--deck-ink)}
:where(html[data-theme=v2]) .chapter[aria-current=page]{background:var(--acc);border-color:var(--acc);color:var(--deck);box-shadow:none}
:where(html[data-theme=v2]) .chapter[aria-current=page] .num{background:none;color:var(--deck)}
:where(html[data-theme=v2]) .chapter[aria-current=page] .ch-dots i{background:rgba(22,16,44,.25)}
:where(html[data-theme=v2]) .chapter[aria-current=page] .ch-dots i.on{background:var(--deck)}

/* ── 枚と見出し ─────────────────────────────── */
:where(html[data-theme=v2]) .slide{border:1px solid var(--line);border-radius:18px}
:where(html[data-theme=v2]) .s-no{font-family:var(--tag);font-weight:600;color:var(--ink-3);letter-spacing:.02em;gap:8px}
:where(html[data-theme=v2]) .s-no::before{content:"";flex:0 0 auto;width:9px;height:9px;border-radius:2px;background:var(--acc);box-shadow:inset 0 0 0 1px rgba(91,63,208,.55)}
:where(html[data-theme=v2]) .s-chip{background:none;color:var(--ink);padding:0;border-radius:0;font-weight:700}
:where(html[data-theme=v2]) .s-chip::after{content:" /";white-space:pre;color:var(--ink-4);font-weight:500}
:where(html[data-theme=v2]) .s-no>.wb{font-family:var(--round);font-weight:700;color:var(--ink-2)}
:where(html[data-theme=v2]) .s-of{border:1px solid var(--line);border-radius:4px;padding:0 6px;line-height:1.5;color:var(--ink-3)}
/* 見出し: ピル・縫い目・縁取り・マウスの矢印を外し、頭にネオンのカーソル（ターミナルの入力待ち） */
:where(html[data-theme=v2]) .pill{background:none;color:var(--ink);padding:0;border-radius:0;box-shadow:none;text-shadow:none;
  font-weight:700;letter-spacing:.01em;gap:.38em;align-items:flex-start}
:where(html[data-theme=v2]) .pill>svg{display:none}
:where(html[data-theme=v2]) .pill::after{content:none}
:where(html[data-theme=v2]) .pill::before{content:"";flex:0 0 auto;width:.22em;height:1em;margin-top:.15em;border-radius:3px;background:linear-gradient(180deg,var(--acc),var(--lime))}
:where(html[data-theme=v2]) .s-lead{color:var(--ink-2)}

/* ── カード・ポイント・札 ───────────────────────── */
:where(html[data-theme=v2]) .card{border:1px solid var(--line);box-shadow:var(--shadow-1)}
:where(html[data-theme=v2]) .card h3{color:var(--ink);font-weight:700}
:where(html[data-theme=v2]) :is(.card:not(.points-card)>h3,.c4-cheat-h,.cv-h)::before{content:"";display:inline-block;width:.5em;height:.5em;border-radius:2px;
  background:var(--acc);box-shadow:inset 0 0 0 1px rgba(91,63,208,.55);margin-right:.5em;vertical-align:.1em}
:where(html[data-theme=v2]) .card.points-card>h3{background:var(--deck);color:var(--acc);border-radius:6px;padding:1px 12px;letter-spacing:.06em}
:where(html[data-theme=v2]) .badge{border:1px solid var(--line-3);border-radius:6px;font-weight:700}
:where(html[data-theme=v2]) .badge.ask{color:var(--ask-ink)}

/* ── 盤・ボタン・切り替え ───────────────────────── */
:where(html[data-theme=v2]) .stage{background:linear-gradient(#eae4f7 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,#eae4f7 1px,transparent 1px) 0 0/24px 24px,#f8f6fd;
  border:1px solid var(--line)}
:where(html[data-theme=v2]) .btn{border:1px solid var(--line-3);border-radius:10px;font-weight:700;box-shadow:0 1px 0 rgba(22,16,44,.08)}
:where(html[data-theme=v2]) .btn:hover{border-color:var(--ink-3)}
:where(html[data-theme=v2]) .btn:active{transform:translateY(1px);box-shadow:none}
:where(html[data-theme=v2]) :is(.btn.primary,.pg-next){background:var(--deck);border-color:var(--deck);color:#fff;box-shadow:none}
:where(html[data-theme=v2]) :is(.btn.primary,.pg-next):hover{box-shadow:0 0 0 3px var(--acc)}
:where(html[data-theme=v2]) .btn.mint{background:var(--acc);border-color:var(--acc-deep);color:var(--deck);box-shadow:none}
:where(html[data-theme=v2]) .btn.mint:hover{background:#bca6ff}
:where(html[data-theme=v2]) .btn[aria-pressed=true]{background:var(--deck);border-color:var(--deck);color:#fff}
:where(html[data-theme=v2]) .btn:disabled{background:var(--paper-2);color:var(--ink-4);border-color:var(--line);box-shadow:none;transform:none}
:where(html[data-theme=v2]) .segmented{background:#eeeaf9;border:1px solid var(--line);border-radius:10px;padding:3px}
:where(html[data-theme=v2]) .segmented button{border-radius:7px;color:var(--ink-3);font-weight:700}
:where(html[data-theme=v2]) .segmented button[aria-pressed=true]{background:var(--deck);color:#fff;box-shadow:none}

/* ── やってみる・これもチェック・表・理解の確認 ─────────── */
:where(html[data-theme=v2]) .tryit{background:#f7f2ff;border:1px solid var(--line);border-left:4px solid var(--deck);border-radius:12px}
:where(html[data-theme=v2]) .tryit .ti{background:var(--deck);color:#fff;border-radius:6px;font-weight:700;display:inline-flex;align-items:center;gap:.45em}
:where(html[data-theme=v2]) .tryit .ti::before{content:"";width:.5em;height:.5em;border-radius:2px;background:var(--acc)}
:where(html[data-theme=v2]) .ti-os{color:var(--ink-3);font-weight:700}
:where(html[data-theme=v2]) details.check{background:#fff;border:1px solid var(--line)}
:where(html[data-theme=v2]) details.check summary{color:var(--ink);font-weight:700}
:where(html[data-theme=v2]) details.check .ctag{transform:none;background:var(--deck);color:var(--lime);border:none;border-radius:6px;padding:0 10px}
:where(html[data-theme=v2]) details.check summary::after{border-radius:8px;border:1px solid var(--line-3);color:var(--ink);background:#fff}
:where(html[data-theme=v2]) details.check[open] summary::after{background:var(--deck);border-color:var(--deck);color:#fff}
:where(html[data-theme=v2]) .dfig{border:1px solid var(--line);border-radius:12px}
:where(html[data-theme=v2]) table.mini th{background:#eeeaf9;color:var(--ink);border-bottom:2px solid var(--ink)}
:where(html[data-theme=v2]) table.mini tr:nth-child(even) td{background:#f7f5fc}
:where(html[data-theme=v2]) .quiz{border:1px solid var(--line);background:linear-gradient(90deg,var(--acc),var(--lime)) 0 0/100% 4px no-repeat,#fff}
:where(html[data-theme=v2]) .quiz .qtag{background:var(--deck);color:var(--acc);border-radius:6px}
:where(html[data-theme=v2]) .qopt{border:1px solid var(--line-3);border-radius:10px}
:where(html[data-theme=v2]) .qopt:hover{border-color:var(--ink-3)}
:where(html[data-theme=v2]) .qopt.ok{border-color:var(--hit)} :where(html[data-theme=v2]) .qopt.ng{border-color:var(--stop)}

/* ── 参考図書（札・しおり・引き出し）──────────────────
   誌面の画像そのものには触らない。傾き・マスキングテープ・こげ茶の帯だけを外す。 */
:where(html[data-theme=v2]) .booktag{border:1px solid var(--line-3);background:#fff;color:var(--ink-2);border-radius:10px;font-weight:700}
:where(html[data-theme=v2]) .booktag b{background:var(--deck);color:var(--acc);border-radius:5px;font-family:var(--tag)}
:where(html[data-theme=v2]) .booktag:hover{background:var(--lime-tint);border-color:var(--ink-3)}
:where(html[data-theme=v2]) .shiori{background:var(--deck);background-image:none;border-radius:10px 0 0 10px;font-weight:700}
:where(html[data-theme=v2]) .shiori b{background:var(--acc);color:var(--deck);border-radius:5px;font-family:var(--tag)}
:where(html[data-theme=v2]) .scrim{background:rgba(22,16,44,.42)}
:where(html[data-theme=v2]) .drawer{background:#fff;border-left:1px solid var(--deck-3)}
:where(html[data-theme=v2]) .dr-head{background:var(--deck)}
:where(html[data-theme=v2]) .dr-ico{background:var(--acc)}
:where(html[data-theme=v2]) .dr-kick{color:var(--acc)}
:where(html[data-theme=v2]) :is(.dr-shelf,.dr-x){border:1px solid rgba(255,255,255,.3)}
:where(html[data-theme=v2]) .dr-shelf.on{background:var(--acc);color:var(--deck);border-color:var(--acc)}
:where(html[data-theme=v2]) .dr-tab{border:1px solid var(--line-3);border-radius:6px;font-family:var(--tag)}
:where(html[data-theme=v2]) .dr-tab.on{background:var(--deck);border-color:var(--deck);color:#fff}
:where(html[data-theme=v2]) .dr-cap{border-left:4px solid var(--acc);background:var(--paper-2);border-radius:0 10px 10px 0}
:where(html[data-theme=v2]) .taped{transform:none;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 24px -18px rgba(22,16,44,.4)}
:where(html[data-theme=v2]) .taped::before,:where(html[data-theme=v2]) .taped::after{content:none}
:where(html[data-theme=v2]) .dr-nav{border:1px solid var(--line-3)}
:where(html[data-theme=v2]) .dr-count{font-family:var(--tag)}
:where(html[data-theme=v2]) .dr-zoom{border:1px solid var(--ink-3);background:#fff;color:var(--ink);border-radius:8px}
:where(html[data-theme=v2]) .sh-row{border-top:1px solid var(--line)}
:where(html[data-theme=v2]) .sh-slide{color:var(--ink)}
:where(html[data-theme=v2]) .sh-clip{border:1px solid var(--line)}
:where(html[data-theme=v2]) .sh-clip b{color:var(--ink-3);font-family:var(--tag)}

/* ── 下の送り ───────────────────────────────── */
:where(html[data-theme=v2]) .pg-count{font-family:var(--tag);color:var(--ink-3)}
:where(html[data-theme=v2]) .pg-keys{font-family:var(--round)}
:where(html[data-theme=v2]) .foot{border-top:1px solid var(--line)}

/* ── 表紙（ひさし→上端のネオンの線、30分の丸→墨の札の中のストップウォッチ、黄の縁取り文字→墨の題＋ネオンのカーソル、花の帯→消す）── */
:where(html[data-theme=v2]) .awning{height:4px;background:linear-gradient(90deg,var(--acc),var(--lime))}
:where(html[data-theme=v2]) .scallop{display:none}
:where(html[data-theme=v2]) .flowers{display:none}
/* 第 1 回: 墨の角丸の札の中の輪（正典の案 A のストップウォッチから）。全 15 回を 15 の目盛りにし、1 回目の弧をネオンで、弧の終わり（下）にライムの点。
   2026-09-27 本人「第7回目の講義に見える」で、7 回・30 分の輪から替えた */
:where(html[data-theme=v2]) .bignum{border-radius:28px;background:var(--deck);color:var(--deck-ink)}
:where(html[data-theme=v2]) .bignum::after{content:"";inset:5px;border:0;border-radius:50%;
  background:repeating-conic-gradient(from calc(var(--arc0,156deg) - .8deg),var(--deck) 0 1.6deg,transparent 1.6deg var(--tick,24deg)),conic-gradient(from var(--arc0,156deg),var(--acc) 0 var(--arc,6.667%),var(--deck-3) var(--arc,6.667%) 100%);   /* 弧と目盛りは ch0.js が LESSON から --arc・--tick・--arc0 で渡す（弧の終わりが下の点） */
  -webkit-mask:radial-gradient(closest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));
  mask:radial-gradient(closest-side,transparent calc(100% - 7px),#000 calc(100% - 6px))}
:where(html[data-theme=v2]) .bignum::before{content:"";position:absolute;left:50%;bottom:8px;width:12px;height:12px;border-radius:50%;
  transform:translate(-50%,50%);background:var(--lime);box-shadow:0 0 0 3px var(--deck);z-index:1;pointer-events:none}
:where(html[data-theme=v2]) .bignum b{font-family:var(--tag);color:var(--deck-ink);font-weight:700;letter-spacing:-.04em;line-height:1.2}   /* 等幅の字は字の箱が 1.16em ある。行の高さ 1 だと箱の上下へ 6px 出る（検査 spill）。字の位置は変わらない */
:where(html[data-theme=v2]) .bignum .tag{background:var(--acc);color:var(--deck);border:2px solid #fff;border-radius:6px;top:-12px}
:where(html[data-theme=v2]) .title-yellow{color:var(--ink);text-shadow:none;font-weight:700;letter-spacing:.01em}
:where(html[data-theme=v2]) .title-yellow::after{content:"";display:inline-block;width:.4em;height:.9em;margin-left:.12em;vertical-align:-.1em;border-radius:3px;
  background:linear-gradient(180deg,var(--acc),var(--lime))}

/* ── 操作の早見（鍵盤は「文字＝白・特殊＝灰・修飾＝墨・日本語＝ライム」の組）── */
:where(html[data-theme=v2]) .guide{background:#fff;border-top:1px solid var(--deck-3);border-radius:16px 16px 0 0}
:where(html[data-theme=v2]) .g-head{background:var(--deck)}
:where(html[data-theme=v2]) .g-tabs{background:rgba(255,255,255,.08)}
:where(html[data-theme=v2]) .g-tab.on{background:var(--acc);color:var(--deck)}
:where(html[data-theme=v2]) :is(.g-os,.g-keys){color:var(--deck-ink-2)}
:where(html[data-theme=v2]) .g-x{border:1px solid rgba(255,255,255,.3)}
:where(html[data-theme=v2]) .g-kbscroll{background:#e4def1;border-radius:14px}
:where(html[data-theme=v2]) .kb .k{border-color:#b9b2c8;color:var(--ink)}
:where(html[data-theme=v2]) .kb .k .k-sub{color:var(--ink-3)}
:where(html[data-theme=v2]) :is(.kb .k.s,.kb .k.a){background:#e7e0f6;border-color:#b9b2c8}
:where(html[data-theme=v2]) .kb .k.m{background:#2c2340;border-color:var(--deck);color:#fff}
:where(html[data-theme=v2]) .kb .k.m .k-sub{color:#cec9db}
:where(html[data-theme=v2]) .kb .k.j{background:#e7e0f6;border-color:#b9b2c8;box-shadow:inset 0 -3px 0 var(--lime-deep)}   /* 地をライムにすると、光ったキー（ライム）と同じ仲間に見えた（デザイン役）。下の縁だけにする */
:where(html[data-theme=v2]) .kb .k.f{background:#eeebf6;color:var(--ink-3)}
:where(html[data-theme=v2]) .kb .k.tid{background:#d6cdea;border-color:#b9b2c8}
:where(html[data-theme=v2]) .kb .k:hover{border-color:var(--ink)}
:where(html[data-theme=v2]) .kb .k.ctx{box-shadow:0 0 0 3px var(--acc-deep)}
:where(html[data-theme=v2]) .kb .k.lit.sel{background:var(--acc);border-color:var(--acc-deep);color:var(--deck)}
:where(html[data-theme=v2]) .kb .k.lit.combo{background:var(--lime);border-color:var(--lime-deep);color:var(--deck)}
:where(html[data-theme=v2]) :is(.kb .k.lit.sel,.kb .k.lit.combo) :is(.k-sub,.k-kana){color:var(--ink-2)}
:where(html[data-theme=v2]) .lg::before{border-color:#b9b2c8}
:where(html[data-theme=v2]) .lg.s::before{background:#e7e0f6} :where(html[data-theme=v2]) .lg.m::before{background:#2c2340}
:where(html[data-theme=v2]) .lg.j::before{background:#e7e0f6;box-shadow:inset 0 -3px 0 var(--lime-deep)} :where(html[data-theme=v2]) .lg.ctx::before{box-shadow:0 0 0 3px var(--acc-deep)}
:where(html[data-theme=v2]) .g-kana{border:1px solid var(--line-3)}
:where(html[data-theme=v2]) .g-kana.on{background:var(--deck);border-color:var(--deck);color:#fff}
:where(html[data-theme=v2]) .g-info{border:1px solid var(--line);border-left:6px solid var(--deck)}
:where(html[data-theme=v2]) .g-info.empty{border-left-color:var(--acc)}
:where(html[data-theme=v2]) .g-h4{color:var(--ink)}
:where(html[data-theme=v2]) .g-combo{border:1px solid var(--line)}
:where(html[data-theme=v2]) .g-combo.on{border-color:var(--lime-deep);background:var(--lime-tint)}
:where(html[data-theme=v2]) .g-op{border:1px solid var(--line-3)}
:where(html[data-theme=v2]) .g-op.on{background:var(--deck);border-color:var(--deck);color:#fff;box-shadow:none}
:where(html[data-theme=v2]) .g-dev{border:1px solid var(--line)}
:where(html[data-theme=v2]) .g-dev.mine{border-color:var(--deck);box-shadow:0 0 0 3px var(--acc-tint)}
:where(html[data-theme=v2]) .g-mine{background:var(--deck);color:var(--acc)}
:where(html[data-theme=v2]) .g-pad{border:2px dashed var(--line-4);background:linear-gradient(#eae4f7 1px,transparent 1px) 0 0/18px 18px,linear-gradient(90deg,#eae4f7 1px,transparent 1px) 0 0/18px 18px,#f8f6fd}
:where(html[data-theme=v2]) .g-pad-h{color:var(--ink)}
:where(html[data-theme=v2]) .g-pad-log li{border:1px solid var(--line)}
:where(html[data-theme=v2]) .g-pad-log li.new{border-color:var(--acc-deep);background:var(--acc-tint)}
:where(html[data-theme=v2]) .g-set{background:var(--paper-2);border:1px solid var(--line)}
:where(html[data-theme=v2]) .g-set h4{color:var(--ink)}
:where(html[data-theme=v2]) .gtip{border:1px solid var(--line-3);background:#fff;color:var(--ink-2)}
:where(html[data-theme=v2]) .gtip:hover{background:var(--lime-tint)}

/* ── 注目（模型と地図の上の枠と番号）は v1 の赤のまま ──────────────
   本文に「赤い枠で光ります」「赤い枠の［表示］」「赤い番号が部品を指している」とあるので、色を変えると文がうそになる。
   並びの番号（ポイントの 1・2・3）だけを墨にする（場所を指していない）。 */
:where(html[data-theme=v2]) .points .mark{background:var(--deck);color:#fff;font-family:var(--tag);font-weight:700;box-shadow:0 0 0 2px var(--acc)}
:where(html[data-theme=v2]) [style*="background:#4a3226"]{background:#241c35!important}
:where(html[data-theme=v2]) [style*="background:#d9506c"]{background:#6a4fc9!important}
:where(html[data-theme=v2]) svg text[font-family*="Hiragino Maru"]{font-family:var(--round)}
:where(html[data-theme=v2]) [style*="--k:#c8455d"]{--k:#241c35!important}

/* ── JS が描く SVG の色（v1 の値 → v2 の値）。CSS は表示属性に勝つ。
   1-1 の画面の模型（Dock・iPhone のアプリの色）と FTYPE（アプリの見分け）は塗り替えない ── */
:where(html[data-theme=v2]) :is(.slide,.guide,.drawer) svg [fill="#e9677f"]{fill:#3c3253}
:where(html[data-theme=v2]) :is(.slide,.guide,.drawer) svg [stroke="#e9677f"]{stroke:#3c3253}
:where(html[data-theme=v2]) svg [fill="#c8455d"]{fill:#241c35}
:where(html[data-theme=v2]) svg [stroke="#c8455d"]{stroke:#241c35}
:where(html[data-theme=v2]) svg [fill="#fde8ec"]{fill:#eae4f7}
:where(html[data-theme=v2]) svg.fi [fill="#fde8ec"]{fill:#ebe3ff}          /* 家（自分の部屋）だけネオンの淡い地 */
:where(html[data-theme=v2]) svg [fill="#f5a3b3"]{fill:#b5adc8}
:where(html[data-theme=v2]) svg [fill="#4a3226"]{fill:#241c35}
:where(html[data-theme=v2]) svg [stroke="#4a3226"]{stroke:#241c35}
:where(html[data-theme=v2]) svg [fill="#3a2d27"]{fill:#1b142b}
:where(html[data-theme=v2]) svg [stroke="#3a2d27"]{stroke:#1b142b}
:where(html[data-theme=v2]) svg [fill="#54453c"]{fill:#332b46}
:where(html[data-theme=v2]) svg [fill="#6b5a4f"]{fill:#4f4664}
:where(html[data-theme=v2]) svg [fill="#9a8d7c"]{fill:#726a85}
:where(html[data-theme=v2]) svg [stroke="#9a8d7c"]{stroke:#726a85}
:where(html[data-theme=v2]) svg [fill="#e6e1d8"]{fill:#e4def1}
:where(html[data-theme=v2]) svg [stroke="#e9dfd2"]{stroke:#d7ceeb}
:where(html[data-theme=v2]) svg [fill="#e9dfd2"]{fill:#d7ceeb}
:where(html[data-theme=v2]) svg [fill="#fbf7ee"]{fill:#f5f3fb}
:where(html[data-theme=v2]) svg [stroke="#d5cbef"]{stroke:#d0cbdc}
:where(html[data-theme=v2]) .slide svg [stroke="#b9ada4"]{stroke:#a6b0b8}
:where(html[data-theme=v2]) .slide svg [fill="#b9ada4"]{fill:#a6b0b8}
:where(html[data-theme=v2]) svg [fill="#23905f"]{fill:#18793a}
:where(html[data-theme=v2]) svg [stroke="#23905f"]{stroke:#18793a}
:where(html[data-theme=v2]) svg [fill="#e2f4ea"]{fill:#e5f4e9}
:where(html[data-theme=v2]) svg [fill="#cf3f55"]{fill:#c42a3b}
:where(html[data-theme=v2]) svg [stroke="#cf3f55"]{stroke:#c42a3b}
:where(html[data-theme=v2]) svg [fill="#fcebee"]{fill:#fdecee}
:where(html[data-theme=v2]) .slide svg tspan[fill="#e03b3b"]{fill:#d63333}   /* 5-1 の拡張子の字（赤のまま、--red に合わせる） */
/* 早見の絵: 光るボタン・指・「×2」 */
:where(html[data-theme=v2]) .g-art [fill="#e03b3b"]{fill:var(--acc)}
:where(html[data-theme=v2]) .g-art text[fill="#e03b3b"]{fill:#241c35}
:where(html[data-theme=v2]) .g-art [fill="#e9677f"]{fill:var(--acc)}
:where(html[data-theme=v2]) .g-art [stroke="#c8455d"]{stroke:var(--acc-deep)}

/* ── 狭い画面 ───────────────────────────────── */
@media(max-width:760px){
  :where(html[data-theme=v2]) .chapters{grid-template-columns:repeat(4,minmax(0,1fr))}
  :where(html[data-theme=v2]) .slide{border-radius:14px}
  /* 110px の札では「分」と輪のあきが字面の 1/4 を割るので、輪を外へ 2px・細く 1px */
  :where(html[data-theme=v2]) .bignum::after{inset:3px;-webkit-mask:radial-gradient(closest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(closest-side,transparent calc(100% - 6px),#000 calc(100% - 5px))}
  :where(html[data-theme=v2]) .bignum::before{bottom:5.5px;width:10px;height:10px}
}
@media(max-width:560px){
  :where(html[data-theme=v2]) .chapters{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}   /* 前は 8 列で章の名前を隠していた（検査 clip@500 が 9 か所を切れと数えた）。4 列 2 段で、番号の下に名前 */
  :where(html[data-theme=v2]) .chapter{flex-direction:column;justify-content:center;gap:2px;padding:6px 4px 11px;text-align:center}
  :where(html[data-theme=v2]) .chapter .ch-t{flex:0 0 auto;max-width:100%}
  :where(html[data-theme=v2]) .chapter .ch-dots{right:50%;transform:translateX(50%);bottom:3px}
}
/* スマホの幅で「文字を拡大」を押すと、4 列では「ダウンロード」が札に入らない（430px で 1 か所、375px で 4 か所）。2 列にする */
@media(max-width:430px){:where(html[data-theme=v2].big) .chapters{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ── v1 の飾りの色の残り（黄の光り・ミントの hover・本のアイコン・早見のキーの縁）── */
@keyframes fresh{0%{background:#f4edff}100%{background:transparent}}
@keyframes c4fresh{0%{background:#f4edff}100%{background:transparent}}
@keyframes c72fresh{0%{background:#f4edff}100%{background:var(--main-soft)}}
/* 本のアイコン（参考書の誌面を見る・引き出しの頭）: クリームの地と黄の背を白とネオンへ */
:where(html[data-theme=v2]) :is(.bt-ico,.dr-ico) svg [fill="#fff7e0"]{fill:#fff}
:where(html[data-theme=v2]) :is(.bt-ico,.dr-ico) svg [fill="#ffd84a"]{fill:var(--acc)}
/* 早見の記録と組み合わせの中のキー（v1 の暖色の縁） */
:where(html[data-theme=v2]) :is(.g-log kbd,.g-ck kbd){border-color:#b9b2c8}

/* 早見のクリックの指: 範囲の :is() の塗り替え（墨灰）が詳細度で勝っていた。ネオンに戻す（デザイン役 3） */
:where(html[data-theme=v2]) .guide svg.g-art [fill="#e9677f"]{fill:var(--acc)}
/* 表紙の「30」: 拡大で字だけが大きくなり、輪とのあきが 11px → 4px。札の大きさは変わらないので、字も据え置く（デザイン役 4） */
:where(html[data-theme=v2].big) .bignum b{font-size:67.2px}
@media(max-width:760px){:where(html[data-theme=v2].big) .bignum b{font-size:48px}}
/* ピルは OS の溝（OS の切り替え・早見のタブ）だけに残す。札は角 6px、ボタンは角 10px、手順の札は 4-2 のミッションの札と同じ形（デザイン役 5） */
:where(html[data-theme=v2]) :is(.c3-tag,.c4-home,.c5-app,.c2-tag,.c2-cnt,.c2-me,.g-mine,.c72-legend span){border-radius:6px}
:where(html[data-theme=v2]) :is(.c2-reset,.g-op,.g-kana,.gtip,.plain,.dr-shelf){border-radius:10px}
/* 6-1 の木の「PC」の段: v1 の暖色の灰（C6_COLOR.pc）。寒色の灰へ（デザイン役 10） */
:where(html[data-theme=v2]) [style*="--k:#8a7d73"]{--k:#726a85!important}
:where(html[data-theme=v2]) svg [fill="#8a7d73"]{fill:#726a85}
:where(html[data-theme=v2]) svg [stroke="#8a7d73"]{stroke:#726a85}
/* Mac の fn の 🌐 は、字体に無く色つきの絵文字で描かれる。墨のキーの上で浮かないよう、色を抜く（色役 8） */
:where(html[data-theme=v2]) .kb [data-gk="Fn"] .k-sub{filter:grayscale(1) brightness(1.7)}
/* 右の列: 参考書のボタンを下端に押し付けると、ポイントとのあいだに白い穴が空き「作りかけ」に見えた（学生役 5） */
:where(html[data-theme=v2]) .s-side>.booktag:last-child{margin-top:0}
/* 白い面に色の錨を 1 つ: ポイントのカードの上端にネオンの線（学生役 3。ネオンを増やすのではなく、置き場を 1 つに決める） */
:where(html[data-theme=v2]) .card.points-card{box-shadow:inset 0 3px 0 var(--acc),var(--shadow-1)}

/* ═════ 補足の厚い形（details.check.sp）の v2（2026-09-26。sp.css の上書き）═════
   ★ 書き方はこのファイルの規律のまま: 規則は全部 :where(html[data-theme=v2]) を頭に付け、v1 と同じ詳細度で後ろから勝つ
   ★ 色は v2 のトークンだけ（墨・ネオンの印・意味の 4 色・注目の赤）。ネオンを白地の字と縁にしない。グラデーションは細い棒だけ
   ★ 傾け・水玉・ピン・固い台の影・999px のピルを戻さない（§7）。画面の模型（sp.js の style の色）と .sp-aw は塗り替えない */

/* 絵の色を v2 に塗り替える（sp.js の SVG はクラスで塗っているので、変数を替えるだけで全部変わる） */
:where(html[data-theme=v2]) .sp{
  --sp-ink:var(--ink);
  --sp-paper:#fff;
  --sp-a:var(--line-2);         /* 淡い灰（台座・道具の胴） */
  --sp-b:var(--acc-tint);       /* ネオンの淡い地（ひもの穴・消しゴム） */
  --sp-c:var(--acc);            /* 印（ネオン。地に敷く。字と縁には使わない） */
  --sp-sh:var(--line);
  --sp-box:var(--lime-tint);
  --sp-hl:var(--red);           /* 注目の赤は v2 でも残す（画面の中の場所を指す輪と番号札） */
  --sp-bg:#f8f6fd;
  --sp-l1:var(--line-4);        /* 終わった系統は灰 */
  --sp-l2:var(--acc-deep);      /* いまに続く系統はネオンの濃い側 */
  --sp-arw:var(--ink);
}

:where(html[data-theme=v2]) .sp-thumb{border:1px solid var(--line);border-radius:6px}

/* 扉: 絵の地は盤と同じ方眼（方眼は盤の中だけ＝この絵の地も盤として扱う） */
:where(html[data-theme=v2]) .sp-hero{border:1px solid var(--line);border-radius:14px}
:where(html[data-theme=v2]) .sp-hero-art{background:linear-gradient(#eae4f7 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,#eae4f7 1px,transparent 1px) 0 0/24px 24px,var(--sp-bg);
  border-right:1px solid var(--line)}
:where(html[data-theme=v2]) .sp-hero-yr{font-family:var(--tag);font-weight:600;border:1px solid var(--line-3);border-radius:4px;background:#fff}
:where(html[data-theme=v2]) .sp-kicker{font-family:var(--tag);font-weight:600;letter-spacing:.08em;color:var(--ink-3);display:flex;align-items:center;gap:8px}
:where(html[data-theme=v2]) .sp-kicker::before{content:"";flex:0 0 auto;width:9px;height:9px;border-radius:2px;background:var(--acc);box-shadow:inset 0 0 0 1px rgba(91,63,208,.55)}
:where(html[data-theme=v2]) .sp-h{font-weight:700;display:flex;align-items:flex-start;gap:.38em}
:where(html[data-theme=v2]) .sp-h::before{content:"";flex:0 0 auto;width:.22em;height:1em;margin-top:.17em;border-radius:3px;background:linear-gradient(180deg,var(--acc),var(--lime))}
:where(html[data-theme=v2]) .sp-h>span{background:none}

/* 見開き: 白い 2 枚、のどは 1px の線 */
:where(html[data-theme=v2]) .sp-spread{background:#fff;border:1px solid var(--line);border-radius:14px}
:where(html[data-theme=v2]) .sp-spread::before{border-left:1px solid var(--line)}
:where(html[data-theme=v2]) .sp-ph{font-weight:700}
:where(html[data-theme=v2]) .sp-no{width:auto;min-width:26px;height:26px;padding:0 6px;border-radius:6px;background:var(--deck);color:var(--acc);font-family:var(--tag);font-weight:700}

/* 鋭い一言: 墨の札にライムの字（.ctag と同じ）、左に墨の 4px */
:where(html[data-theme=v2]) .sp-key{border:1px solid var(--line);border-left:4px solid var(--deck);border-radius:12px;background:var(--paper-2)}
:where(html[data-theme=v2]) .sp-key-lbl{font-family:var(--tag);font-weight:700;background:var(--deck);color:var(--lime)}
:where(html[data-theme=v2]) .sp-key p{font-weight:700}

/* 路線図（系統の外の菱形は v1 と同じ墨の点線。終わった系統の線（--line-4 の灰）と同じ色にしない） */
:where(html[data-theme=v2]) .sp-legend{font-weight:700}
:where(html[data-theme=v2]) .sp-st-y{font-family:var(--tag);font-weight:600;color:var(--ink-3)}
:where(html[data-theme=v2]) .sp-st-n b{font-weight:700}
:where(html[data-theme=v2]) .sp-ver{border:1px solid var(--line);border-radius:4px;background:#eeeaf9;color:var(--ink-2)}

/* 標本・標本の格子・画面 1 枚 */
:where(html[data-theme=v2]) .sp-spec{border:1px solid var(--line);border-radius:10px}
:where(html[data-theme=v2]) .sp-spec-h{font-weight:700}
:where(html[data-theme=v2]) .sp-y{font-family:var(--tag);font-weight:600;color:var(--ink-3)}
:where(html[data-theme=v2]) .sp-cell{border:1px solid var(--line);border-radius:10px}
:where(html[data-theme=v2]) .sp-cell-fig{border:1px solid var(--line-3);border-radius:6px}
:where(html[data-theme=v2]) .sp-cell-n{font-weight:700}
:where(html[data-theme=v2]) .sp-mon{border:1px solid var(--line);border-radius:12px}

/* 図の札（番号は .sp-no。ページの見出しと同じ墨の札） */
:where(html[data-theme=v2]) .sp-plate{border:1px solid var(--line);border-radius:14px}
:where(html[data-theme=v2]) .sp-plate figcaption{font-weight:700}

/* 数の並び: 段は ネオンの淡い地（g1・g2。路線図の「いまに続く系統」の線と同じ色の系統）／ライムの淡い地（g3）。
   ★ 前は g1 を淡い灰にしていて、同じ見開きの凡例の「Mac OS 9 までの系統」（灰の線）と重なった（2026-09-26） */
:where(html[data-theme=v2]) .sp-num{border:1px solid var(--acc-deep);border-radius:4px;background:var(--acc-tint)}
:where(html[data-theme=v2]) .sp-numrow-l.g3 .sp-num{border-color:var(--lime-deep);background:var(--lime-tint)}
:where(html[data-theme=v2]) .sp-numrow-l .sp-num.skip{border-style:dashed;border-color:var(--line-4);background:transparent;color:var(--ink-3)}
:where(html[data-theme=v2]) .sp-numh{font-family:var(--tag);font-weight:600}

/* 展開した木 */
:where(html[data-theme=v2]) .sp-tree ul>li::before{border-left-width:1px;border-left-color:var(--line-3)}
:where(html[data-theme=v2]) .sp-tree ul>li::after{border-top-width:1px;border-top-color:var(--line-3)}
:where(html[data-theme=v2]) .sp-tn.dir{font-weight:700}
:where(html[data-theme=v2]) .sp-tree li.hl>.sp-tn{background:var(--lime-tint)}

/* 豆知識: ピンをやめ、左に墨の 4px（やってみると同じ言葉） */
:where(html[data-theme=v2]) .sp-tid{border:1px solid var(--line);border-left:4px solid var(--deck);border-radius:12px;box-shadow:var(--shadow-1)}
:where(html[data-theme=v2]) .sp-tid::before{content:none}
:where(html[data-theme=v2]) .sp-tid-h{background:var(--deck);color:var(--lime);border-radius:6px;font-weight:700}

/* 資料 */
:where(html[data-theme=v2]) .sp-src{border-top:1px solid var(--line)}
:where(html[data-theme=v2]) .sp-src-h{border:1px solid var(--line-3);border-radius:4px;font-family:var(--tag);font-weight:600}

/* 名前の札・判定・書き換えの例・バイト・流れ */
:where(html[data-theme=v2]) .sp-fname{border:1px solid var(--line-3);border-radius:6px;background:#eeeaf9}
:where(html[data-theme=v2]) .sp-arrow{color:var(--ink)}
:where(html[data-theme=v2]) .sp-vd{border-width:1px;border-radius:6px;font-weight:700}
:where(html[data-theme=v2]) .sp-vd.ask{color:var(--ask-ink)}
:where(html[data-theme=v2]) .sp-case{border-top:1px solid var(--line)}
:where(html[data-theme=v2]) .sp-byte{border:1px solid var(--line-3);border-radius:4px}
:where(html[data-theme=v2]) .sp-byte i{border-top:1px dashed var(--line)}
:where(html[data-theme=v2]) .sp-byte.hot{border-color:var(--acc-deep)}
:where(html[data-theme=v2]) .sp-byte.hot b{background:var(--acc-tint)}
:where(html[data-theme=v2]) .sp-flow-h{font-weight:700}
:where(html[data-theme=v2]) .sp-flow-st{border:1px solid var(--line-3);border-radius:6px}

/* 実験台: 地は盤と同じ方眼。いま選んでいる札は、明るい地の上なので墨の地に白い字 */
:where(html[data-theme=v2]) .sp-lab{background:linear-gradient(#eae4f7 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,#eae4f7 1px,transparent 1px) 0 0/24px 24px,#f8f6fd;
  border:1px solid var(--line);border-radius:14px}
:where(html[data-theme=v2]) .sp-lab-t{color:var(--ink);font-weight:700}
:where(html[data-theme=v2]) .sp-pick{border:1px solid var(--line-3);border-radius:10px;box-shadow:0 1px 0 rgba(22,16,44,.08)}
:where(html[data-theme=v2]) .sp-pick:hover{border-color:var(--ink);background:var(--lime-tint)}
:where(html[data-theme=v2]) .sp-pick[aria-pressed=true]{background:var(--deck);border-color:var(--deck);box-shadow:none}
:where(html[data-theme=v2]) .sp-pick[aria-pressed=true] b{color:#fff}
:where(html[data-theme=v2]) .sp-pick[aria-pressed=true] small{color:var(--deck-ink-2)}
:where(html[data-theme=v2]) .sp-lab-file{border:1px solid var(--line);border-radius:12px}
:where(html[data-theme=v2]) .sp-nametag{border:1px solid var(--line-3);border-radius:6px 10px 10px 6px;font-weight:700}
:where(html[data-theme=v2]) .sp-nametag.changed{border-color:var(--ask);background:var(--ask-soft)}
:where(html[data-theme=v2]) .sp-inside{border:1px dashed var(--line-3);border-radius:8px}
:where(html[data-theme=v2]) .sp-app{border:1px solid var(--line-3);border-radius:6px;background:#eeeaf9;color:var(--ink);font-weight:700}
:where(html[data-theme=v2]) .sp-lab-why{border:1px solid var(--line);border-left:4px solid var(--ask);border-radius:12px}

/* 確認の札 */
:where(html[data-theme=v2]) .sp-note{border:1px solid var(--line);border-left:4px solid var(--deck);border-radius:12px;background:var(--paper-2)}
:where(html[data-theme=v2]) .sp-note-os{background:var(--deck);border-radius:6px;font-weight:700}

@media(max-width:1100px){   /* 見開きを 1 列に畳む境（sp.css と同じ 1100px） */
  :where(html[data-theme=v2]) .sp-spread{background:#fff}
  :where(html[data-theme=v2]) .sp-page+.sp-page{border-top:1px solid var(--line)}
}
@media(max-width:760px){
  :where(html[data-theme=v2]) .sp-hero-art{border-right:none;border-bottom:1px solid var(--line)}
}

/* ── レトロの印（第1回で足した塊）──────────────────────────────────
   ★ ポイントの札をメッセージウィンドウの形にする（濃い帯の地・白い二重の縁・ドット字体の題）。字は濃い帯の字（比 8 以上）。
   ★ 章の番号・札の題・補足の札・表紙の大きな数はドット字体（parts.css の px-dot）。本文は丸文字のまま。 */
:where(html[data-theme=v2]) .card.points-card{background:var(--deck);color:var(--deck-ink);border:0;border-radius:12px;
  box-shadow:0 0 0 3px var(--deck),inset 0 0 0 3px var(--deck-ink),inset 0 0 0 6px var(--deck)}
:where(html[data-theme=v2]) .card.points-card>h3{font-family:'px-dot',var(--round);font-weight:400;background:var(--deck);color:var(--lime);
  box-shadow:inset 0 0 0 2px var(--deck-ink);letter-spacing:.08em;color:var(--acc)}
:where(html[data-theme=v2]) .points-card .points li{color:var(--deck-ink)}
:where(html[data-theme=v2]) .points-card .points b{color:var(--lime)}
:where(html[data-theme=v2]) .points-card mark{background:var(--acc);color:var(--deck);padding:0 .2em;border-radius:3px;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
:where(html[data-theme=v2]) .points-card .points .mark{background:var(--deck-3);color:var(--deck-ink);box-shadow:0 0 0 2px var(--acc)}
/* ★ 章ナビの番号と表紙の大きな数は、ドット字体だと字の箱が器から 2〜9px 出る（spill の組。2026-09-27）ので、等幅の字体のまま */
:where(html[data-theme=v2]) :is(.s-chip,details.check .ctag,.bignum .tag,.cv-no){font-family:'px-dot',var(--tag);font-weight:400}

/* ============================================================================
   中核 — 状態・差分更新・委譲

   ★ 押しても図とスクロールとフォーカスが飛ばないのは、この差分更新のおかげです。
     `#app.innerHTML` を毎回入れ替えると、SVG も入力欄も作り直されて位置が跳ねます。
     差分の中核（nodeKey / compatible / patchNode / patchChildren / patchTree）は
     基準版 論理回路_単体版.html の実装をそのまま使っています（2026-09-20）。
     2026-09-24 に正典 algorithm-data-structure/_build/01-web から写し、keyAttributes と、状態・送り・委譲（下半分）を変えました。
   ★ /designslide の共通の部品です。教材の側で直さない（足りない部品は parts.js か章のファイルに書く）。
   ============================================================================ */

var $ = function (sel) { return document.querySelector(sel); };

/* ── この教材の値 ──────────────────────────────────────────────────────
   ★ build_web.py が deck.json の画面に効く値を var DECK として JS の先頭に差し込む（ここより前）。
   ★ AXIS は上の帯の切り替え（deck.json の axis = {key, values, labels, aria}）。切り替えの無い教材では null。
     いまの値は state[AXIS.key]。題や手順を切り替えで分けるときは {値: …} の束にして tt・axPick で引く。
     切り替えたときに戻したい状態は、章のファイルが onAxis(fn) で登録する（boot.js が切り替えの前に呼ぶ）。 */
var DECK = (typeof DECK === "object" && DECK) || {};
var AXIS = DECK.axis && DECK.axis.key ? DECK.axis : null;
function axVal() { return AXIS ? state[AXIS.key] : undefined; }
/* axPick(a, b, …) は AXIS.values の順に並べた値から、いまの値の位置のものを返す。axPick({win: a, mac: b}) の形でもよい */
function axPick() {
  var a = arguments;
  if (a.length === 1 && a[0] && typeof a[0] === "object") return a[0][axVal()];
  var i = AXIS ? AXIS.values.indexOf(axVal()) : 0;
  return a[i < 0 ? 0 : i];
}
function osPick(win, mac) { return axPick(win, mac); }   /* 前からの名前（axPick と同じ） */
var AXIS_HOOKS = [];
function onAxis(fn) { AXIS_HOOKS.push(fn); }

/* 差分のときに「同じ部品」と見なす目印。ここに無い属性は、位置だけで照合されます。 */
var keyAttributes = [
  "id", "data-slide-id", "data-slide", "data-os", "data-seg", "data-row", "data-step",
  "data-qopt", "data-quiz", "data-open", "data-run", "data-field",
  "data-clip", "data-k", "data-node", "data-file"
];
if (AXIS && keyAttributes.indexOf("data-" + AXIS.key) < 0) keyAttributes.push("data-" + AXIS.key);
keyAttributes.push("data-range", "data-pick");   /* スライダー（rangeCtl）と図の上で指す所は、描き直しても同じ要素のまま（動かしている途中で差し替えない） */

function nodeKey(node) {
  if (node.nodeType !== 1) return null;
  for (var i = 0; i < keyAttributes.length; i++) {
    var name = keyAttributes[i];
    if (node.hasAttribute(name)) return name + ":" + node.getAttribute(name);
  }
  return null;
}

function compatible(a, b) {
  return a.nodeType === b.nodeType && a.nodeName === b.nodeName && a.namespaceURI === b.namespaceURI;
}

function patchNode(current, next) {
  if (current.nodeType !== 1) {
    if (current.nodeValue !== next.nodeValue) current.nodeValue = next.nodeValue;
    return;
  }
  var attrs = [].slice.call(current.attributes);
  for (var i = 0; i < attrs.length; i++) {
    var attr = attrs[i];
    /* 開いている折りたたみは、描き直しで閉じない */
    if (attr.name === "open" && current.tagName === "DETAILS") continue;
    if (!next.hasAttribute(attr.name)) current.removeAttribute(attr.name);
  }
  var nattrs = [].slice.call(next.attributes);
  for (var j = 0; j < nattrs.length; j++) {
    if (current.getAttribute(nattrs[j].name) !== nattrs[j].value) current.setAttribute(nattrs[j].name, nattrs[j].value);
  }
  patchChildren(current, next);
  if (current.tagName === "INPUT" && current.value !== next.value) current.value = next.value;
  if (current.tagName === "SELECT" && current.value !== next.value) current.value = next.value;
}

function patchChildren(current, next) {
  var wanted = [].slice.call(next.childNodes);
  for (var i = 0; i < wanted.length; i++) {
    var target = wanted[i], key = nodeKey(target);
    var existing = current.childNodes[i];
    if (!existing || !compatible(existing, target) || nodeKey(existing) !== key) {
      var match = null;
      if (key) {
        var rest = [].slice.call(current.childNodes).slice(i + 1);
        for (var r = 0; r < rest.length; r++) {
          if (nodeKey(rest[r]) === key && compatible(rest[r], target)) { match = rest[r]; break; }
        }
      }
      if (match) {
        current.insertBefore(match, existing || null);
        existing = match;
      } else {
        current.insertBefore(target.cloneNode(true), existing || null);
        continue;
      }
    }
    patchNode(existing, target);
  }
  while (current.childNodes.length > wanted.length) current.lastChild.remove();
}

function patchTree(root, markup) {
  var template = document.createElement("template");
  template.innerHTML = markup;
  jwTree(template.content);
  patchChildren(root, template.content);
}

/* ── 日本語を文節で折り返す ─────────────────────────────────────────────
   ★ 既定の折返しは 1 文字単位なので「フォル／ダー」「ダウ／ンロード」と語の中で割れる（投影で信用を落とす）。
     描く前の文字に、文節の切れ目の印（ZWSP）を入れ、CSS の keep-all で「印と空白でだけ折る」にする。
   ★ JS の文字列には入れない（正規表現・比較・キーに使っている文字列が壊れる）。描く直前の DOM の文字にだけ入れる。
     毎回同じ結果になるので、差分の比較で余計な書き換えは起きない。
   ★ 区切りは Intl.Segmenter の語。文節に寄せるため、切れ目を入れるのは
     「前がひらがな・句読点・閉じかっこで終わり、次が漢字・カタカナ・英数字・開きかっこで始まる」ところだけにする
     （助詞・送りがなは前にくっつく。漢字どうし・カタカナどうしの間には入れない＝熟語と外来語の中で割れない）。

function clipImg(name, cls) {

  if (!f) return "";
  if (!f.src) return '<div class="clip-empty" data-fig="' + name + '"><p>この図は教室で配る版にだけ入っています。</p></div>';

    + '" alt="' + esc(f.cap) + '">';

function shiori() {
