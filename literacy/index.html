<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PCリテラシ｜授業資料（2026年度 後期）</title><style>:root{--bg:#f6f7fb;--card:#fff;--ink:#16181d;--sub:#4b5260;--line:#e3e6ee;--chip:#eef0f5;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--card:#1b1e25;--ink:#eef0f4;--sub:#aab1bf;--line:#2c313b;--chip:#262a33;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.7 "Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:880px;margin:0 auto;padding:32px 16px 56px}
header h1{font-size:28px;line-height:1.3;margin:0 0 6px;font-weight:800;letter-spacing:.01em}
header p{margin:0;color:var(--sub);font-size:15px}
section.subj{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.subj>.head{padding:16px 18px 12px;border-top:6px solid var(--c)}
.subj h2{margin:0;font-size:21px;line-height:1.4;font-weight:800}
.subj h2 a{color:inherit;text-decoration:none}
.subj .lead{margin:4px 0 0;color:var(--sub);font-size:15px}
ul.lecs{list-style:none;margin:0;padding:0}
ul.lecs li{display:grid;grid-template-columns:72px minmax(0,1fr);align-items:center;gap:8px 12px;padding:14px 18px;border-top:1px solid var(--line)}
.no{text-align:center;font-weight:800;font-size:14px;color:var(--ct);background:var(--chip);border-radius:999px;padding:3px 8px}
.ttl{font-weight:700;font-size:17px;line-height:1.5}
.acts{grid-column:2;display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:7px 14px;border-radius:9px;font-weight:700;font-size:15px;text-decoration:none;border:1.5px solid var(--ct);color:var(--ct);background:transparent;white-space:nowrap}
.btn.pri{background:var(--c);border-color:var(--c);color:#fff}
ul.lecs li.locked .ttl{color:var(--sub);font-weight:600}
ul.lecs li.locked .no{color:var(--sub)}
.soon{grid-column:2;color:var(--sub);font-size:14px}
section.subj{--ct:var(--c)}
@media (prefers-color-scheme:dark){section.subj{--ct:color-mix(in srgb,var(--c) 55%,#fff)}}
.btn:focus-visible{outline:3px solid var(--c);outline-offset:2px}
@media (hover:hover){.btn:hover{filter:brightness(1.08)}}
.back{display:inline-block;margin-bottom:14px;font-size:15px;color:var(--sub)}
@media (max-width:560px){header h1{font-size:24px}ul.lecs li{grid-template-columns:minmax(0,1fr);padding:14px}.no{justify-self:start}.acts,.soon{grid-column:1}}</style></head><body><div class="wrap"><a class="back" href="../">← 授業資料の一覧</a><header><h1>PCリテラシ｜授業資料（2026年度 後期）</h1><p>平成国際大学 情報デザイン学部　小船 幹生</p></header>
<section class="subj" id="literacy" style="--c:#0f766e">
<div class="head"><h2>PCリテラシ</h2><p class="lead">Windows 11 と Mac を切り替えて見られる教材です。</p></div>
<ul class="lecs">
<li><span class="no">第1回</span><span class="ttl">ファイルの住所を読む</span><span class="acts"><a class="btn pri" href="../literacy/pc-01.html">開く</a></span></li>
</ul></section>
</div></body></html>
